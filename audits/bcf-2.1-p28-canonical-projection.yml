canonical_projection:
  profile_contract: '3.0'
  source_owner: bcf_governance/tooling/ci_graph_defaults.py
  installed_owner: scripts/_bcf_runtime/ci_graph_defaults.py
  portable_helpers:
  - bcf_governance/tooling/evidence_shards.py
  - bcf_governance/tooling/evidence_modes.py
  - bcf_governance/tooling/ci_controller_policy.py
  - bcf_governance/tooling/ci_controller_adoption.py
  - bcf_governance/tooling/ci_controller_builder.py
  - bcf_governance/tooling/ci_controller_provider.py
  - bcf_governance/tooling/routine_controller_rotation.py
  projected_capabilities:
  - claim-aware preflight and one exact evidence session
  - planner-derived duration-aware four-shard execution
  - optional exact prior-evidence transport
  - grouped receipt fan-in and terminal scoped truth
  - exact-main admission finalization and publication
  - opt-in provider-authenticated one-PR trusted-controller rotation
  - one agent-facing prospective-train command
  excluded_self_authority:
  - recovery and Break Glass authority
  - release publisher credentials
  - repository protection mutation
  applicability:
    ordinary_adopter: executable controller only; no controller policy workflow or authority is projected
    trusted_controller_adopter: explicit typed adoption projects canonical build bootstrap probe activation and certification
    self_governance: uses the same provider transition primitives under its separately governed self-policy custody
fresh_adopter_proof:
  installation: real strict install_governance_pack.py path
  profiles: [standard, regulated]
  graph: canonical rendered contract with planned gate_shard execution
  evidence: schema-v3 receipts from one planner-owned session
  truth: bounded workitem certification from exact authenticated evidence
  structural_rule: preflight-only claims are excluded from workitem acceptance through the canonical claim model
  trusted_controller:
    adoption: explicit transaction after ordinary installation and committed N runtime
    policy: closed schema binds installed N exact artifact installation two-runner inventory graph extension transition schema and protection contract
    workflow: seven-stage provider-authenticated authorize bootstrap probe promote activate train
    authority: installed N authorizes N+1; candidate cannot appoint itself
    routine_repository_mutations: one protected implementation PR and zero bookkeeping mutations
    post_activation: provider-active receipt selects N+1 and dispatches fresh exact-main certification
    one_time_migration: initial runner App environment provider workflow IDs and installed-N custody are provisioned separately and are not Benchmark D evidence
prospective_chain:
  preflight: exact generated graph manifests runtime and profile contracts must be fresh
  controller_compatibility: ordinary adopters remain executable-only; opted-in trusted-controller candidates are parsed by installed N and predict rotation only when N can authorize the exact candidate state
  pr_evidence: one session and planner-derived shards execute only unresolved producers
  certification: terminal truth preserves exact subject intent and target
  merge: normal protected merge only
  exact_main: authenticated admission transports exact prior evidence before reusable governance
  controller_lifecycle: changed trusted-runtime bytes build N+1 once then installed N authorizes exact bootstrap probe and atomic provider activation without target confirmation or pin-recording PRs
  bounded_truth: P28-P0-01 may close only from receipt-producing authenticated claims
  finalizer: exact run attempt subject proposition and producer inventory remain mandatory
  publisher: bounded status cannot substitute for release or protection authority
  successor_eligibility: only authenticated P28-P0-01 closure makes P28-P0-02 eligible
non_escalation:
- candidate configuration cannot replace an existing canonical claim model
- preflight observations cannot satisfy behavioral workitem evidence
- prior evidence remains optional exact transport and ambiguous applicability executes canonically
- no self authority credential workflow or protection mutation is projected into adopters
- trusted-controller machinery appears only after explicit typed adoption and never in an ordinary install
- protection omission policy drift mixed runner state wrong artifact run attempt subject or replay fails closed
- active provider custody remains non-repository state and cannot broaden bounded certification
- release authority remains absent
self_authority_overlays:
  workitem: P28-P0-02
  canonical_contract: governance/self-overlays.yml
  schema: schemas/self-authority-overlays.schema.json
  validator: bcf_governance/tooling/governance_validation/self_authority_overlays.py
  permitted_propositions:
  - id: self-controller-custody
    proposition: construct_install_and_activate_this_repository_trusted_controller
    extensions: [bcf-trusted-control]
  - id: self-publication-authority
    proposition: publish_pre_certified_immutable_release_bytes
    extensions: [bcf-release]
  - id: self-recovery-authority
    proposition: recover_only_from_ordinary_controller_bootstrap_deadlock
    extensions: [bcf-break-glass-recovery]
  - id: self-repository-authority
    proposition: mutate_only_declared_repository_metadata_and_durable_evidence
    extensions: [bcf-automation, bcf-evidence-storage]
  mechanical_invariants:
  - every self graph extension has exactly one overlay owner
  - extension sources and generated workflows are derived and present
  - authority surfaces and generated self workflows are absent from the ordinary adopter pack
  - self-only graph value sources have declared ownership
  - typed opt-in adopter controller rotation remains packaged product outside the overlay inventory
  - proposition drift overlap omission missing files stale extension digests and pack leakage fail closed
post_merge_hotfix:
  id: P28-HF01
  failing_run: {workflow: bcf/automation-changelog-reconciler, run_id: '36218038519', run_attempt: '1', job_id: '108337832851'}
  exact_subject: {commit_sha: 98716225814b305658060e5bc5b2589222ff1f17, tree_sha: 3c9e483e9d30d0484309850b538a383e7c5dd47b}
  first_causal_failure: repository artifact inventory changed during pagination
  concurrent_event: trusted finalizer 36218038537/1 uploaded its exact-main certification bundle during the repository artifact read
  classification: provider_read_concurrency_defect
  correction:
  - require two consecutive exact canonical inventories before returning provider artifacts
  - restart only bounded reads that observe concurrent inventory drift
  - reject persistent churn malformed identities incomplete pages duplicate identities and same-count replacement
  preserved:
  - exact provider artifact and transition receipt authentication
  - installed-N authorization of N+1
  - two-runner bootstrap probe and promotion
  - noncertifying pending-rotation topology
  - release authority absence
post_merge_truth_hotfix:
  id: P28-HF02
  failing_run: {workflow: bcf/exact-main, run_id: '36223127734', run_attempt: '2', job_id: '108354017329'}
  exact_subject: {commit_sha: 256fb901f6782fe5cd2ad4d1c9dca7a3b42f7259, tree_sha: f37d37b4d74f7424c8455cb58dc75a6be563afbc}
  first_causal_failure: hotfix_P28-HF01_effective_state_completed
  classification: authenticated_reuse_consumer_projection_defect
  causal_trace:
  - phase and bounded-workitem truth received the canonical claim-indexed reuse projection
  - hotfix truth received only current receipts and preflight observations
  - exact reusable test contract-test and runtime-smoke claims were therefore invisible only to hotfix closeout
  correction:
  - pass the already-authenticated reuse index to the shared hotfix resolver
  - resolve each required gate through its exact canonical claim and producer identity
  - reject wrong claim execution-group source receipt and decision identities unchanged
  preserved:
  - preflight observations cannot masquerade as behavioral evidence
  - P28-P0-01 bounded subject and proposition
  - P28-P0-02 successor eligibility only after authenticated predecessor closure
  - release authority absence
