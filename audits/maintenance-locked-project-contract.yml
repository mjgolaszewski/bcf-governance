required_behavior:
  - Compile only reachable selected lock nodes, edges, extra expansions and marker forks.
  - Validate authored project and selected group requirements against lock metadata and exact versions.
  - Reject stale lock metadata after an authored floor changes even if its exact selected version remains compatible.
  - Preserve PEP735 include-group expansion and detect cycles or normalized-name ambiguity.
  - Reject unresolved nodes, unsupported source kinds, URLs and ambiguous applicability before allocation.
  - Bind all source and selector bytes to plan identity and recheck at consuming boundaries.
  - Require actual selected runtime and platform to match the authored marker cohort before allocation or reuse.
  - Do not let a local Python3.14 cohort certify Python3.12 graph resources or image dependencies.
  - Keep explicit groups and extras distinct and prevent unselected provider-group leakage.
  - Consume closed exact requirement arguments rather than mutable projection bytes.
  - Disable native dependency resolving for locked plans and verify installed metadata against the exact source-derived closure before caching.
