document: {kind: capability_design_audit, id: bcf-governance-p23-issue-165, version: 1.0.0, status: active, path: audits/p23-issue-165-storage-design.yml}
issue:
  provider: github
  repository: mjgolaszewski/bcf-governance
  number: 165
  consumer_tracking_id: racecar-18
  title: Bound Actions evidence storage with content-addressed inputs and authenticated manifests; no NAS dependency
  target_release: 1.2.0
classification:
  kind: missing_optional_bcf_capability
  severity: high_operational_cost
  separate_from_issue_164: true
  reason: current graph transport correctly binds run-attempt Actions artifacts but has no durable content-addressed input plane or reachability budget
consumer_baseline:
  repository: mjgolaszewski/racecar
  source: 18fddaeb53bee90f512a8d80935f2d3d4c6cbaf8
  actions_artifacts: 994
  actions_bytes: 59891376352
  actions_gib: 55.778
  preparation_gib: 54.694
  representative_run: 34640869465
  representative_total_gib: 1.2950
  representative_preparation_gib: 1.2569
  estimated_repeated_input_reduction_percent: 97
  disposition: read_only_design_and_compatibility_proof_no_consumer_mutation
authority_model:
  canonical_contract: governance/evidence-storage.yml
  graph_owner: governance/ci-graph.yml plus registered extensions
  input_manifest: governance.evidence-input-manifest.v1
  provider_reference: governance.evidence-input-reference.v1
  repository_evidence_admission: governance.evidence-receipt-admission.v1
  invariants:
  - a digest identifies bytes but never substitutes for their retained availability
  - candidate jobs may prepare bytes but cannot publish delete retain or certify durable evidence
  - trusted publishers inspect and hash candidate bytes but never import install or execute them
  - a draft is completely populated and independently described before immutable publication
  - every resolver authenticates repository release asset attestation subject commit producer and manifest identities before materialization
  - caches accelerate retrieval only and never satisfy availability or evidence requirements
  - required objects are published before compact references and Actions handoff deletion
  - current heads certified commits releases unresolved findings and explicit custody roots remain reachable
  - unavailable storage exceeded budgets expired freshness or failed reconstruction fails closed
  - trusted workflow tokens authenticate ordinary reads while distinct short-lived contents-write and Administration-read credentials own draft-visible Release transactions and immutable-setting inspection respectively
transport_design:
  durable_backend: immutable_github_release_assets
  release_namespace: non_product_bcf-evidence-inputs
  object_identity: canonical_archive_sha256
  archive: deterministic_safe_tar_gzip_with_member_hashes_modes_and_bounded_expansion
  per_run_actions_content: [authenticated_reference_manifest, ordinary_results, raw_outputs, receipts, findings]
  transient_actions_content: [one_candidate_preparation_bundle_until_durable_publication_and_reference_validation]
  materialization_order: [authenticate_reference, fetch_manifest_and_objects, verify_provider_and_content_identity, validate_freshness, extract_into_isolated_bounded_tree, invoke_existing_receipt_and_truth_validation]
  compatibility:
  - receipt schema 2.0 top-level fields remain unchanged
  - existing Actions-only graph artifacts remain valid and unchanged
  - content-addressed transport is explicit and opt-in for existing consumers
  - fresh Standard-v2 includes the disabled-by-default governed storage contract and supported graph vocabulary
  - product release tags and evidence-input release namespaces remain mechanically disjoint
retention_design:
  algorithm: exact_reference_reachability_with_lease_protection
  protected_roots: [live_runs, active_candidate_heads, certified_commits, immutable_product_releases, unresolved_findings, explicit_historical_custody]
  budget_dimensions: [Actions_bytes, durable_unique_bytes, object_count, object_age, upload_bytes, download_bytes]
  deletion_rule: only authenticated unreachable transient Actions artifacts after durable publication independent retrieval and lease expiry
  failure_rule: report and stop without deleting reachable or unverified bytes or minting success
  limitation: unique originals retained forever produce unbounded total storage; policy must declare a governing retention basis rather than promise unlimited storage
hosted_execution:
  rule: run_and_done
  publication: trusted local no-checkout job after candidate preparation has completed
  consumption: hosted jobs actively download verify materialize execute and exit
  forbidden: [hosted_polling, hosted_sleeping, hosted_capacity_waiting, hosted_local_runner_supervision]
  provider_edges: needs and completion events defer runner allocation rather than occupying a VM
provider_permission_model:
  ordinary_read: {credential: workflow_token, permissions: [actions_read, attestations_read, contents_read]}
  release_mutation: {credential: protected_environment_GitHub_App_token, permissions: [contents_write], reads: [draft_discovery, publication_release_ID, draft_inclusive_inventory]}
  immutable_settings_preflight: {credential: protected_environment_short_lived_token, permissions: [administration_read]}
  invariant: no credential may be silently substituted for a differently scoped provider operation
implementation_scope:
  bounded_contexts: [evidence, ci_authority, cleanup, install]
  layers: [tooling, pack, public]
  target_modules: [evidence_storage_contracts.py, evidence_storage_archives.py, evidence_storage_github.py, evidence_storage_commands.py, evidence_storage_github_api.py, ci_github_downloads.py, ci_graph_contracts.py, ci_graph_render.py, ci_github_api.py]
  expected_tests: [contract_validation, deterministic_archives, provider_authentication, cold_materialization, unsafe_archive_rejection, freshness, graph_edges, retention_reachability, budgets, legacy_compatibility, package_parity]
  forbidden_surfaces: [Racecar_repository, Chrysalis_Identity_repository, receipt_schema_2_top_level, existing_21_gate_ids, existing_PR_exact_main_scheduled_and_product_release_topology, product_release_authority]
  BCF_qualification_topology: {workflows_added: 2, jobs_added: 3, activation: owner_dispatch_only, hosted_waiters: 0}
