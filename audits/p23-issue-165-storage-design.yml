    scheduled_mutant_profiles: 5.21
  expected_train_hosted_minutes: 199
  authorized_ceiling_with_contingency_minutes: 240
  accounting_rule: hosted execution time and retained Actions storage are coequal stop conditions
  controls:
  - jobs are allocated only after provider dependencies are satisfied
  - no hosted polling sleeping idling lease waiting or local-runner supervision
  - a failed remote canary stops the train until the complete defect class passes offline
  - authenticate job timestamps and runner labels after every remote phase and stop before exceeding the train ceiling
