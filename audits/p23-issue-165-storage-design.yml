  accounting_rule: retained Actions bytes and peak incremental Actions bytes are release acceptance criteria rather than informational telemetry
  controls:
  - no remote execution before the complete combined local suite passes
  - no hosted polling sleeping idling lease waiting or local-capacity supervision
  - publish one compact qualification pack once and reuse it for cold reconstruction
  - purge superseded transient artifacts only after authenticated consumers complete
  - authenticate complete provider artifact inventory after every remote phase and stop when either the incremental or repository-wide byte ceiling is exceeded
