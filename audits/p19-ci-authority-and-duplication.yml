authority_map:
- fact: workflow topology events jobs matrices edges conditions permissions concurrency runners and artifacts
  canonical_owner: governance/ci-graph.yml plus registered governance/ci-extensions
  consumers: generated GitHub workflows and CI authority pin compiler
  synchronization: deterministic rendering with stable serialization
  drift_detection: graph validation import inventory generated-byte parity and authority-pin verification
  failure_behavior: cycles missing edges unreachable truth incomplete fan-in overlaps unsafe trust crossings unregistered roles or hand edits fail closed
- fact: gate commands evidence contracts and negative controls
  canonical_owner: governance/gate-contracts.yml
  consumers: evidence runtime graph gate executors Make projection and truth
  synchronization: direct contract resolution
  drift_detection: profile/graph/gate parity exact invocation checks and evidence admission
  failure_behavior: missing duplicate skipped malformed wrong-invocation or unsuccessful evidence cannot satisfy truth
- fact: test populations and counts
  canonical_owner: governance/test-manifests/*.txt collected from governed selectors
  consumers: preflight evidence receipts and truth
  synchronization: bcf test-manifest collect/check
  drift_detection: exact collected-node comparison
  failure_behavior: missing extra duplicated or skipped tests invalidate evidence without manual count edits
- fact: expected provider jobs and workflow identity
  canonical_owner: compiled workflow bytes plus governance/ci-authority.yml
  consumers: admissions finalizers status publishers release authority and trusted controller
  synchronization: bcf ci pin-authority derives paths blobs matrices semantic roles and expected jobs
  drift_detection: preflight self-controller and authenticated run-attempt membership checks
  failure_behavior: lane add rename remove skip timeout malformed output or attempt replay revokes authority rather than borrowing earlier success
- fact: evidence sessions receipts and truth inputs
  canonical_owner: evidence-session allocator canonical root selector receipt-admission decoder and schema 2.0
  consumers: capture fan-in truth certification and release collection
  synchronization: exact session/run/attempt/commit/tree/invocation identities
  drift_detection: session manifest digest producer inventory artifact hashes and collision checks
  failure_behavior: missing duplicated malformed wrong-SHA replayed mixed-session mixed-attempt or unsuccessful evidence invalidates every ambiguous member
- fact: gate and outer workflow timeouts
  canonical_owner: governance/gate-contracts.yml execution_policy plus ci-graph job timeout_minutes and headroom policy
  consumers: evidence subprocess runtime and graph compiler
  synchronization: direct timeout consumption and compile-time containment validation
  drift_detection: bcf ci graph validate
  failure_behavior: an evidence job shorter than its longest inner deadline plus explicit headroom cannot render
- fact: automated dependency changelog facts
  canonical_owner: authenticated exact base/head bytes selected by governance/automation-producers.yml
  consumers: trusted reconciler and CHANGELOG.md projection
  synchronization: typed manifest/lockfile decoders derive dependency previous version and new version
  drift_detection: schema 1.1 source coverage transition agreement and idempotent projection checks
  failure_behavior: titles bodies commit messages unsupported formats versionless changes conflicting manifests stale heads or unsafe paths cannot influence the write
- fact: trusted-controller runtime dependency closure
  canonical_owner: pyproject.toml project dependencies plus wheel Requires-Dist metadata decoded by governance.controller-wheelhouse-closure.v1
  consumers: exact-main controller builder pin compiler bootstrap installer and release authorizer
  synchronization: builder downloads the package-derived direct and transitive wheel closure records its build environment and completes one offline install
  drift_detection: non-executing recursive wheel metadata validation runs before upload and again before pin compilation
  failure_behavior: missing duplicate incompatible malformed direct-URL or environment-ambiguous wheels cannot produce or become a controller target
duplication_disposition:
  mechanically_removed:
  - independent evidence-session root selection in gate-group and shard capture
  - hard-coded evidence subprocess deadline disconnected from gate contracts
  - path-only automated dependency changelog facts
  - ambiguous first-match mutation targets after runtime-owner decomposition
  - hard-coded trusted-controller runtime requirement list
  already_mechanical:
  - generated workflow bytes and action pins
  - exact expected-job and matrix inventories
  - test-node counts and partitions
  - artifact namespaces and exact run-attempt fan-in
  - exact candidate commit tree invocation and gate-contract receipt binding
  retained_assertions:
  - focused topology tests consume the compiled graph and assert security or failure semantics; they do not author workflow bytes
  - authority state-machine fixtures retain explicit synthetic jobs because they test transitions independently of BCF's current product graph
  obsolete_tests_or_lists_removed: []
  reason_no_test_tombstones: no reviewed test was subsumed without retaining a unique security branch failure cause or public contract
  mutation_target_validation: every scheduled mutant search must identify exactly one canonical runtime location before execution
historical_diagnosis:
  confirmed:
  - run: 34412310621
    sha: 7451d92263f7dcbc30d19a8567c6552009f4d124
    class: incomplete trusted-controller dependency closure
    evidence: both uniquely labelled trusted runners failed the identical offline staging command because artifact 10126859645 omitted packaging even though the project wheel required packaging greater than or equal to 24 and less than 27
    product_assertion: true
    disposition: no retry or probe; reproduce locally, derive all runtime requirements from pyproject metadata, validate recursive wheel closure before pin admission, and build a new exact-main artifact
  - run: local pre-remote artifact verification
    sha: 16eee0ade75baca1160626937263fea0fe8cfd22
    class: undeclared runtime dependency
    evidence: clean wheel installation failed importing automation_dependencies because packaging was present only in governance and release tooling inputs
    product_assertion: true
  - run: local pre-remote extracted-sdist verification
    sha: ce5fb6b718984ef7c45ee1e15c18b9935ef5928f
    class: duplicate interpreter dependency ownership
    evidence: packaging was declared by both project runtime dependencies and security-dependency-audit gate additions; the canonical environment compiler rejected both affected tests before projection
    product_assertion: true
  - run: local exact-PR preflight
    sha: 38795f22174ba5751665b0f3a87c3c896a40c988
    class: negative-control oracle population drift
    evidence: the front door reported both issue-remediation controls together because their killer tests were not members of the contract-test manifest and one parametrized oracle lacked its exact node suffix
    product_assertion: true
  - run: 33698496638
    sha: ef43d62ef78c03678ec3b7a884762bf29d5d1cc1
    class: artifact dispatch/fan-in error
    evidence: exact-main status publisher requested absent bcf-exact-main-certification-33698472050-1 and failed before controller execution
    product_assertion: false
  - run: 33694579805
    sha: 1f382bec937dc903455ab952b73f041ada2ea8d1
    class: runner/controller installation drift
    evidence: trusted local runner exited 127 because pinned /opt/runner_toolcache controller executable did not exist
    product_assertion: false
  - run: 33713078511
    sha: 4a68a3cfd9e52869d8a227367800705e8d5eb0f8
    class: valid cheap-front-door product-policy rejection
    evidence: missing CHANGELOG.md update failed in 11 seconds and both expensive package jobs were skipped
    product_assertion: true
  - run: 33715135981
    sha: c3a7a2f3187982bf2c0d4f0b026629bbc2f6b871
    class: source-distribution packaging defect
    evidence: artifact 9878297661 digest sha256:9379c5a27ff6142a77d891dfe0ffa8a9c6bfb1c2efc30f35d3c6527b5f0cfab2 records 696 passed and one sdist failure because .github/dependabot.yml was absent from the extracted source
    product_assertion: true
  evidence_backed_inferences:
  - same-SHA mixtures of green and red trusted callback runs are authority-state transitions unless the authenticated terminal artifact or log proves a producer defect
  - scheduled and dispatched mutant runs share governed commands but have distinct provider event identities; neither substitutes for the other
  unavailable_evidence:
  - the first three listed runs have no retained Actions artifacts; conclusions above use retained provider logs and job metadata
