prospective_authority_chain:
- {boundary: preflight, deterministic_next_rejection: governed artifact editorial manifest and graph parity, disposition: validate before push}
- {boundary: controller_compatibility, deterministic_next_rejection: trusted runtime target differs from installed controller, disposition: require ordinary-current compatibility before push}
- {boundary: pr_evidence, deterministic_next_rejection: exact required producer or job inventory incomplete, disposition: validate canonical plan session and graph inventories locally}
- {boundary: certification, deterministic_next_rejection: finalizer subject scope or inventory mismatch, disposition: exercise canonical bounded certification fixtures}
- {boundary: merge, deterministic_next_rejection: exact-main evaluation target is not authored DONE or predecessor closure is absent, disposition: validate P27-P0-01 authored closure and exact P26 history}
- {boundary: exact_main, deterministic_next_rejection: prior evidence inapplicable or producer inventory does not match plan, disposition: retain provider-authenticated applicability and execute only unresolved groups}
- {boundary: controller_lifecycle, deterministic_next_rejection: proposed tree requires a controller absent from trusted runners, disposition: prove no trusted runtime byte change and ordinary-current compatibility}
- {boundary: bounded_truth, deterministic_next_rejection: target remains active missing evidence or has wrong predecessor, disposition: target exact DONE P27-P0-01 and preserve P27 active}
- {boundary: finalizer, deterministic_next_rejection: proposition subject target run or attempt differs, disposition: exercise exact scoped-certification normalization and verification}
- {boundary: publisher, deterministic_next_rejection: bounded status is broadened or wrong context selected, disposition: preserve bcf/workitem-certification only}
- {boundary: successor_release, deterministic_next_rejection: bounded certification used as phase or release authority, disposition: require P27-P0-02 eligibility only and explicit release rejection}
simplification_baseline:
  graph_inventory: {workflows: 19, jobs: 32, extensions: 5}
  agent_facing_canonical_interfaces:
  - {interface: preflight_governance, unique_proposition: candidate structural prerequisites and execution plan are deterministic and closed}
  - {interface: governance_evidence, unique_proposition: independently executed producer observations bind exact subject session and controls}
  - {interface: governance_truth, unique_proposition: authenticated evidence closes the requested bounded or terminal proposition}
  - {interface: ci_graph, unique_proposition: provider topology and authority projection derive from one canonical graph}
  mandatory_future_reductions:
  - replace routine target confirmation pin and activation repository mutations with authenticated transition evidence under existing protected policy
  - collapse derivable fixed-point bookkeeping behind one canonical reconcile operation
  - remove or consolidate every surviving mechanism that cannot name a unique assurance or authorization proposition
security_boundaries:
  candidate_self_authorization: prohibited
  source_receipt_mutation: prohibited
  bounded_to_release_escalation: prohibited
  break_glass_routine_use: prohibited
  controller_rotation_acceptance: one protected implementation PR and zero bookkeeping-only follow-up commits or pull requests
