  - {boundary: merge, proof: protected merge remains the only source authorization event}
  - {boundary: exact_main, proof: independent builder emits exact N+1 while incompatible evidence remains suppressed}
  - {boundary: controller_lifecycle, proof: dormant protocol cannot activate before legacy migration installs compatible N+1}
  - {boundary: bounded_truth, proof: P27-P0-02 remains active until its exact authenticated evidence closes}
  - {boundary: finalizer_publisher, proof: workitem scope remains exact and non-release}
  - {boundary: successor_release, proof: bounded certification cannot authorize phase closure or release}
