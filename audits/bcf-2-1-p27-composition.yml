  - {path: schemas/controller-transition.schema.json, responsibility: dormant immutable routine-transition receipt contract}
  one_time_migration:
  - merge this expansion under installed controller N
  - use the existing ordinary Git-mediated rotation exactly once to install compatible controller N+1
  - activate provider-backed transition routing in a protected migration change
  - prove the next routine runtime upgrade completes from its implementation PR without target confirmation pin or activation repository mutations
  prospective_chain:
