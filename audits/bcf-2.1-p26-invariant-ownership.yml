    installed_controller: c14a138d05ce962f0d1735e18b757c8158a55eca
    controller_lifecycle: ordinary-current
  trusted_execution:
  - exact-main admission must succeed before provider transport executes
  - transport executes under the installed current controller without candidate checkout
  - admission remains non-successful if authentication or immutable materialization fails
  - the exact transport directory is uploaded as a run-attempt control artifact
  downstream_matrix:
