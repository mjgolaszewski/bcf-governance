- {id: DependencyClosure, canonical_owner: schemas/evidence-receipt.schema.json#/$defs/dependencyManifest, executable_owner: 'bcf_governance/tooling/evidence_planning.py::build_dependency_manifest', p26_action: reuse_by_digest}
- {id: Qualification, canonical_owner: schemas/evidence-receipt.schema.json#/$defs/qualification, executable_owner: 'bcf_governance/tooling/evidence_claims.py::claim_receipt_fields', p26_action: reuse_by_digest}
