  - complete authenticated admission and producer inventory is certifiable
  - missing or skipped admission and producer shapes are noncertifying
  - skipped matrix placeholders from preflight truncation are noncertifying
  - active extra or duplicate jobs remain malformed and fail closed
  - certification still invokes the strict complete same-admission collector
  publication:
  - noncertifying observations publish no success or failure status
  - missing bundles cannot manufacture a certification failure without proven applicability
  - historical valid bundles remain immutable and are suppressed after default-main movement
  bounded_authority:
  - workitem success retains only declared successor eligibility
  - explicit active-phase closure and release authorization remain rejected
