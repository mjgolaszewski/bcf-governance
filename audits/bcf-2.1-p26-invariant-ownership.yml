    merge: ordinary protected merge only
    exact_main: admission transports current merge evidence before governance fan-out
    controller_lifecycle: ordinary-current required; pending or recovery custody cannot certify
    bounded_truth: P26-P0-02 may close only from exact authenticated test, contract-test, and runtime-smoke evidence
    finalizer: exact same-admission producer and P26-P0-02 proposition remain mandatory
    publisher: only bcf/workitem-certification may publish bounded success
    successor_eligibility: only authenticated P26-P0-02 closure makes P26-P0-03 eligible
  non_escalation:
  - P26 remains active
  - release authority remains absent
  - transport does not feed reuse planning or claim applicability in P26-P0-02
  - P26-P0-03 reuse activation remains absent
p26_p0_03_dormant_expansion:
  workitem: P26-P0-03
  baseline_main: {commit_sha: 8cd1b6627bd4e0cf3e54d0eca5d0e5639de3f059, tree_sha: 4984e0a09a87d9011bfacb2b8e3ad288dd3df703}
  first_expansion_merge: {commit_sha: 15fa671c1bd8b48321e2091a1c034aecc5b474b8, tree_sha: 5efc1f1e8bcf33693adf10bbdc59204a300af43e, exact_main_run: '35690773063/1', admission: success, controller_builder: success, governance: stale_installed_controller_fail_closed, evidence: suppressed}
  second_expansion_prospective:
  - provisional local transport may produce typed truth observations but cannot confer certification authority
  - trusted finalizer independently authenticates same-admission transport, session, subject, run, attempt, skipped-claim inventory, and main closure
  - missing or ambiguous transport cannot suppress canonical producer execution
  - no graph activation or P26-P0-03 target change occurs in the dormant expansion
  - ordinary PR preflight reports pending_rotation and release_authority false
  - canonical suite found the 800-LOC cap exceeded in preflight; negative-control
    target applicability was extracted intact to preflight_negative_controls,
    with the cap and fail-closed diagnostics preserved
  - prospective graph trace found reusable workflow calls could not consume a
    declared artifact produced by an exact caller predecessor; generic optional
    artifact_bindings now compile a same-run/attempt guarded download only for
    a false-default boolean workflow_call input, and reject wrong caller,
    producer, dependency, input, or duplicate component custody
  - rendered activation fixture caught checkout deleting a pre-checkout
    download; canonical renderer now places bound control downloads after
    component checkout and before the consuming preflight/truth command
  - this graph capability remains dormant until a later protected activation;
    current workflows, topology, and installed controller are unchanged
  causal_boundary:
  - the trusted transport payload digest excludes its manifest; prior receipt loading must also close the manifest bytes
  - authentic source execution commits may be absent from a local clone; exact Git tree OIDs permit conservative path comparison without admitting authority
  - current truth resolves current-run receipts only; reuse decisions remain dormant until attestation-aware truth and finalizer agree
  canonical_owners:
    transport_bytes: bcf_governance/tooling/prior_evidence_receipts.py
    claim_model_and_dependency_closure: bcf_governance/tooling/evidence_planning.py
    qualification: bcf_governance/tooling/evidence_claims.py
    grouped_claim_resolution: bcf_governance/tooling/evidence_claim_resolution.py
    provider_main_tree: bcf_governance/tooling/provider_reuse_closure.py
    reuse_decision: bcf_governance/tooling/evidence_reuse_attestations.py
    finalizer_authority: bcf_governance/tooling/ci_reuse_attestation_verifier.py
  prospective_chain:
    preflight: no transport consumption or skipped producer is activated by this expansion
    controller_compatibility: changed trusted runtime requires ordinary pending rotation and an exact provider-built N+1
    pr_evidence: ordinary PR execution and bcf/pr-certification remain unchanged
    certification: dormant verifier rejects claimed reuse without exact attestation and otherwise preserves old truth
    merge: normal protected merge; no bypass or candidate self-authorization
    exact_main: old installed controller suppresses evidence while building N+1 under pending rotation
    controller_lifecycle: bootstrap, probe, confirm, promote, and normalize by canonical ordinary custody
    bounded_truth: after rotation, P26-P0-02 remains the target and P26 stays active
    finalizer: no-reuse truth is unchanged; future reuse requires same-admission provider transport and main closure recomputation
    publisher: bounded workitem status only; no release status substitution
    successor_eligibility: only P26-P0-03 remains eligible until its own later authenticated closure
  non_escalation:
  - no evidence producer is skipped by this expansion
  - no candidate-attested reuse reaches certification without trusted recomputation
  - release authority and P26 parent closure remain absent
p26_p0_03_activation_prospective:
  status: pre_install_design_gate_not_yet_implemented
  current_gaps:
  - canonical preflight can consume locally closed transport when explicitly
    supplied, but the governance workflow does not yet download the same-attempt
    artifact; locally observed bytes remain provisional until finalizer custody
  - the current prior-receipt loader couples byte/identity validation to the
    current gate contract; an authentic but no-longer-applicable source must
    fall back to execution rather than fail the entire preflight
  - current truth resolves required claims through current-session receipts only;
    a legitimately skipped producer therefore cannot close its reused claims
  - truth binds raw session bytes when reuse is planned, but does not yet emit
    attestations or resolve their typed claims, so reuse remains inactive
  required_sequence:
  - merge the dormant transport expansion without activating reuse
  - expand every remaining trusted runtime consumer while reuse remains dormant;
    do not rotate the incomplete expansion as the final activation controller
  - prospectively prove the complete final runtime closure, then rotate that
    exact provider-built controller by ordinary bootstrap, probe, and confirmation
  - activate transport download, selective execution, typed truth, and the
    P26-P0-03 bounded target only after compatible installation
  pre_push_chain:
    preflight: close exact transport bytes and admission subject before planning;
      untrusted local custody is provisional, and missing, stale, or ambiguous
      material cannot suppress a producer
    controller_compatibility: dormant expansion is pending rotation under N;
      activation requires ordinary-current N+1 with the complete runtime closure
    pr_evidence: direct PRs continue complete ordinary execution and certification
    certification: provisional candidate reuse cannot publish status without
      trusted same-admission recomputation of the exact skipped-claim inventory
    merge: protection and bcf/pr-certification remain unchanged
    exact_main: admission produces exact transport; only applicable claim groups
      may be skipped and every unresolved group executes canonically
    controller_lifecycle: no activation before exact artifact bootstrap, two-runner
      probe, confirmation, projection, and ordinary-current normalization
    bounded_truth: current receipts and authenticated reused-claim attestations
      resolve through one claim-aware owner; unrelated claims cannot be laundered
    finalizer: independently compare subject, run, attempt, producer, transport,
      main closure, and the session plan's complete reused-claim set
    publisher: publish only authenticated workitem-scoped success or revocation
    successor_eligibility: only authenticated P26-P0-03 closure may make P26-P0-04
      eligible; P26 remains active and release authority remains absent
  partial_group_rule: if any claim in a group is unresolved, its canonical producer
    executes; current receipts and reuse decisions must not double-credit claims
  failed_source_rule: a source receipt with failed behavior cannot supply either
    a reused claim or a reusable detector qualification
  fast_fail_rule: structurally missing transport wiring, non-exhaustive reused
    inventories, and impossible producer plans reject before evidence fan-out
