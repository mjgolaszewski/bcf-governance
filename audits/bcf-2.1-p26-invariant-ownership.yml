- {id: RecoveryAuthority, canonical_owner: schemas/recovery-reentry-authorization.schema.json, executable_owner: 'bcf_governance/tooling/ci_graph_controller_lifecycle.py', p26_action: reuse_without_broadening}
foundation_invariants:
- source receipts remain byte-for-byte immutable and are referenced only by digest and immutable provider identity
- reuse admission binds exact claim and execution-group identity without creating a parallel registry
- admitted reuse requires equivalent dependency-closure and qualification digests
- rejected or ambiguous reuse requires canonical execution and at least one closed rejection reason
- provider custody binds repository, PR, candidate, merge, main, workflow, run, attempt, artifact, controller, and protection identities
- preflight observations are not evidence receipts and cannot satisfy behavioral proof
corrective_insertion:
  exact_main_failure:
    run: 35387324770
    attempt: 1
    main_commit: 95c4bd67115aef05a36b546b9bac8248f052a747
    main_tree: 8d500bf684c77e5a46226ed874021cb7cb6545ab
    first_causal_invariant: trusted controller target is stale for runtime files
    rejected_path: bcf_governance/pack/template-repo/schemas/reuse-attestation.schema.json
  defect_class: packaged_schema_presence_was_conflated_with_active_runtime_requirement
  canonical_activation_primitive: AGENTS.yml#governance.structural_schema_contract.required_schemas
  correction:
  - derive trusted packaged schema compatibility from active requirements at both
    controller target and current subject
  - retain target-active requirements in the comparison so mutation or removal
    remains fail-closed
  - package reuse-attestation.schema.json while leaving it dormant until a compatible
    controller is installed
  sibling_review:
  - pack manifest and schema-parity inventories intentionally govern every present
    file and do not confer runtime activation
  - controller and exact-main schema scans validate captured artifacts and do not
    decide controller compatibility
  regression_proof:
  - dormant successor schema with controller N is compatible
  - activation with incompatible controller N is rejected
  - activation with controller N+1 that already carries the schema is compatible
  - active schema mutation and removal are rejected
  boundary: P26-02 remains blocked until protected merge, ordinary governed controller
    rotation, and fresh exact-main certification close P26-01 truth
post_merge_claim_resolution_correction:
  exact_main:
    run: 35391756266
    attempt: 1
    main_commit: 10582b78943d3dc9ea06484fc901e14913e612d4
    main_tree: 0c0cca378b32d1010a4774178d2f7fb174dc18a7
  producer_result:
    admission: success
    independent_controller_build: success
    closure_preflight: success
    evidence_shards: {expected: 4, successful: 4}
  causal_trace:
  - required claim identities mapped to their canonical execution groups and producers
  - all emitted grouped receipts bound the exact main subject and authenticated session
  - receipt validation and closeout consumers verified every applicable produced claim
  - the terminal failure envelope incorrectly copied the pre-execution DAG after fan-in,
    retaining seven satisfied producer groups as required next actions
  - the actual remaining closure cause was the three intentionally open P26 workitems
  common_correction:
  - resolve exact claims only through their canonical execution-group producer
  - reconcile the terminal DAG and invalidation list against authenticated resolved claims
  - reject duplicate legacy claim mappings during claim-model preflight
  sibling_consumers:
  - closeout, workitem, hotfix, release, and finding consumers already use the canonical
    eligible-receipt resolver and required no semantic change
  fail_closed_proof:
  - invalid, missing, wrong-subject, wrong-session, wrong-producer, and wrong-claim
    evidence remains ineligible
  - a valid grouped receipt cannot confer an unrelated producer's claim
  boundary: P26-02 remains blocked until protected merge, fresh exact-main success,
    and bounded P26-01 truth closure
pr_219_ci_correction:
  provider_evidence:
    run: 35395179226
    attempt: 1
    artifact: 10568231376
    tests: {collected: 1438, passed: 1434, failed: 4}
  loc_boundary:
    cause: grouped-claim resolution remained embedded in governance_truth.py and its runtime mirror
    correction: extracted canonical claim ownership and authenticated evidence resolution into
      bcf_governance/tooling/evidence_claim_resolution.py and mechanically projected it
    resulting_governance_truth_loc: 797
  claim_contract_boundary:
    cause: receipt-local claim population checks loaded the full repository dependency-closure model
    correction: receipt population and qualification consumers load only the canonical claim,
      execution-group producer, and gate projection they require
    strict_boundary: full repository claim-model validation remains mandatory at planning,
      preflight, applicability, and exact-tree truth boundaries
    sibling_review: qualification control inventory was the only genuine sibling consumer
  invariants:
  - duplicate legacy mappings remain rejected by full claim-model preflight
  - wrong-producer grouped receipts cannot confer another producer's claim
  - malformed required claim, execution-group, producer, or gate contracts fail closed
  - minimal valid claim contracts retain specific claim-population diagnostics
  boundary: P26-02 remains blocked pending protected merge, fresh exact-main success,
    and P26-01 truth closure
post_merge_workitem_lifecycle_correction:
  exact_main:
    run: 35401727217
    attempt: 1
    main_commit: 83c8fe52e6d6e4f8aafc4ba1f88d65d69742cd81
    main_tree: af227004ab8c326ff05f5f4b2203deed0fa4c713
  verified_boundary:
    admission: success
    independent_controller_build: success
    closure_preflight: success
    evidence_shards: {expected: 4, successful: 4}
    remaining_issue: phase_effective_state_active
  primitive_gap: ordinary acceptance was aggregated only at whole-phase scope, so a
    completed child could not represent evidence-derived closure while its parent remained active
  correction:
  - derive each ordinary workitem's verified closure from authored DONE, its existing
    acceptance contract, exact-subject eligible receipts, and closed predecessors
  - encode predecessor requirements through the existing deterministic acceptance predicate
    requires-workitem-closure:<id>, avoiding an active schema mutation
  - expose bounded workitem closure as workitem-only authority; phase, release, and publication
    remain governed by their existing aggregate terminal conditions
  fail_closed_proof:
  - missing, invalid, wrong-subject, wrong-session, wrong-claim, or preflight-only evidence
    cannot close a workitem
  - duplicate, unknown, forward, or cyclic predecessor declarations reject mechanically
  - authored DONE without verified acceptance or predecessor closure remains completed, not closed
  governance_validate_trace:
    claim: governance-contracts-valid
    execution_group: preflight-structural
    classification: {captured_by_preflight: true, receipt_producer: false}
    planner_projection: preflight_satisfied_claims
    execution_dag_projection: omitted
    session_gate_inventory: omitted
    receipt_emission: none
    bounded_resolver: ineligible because include_preflight is false
  acceptance_correction:
  - remove governance-validate from active P26 ordinary-workitem acceptance evidence
  - retain test, contract-test, and runtime-smoke because their canonical groups emit
    authenticated receipts
  - retain governance-validate unchanged in phase-wide closeout and canonical preflight
  - reject preflight-only evidence in profile-v3 ordinary workitem contracts during validation
  hotfix_boundary: corrective hotfix lifecycle and authority remain unchanged
  boundary: P26 remains active and P26-02 implementation remains blocked pending protected
    merge, fresh exact-main success, and authoritative P26-P0-01 bounded closure
final_orchestration_correction:
  exact_main: {run: 35426823669, attempt: 1, main_commit: 98d467345efe7056066a460a62aab7a7a795b412, main_tree: 7aba86d6b15a6eb1a52f92e0c4298948c067e7a9}
  proven_state:
    target: {id: P26-P0-01, effective_state: closed, missing_evidence: []}
    successor: {id: P26-P0-02, eligible: true}
    phase: {id: P26, effective_state: active}
  first_causal_invariant: terminal phase closure was requested for a bounded workitem proposition
  prospective_consumer_matrix:
    must_change:
    - truth intent, target, failure reporting, and terminal observation
    - exact-main artifact authentication, trusted finalization, certification verification,
      scoped status publication, and release rejection
    - reusable governance inputs and the generic authority executor contract
    generated_consequence:
    - canonical graph workflows, pack runtime and schema mirrors, manifests, locks,
      editorial inventory, and mechanically compiled workflow authority
    test_only:
    - bounded lifecycle, finalizer tamper, status-scope, release exclusion, graph,
      preflight, compatibility, phase closure, PR progress, and hotfix regressions
    inspected_no_impact:
    - PR certification context, protection requirements, release publication roles,
      controller installation custody, successor lifecycle derivation, and hotfix semantics
  scope_contract:
  - bind exact commit, tree, evaluation intent, typed target, proposition, provider artifact,
    run, attempt, and immutable report digest through truth and certification
  - workitem success authorizes only declared successor-workitem eligibility
  - bounded success uses a separate provider status context and cannot authorize release
  - phase closure and PR progress remain distinct explicit evaluations
  compatibility_boundary:
    sequence: [expand_inert_contract, merge, build_and_rotate_compatible_controller, activate_bounded_target]
    reason: activating before rotation would permit the old finalizer to erase target scope
    current_exact_main_invocation: phase_closure
  boundary: P26-02 remains blocked; this insertion must merge and rotate normally before
    a separate activation can request bounded P26-P0-01 certification
rotation_finalizer_correction:
  provider_failure:
    main_commit: 7fbed1a9cc9a26a90393b245f84ec2805ef177e6
    finalizer_run: {id: 35467777749, attempt: 1}
    installed_controller: ea638478932a726782f6b10cd749044337e6878a
    first_causal_invariant: admission exact job inventory does not match authority
  classification: pending_rotation_callback_applicability_defect
  canonical_correction:
  - keep the independent read-only controller builder free of the disabled admission dependency
  - require installed-current controller custody for exact-main finalization and status publication
  - retain complete admission inventory enforcement for every certification attempt
  - retain partial-admission selection only for the exact controller artifact resolver
  sibling_workflow_run_review:
  - PR finalization and automation callbacks consume different complete producer topologies
  - evidence-storage qualification is an explicit bounded publication lane
  - release collection already requires installed-current controller custody
  proof:
  - pending rotation runs only the independent controller builder and cannot emit certification
  - current custody restores admission, evidence, finalization, and publication mechanically
  - release and bounded-workitem certification remain unavailable during pending rotation
  - bootstrap, probe, confirmation, and installation retain exact artifact and subject binding
  - authenticated recovery re-entry remains non-certifying and release-ineligible
  boundary: P26-02 remains blocked pending protected merge, ordinary bootstrap/probe/confirmation,
    normalized installation, and fresh exact-main certification
