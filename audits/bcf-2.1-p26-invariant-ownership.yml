  provider_precondition:
    authoritative_main: {commit: da05d9b722798dea25d433742b1416ae479fdc7d, tree: a47db09483512e649606b42695b1d89a6f288896}
    exact_main: {run: 35627743279, attempt: 1, conclusion: success}
