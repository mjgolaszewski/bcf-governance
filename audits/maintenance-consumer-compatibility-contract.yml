evidence_rules:
- Selected diagnostics and source AST checks never become full release or Standard acceptance.
- Preserve every original negative and exact collected/executed/phase/JUnit population; qualified proof reuse binds exact candidate bytes.
- Portable canonical tests must not require private corpus environment variables or consumer checkout paths.
- Native generator and semantic lock commands derive mirrors/manifests/locks; no hand hashes or freshness exclusions.
- Native ci submit and reconcile own candidate lifecycle workflow and authority commit pairing.
- Official immutable publication and independent exact-asset custody are separate final requirements; keep release machinery and independent 2.5 development intact.
