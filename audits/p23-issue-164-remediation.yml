classification:
  kind: upstream_defect
  severity: high
  false_pass_possible: true
  impact: a query or other closed operation can conceal a write or authority effect behind an unresolved same-instance helper call
root_cause:
  defect: source discovery records self method calls as repository-path plus self attribute text instead of the exact declaring-class method identity
  prior_failure_mode: the effect walker does not resolve the edge visits no helper effects and reports zero writes and zero authority effects
  required_authority: source-first lexical class and receiver facts normalized by one exact fail-closed method-dispatch owner before effect evaluation
dispatch_class_review:
  exact_resolution: [direct same-instance method, async same-instance method, unconventional receiver parameter, same-named methods in distinct lexical classes]
  fail_closed: [receiver rebinding, receiver alias, bound-method alias, classmethod receiver, getattr receiver dispatch, type receiver dispatch, inheritance, overrides, super, unresolved same-instance callable, decorated class, decorated method, decorated entrypoint, metaclass, dynamic attribute lookup, instance method replacement]
  boundary_behavior: [pure resolved helpers remain legal, exact resolved helper ports are reachable, chained component calls require an explicit declared port, hard same-instance ambiguity cannot be hidden by a raw declaration]
  excluded: [runtime monkey-patching proof, whole-program external subclass discovery, arbitrary dynamic Python dispatch]
remediation:
  discovery_owner: bcf_governance/tooling/semantic_ownership_inventory.py::discover_python_source
  identity_owner: bcf_governance/tooling/semantic_python_method_identity.py::resolve_method_dispatch
  effect_owner: bcf_governance/tooling/semantic_operation_effects.py::validate_operation_effects
  behavior:
  - collect class methods bases receiver bindings and neutral dispatch facts during the existing source-first AST inventory
  - resolve direct same-instance calls only to an exact method in the declaring lexical class
  - reject hierarchy-sensitive and dynamically rebound dispatch before it can conceal effects
  - allow unresolved component calls only when the operation declares their exact boundary identity
  - preserve one shared inventory and the existing public operation validator
  compatibility:
  - receipt schema 2.0 profile contracts authority v1.1 all 21 gate IDs and generated CI topology remain unchanged
  - flat and src-layout import-root behavior from 1.1.1 remains unchanged
  - consumers with ambiguous operation paths receive a fail-closed diagnostic and must declare real component ports or remove dynamic dispatch
  context_budget_disposition:
  - inventory remains within the existing 800-line production-module limit
  - canonical-representations gains only the exact method owner and four required generated projections so its self-governance cap moves from 56 to 58 KiB
  - the mechanically generated semantic lock gains four projection rows so its self-governance line cap moves from 300 to 325
  - completed 1.0.0rc1 release detail was removed from active memory because phase history and immutable provider custody already own it
controls:
  positive: [direct forbidden write, indirect forbidden write, indirect authority effect, pure helper, exact declared helper port, exact declared component port, canonical YAML public operation]
  adversarial: [receiver rebinding, receiver alias, bound-method alias, classmethod, chained undeclared component, missing method, getattr, type receiver, inheritance, override, super, same-name collision, async dispatch, decorated class, decorated method, decorated entrypoint, metaclass, dynamic attribute lookup, instance method replacement]
