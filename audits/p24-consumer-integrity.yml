compatibility:
- All 21 existing gates, receipt and profile contracts, and semantic-lock schema 1.0 remain unchanged.
- CI graph schema 1.0 adds an optional closed candidate routing policy; existing consumers retain literal hosted selection.
- Private same-repository PR routing requires explicit opt-in and native head/base repository identity.
- Python-only semantic lock material retains its prior digest behavior; TypeScript-enabled consumers bind compiler inputs and rebuild stale locks.
- Adoption promotes only existing managed governance files and executes no dependency installation scripts or network operations.
