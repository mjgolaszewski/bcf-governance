required_controls:
  - genuine typed async read followed by model projection
  - direct receiver alias and bound-method alias remain fail-closed
  - method returning self does not erase receiver provenance
  - rebound decorated inherited and dynamic dispatch remain fail-closed
  - writes and authority hidden in projection remain rejected
  - missing unreachable and overlapping declarations fail
  - no authoritative read is relabeled non_authoritative_output_effects
  - canonical and portable runtime behavior remains identical
  - immutable 2.3.6 stays unchanged
open_design_questions:
  - Establish the smallest explicit read-boundary contract without treating a declaration as proof of implementation purity.
  - Preserve traversal into actual projection owners without selecting targets by method-name suffix or annotation alone.
  - Distinguish supported genuine source-level application functions from analyzer-evasion wrappers.
