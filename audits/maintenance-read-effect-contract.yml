observations:
  - authoritative_read classifies an operation but declares no read boundary.
  - Closed operation schema provides mutation authority and output ports only.
  - Hard unresolved dispatch rejects before declared effect ports are consulted.
  - Call-result data provenance includes receiver origins; returned models can be classified receiver_alias.
  - A call can return self; dropping receiver provenance alone would weaken fail-closed semantics.
  - Protocol return annotations alone do not prove concrete runtime method identity or purity.
