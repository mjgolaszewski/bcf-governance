contract:
  - Snapshot only exact native list or tuple containers and accept only exact native string members; None snapshots the actual process argv and excludes its program token after validation
  - Use type identity checks without user equality repr coercion iteration or indexing before rejecting custom sequences and values
  - Copy mutable lists before validation and retain an owned exact string list; later caller mutation cannot change the admitted arguments
  - Preserve ordinary CLI grammar default argv help version empty-input error behavior valid tuple callers and dispatch arguments
  - Run normalization before parser construction at every declared entrypoint and both package/controller dispatchers
  - Reuse the same primitive in the nested-command builder before source-path or child-command construction
  - Project changes through canonical private runtime and package generation; no wrapper-specific replacement helper
  - Consolidate governance_evidence duplicate imports from evidence_sessions without changing its imports or effect owner; keep every production module at or below800lines
qualification:
  - Commit contract and independent callback witnesses plus causal controls before production
  - Compare declared catalog keys with runtime dispatcher population; retain validator alias and generated-controller consumer explicitly
  - Prove custom iterators sequence subclasses string subclasses and metaclass hooks cannot be consumed before rejection
  - Exercise all declared entrypoints with parser construction as an independent admission oracle and normal help routes as positive controls
  - Qualify fresh/repaired SDK-absent consumers and disabled container/member predicates that must fail named rejection controls
  - Execute the actual generated controller dispatcher from a real synthetic committed installed-source fixture without building or publishing a controller
limits:
  - Callback witnesses retain receivers outside the invocation; whole input lifetime initialization global binding native provenance and side-effect closure remain unqualified
  - Arbitrary custom Python iterables were not part of the documented list/None CLI API and now receive TypeError; exact string tuples remain supported
  - This enforces an ingress shape only; candidate annotations and this helper cannot confer operation context authority
  - The positive runtime-context factory and complete lifecycle source/runtime conformance remain open; strict required consumers and all82whole statuses remain unchanged
forbidden:
  - A second argument broker registry effect evaluator or receipt family
  - Source-only mode in required gates or native purity inferred from a callee name
  - Main maintenance workflows authority pins release publication or maintained adopter changes
