- tests/test_operational_observations.py
- audits/issue-394/baseline-observations.yml
contract:
- Add an opt-in pipeline timing observation to the existing non-authoritative operational schema; preserve all existing observation variants and callers.
- Bind repository name/ID, exact commit/tree, a retained source-snapshot digest, one pipeline context, one clock identity/basis and an explicit observed start/end window.
- Report elapsed span, union of observed execution intervals, union of external waits, uncovered span and summed execution elapsed separately.
- Retain failed cancelled and superseded intervals. CPU use remains unknown unless separately observed for every execution interval.
- Reject mixed clock identities duplicate intervals negative or boolean times reversed windows and observations outside the declared window.
- Never infer elapsed time or CPU use from summed job durations.
- Capture authenticated provider timestamps as local observations without promoting them to matched cohorts or percentile certification.
- No active proof scheduling suppression or provider/controller mutation is introduced.
expected_tests:
- parallel ten millisecond jobs have ten milliseconds elapsed and twenty milliseconds summed execution
- gaps and external waits remain visible and failures are retained
- invalid or ambiguous clock and identity snapshots reject
- old and new observation schema variants remain readable
forbidden: [new broker, new proof receipt family, performance certification from insufficient samples, maintained adopter mutation]
remaining:
- Adequate matched self and isolated-adopter cohorts and separately reviewed frozen targets and budgets.
- Authenticated independent end-to-end custody and developer-interruption measurements.

ownership_correction: Existing canonical source membership places operational_observations.py in operations; evidence is its measurement consumer, not a second source owner.

provider_projection_followup:
  contract:
  - Add an opt-in pure provider-attempt snapshot projection through existing pipeline_timing_observation.
  - Require caller-authenticated expected run/attempt and exact repository commit/tree; verify every job run/head and complete declared job count.
  - Derive all intervals and statuses from retained raw timestamps/conclusions; reject missing nonterminal unknown-conclusion or naive timestamps rather than inventing time or success.
  - Reject naive clock inputs in the shared existing timestamp reader; preserve missing-as-unknown behavior.
  - Retained captures remain observations only, never matched baselines or authority. No provider I/O is added to product code.

provider_context_followup:
  contract:
  - A complete provider workflow-attempt window cannot claim publication/dispatch/merge-to-custody or developer-interruption endpoints absent from its snapshot. Those contexts require separately authenticated endpoint facts through the generic timing owner.
  - Missing event identity rejects. Optional caller-authenticated expected event must match exactly; event alone does not classify workflow intent.
  - All workflow context assignment remains caller-owned protected workflow policy. PR events may run trusted controllers or adopter workflows; never invent a global event-to-context mapping.
  - Preserve exact bytes of existing valid PR captures and keep observations nonauthoritative.
