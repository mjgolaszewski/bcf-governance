problem: The strict effect traversal receives source call rows but does not independently reconcile their explicit Python call sites against the source. An omitted call can hide a reachable effect before any runtime-context qualifier consumes the inventory.
change:
- Reuse the existing source and function-identity owners, independently of FunctionVisitor call extraction.
- After complete public-operation admission and before effect traversal, reparse the inventoried Python source and reconcile all discovered runtime function identities and explicit call spans.
- Bind every file to its captured raw-byte SHA256. For committed inventories independently reconstruct the complete committed Python file membership through the existing source owner.
- Reject missing, extra, overlapping or moved call rows, missing function rows and contradictory call-expression or argument digests.
- Preserve optional legacy call contracts, future annotations, nested definitions, native Unicode positions and CRLF source bytes.
- Preserve source-only observations as unqualified; coverage agreement grants no runtime, policy or phase authority.
scope_limits:
- This validates explicit call syntax in the existing runtime-function scopes. It is not independent runtime effect discovery or positive native/dynamic qualification.
- Reuse existing function identity and overload rules; do not claim a second independent proof of those rules.
- Deferred lambda bodies and initialization retain their existing separate, unqualified treatment. No absence or purity conclusion follows from their exclusion from function call rows.
- Caller still authenticates repository, source population and protected policy. No candidate execution, new graph, registry, evaluator or receipt family.
expected_tests:
- Actual consumer refuses erased, duplicated, moved or replayed source call rows, including a removed edge to an independently witnessed write.
- Removing both an edge and its paired test inventory from a committed subject still fails against independently reconstructed membership.
- Reject missing function/file rows, duplicate files, changed source bytes, wrong member digests and unsafe paths.
- Preserve ordinary calls, repeated calls, nested frames, default/decorator/annotation syntax, postponed annotations, Unicode, CRLF and structured argument contracts.
- Installed SDK-absent fresh and upgrade consumers retain the guard; removing only the consuming guard causes the named omission detector to fail.
required_checks:
- Affected semantic and protected-operation behavioral controls
- Standard lint, canonical pack generation/check and architecture boundaries
- Installed fresh/upgrade private runtime parity
forbidden:
- Main, release, predecessor or maintained adopter mutation
- Turning require_runtime_context off or claiming the positive runtime qualifier is complete
- Replaying unchanged full baselines for bookkeeping or hand-editing generated authority/workflow files
