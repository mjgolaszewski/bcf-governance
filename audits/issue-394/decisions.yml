document: {kind: issue_394_derivable_decision_inventory, path: audits/issue-394/decisions.yml, status: characterized_not_activated, authority: false}
rule: authenticated state plus approved policy determines routine actions; missing authority blocks and uncertain impact expands proof
mechanically_derivable:
- {decision: repository and bound PR base head, owner: bcf_governance/tooling/local_pr_context.py::resolve_local_pr_context, facts: [provider repository identity, bound PR, exact base and head], residual: revalidate before each authority boundary}
- {decision: lifecycle intent and bounded target, owner: bcf_governance/tooling/ci_graph_post_merge.py::authored_post_merge_scope, facts: [validated workitem DAG, exact statuses, successor dependencies], residual: integrate only the admitted Issue 420 fix without reordering unrelated work}
- {decision: exact push subject and reconciliation order, owner: bcf_governance/tooling/ci_authority_submit.py::submit_candidate, facts: [canonical source identity, fixed point, prospective proof], residual: one coalesced exact transaction and resumable continuation}
- {decision: protected merge legality, owner: bcf_governance/tooling/ci_recovery_frontier.py::protected_merge_frontier, facts: [authenticated protection, exact candidate, authority ancestry], residual: prove every legal alternate and terminal rejection}
- {decision: claim test and control population, owner: governance/gate-contracts.yml, facts: [claim dependency closure, exact manifests, policy, detector qualifications], residual: independently derive required population and expand dynamic unknowns}
- {decision: affected closure, owner: bcf_governance/tooling/affected_proof_closure.py, facts: [exact base candidate graph semantic owners and dependencies], residual: full generated fixture configuration trust and mixed-toolchain corpus}
- {decision: reuse or execute, owner: bcf_governance/tooling/evidence_planning.py, facts: [original immutable proof, current exact applicability, freshness, authority, detector qualification], residual: extend exact continuation and preserve current-session prerequisites}
- {decision: shard count readiness and placement, owner: bcf_governance/tooling/evidence_scheduling.py, facts: [sound unresolved population, dependencies, resources, bound duration observations], residual: bound nested fanout leases and resource conflicts without speculative duplicates}
- {decision: installed interpreter capsule, owner: bcf_governance/tooling/interpreter_environment.py, facts: [repository-owned dependency contract, runtime contract, exact installation], residual: retain unattributed compatibility/interpreter diagnostic and require exact adopter/stage context; do not invent declarations or use an ambient controller environment}
- {decision: release version and asset inventory, owner: bcf_governance/tooling/release_asset_inventory.py, facts: [active release policy, certified subject, complete exact build manifest], residual: preserve exact bytes through collector publisher and custody}
- {decision: adopter source inventory, owner: bcf_governance/tooling/release_adopter_sources.py, facts: [approved adopter population, provider repository default-source facts, source commit and tree], residual: isolated1.4 provider capture and freshness pass; installed current-consumer qualification and integration remain pending without publication authority}
- {decision: next legal recovery action, owner: bcf_governance/tooling/ci_recovery_frontier.py::compile_recovery_frontier, facts: [exact admitted state, scoped failure, observed mutation outcome], residual: authenticate outcome before mutation retry; only invalidated or unobserved work resumes}
- {decision: immutable publication continuation, owner: bcf_governance/tooling/release_publication_transaction.py, facts: [certified receipt, exact tag assets and attestations, provider observation], residual: complete crash-after-acceptance and credential-retirement corpus}
- {decision: due periodic work and next consumer fallback, owner: governance/gate-contracts.yml, facts: [approved proposition cadence freshness expiry and resource priority], residual: implement due grace catch-up nonoverlap and on-demand execute-or-block through existing scheduler owners}
requires_explicit_policy_or_intent:
- approve a genuinely new assurance trust protection or authorization policy
- approve profile-specific optimization opt-in and compatible activation
- approve periodic cadence freshness grace and foreground capacity policy
- approve baseline-relative performance and resource complexity budgets after measurement
- authorize new product intent that cannot be derived from existing lifecycle state
presently_unprovable:
- {decision: exclude proof with unknown dynamic generated or cross-language dependencies, consequence: expand to the sound governed closure}
- {decision: treat a local or compatibility observation as protected provider authority, consequence: block the authority consumer}
- {decision: infer source equivalence from a version branch filename cache key or prior green result, consequence: authenticate exact applicability or execute}
- {decision: report statistically meaningful p95 improvement from one predecessor subject, consequence: retain observations and collect adequate matched cohorts}
- {decision: retire the prose DAG from the dormant compiler alone, consequence: require full machine lifecycle populations executable conformance and generated-view parity first}
