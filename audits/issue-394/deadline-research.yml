observed_contracts:
  immutable_get:
    owner: bcf_governance/tooling/provider_read.py::open_provider_get
    attempts: 3
    normal_backoff_seconds: [1, 2]
    maximum_retry_after_seconds_per_delay: 30
    github_transport_socket_timeout_seconds: 30
    conditional_socket_and_delay_budget_seconds: 150
    limitations:
    - This arithmetic bounds configured socket waits and delays only; it is not a wall-clock deadline.
    - Response reading is outside the retry opener and has no explicit total elapsed deadline.
    - Retry-After float parsing lacks explicit finite-number rejection; a NaN value must be a cause-specific negative case.
  repository_artifact_inventory:
    owner: bcf_governance/tooling/ci_github_artifact_inventory.py::complete_repository_artifacts
    maximum_objects_per_read: 100000
    page_size: 100
    maximum_pages_per_read: 1000
    maximum_stability_reads: 4
    maximum_json_requests: 4000
    conditional_socket_and_delay_budget_seconds: 600000
    limitations:
    - The arithmetic composes existing maxima, not observed duration or an approved execution budget.
    - Two consecutive matching inventories are required; drift can cause up to four complete reads.
    - A name-prefix filter applies after collection and does not narrow the provider request.
    - Outer cancellation, response bytes, setup, cleanup and caller loops remain outside this partial envelope.
  graph_timeout_checks:
    owner: bcf_governance/tooling/ci_graph_timeouts.py
    established:
    - Gate jobs must contain the largest declared single gate timeout plus declared headroom.
    - Each component sequence job must contain every declared component minimum individually.
    missing:
    - Sum of sequential component work and retry paths.
    - Reachable provider calls, pagination, response reads and nested controller-resolution work.
    - Independently authenticated measured lower bounds, freshness and approved headroom/quantization.
next_contract_obligations:
- Inventory all provider-resolution, controller authorization/dispatch, exact-main and release-authorization call paths through existing source owners.
- Bind each sequential, parallel and recovery path to its exact source, subject, policy and bounded retry/resource semantics.
- Treat missing or stale measurement as conservative expansion or a blocker; never silently substitute a zero cost.
- Reproduce the historical 568-second inner-work case under a 600-second outer limit with nonzero overhead as a rejection fixture; fixture arithmetic alone is not authenticated historical timing.
- Approve measured target and budget policy before activation; no numerical proposal in this research confers approval.
- Require early envelope validation before rendering or allocation and independently test every sibling consumer.
