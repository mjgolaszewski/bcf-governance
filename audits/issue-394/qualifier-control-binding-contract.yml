  status: source_review_hypothesis_not_executed
  observation: Existing qualification metadata compares control_ids with policy, while probe recomputation uses the receipt's supplied IDs/oracles and optional v3 presence. Establish whether those two populations can diverge through executable counterfactuals before declaring a defect.
