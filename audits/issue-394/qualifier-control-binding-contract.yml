  forbidden: [main, maintenance, adopters, manual CI digest or authority pins, gate waivers, alternate receipt verifier or claim registry]
contract:
  authority: Existing protected policy capture and canonical producer/claim/receipt/session/artifact owners remain authoritative for their scopes; the consuming actor authenticates source selection.
  population: For inline subject qualification in protected mode, reconstruct required control IDs and oracles from the same committed canonical gate contracts. Match both directions between the complete inline required controls and actual probes; reject missing, duplicate, contradictory or substituted traces.
  oracle: Probe oracle must equal the protected declared oracle. Reuse existing raw-artifact oracle recomputation, mutation-applied, exit and unexpected-source-change checks; do not replace them with satisfied booleans.
  artifact_binding: Probe raw-artifact references must be canonical relative members of the receipt's declared artifact population. Existing artifact and raw-result owners remain sole verifiers. Bound artifact admission rejects symlink files/directories and noncanonical or escaping paths while legacy unbound behavior remains unchanged.
  compatibility: Absent protected context retains ordinary behavior. Required native-model admission uses protected mode only; stronger rejection is not a backdoor legacy authority claim.
  earliest_boundary: Reject invalid bound qualification populations/oracles/artifact bindings before executing receipt-supplied oracle logic or reparsing raw test files. Legacy evaluation order remains unchanged.
  referenced_qualification: Preserve independent detector-reference applicability and canonical reference checks; no inline metadata may replace referenced evidence.
verification:
  baseline: Execute real existing v3 receipt/session fixture counterfactuals; record each accepted omission/substitution separately from already rejected controls and the valid fixture. No native runtime approval from fixture results.
  scope: Source/private/installed fresh and upgrade parity; affected claim/receipt/planning suites, architecture, lint/pack and governance. Keep existing canonical-reconciliation and runtime blocks unwaived.
