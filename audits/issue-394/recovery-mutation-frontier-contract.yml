contract:
- Remove the four unconsumed generic mutation_result projection edges rather than accepting caller assertion or inventing an authentication token, receipt, broker or parallel transaction owner.
- Generic committed, not_committed, unknown and conflict inputs must fail through the existing closed unsupported-edge error before any action is emitted. An idempotency key or asserted authenticated flag does not create authority.
- Preserve supported immutable-read, exact submission, provider retry, protected merge and controller-transition projections and their existing owner-side consuming checks.
- Continue ambiguous provider mutation reconciliation through existing concrete operation owners; do not replace those owners with a generic retry path or blind mutation retry.
- Historical JSON observations remain retained as non-authoritative evidence. The unsupported generic Python helper ingress now blocks; ordinary CLI grammar, provider statuses and valid frontier bytes remain unchanged.
verification:
- Capture actual pre-change outputs for all four generic states with unbound identity and caller-asserted key/authority variants.
- Execute cause-specific unsupported-edge tests and existing valid frontier/provider/merge/controller consumers; prove private/source parity and installed behavior.
- Complete required governance, architecture, semantic and package checks before integration; use canonical submission only after fresh native admission.
forbidden: [new authority or receipt family, hand-authored workflow pins, maintained adopters, immutable predecessor bytes, editing submitted subjects, claiming full recovery closure from this retirement]
