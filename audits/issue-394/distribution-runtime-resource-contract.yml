schema_version: '1.0'
runtime_prebuild_admission:
  owner: bcf_governance/tooling/governance_validation/source_inventory.py
  side: query
  required_behavior:
    - Move the three existing resource queries without changing their AST or public signatures; preserve release-script imports as compatibility aliases.
    - Consume metadata coverage from the loaded runtime before the selected-project subprocess in validate_source_distribution.
    - Recheck coverage in the standalone source-inventory query before backend Distribution allocation.
    - Preserve the existing framework-source applicability boundary and genuinely nonframework behavior; add no caller authority flag or new population selector.
    - Missing or excluded resource coverage rejects through existing typed source-admission errors; candidate evaluator success cannot supply authority.
    - Preserve malformed-observation controls after furnishing complete authored resource fixtures, rather than allowing an earlier fixture omission to mask them.
  migration: Framework-source fixtures and callers must declare coverage for their existing pack resources; this is the same required population enforced by wheel verification, checked earlier.
  target_modules: [bcf_governance/tooling/governance_validation/source_inventory.py, bcf_governance/tooling/governance_validation/preflight_distribution.py, .github/scripts/test_release_artifacts.py]
  expected_tests: [real missing metadata rejection, excluded resource rejection, no project subprocess on failure, no backend allocation on failure, malicious candidate evaluator not executed, valid complete framework source, nonframework compatibility, installed SDK-absent authority]
authority: false
phase: P32
workitems: [P32-P0-03, P32-P0-04, P32-P0-07]
bounded_context: Existing release artifact qualification
architectural_layer: Existing release verification script
operation_side: query
owner: .github/scripts/test_release_artifacts.py
problem: Wheel runtime asset discovery sees only JavaScript modules; missing or substituted standalone runtime schemas can survive until installed execution.
required_behavior:
  - Independently discover every pack file plus non-Python package resource from the admitted source, excluding interpreter caches only.
  - Keep ordinary package Python discovery separate from data selection; Python files embedded in the pack remain required pack resources.
  - Check declared package-data coverage before build and exact required resource population and bytes before wheel execution or installation allocation.
  - Reject missing, duplicated, substituted or symlinked required resources rather than selecting an arbitrary copy or silently omitting source members.
  - Preserve the existing canonical package and release verification owners; no asset registry or alternate release gate.
  - Qualify source, wheel and sdist resource parity separately from installed-runtime behavioral tests and live publication custody.
targets: [.github/scripts/test_release_artifacts.py, tests/test_release_runtime_resource_inventory.py, pyproject.toml]
forbidden_surfaces: [generated workflows, authority pins, maintained adopter upgrades, new receipt family, performance or release closure claims]
expected_controls: [omitted schema population, omitted pack Python, metadata exclusion, substituted asset bytes, duplicate archive member, symlink source, valid complete resources, ordinary source Python exclusion, cache exclusion]
limits:
  - Source-root admission and final immutable artifact custody remain owned by their existing callers.
  - Passing static or archive checks does not qualify all consumer behaviors or close any whole requirement.
dependency_inventory_followup:
  observed_failure: Existing runtime import inventory rejects undeclared setuptools imported by the packaged source declaration query.
  evidence: tests/test_release_artifacts.py::test_runtime_third_party_imports_are_declared_as_package_dependencies
  required_correction: Declare the actual packaged query dependency using the existing build-system setuptools lower bound; do not exempt the module or weaken import discovery.
  migration: Additive SDK dependency declaration; no CLI or standalone consumer grammar change. Existing controller requirement derivation must include it mechanically.
  qualification: Rerun runtime import inventory and source requirement derivation; actual isolated distribution and controller closure remain separately required.
