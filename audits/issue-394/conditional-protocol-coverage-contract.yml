problem: The independent pass now checks mandatory attribute/context/await rows, but conditional protocol rows and expression occurrences can still be omitted or substituted before runtime-context qualification.
scope:
- Extend the same cold AST pass to all currently supported protocol syntax and comprehension guards, using independently reconstructed site grammar and the existing canonical native-literal/Boolean eligibility proofs.
- Do not invoke FunctionVisitor or its implicit protocol classifier to reconstruct expected source sites; deleting that producer classifier and its paired test must leave cold source obligations visible.
- Bind kind, exact caller/span/expression digest, model version and occurrence; bind explicit call-contract occurrences in the same source traversal, including collisions with comprehension guard expressions.
- Recompute existing native eligibility from actual source; no annotation or candidate disposition supplies exclusion. Qualification of the native eligibility models themselves remains a separate protected-context requirement.
- Keep existing source/protocol/effect owners and schema identities. No parallel registry, graph, runtime evaluator or receipt family.
controls:
- Erase truth/operator/iteration/collection/subscript/format/exception/match obligations, retaining all unrelated explicit calls and stores.
- Remove the producer emitter or classifier; the independently reconstructed source population must still reject omissions.
- Duplicate or forge kind/span/digest/caller/version/occurrence and exchange repeated-expression identities.
- Include actual truth/hash/iteration/operator/format/subscript callbacks after erasing their inventory rows.
- Preserve native literal and Boolean-result exclusions, eager definitions/class bodies, deferred function/lambda scopes, comprehensions, closure scalar cells, Unicode and CRLF bytes.
- In fresh and upgraded SDK-absent Lite installations, remove only the consumer reconciliation call; named omitted-protocol controls must fail.
