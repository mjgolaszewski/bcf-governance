document:
  kind: affected_surface_contract
  path: audits/issue-394/submit-normalization-slice.yml
  status: planned
  authority: false
workitem: P32-P0-07
trigger: canonical submit rejected incomplete P32 as phase closure because it consumed the inherited generated scope before
  canonical normalization
invariants:
- I20
- I21
- I22
- I25
- I26
- AC17
- AC21
bounded_context: ci_authority
architectural_layer: tooling
operation_side: command
owner: bcf_governance/tooling/ci_authority_submit.py::submit_candidate
targets:
- bcf_governance/tooling/ci_authority_submit.py
- tests/test_candidate_submit.py
- bcf_governance/tooling/scaffold_governance_artifacts.py
- tests/test_reconcile_governance.py
- governance/application-operations.yml
existing_owners:
  authored_state: bcf_governance/tooling/governance_validation/authored_phase_state.py::validate_authored_phase_state
  normalization: bcf_governance/tooling/scaffold_governance_artifacts.py::reconcile_main
  lease: bcf_governance/tooling/local_execution_admission.py::local_gate_lease
contract:
- reject authored contradiction or wrong intent assertion before any normalization mutation
- acquire the existing local lease before normalization so a concurrent admitted train cannot be mutated
- reuse canonical selective fixed-point checks; invoke the existing exact-runtime reconcile owner only for dirty derived state
- normalize through the canonical atomic workflow-authority transition; never edit generated pins or choose stages
- derive fresh context commit tree scope and title after normalization; never prove or push the old subject
- release the normalization lease before the existing prospective owner acquires its own execution lease
- normalization failure or partial state blocks prospective proof and push
- The canonical release-version stage cache includes the actual authoritative version source; a version-only change cannot
  inherit an old clean projection
positive_tests:
- stale generated scope normalizes before title proof and push
- fixed-point submission performs no generation
negative_tests:
- authored contradiction mutates nothing
- normalization failure cannot prove or push
- busy lease performs no normalization
- wrong intent assertion mutates nothing
- A source-version-only change rejects stale projections even after an earlier clean cache entry
forbidden:
- intent-flag workaround
- false phase completion
- manual generated pins
- new mutation authority
- new broker or principal
- weakening prospective or provider proof
coordination_effect:
  symbol: bcf_governance/tooling/local_execution_admission.py::local_gate_lease
  classification: non_authoritative_output_effects
  scope: Existing fixed host-local lease path and authenticated execution namespace only
  rejection: Invalid execution identity or busy lease blocks before normalization
  cleanup: Existing finally block unlocks and closes its descriptor
  authority_effect: none; no provider or truth effect

release_surface_completeness:
  target_module: bcf_governance/tooling/release_version_projection.py
  bounded_context: evidence
  architectural_layer: tooling
  operation_side: query_before_existing_projection_command
  trigger: Package parity found a missing current-version changelog target after normalization had accepted the tree.
  contract:
  - Validate an authored unreleased target or existing exact release heading before any projection mutation.
  - Reject absent stale duplicate or misplaced unreleased target when no compatible exact released entry permits it.
  - Never fabricate release history or automatically author a release target.
  - Preserve graphless and fixture roots without package surfaces or an optional changelog.
  - Include every inspected README usage and changelog surface in release-version cache applicability.
  expected_tests: [tests/test_reconcile_governance.py, tests/test_pack_sync.py]
  forbidden: [release publication, phase activation, workflow edits, authority relaxation]

  admission_boundary: The canonical submit caller invokes this same pure owner before acquiring its local lease or requesting reconciliation; partial release ownership rejects there as well.
  runtime_version_owner: bcf_governance/tooling/runtime_capacity.py::executing_runtime_version

submission_progress_projection:
  targets: [bcf_governance/tooling/ci_authority_submit.py, bcf_governance/tooling/ci_commands.py, tests/test_candidate_submit.py, docs/USAGE.md]
  bounded_context: ci_authority
  architectural_layer: tooling
  operation_side: existing_command_with_non_authoritative_observation
  contract:
  - Forward the existing prospective progress sink through canonical submit; use the unchanged operational-observation schema.
  - CLI progress is flushed JSON on stderr; stdout retains its single terminal result.
  - No event grants proof or provider authority; incomplete proof still prevents push.
  - Keep the optional callback additive and preserve behavior for callers without a sink.
  expected_tests: [test_submit_forwards_existing_progress_without_conferring_authority, test_submit_cli_keeps_progress_on_stderr_and_result_on_stdout]
  forbidden: [new progress authority, second execution path, provider polling loop, fabricated progress on silent stages]
