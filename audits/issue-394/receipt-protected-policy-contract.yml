contract:
  selection: The existing trusted caller authenticates repository and exact protected commit/tree. New optional policy_subject is not authority and must equal the receipt evaluation subject; no candidate override or implicit HEAD substitution.
  source: Read exact committed receipt schema, canonical gate contract, profile, evidence policy, dependency tree entries, test-node manifests and session schemas through the existing inert Git owner. Validate object type, membership, subject and blob identity.
  evaluation: Reuse canonical claim parsing, receipt applicability, artifact/test/control recomputation, identity/session/qualification-reference verification and freshness. Preserve complete source/detector/test/toolchain/trust dependency closure.
  admission_settings: Bound mode requires canonical profile3.0, session enforcement, expected kinds/invocations and negative-control/allowlist settings from the same exact protected policy. Caller overrides cannot weaken them.
  consumption: Reauthenticate the protected receipt/gate policy capture before returning admitted results. Reject missing, modified or contradictory context. A class identity or caller verified flag grants no authority.
  compatibility: Optional internal query context only; ordinary CLI grammar, absent-context receipt behavior and existing receipt/session schemas remain unchanged.
  runtime_limit: This admits protected qualifier evidence policy. It does not bind executing native code, source frames or actual model applicability and cannot discharge operation effects by itself.
controls:
- Old unbound behavior remains compatible.
- Valid committed policy remains usable when candidate/dirty working schema, gate contract, test manifest or session schema differs or is absent.
- Unknown or incomplete protected subjects and wrong current subject fail before evidence discovery.
- Missing or substituted committed objects, stale dependency closure, forged qualification flags and incorrect producer/profile/session/test/control bindings remain rejected.
- Independent extraction characterization and installed fresh/upgrade aliases preserve existing required receipt behavior.
verification:
  gates: [affected behavioral and cause-specific controls, canonical pack generation/check, affected architecture, lint, required governance]
  known_unwaived_governance_block: CI graph public-contracts value source digest requires canonical submission/reconciliation; do not hand-edit pins or claim whole governance green.
