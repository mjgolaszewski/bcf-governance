contract:
- Capture the existing complete inventory for a representative source fixture before moving production code.
- Preserve inventory fields ordering identities fingerprints class/import/method facts dynamic-call observations and error classes byte for byte.
- Keep population discovery import resolution and public query entrypoints in their existing owner; retain compatibility reexports for existing helper names.
- Extract only the AST function/call visitor and its existing private return-fingerprint and classification constants into a cohesive Python fact collector.
- Move annotation rendering to the existing annotation owner with the endpoint and function collectors as its two real consumers.
- Register the extracted collector and shared annotation helper in the existing generated-source provenance owner.
- Assign the new collector explicitly to semantic_ownership through the existing module-context policy without broadening wildcard ownership.
- Preserve CLI and source/package/private-template parity and keep every production module within the declared cap.
- Add no new effect classifier state evaluator lifecycle authority or active optimization during deconstruction.
