schema_version: '1.0'
private_runtime_schema_projection:
  context: Existing CI authority query and canonical installation projection
  side: query; generation remains owned by build_pack_manifest.py
  problem: Standalone private runtime cannot resolve SDK-only packaged schema location.
  required_behavior:
    - Preserve SDK schema authority at its existing packaged template root.
    - Project the complete existing canonical schema population into private runtime resources through the existing generator and manifest.
    - Select private schema resources from the loaded private module; never discover caller, checkout or current-working-directory schemas.
    - Missing owned resources fail closed even when candidate schemas exist and accept arbitrary documents.
    - Qualify actual protected phase queries and schema rejection with SDK absent in fresh and upgrade source installations.
    - Keep installed runtime resources framework owned under existing installation and upgrade ownership.
  target_modules: [bcf_governance/tooling/ci_github_authority.py, .github/scripts/build_pack_manifest.py]
  forbidden_surfaces: [candidate schema fallback, new schema registry, workflow or authority pins, lifecycle status promotion]
  expected_tests: [private module resource binding, canonical population parity, candidate schema substitution, missing resources, protected no-parent phase query, fresh and upgrade SDK-absent consumers]
  limits: Source installation is distinct from wheel/sdist, all profiles, real adopter and full parent-proof qualification.
authority: false
phase: P32
workitems: [P32-P0-03, P32-P0-04]
status: authored_contract
bounded_context: evidence lifecycle
architectural_layer: existing workitem lifecycle tooling
operation_side: query and authored admission
owner: bcf_governance/tooling/evidence_workitem_lifecycle.py
problem: Mandatory requires- predicates can be ignored as prose when whitespace, case or an unsupported predicate name prevents the existing exact-prefix match.
required_behavior:
  - Keep mandatory predicate interpretation in the existing shared lifecycle decoder.
  - Accept the exact existing requires-workitem-closure grammar and retain its predecessor identity, duplicate, ordering and DONE dependency checks.
  - Reject malformed or unknown mandatory predicates rather than interpreting them as contextual prose or satisfied conditions.
  - Reject whitespace and case variations without silently normalizing them into authority.
  - Preserve ordinary prose outside the reserved mandatory predicate namespace.
  - Apply the same typed outcome at authored readiness, active-ledger loading and computed workitem truth boundaries.
  - Keep future full lifecycle composition predicates blocked until their actual consumer is implemented and qualified.
expected_controls:
  - Leading whitespace cannot hide a dependency on an unfinished predecessor.
  - Unsupported mandatory lifecycle or proof predicates cannot be ignored by computed truth.
  - Exact supported predicates and ordinary prose remain compatible.
  - Invalid mandatory syntax rejects before normalization, proof or push through existing readiness consumers.
migration:
  - The requires- prefix is reserved for executable mandatory predicates; contextual prose must use ordinary descriptive sentences.
  - No new predicate grants eligibility in this correction and ordinary CLI grammar is unchanged.
limits:
  - This entry-boundary correction does not implement the complete protected context population or runtime conformance consumer.
  - Keep all82 whole requirements open and P33-P35 dormant.
phase_proof_followup:
  existing_declarations: P32-P0-01 requires P31; P33-P35 first workitems require the preceding phase
  required_authority: Existing certified phase_closed proposition with exact phase/subject, authenticated verifier and immutable evidence custody
  owners_to_extend: [bcf_governance/tooling/evaluation_scope.py, bcf_governance/tooling/evidence_workitem_lifecycle.py, bcf_governance/tooling/prior_evidence_receipts.py]
  forbidden_shortcuts: [whitelisting the phase predicate without consumption, trusting authored history status, promoting caller booleans, accepting a PR or bounded workitem terminal as phase closure]
  current_disposition: Source/template syntax parity is retained; the stricter lifecycle branch fails its own phase admission and is not ready for integration until phase-proof consumption is implemented
authenticated_phase_input_contract:
  operation: Read and independently verify an existing historical exact-main finalizer certificate
  context: Existing provider CI authority and evidence lifecycle
  side: query
  trusted_schema_source: Loaded SDK packaged template schemas; candidate schemas cannot supply authority
  required_sequence:
    - Derive expected phase and subject from protected canonical lifecycle policy; authored completion labels are selectors only.
    - Authenticate repository, historical source and tree, default-branch ancestry, and source-bound CI authority.
    - Select the latest exact-source independent finalizer through the existing provider owner; do not fall back to an older successful run.
    - Authenticate role, attempt, job inventory, artifact identity and provider digest before reading the exact bounded archive.
    - Verify exact bundle inventory and file hashes through existing bundle ownership.
    - Require bundled authority to equal independently fetched source-bound provider authority.
    - Recompute normalized certification through existing verifier using loaded SDK schemas.
    - Require certified full phase_closed success for the exact expected phase and source/tree; PR and bounded workitem propositions are insufficient.
    - Reauthenticate moving provider subjects at consuming boundaries.
  forbidden_surfaces: [new receipt family, parallel evaluator, caller boolean authority, candidate-supplied schemas, admission provisional report as terminal certification]
  expected_adversarial_controls: [wrong repository, wrong phase, substituted source or tree, artifact digest mismatch, omitted bundle file, altered authority, substituted schema source, later failed finalizer, expired artifact, moved provider subject, PR proposition, bounded workitem proposition]
  cold_predecessor_observation: audits/issue-394/phase31-finalizer-cold-verification.json
  remaining: Implement the authenticated input through existing owners and wire actual authored/computed phase-predicate consumers; the observation alone grants no eligibility.
phase_input_implementation_scope:
  owner: bcf_governance/tooling/trusted_inputs.py
  operation: verify_phase_closure_input
  arguments: Authenticated API port, repository, expected phase, exact expected historical commit and tree
  result: Existing ProviderArtifact and CertificationVerification plus exact original archive bytes; no new receipt or activation grant
  expected_tests: tests/test_phase_closure_input.py using existing exact-main finalizer fixture and real normalized bundles
  forbidden_files: [primary submitted worktree, workflows, authority pins, public CLI grammar, maintained adopter repositories]
  integration_limit: Caller coordinates are expected-value assertions only; canonical protected-policy derivation and actual lifecycle consumption remain required before integration.
protected_phase_population_scope:
  owner: bcf_governance/tooling/trusted_inputs.py
  operation: verify_required_phase_closure_inputs
  source: Authenticated current-default plans/build-plan.yml hard_dependencies, phase-ledger and phase-history at one exact provider subject
  behavior:
    - Derive the complete required phase population from the protected build plan; candidate acceptance removal cannot shrink it.
    - Treat history verification snapshots solely as exact subject locators, then authenticate each independent finalizer certificate.
    - Resolve an active predecessor against current protected main rather than requiring an archived history entry.
    - Validate the full dependency and locator population before downloading any proof artifact.
    - Reject malformed, duplicate, absent, contradictory or moving protected inputs without successful-history fallback.
  result: Protected MainIdentity plus phase-keyed existing artifact and certification verification contexts with retained original bytes
  forbidden_shortcuts: [local candidate lifecycle policy as authority, authored completed or closed labels as proof, caller-selected evidence run, missing dependency treated as empty population]
  controls: tests/test_phase_closure_population.py
  limits: This authenticated population query still needs wiring into authored readiness and computed lifecycle truth before integration.
truth_owner_deconstruction:
  reason: Existing governance_truth.py is798 lines and cannot receive phase-input integration without violating its800-line cap.
  fatty: bcf_governance/tooling/governance_truth.py
  owning_context: evidence truth
  layer: tooling query
  destination: Existing bcf_governance/tooling/truth_workflow_graph.py
  extraction: Workflow gate resolution and its path-safety primitive; retain compiled graph and legacy traversal semantics
  preserved: Existing truth CLI, derive_truth API, TruthfulnessError identity, YAML loader semantics, workflow diagnostics, wrapper ordering and all authority decisions
  approach: Keep the old private workflow query as a thin delegate; explicitly pass its unchanged YAML loader rather than introducing a circular import or duplicate evaluator.
  tests_first: tests/test_truth_workflow_extraction.py and affected existing truth/graph controls
  forbidden: [new graph or claim owner, workflow or authority pin edits, source admission changes, phase predicate whitelisting, public CLI changes]
  gate: Characterize before moving code, compare moved AST bodies with only declared loader injection, verify owner boundaries and mirrors.
actual_phase_consumer_scope:
  owners: [bcf_governance/tooling/evidence_workitem_lifecycle.py, bcf_governance/tooling/governance_truth.py]
  operations: [phase prerequisite observation, bounded authored readiness, computed workitem closure, existing derive_truth projection]
  source_authority: Only authenticated provider API and expected repository context through verify_required_phase_closure_inputs; no raw proof dictionary or caller verified boolean ingress
  required_behavior:
    - Recognize exact requires-phase-closure grammar only when the consuming lifecycle path enforces it; unsupported mandatory predicates continue to block.
    - Keep structural parsing distinct from independent phase-proof applicability and verification.
    - Derive protected required parents independently of candidate declaration removal; do not let local files shrink the bound population.
    - Bind every required fact to exact repository, phase, historical subject/tree, authenticated finalizer and immutable artifact bytes.
    - Missing authority yields a typed missing or unverified prerequisite; it cannot yield eligible, verified or closed workitem truth.
    - Authored readiness checks exact target and its existing declared predecessor closure before allocating evidence; future unrelated workitems cannot supply or hide prerequisites.
    - Reauthenticate at computed truth consumption after long-running evidence; an earlier readiness observation alone is insufficient.
    - Preserve ordinary genuinely unbound behavior when no reserved phase requirement exists; do not add ambient network or token discovery to pure parsing.
    - A PR progress or bounded workitem proposition never substitutes for full prerequisite phase closure.
    - Keep reports within existing workitem and truth projections; no new receipt family, evaluator or lifecycle graph.
  verification_matrix: [authenticated predecessor success, missing API, missing repository, caller boolean rejection, wrong phase, wrong repository, candidate dependency removal, moved source after readiness, missing or newer failed finalizer, unrelated future prerequisite, ordinary unbound compatibility]
  remaining_integration: Readiness provider-context forwarding, trusted PR and exact-main consumers, ordinary CLI custody, installed runtime parity and full semantic qualification must pass before branch integration.
  local_readiness_owner_limit: local_pr.py is800 lines; finish a separate characterized responsibility extraction before adding forwarding behavior there.
phase_closure_early_authored_invariant:
  owner: bcf_governance/tooling/evidence_workitem_lifecycle.py
  invariant: Full phase closure requires every active workitem to be authored DONE before required evidence can possibly close the phase.
  admission_order: Reject unfinished authored workitems before any provider query, artifact download, evidence allocation or expensive execution.
  compatibility: Keep computed verification independent; authored DONE is necessary and never sufficient.
  controls: tests/test_workitem_phase_consumption.py full phase readiness controls
trusted_pr_phase_context_forwarding:
  owner: bcf_governance/tooling/ci_github_pr.py
  boundary: Existing independent trusted evaluator calling derive_truth
  required: Forward the already authenticated provider API and expected repository; a candidate cannot disable protected predecessor discovery by removing its own phase predicates.
  controls: Existing protected-evaluator rejection control must assert exact API and repository forwarding in addition to rejecting a candidate pass claim.
  preserved: Existing candidate subject authentication, artifact inventory/digest checks, independent evaluation, required status identity and ordinary CLI grammar
local_owner_deconstruction:
  fatty: bcf_governance/tooling/local_pr.py
  current_lines: 800
  context: Existing prospective CI authority
  layer: tooling use case and telemetry query
  destination: bcf_governance/tooling/ci_authority_prospective_telemetry.py
  extraction: Existing per-train progress list, monotonic origin, emit and matching-start fail transition
  preservation: Same event construction, sequence, monotonic milliseconds, validation-before-sink order, callback exceptions, partial-private reporting and false authority
  dependency_rule: Pass the existing validator explicitly so the local facade remains injectable; retain existing operational event primitives and schemas.
  tests_first: tests/test_prospective_progress_extraction.py plus existing prospective and submission behavior
  limits: Pure extraction precedes provider-context behavior; no CLI mode, graph, receipt family or evaluator added.
local_phase_context_forwarding:
  owner: bcf_governance/tooling/local_pr.py
  required_calls: [public pre-lease authored readiness, inner exact-subject authored readiness, PR truth, post-merge semantic truth]
  authority: Existing authenticated provider API and expected repository from the canonical submission caller
  invariants: [missing phase authority blocks before proof allocation, computed consumption refreshes authority after evidence, candidate cannot shrink protected parent population, existing provider/head/context freshness stays enforced]
  tests: Source forwarding controls plus actual phase-consumer fixtures and existing full prospective suite
  remaining: Ordinary CLI/exact-main and installed consumer qualification remain required before integration.
local_phase_repository_binding:
  rule: Inner phase consumption uses the authenticated LocalPRContext repository independently of the managed workflow-authority repository selector.
  compatibility: Keep ordinary lane workflow-authority behavior unchanged; do not enable managed-controller checks merely to supply phase identity.
  mismatch: A contradictory asserted repository must block before phase-proof acquisition or evidence allocation.
  controls: Public and inner preallocation forwarding, ordinary bound context, contradictory repository, and both actual full-train truth boundaries
ordinary_truth_cli_phase_context:
  owners: [bcf_governance/tooling/ci_authority_preflight.py, bcf_governance/tooling/governance_truth_cli.py]
  operation: Resolve the existing GitHub execution context at the CLI facade and forward it explicitly to derive_truth
  grammar: Preserve all ordinary CLI flags and output/status behavior
  authority: Environment repository/token are connection assertions only; existing provider verifier authenticates repository/default/policy/finalizer/digest and exact phase scope
  admission:
    - With neither repository nor token assertion, preserve genuinely unbound local behavior and perform no provider discovery.
    - Partial asserted provider context blocks with a typed error before deriving truth; missing identity cannot silently disable protected discovery.
    - Decode origin with the existing exact GitHub remote decoder; reject wrong host, wrong repository, ambiguous or absent remote before constructing an API client.
    - Keep pure derive_truth and lifecycle parsing free of ambient credentials or network discovery.
    - Forward the constructed API and expected repository even if candidate phase predicates were removed; protected policy independently defines the population.
    - Never emit a pass report, write output or create a release receipt after context rejection.
  controls: Actual CLI through real derive_truth and normalized phase bundle; absent and partial authority; mismatched remote; candidate predicate removal; genuinely unbound compatibility
  limits: This facade correction does not independently authenticate the exact-main finalizer lifecycle or complete early preflight/installed/semantic qualification.
hosted_preflight_phase_readiness:
  owners: [bcf_governance/tooling/preflight.py, bcf_governance/tooling/local_pr.py]
  operation: Consume the existing authored evaluation readiness gate before syntax/discovery, semantic evaluation or session allocation
  inputs: Explicit provider API and expected repository on run_preflight; CLI resolves existing connection assertions through provider_context_for_checkout; local prospective calls forward their authenticated phase context
  ordering:
    - Keep cheap Git/authored lifecycle/matrix/structural and evaluation grammar checks first.
    - Validate the bounded target through its existing owner, then authored readiness before test discovery and allocation.
    - Authored incomplete work must block without provider proof download; authored DONE remains necessary and insufficient.
    - Missing phase authority and invalidated/moved proof block before downstream expensive work.
    - Pure run_preflight does not discover ambient credentials; ordinary PR semantics stay unchanged.
  compatibility: Preserve ordinary CLI grammar, trace existing owners, no new execution intent/receipt/evaluator, and keep each production owner within800 lines
  controls: Real missing/valid phase authority, incomplete authored target, preallocation/discovery ordering, CLI context forwarding, both prospective preflight call sites, and genuine unbound compatibility
  limits: Does not replace independent computed truth consumption after evidence or exact-main finalizer authentication.
phase_input_semantic_consumers:
  owners: [governance/canonical-representations.yml, bcf_governance/tooling/trusted_inputs.py]
  problem: Composed authored semantic scan rejects verify_phase_closure_input as an undeclared downstream consumer of existing certified values
  correction: Declare exact authorization consumers under existing certification/provider-artifact families only when source discovery proves they consume those canonical values
  invariants: [existing factories remain sole constructors, no new family or registry, no pure-delegate promotion, no narrow suppression, no analyzer weakening, exact operation population changes must be separately explained rather than overwriting its golden]
  controls: Discover actual verifier source independently; removing each added consumer declaration must restore its corresponding semantic violation
phase_input_temporary_materialization_effects:
  owner: governance/application-operations.yml
  source_owner: bcf_governance/tooling/trusted_inputs.py::verify_phase_closure_input
  discovery: Composed operation scan independently finds path.parent.mkdir and path.write_bytes while materializing bounded provider bytes in an exactly scoped TemporaryDirectory for the existing verifier
  classification: Declare only these two exact leaf calls as non-authoritative temporary output effects for actual reachable public operations; do not hide the whole verification function behind an effect port
  invariants: [verification and provider reads remain traversable, no new authority or mutation factory, no broader path/write wildcard, no golden replacement without exact population delta, canonical reconciliation alone owns generated semantic locks]
  controls: Independently discover the real helper and remove each exact leaf declaration; undeclared-write rejection must return. Then run the complete actual operation population and compare every changed operation against the retained baseline.
exact_main_policy_subject_separation:
  owner: bcf_governance/tooling/trusted_inputs.py
  operation: Extend existing protected prerequisite acquisition with an optional exact admitted policy subject
  authority: The supplied MainIdentity is an assertion only; authenticate repository/default identity, exact provider commit/tree and default-branch lineage before consuming its policy bytes
  invariants:
    - Existing callers without an admitted subject continue to derive policy from current authenticated default.
    - Preserve current protected frontier separately from the exact admitted policy source; historical finalization cannot silently use a newer phase plan.
    - Fetch every lifecycle document at the authenticated selected policy commit; active predecessor coordinates use that same selected subject.
    - Reject malformed, foreign, rewritten or nonlineage subjects before lifecycle reads or proof download.
    - Reauthenticate current default before proof allocation and after verification; moving state rejects without retrying mutations.
    - Return the actual authenticated policy subject alongside the existing verified inputs; no caller boolean or new receipt family.
  controls: Actual retained predecessor fixture, current/historical source distinction, wrong repository/default/tree/lineage, malformed coordinates, moving frontier and unchanged current-default behavior
  followup: Independent exact-main finalizer derives its phase/target from that admitted provider subject and consumes these verified prerequisites before certification; source forwarding alone does not close that followup.
independent_exact_main_readiness:
  owners: [bcf_governance/tooling/ci_exact_main_truth.py, bcf_governance/tooling/ci_github_exact_main.py, bcf_governance/tooling/evidence_workitem_lifecycle.py, bcf_governance/tooling/trusted_inputs.py]
  operation: Independently enforce existing authored readiness and authenticated phase prerequisites for the exact admitted default subject before final certification
  source:
    - Derive active phase from admitted provider lifecycle policy only after subject authentication; optional phase_id null is allowed solely with an explicit admitted subject and never becomes a CLI choice.
    - Use existing complete_tree inventory at the admitted tree, exact content paths and matching blob OIDs; reject missing or ambiguous inventory and unsafe referenced paths.
    - Materialize only required lifecycle YAML data into one scoped temporary root; include every phase hotfix discovered by the independent complete tree population.
  consumption:
    - Extend existing readiness context with the authenticated admitted policy subject and forward it through the existing lifecycle owner; do not implement another evaluator or graph.
    - Require full phase target to match provider active phase; existing owner checks completed phase/hotfix documents and all DONE workitems.
    - Bounded target must be present and authored DONE through the same existing owner, with existing predecessor rules and fresh required phase proof.
    - Consume readiness after authenticating exact truth scope but before collecting certification producers or writing a certification bundle.
    - Keep PR progress explicitly noncertifying; it cannot request phase closure or use this gate to gain terminal authority.
    - Preserve historical admitted-subject finalization after current main moves; pin current default independently at actual proof consumption.
  evidence: Existing finalizer/certification/session/bundle owners retain authority; no new receipt family or caller verified boolean
  controls: Exact phase/workitem positive paths; unfinished phase/workitem/hotfix; missing or forged prerequisite; wrong target; historical source vs current default; omitted/duplicate/wrong-blob/unsafe lifecycle inventory; no partial certificate after rejection; noncertifying PR compatibility
  limits: Installed runtime parity, full lifecycle/effect conformance and whole Issue394 acceptance remain independently required.
exact_main_regular_lifecycle_blobs:
  owner: bcf_governance/tooling/ci_github_api.py
  finding: Existing complete_tree projects only path/blob OID and loses the provider Git file mode needed to distinguish regular lifecycle YAML from symlink blobs
  correction: Share one exact provider tree decoder between the unchanged two-column query and an additive mode-preserving query; finalizer reads lifecycle data only from regular100644/100755 blobs
  invariants: [legacy complete_tree shape unchanged, full population retained, unrelated symlinks do not become lifecycle inputs, unknown modes reject in mode-preserving query, no second parser/graph/registry, no CLI grammar change]
  controls: Legacy exact inventory compatibility; actual Git regular/symlink modes; malformed/missing modes; finalizer rejection of a correctly hashed nonregular lifecycle blob
independent_bounded_successor_projection:
  owners: [bcf_governance/tooling/evidence_workitem_lifecycle.py, bcf_governance/tooling/ci_exact_main_truth.py, bcf_governance/tooling/ci_github_exact_main.py]
  finding: Actual finalizer probe certifies bounded propositions naming an undeclared or self successor despite authenticated source declaring neither
  correction: Extend the existing bounded successor validator with an optional untrusted claimed-successor projection; finalizer passes the authenticated truth proposition and validates it against reconstructed admitted source before phase proof or producer collection
  invariants:
    - Keep existing target, ambiguity and stranded-work checks in their sole lifecycle owner.
    - Claimed successor IDs must be a unique nonempty-string list and cannot exceed the source-declared direct successor population.
    - Structural membership does not manufacture verified eligibility; existing computed truth and evidence requirements remain separate.
    - Preserve the ordinary two-argument validator and all CLI grammar; no graph, registry, receipt family or evaluator added.
    - Reject invalid projection before a certificate bundle can be allocated; phase/PR authority remains distinct.
  controls: Undeclared/self/duplicate/malformed successors, valid declared successor, empty safe projection, existing ambiguity/stranding, disabled source-membership guard and finalizer forwarding
  limits: Full computed workitem/lifecycle conformance and installed qualification remain independently required.
