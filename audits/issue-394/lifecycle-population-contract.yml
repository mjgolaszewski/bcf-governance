contract:
- Derive complete expected contexts, nodes, required relationships and grounded exclusions from authenticated protected canonical owners, independently of the proposed composition and its test list.
- Retain repository default, PR comparison base, observed head, local descendant and protected evaluator/policy subjects as distinct identities at consuming boundaries.
- Model success, rejection, ambiguous mutation, interruption, recovery, unresolved cleanup and terminal custody explicitly; successful PR completion cannot imply protected-main, phase, controller or release progress.
- Bind both directions between independently discovered operation/effect populations and context-qualified producers/consumers; opaque effects and missing authority block qualification rather than becoming empty populations.
- Removing a proposed relationship and its test together must still fail against independently derived expected populations.
- Bind every admitted transition to implementation plus positive and cause-specific execution. Static inventories and runtime observations remain distinct; unknown behavioral applicability requires conservative full execution.
- Reuse existing CI-edge ownership and composition schemas with explicit compatibility/migration for changed public contracts; add no parallel graph, claim registry, evaluator or receipt family.
- Generate human projections deterministically from validated canonical data. Existing prose remains explanatory until full population and runtime conformance are independently qualified.
- Keep all mechanisms dormant and all82 whole requirements open until their own applicable evidence and computed closure exist; this contract does not activate P33.
characterization:
- Run the complete existing composition suite and retain exact subject, command, raw stream hashes and result before the pure extraction.
- Preserve public compiler import paths, exception semantics, reordered canonical bytes, edge identity and every current positive/negative case during extraction.
- Add genuine omission, false-exclusion, missing-effect, missing-consumer and omitted-edge-plus-test controls against the protected population before production behavior changes.
qualification:
- Execute fresh and upgrade installed private compilers with the source package absent, comparing canonical outputs and rejecting omitted relationship-plus-test and false exclusions.
- Verify complete context/profile/terminal populations, alternate and recovery paths, actual isolated consumer effects and both trace directions; do not substitute a convenient subset.
- Run affected behavioral and cause-specific controls followed by governance, architecture, semantic, package and installed parity checks.
- Integrate only after exact source/private/consumer qualification. Canonical submission and reconciliation alone own generated workflows and authority commits.
forbidden:
- Editing the admitted primary candidate or its running qualification.
- Replaying already incorporated research branches.
- Editing maintained adopters, immutable predecessor bytes, generated workflows or authority pins.
- Treating caller booleans, bus reports, authored DONE or absence of observations as independent authority.
next_action: Characterize existing full compiler, then perform one behavior-preserving pure extraction before population implementation.
