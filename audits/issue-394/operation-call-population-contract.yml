contract:
- Traverse exact source-resolved calls from one exact discovered Python entrypoint through every discovered function including declared ports; do not consult allowed-effect declarations.
- Reuse existing parser import resolution and versioned call facts rather than another scanner or evaluator.
- Preserve every lexical call identity and classify only whether its callee is a discovered unambiguous source function; all other calls remain unresolved observations.
- Terminate source cycles deterministically and retain each distinct lexical occurrence without runtime execution-count claims.
- Reject missing incompatible or malformed call facts and ambiguous function identities instead of guessing or silently narrowing scope.
- Bind the result to discovered source file hashes and report its limited discovered-function scope explicitly.
- Preserve existing effect checker behavior and all default callers; no optimization or authority decision consumes this query.
positive_evidence:
- Exact source call traversal crosses a declared-port-shaped helper and records its nested call.
- Source recursion terminates with deterministic ordering and preserves repeated occurrences.
- Disconnected functions stay outside this operation traversal; their scope remains an independent protected-population obligation.
negative_evidence:
- Added unresolved nested call changes the inventory even when source function declarations remain.
- Missing facts wrong versions duplicate functions wrong entrypoint or ambiguous dispatch reject or remain unresolved as specified.
forbidden_surfaces: [new effect classifier, runtime authority, policy bypass, proof suppression, changed existing port enforcement, provider mutations]
remaining: Module initialization dynamic dispatch external/native effects cross-language roots protected population acquisition and actual authority-effect interpretation require separate proof.
