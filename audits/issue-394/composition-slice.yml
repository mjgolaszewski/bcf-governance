behavior:
- exact repository source tree controller policy graph and CI-edge identities are mandatory
- every expected context-qualified ordered relationship has exactly one contract or exact canonical structural exclusion
- reachable relationships include authenticated facts guards effects failure recovery cleanup resource cost and terminal bindings
- missing context population changed edge digest false exclusion omitted runtime effect and missing causal control reject
- deterministic canonical output is nonauthoritative; successful compilation cannot activate suppression or grant terminal
  authority
forbidden:
- a new CI graph truth engine claim registry or active execution strategy
- caller booleans standing in for authenticated facts
- candidate-owned required-population derivation
- treating symbol existence or a schema digest as execution proof
- editing generated workflows frozen predecessor bytes or maintained adopters
acceptance:
- characterize valid composition and every rejection above before implementing the compiler
- prove reordered equivalent input produces identical canonical bytes
- prove deleting a relationship and its tests cannot defeat the independent population
- prove source package and private template parity
remaining_foundation_obligations:
- authenticate and wire the actual full lifecycle and runtime-effect populations through canonical owners
- bind every adopted transition to implementation positive and cause-specific negative execution
- generate the actual human lifecycle projections and prove their parity
- qualify every applicable profile and terminal context independently

binding_conformance_slice:
  workitem: P32-P0-03
  owner: home:bcf-governance:bcf-394-ironwatch
  bounded_context: ci_authority
  architectural_layer: tooling
  operation_side: query
  target_modules: [bcf_governance/tooling/ci_graph_composition.py]
  expected_tests: [tests/test_ci_graph_composition.py]
  source_of_functions: existing semantic source-discovery inventory from the protected consumer
  source_of_tests: existing verified pytest selector collection from the protected consumer
  source_of_causes: independent protected per-relationship required negative-control mapping
  required_behavior:
  - Resolve every implementation and terminal-consumer reference to exactly one discovered runtime function.
  - Resolve every positive and negative selector to the exact independently collected pytest population.
  - Require exactly the protected cause-specific negative-control bindings for every reachable relationship.
  - Reject missing relationships, missing causes, duplicate function identities, forged compiled digests and stale source identities.
  - Return only a deterministic nonauthoritative static-conformance observation; existence never substitutes for execution qualification.
  forbidden_surfaces: [truth engine, provider mutation, active suppression, generated workflows, maintained adopters]
  remaining_obligations:
  - Wire actual protected consumer source and test collection owners across every adopted lifecycle context.
  - Independently qualify behavioral positives and cause-specific controls on exact admitted bytes.

requirement_binding_inventory_slice:
  workitem: P32-P0-03
  operation_side: query
  targets: [audits/issue-394/workplan.yml, audits/issue-394/workplan.schema.json, tests/test_ci_graph_composition.py]
