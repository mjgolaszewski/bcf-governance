source_call_conformance_slice:
  workitem: P32-P0-03
  bounded_context: ci_authority
  architectural_layer: tooling
  operation_side: query
  targets: [bcf_governance/tooling/ci_graph_composition.py, tests/test_ci_graph_composition.py]
  contract:
  - Resolve protected per-relationship call obligations through existing source-inventory call facts, not source names alone.
  - Require complete reachable-relationship coverage in the independent call catalogue.
  - Every required caller/callee must be a discovered runtime function named by its contract.
  - A removed runtime call rejects even when both function declarations and their tests remain present.
  - A relationship without an internal call obligation needs an existing compiled CI-edge handoff.
  - Unknown or dynamic call resolution blocks static adoption rather than inventing a source edge.
  remaining: Full independently enumerated authority effects and context-qualified runtime populations are still required before adoption.

tracked_projection_fixed_point_slice:
  workitem: P32-P0-03
  bounded_context: ci_authority
  architectural_layer: tooling
  operation_side: query
  targets: [bcf_governance/tooling/ci_graph_composition.py, tests/test_ci_graph_composition.py]
  contract:
  - Keep the existing full subject-bound renderer as the default and preserve its output.
  - Add an explicit contract view for tracked generation whose digest binds the complete semantic relationships plus canonical graph CI-edge and policy identities.
  - Subject commit/tree repository and installed controller identities stay in the authenticated runtime envelope rather than creating self-referential tracked bytes.
  - Validate the full bound envelope before projecting either view.
  - Byte-identical contract semantics regenerate identically across runtime subjects; semantic policy edge or contract changes still alter the contract view.
  - Unknown view selection and tampered bound snapshots reject.
  remaining: Wire the adopted complete machine model into canonical generation after full population and runtime conformance.

existing_effect_inventory_projection_slice:
  workitem: P32-P0-03
  bounded_context: semantic_ownership
  architectural_layer: tooling
  operation_side: query
  targets: [bcf_governance/tooling/semantic_operation_effects.py, bcf_governance/tooling/semantic_authority_contracts.py, tests/test_semantic_operation_inventory.py, tests/test_semantic_authority.py, tests/test_semantic_typescript_effects.py]
  shared_kernel_decision: Reuse the existing source-effect traversal as a read-only fact interface owned by semantic_ownership; ci_authority consumes its immutable classified port facts without introducing another detector or evaluator.
  contract:
  - Expose a deterministic immutable inventory of reached mutation authority and non-authoritative observation ports from the existing validated effect traversal.
  - Preserve the legacy validator tuple counts and every existing rejection message and rule.
  - Discover source call paths before consulting proposed lifecycle edges; an undeclared source effect must still reject even if its proposed edge/control is removed.
  - Reject unreachable declared ports and unresolved dynamic call paths before returning an inventory.
  - Extend existing operation observations with classified exact port identities without a second source scan or changing semantic-lock shape.
  - Keep source-family ownership and source/package/template parity intact.
  expected_tests:
  - exact stable inventory and legacy counts for valid source paths
  - source-only undeclared write and authority effects reject
  - unknown dynamic path and unreachable declared port reject
  - existing Python and TypeScript semantic conformance remains unchanged
  remaining: Bind the full protected runtime effect population into adopted lifecycle contexts and independent terminal consumers.

operation_effect_composition_bridge:
  workitem: P32-P0-03
  bounded_context: ci_authority
  architectural_layer: tooling
  operation_side: query
  targets: [bcf_governance/tooling/ci_graph_composition.py, tests/test_ci_graph_composition.py]
  contract:
  - Consume the existing validated operation observations as immutable required-effect facts, independently of proposed lifecycle rows.
  - Require exact protected operation/entrypoint and classified port populations, including cause-preserving role counts.
  - Bind each existing operation-port identity to every independently required context-qualified relationship; missing or extra bindings reject.
  - Derive the compiler required effect set from canonical operation role target-kind and symbol identities, without a new effect registry.
  - Missing old-consumer capability, duplicate operations/ports, wrong entrypoints, malformed facts and unresolved context consumers block adoption.
  - An omitted proposed effect or edge cannot erase the independently discovered source port.
  - No source authentication or runtime execution qualification is inferred from a static observation; protected consumers still reconstruct full actual populations.
  remaining: Full graph/context mapping and protected installed consumer wiring remain required before normative adoption.

independent_fact_binding_slice:
  workitem: P32-P0-03
  bounded_context: ci_authority
  architectural_layer: tooling
  operation_side: query
  targets: [bcf_governance/tooling/ci_graph_composition.py, tests/test_ci_graph_composition.py]
  contract:
  - Require a protected complete per-relationship fact catalogue independently of proposed contracts.
  - Compare every fact identity producer verifier subject proposition authority and freshness to that catalogue.
  - Resolve each producer and verifier to the existing independently discovered source function population.
  - Reject missing duplicate substituted or orphaned fact bindings even when the candidate retains valid tests and call paths.
  - Keep source authentication and execution qualification with existing protected consumers; static correspondence grants no authority.
  expected_tests:
  - Complete source-bound fact catalogue passes without mutating inputs or qualifying execution.
  - Missing relationship fact population and missing or duplicate required facts reject.
  - Wrong producer verifier subject proposition authority and freshness each reject independently.
  - Deleted producer or verifier rejects despite retained edge tests and implementation functions.
  forbidden_surfaces: [provider mutation, active suppression, workflow authority, maintained adopters, frozen distribution]
  remaining: Authenticate actual canonical fact owners and full consumer populations before normative adoption.

tracked_machine_contract_slice:
  workitem: P32-P0-03
  bounded_context: ci_authority
  architectural_layer: tooling
  operation_side: query
  targets: [bcf_governance/tooling/ci_graph_composition.py, schemas/ci-lifecycle-composition.schema.json, tests/test_ci_graph_composition.py]
  compatibility:
  - Preserve version 1.0 subject-bound input and both existing human renderer views.
  - Add explicit version 1.1 authored input containing relationships without a runtime source envelope.
  - Register both readable schema versions in the existing self public-contract inventory; this declaration does not activate the lifecycle model.
  - Installed consumers must explicitly support the new schema before adoption; old consumers must reject it safely.
  contract:
  - Render canonical machine input from the existing compiled owner without a self-referential repository commit/tree identity.
  - Require the protected consumer to supply a complete schema-valid authenticated source envelope for every compilation.
  - Bind the compiled result to that exact source, policy, graph and existing CI-edge population; authored input cannot select source authority.
  - Forbid a caller-supplied source envelope in version 1.1 and require it in legacy version 1.0.
  - Preserve complete relationship semantics, required populations, exclusions and effect checks through render/compile round trips.
  - Machine bytes remain stable across runtime subjects and input order; runtime compiled identity still changes with authenticated subject.
  expected_tests:
  - Legacy subject-bound input and existing human views remain unchanged.
  - Canonical machine round trip preserves every contract and exclusion.
  - Missing or malformed protected source and injected authored source reject.
  - Current graph/edge identity mismatch and missing relationship/effect still reject in authored mode.
  forbidden_surfaces: [active suppression, provider mutation, caller-authorized facts, generated workflows, frozen distribution]
  remaining: Populate and independently qualify the complete actual lifecycle model before normative adoption or prose retirement.
