independent_inputs:
- the protected consumer supplies complete context-qualified node populations; ordered distinct node pairs must close exactly
- the protected consumer supplies the complete required relationship population and structural exclusions
- the protected consumer supplies the complete required runtime authority-effect population
- the existing CompiledCIGraph supplies graph identity and CI edge population
