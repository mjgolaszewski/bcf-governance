    status: focused_tests_passed
    authority: false
    positive_tests:
    - tests.test_ci_graph_composition::test_valid_composition_has_no_authority_and_is_byte_stable
    - tests.test_semantic_python_inventory_characterization::test_python_inventory_matches_pre_deconstruction_characterization
    - tests.test_ci_graph_composition::test_binding_conformance_uses_existing_source_and_pytest_collection_owners
    - tests.test_ci_graph_composition::test_binding_conformance_traces_actual_compiler_and_projection_calls
    - tests.test_ci_graph_composition::test_contract_view_is_stable_across_bound_subjects
    - tests.test_ci_graph_composition::test_machine_contract_round_trip_preserves_every_relationship
    - tests.test_ci_graph_composition::test_machine_contract_bytes_are_stable_across_subjects_and_order
    - tests.test_semantic_operation_inventory::test_validated_inventory_preserves_port_classes_and_legacy_counts
    - tests.test_ci_graph_composition::test_discovered_source_authority_port_survives_candidate_effect_omission
