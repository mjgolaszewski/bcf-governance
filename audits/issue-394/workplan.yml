implementation_slices:
  dormant-composition-and-static-bindings:
    id: dormant-composition-and-static-bindings
    workitem: P32-P0-03
    scope: Closed proposed node/edge populations, typed fact references, deterministic human views and static runtime/test/control bindings only; required
      source call edges resolve through independently supplied discovery facts
    contract: audits/issue-394/composition-slice.yml
    producer: bcf_governance/tooling/ci_graph_composition.py::compile_lifecycle_composition
    consumer: bcf_governance/tooling/ci_graph_composition.py::validate_lifecycle_bindings
    status: focused_tests_passed
    authority: false
    positive_tests:
    - tests.test_ci_graph_composition::test_valid_composition_has_no_authority_and_is_byte_stable
    - tests.test_ci_graph_composition::test_binding_conformance_uses_existing_source_and_pytest_collection_owners
    - tests.test_ci_graph_composition::test_binding_conformance_traces_actual_compiler_and_projection_calls
    negative_controls:
    - cause: deleted-edge-and-test
      test: tests.test_ci_graph_composition::test_removed_relationship_and_its_tests_cannot_hide_population
    - cause: false-exclusion
      test: tests.test_ci_graph_composition::test_false_exclusion_cannot_erase_reachable_guard_failure
    - cause: omitted-effect
      test: tests.test_ci_graph_composition::test_omitted_runtime_effect_rejects_independently
    - cause: authentication-boolean
      test: tests.test_ci_graph_composition::test_candidate_cannot_supply_authentication_boolean
    - cause: missing-causal-control
      test: tests.test_ci_graph_composition::test_binding_conformance_rejects_missing_cause_even_with_existing_negative
    - cause: deleted-terminal-function
      test: tests.test_ci_graph_composition::test_binding_conformance_rejects_deleted_function[terminal_consumers]
    - cause: removed-source-call
      test: tests.test_ci_graph_composition::test_binding_conformance_rejects_removed_call_with_both_functions_present
    - cause: unresolved-source-call
      test: tests.test_ci_graph_composition::test_binding_conformance_rejects_unresolved_required_call
    remaining:
    - Actual protected consumer populations and complete independent runtime-effect reverse tracing remain unadopted.
    - Full lifecycle recovery, deadline, installed profile and terminal-context execution qualifications remain required.
  canonical-submit-normalization:
    id: canonical-submit-normalization
    workitem: P32-P0-07
    scope: Authored phase and release-target rejection, existing local lease and canonical normalization before exact scope/subject capture only; forwards
      existing prospective progress without conferring proof
    contract: audits/issue-394/submit-normalization-slice.yml
    producer: bcf_governance/tooling/ci_authority_submit.py::_normalize_submission
    consumer: bcf_governance/tooling/ci_authority_submit.py::submit_candidate
    status: focused_tests_passed
    authority: false
    positive_tests:
    - tests.test_candidate_submit::test_submit_normalizes_before_capturing_the_proved_subject
    - tests.test_candidate_submit::test_fixed_point_submit_normalization_does_not_generate
    - tests.test_candidate_submit::test_submit_cli_keeps_progress_on_stderr_and_result_on_stdout
    negative_controls:
    - cause: authored-phase-contradiction
      test: tests.test_candidate_submit::test_authored_contradiction_rejects_before_any_normalization
    - cause: wrong-intent-assertion
      test: tests.test_candidate_submit::test_wrong_intent_assertion_cannot_generate
    - cause: busy-execution-lease
      test: tests.test_candidate_submit::test_busy_submit_cannot_normalize_another_active_train
    - cause: partial-normalization
      test: tests.test_candidate_submit::test_partial_canonical_apply_requires_a_verified_fixed_point
    - cause: authored-release-target
      test: tests.test_reconcile_governance::test_authored_release_target_precedes_every_projection_mutation
    - cause: progress-is-not-proof
      test: tests.test_candidate_submit::test_submit_forwards_existing_progress_without_conferring_authority
    remaining:
    - Complete source/package/profile/runtime pre-dispatch admission and exact concurrent join/resume remain required.
    - Provider PR/exact-main authority and full terminal custody are not certified by these local tests.
  separate-pipeline-clock-observation:
    id: separate-pipeline-clock-observation
    workitem: P32-P0-06
    scope: Opt-in nonauthoritative repository/snapshot-bound clock windows with separate elapsed, execution overlap, waits, gaps and measured CPU
    contract: audits/issue-394/baseline-measurement-slice.yml
    producer: bcf_governance/tooling/operational_observations.py::pipeline_timing_observation
    consumer: bcf_governance/tooling/operational_observations.py::validate_operational_observation
    status: focused_tests_passed
    authority: false
    positive_tests:
    - tests.test_operational_observations::test_pipeline_timing_keeps_parallel_elapsed_separate_from_sum_and_cpu
    - tests.test_operational_observations::test_pipeline_timing_retains_waits_gaps_cancellation_and_supersession
    - tests.test_operational_observations::test_pipeline_timing_is_deterministic_detached_and_schema_valid
    negative_controls:
    - cause: mixed-clock
      test: tests.test_operational_observations::test_pipeline_timing_rejects_ambiguous_or_invalid_intervals[mixed_clock]
    - cause: wrong-subject-or-window
      test: tests.test_operational_observations::test_pipeline_timing_rejects_wrong_subject_and_reversed_window
    - cause: missing-snapshot
      test: tests.test_operational_observations::test_pipeline_timing_rejects_unbound_repository_or_snapshot[source_snapshot_sha256-missing]
    remaining:
    - Adequate matched self/isolated-adopter cohorts and separately approved frozen performance/resource targets remain required.
    - Independent complete producer populations, terminal custody clocks and measured CPU are not inferred from these observations.
