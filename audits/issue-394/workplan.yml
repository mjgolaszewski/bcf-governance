additional_regressions:
- id: provider_deadline_948
  workitem: foundation.deadlines
  positive: A complete bounded inner envelope plus setup cleanup and headroom fits the canonically quantized outer deadline
  negative: Reject 568 seconds of inner work plus setup cleanup and headroom under a 600 second outer ceiling; cover every sibling provider-effective consumer
  source: https://github.com/mjgolaszewski/bcf-governance/issues/394#issuecomment-6196161840
- id: issue_420_nonprefix_frontier
  workitem: foundation.residuals
  positive: Incorporate only admitted dependency-DAG frontier fix as an exact regression
  negative: Never close or reorder unrelated workitems to manufacture prefix authority
  source: https://github.com/mjgolaszewski/bcf-governance/issues/420
- id: submit_stale_inherited_scope
  workitem: foundation.submit-normalization
  positive: Canonical normalization precedes scope derivation and fresh subject capture
  negative: Contradictory authored state wrong assertion busy lease and partial normalization cannot allocate proof or push
  source: audits/issue-394/submit-normalization-slice.yml
measurement_policy:
  status: requires_review_after_baseline_before_optimization
  proposed_pr:
    p50_improvement_percent: 25
    p95_improvement_percent: 20
    max_risk_class_p95_regression_percent: 10
  separate_required_targets:
  - release
  - adopter qualification
  - dispatch-to-terminal-custody
  - merge-to-terminal-custody
  - earliest failure latency and downstream work avoided
  - planner overhead
  - compute storage API and complexity budgets
  reporting:
  - user-selected collection uses governed provider runs as they occur plus controlled isolated local and pinned-adopter trials
  - authenticate exact subject and clock then freeze matched cohorts before percentile claims
  - actual nonoverlapping critical paths
  - BCF-controlled and total elapsed time including waits
  - matched cold and warm cohorts with exact identities counts variance exclusions
  - include failed slow superseded and periodic-shifted work
  - no p95 certification from insufficient observations
  approved_targets: null
verification_commands:
- .venv/bin/python scripts/validate_governance_yaml.py --repo-root .
- .venv/bin/python -m pytest -q tests
completion:
  status: not_complete
  requires:
  - all 82 identified requirements plus deadline regression bound to executable positive and cause-specific negative evidence
  - independent contract and runtime-effect population completeness
  - profile and real isolated-adopter parity
  - approved separately measured pipeline improvements
  - exact protected scope certification and independently verified immutable custody
  - Resolve predecessor admission and derive canonical phase IDs before phase activation or production implementation
