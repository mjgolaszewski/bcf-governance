      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -c 'import json,os,pathlib,re;source=pathlib.Path(os.environ["BCF_CONTROLLER_ROUTE_FILE"]);files=[source] if source.is_file() else sorted(source.glob("*.json"));assert len(files)==1;p=json.loads(files[0].read_text());candidates=(p.get("controller_custody",{}).get("controller",{}).get("commit_sha"),p.get("authority",{}).get("controller_commit_sha"),p.get("controller",{}).get("commit_sha"),p.get("artifact",{}).get("commit_sha"),p.get("observations",{}).get("controller_custody",{}).get("controller",{}).get("commit_sha"));values=[v for v in candidates if isinstance(v,str)];assert values and len(set(values))==1 and re.fullmatch(r"[a-f0-9]{40}",values[0]);pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a").write("controller_commit_sha="+values[0]+"\n")'
