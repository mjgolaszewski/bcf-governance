      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_CONTROLLER_ROUTE_FILE: '${{ runner.temp }}/bcf-controller-transition-${{ github.run_id }}-${{ github.run_attempt }}/outcome'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -c 'import json,os,pathlib,re;source=pathlib.Path(os.environ["BCF_CONTROLLER_ROUTE_FILE"]);files=[source] if source.is_file() else sorted(source.glob("*.json"));assert len(files)==1;p=json.loads(files[0].read_text());candidates=(p.get("controller_custody",{}).get("controller",{}).get("commit_sha"),p.get("authority",{}).get("controller_commit_sha"),p.get("controller",{}).get("commit_sha"),p.get("artifact",{}).get("commit_sha"),p.get("observations",{}).get("controller_custody",{}).get("controller",{}).get("commit_sha"));values=[v for v in candidates if isinstance(v,str)];assert values and len(set(values))==1 and re.fullmatch(r"[a-f0-9]{40}",values[0]);pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a").write("controller_commit_sha="+values[0]+"\n")'
      id: controller-route
    - name: Authenticate activation and request fresh exact-main certification
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}', BCF_CONTROLLER_CUSTODY_PATH: '${{ runner.temp }}/bcf-controller-transition-${{ github.run_id }}-${{ github.run_attempt }}/outcome', BCF_CONTROLLER_EXECUTION_REQUIRED: 'true', BCF_COMMAND_ARG_0: '${{ runner.tool_cache }}/bcf-governance/${{ steps.controller-route.outputs.controller_commit_sha }}/bin/bcf', BCF_COMMAND_ARG_5: '${{ github.repository }}', BCF_COMMAND_ARG_7: '${{ github.event.workflow_run.id }}', BCF_COMMAND_ARG_9: '${{ github.event.workflow_run.run_attempt }}'}
      run: |-
        set -euo pipefail
        "$BCF_COMMAND_ARG_0" ci-github controller-rotation dispatch-certification --repository "$BCF_COMMAND_ARG_5" --rotation-run-id "$BCF_COMMAND_ARG_7" --rotation-run-attempt "$BCF_COMMAND_ARG_9"
