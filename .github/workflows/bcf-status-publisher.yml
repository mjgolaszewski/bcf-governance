name: bcf/exact-main-status-publisher
'on':
  workflow_run:
    workflows: [bcf/trusted-evidence-finalizer]
    types: [completed]
permissions: {actions: read, contents: read, statuses: write}
jobs:
  publish:
    name: Publish newest authenticated exact-main status or revocation
    if: ${{ vars.BCF_CI_AUTHORITY_ENABLED == 'true' && github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.head_branch == 'main' }}
    permissions: {actions: read, contents: read, statuses: write}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 5
    steps:
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Download exact exact-main-certification evidence
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {name: 'bcf-exact-main-certification-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}', path: '${{ runner.temp }}/bcf-exact-main-certification-${{ github.run_id }}-${{ github.run_attempt }}', github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: '${{ github.event.workflow_run.id }}'}
      continue-on-error: true
    - name: Publish newest authenticated exact-main status or revocation
      shell: bash
      env: {GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        test -d "$RUNNER_TOOL_CACHE"/bcf-governance/dc07e3352082498db413ba2540dd94f69ce095ef
        test ! -L "$RUNNER_TOOL_CACHE"/bcf-governance/dc07e3352082498db413ba2540dd94f69ce095ef
        test -x "$RUNNER_TOOL_CACHE"/bcf-governance/dc07e3352082498db413ba2540dd94f69ce095ef/bin/bcf
        "$RUNNER_TOOL_CACHE"/bcf-governance/dc07e3352082498db413ba2540dd94f69ce095ef/bin/bcf ci-github exact-main publish --repository "$GITHUB_REPOSITORY" --bundle "${{ runner.temp }}/bcf-exact-main-certification-${{ github.run_id }}-${{ github.run_attempt }}" --target-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/${{ github.event.workflow_run.id }}" --collector-run-id "${{ github.event.workflow_run.id }}" --collector-run-attempt "${{ github.event.workflow_run.run_attempt }}"
