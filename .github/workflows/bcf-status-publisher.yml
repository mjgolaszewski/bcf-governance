name: bcf/exact-main-status-publisher
'on':
  workflow_run:
    workflows: [bcf/trusted-evidence-finalizer, bcf/controller-rotation]
    types: [completed]
permissions: {actions: read, contents: write, statuses: write}
jobs:
  publish:
    name: Publish newest authenticated exact-main status or revocation
    if: ${{ vars.BCF_CI_AUTHORITY_ENABLED == 'true' && github.event.workflow_run.name == 'bcf/trusted-evidence-finalizer' && github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.head_branch == 'main' }}
    permissions: {actions: read, contents: read, statuses: write}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 5
    steps:
    - name: Validate all required environment inputs before work
      shell: bash
      env: {BCF_CONTROLLER_ROUTE_FILE: '${{ runner.temp }}/bcf-controller-custody-${{ github.run_id }}-${{ github.run_attempt }}/controller-custody.json'}
      run: |
        set -euo pipefail
        test -n "$BCF_CONTROLLER_ROUTE_FILE"
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Download exact finalizer certification bundle
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {name: 'bcf-exact-main-certification-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}', github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: '${{ github.event.workflow_run.id }}', path: '${{ runner.temp }}/bcf-exact-main-certification-${{ github.run_id }}-${{ github.run_attempt }}'}
    - name: Download finalizer-preserved admission controller custody
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {name: 'bcf-finalizer-controller-custody-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}', github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: '${{ github.event.workflow_run.id }}', path: '${{ runner.temp }}/bcf-controller-custody-${{ github.run_id }}-${{ github.run_attempt }}'}
    - name: Project non-authoritative routing from finalizer-preserved admission custody
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_CONTROLLER_ROUTE_FILE: '${{ runner.temp }}/bcf-controller-custody-${{ github.run_id }}-${{ github.run_attempt }}/controller-custody.json'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -c 'import json,os,pathlib,re;source=pathlib.Path(os.environ["BCF_CONTROLLER_ROUTE_FILE"]);files=[source] if source.is_file() else sorted(source.glob("*.json"));assert len(files)==1;p=json.loads(files[0].read_text());candidates=(p.get("controller_custody",{}).get("controller",{}).get("commit_sha"),p.get("authority",{}).get("controller_commit_sha"),p.get("controller",{}).get("commit_sha"),p.get("artifact",{}).get("commit_sha"),p.get("observations",{}).get("controller_custody",{}).get("controller",{}).get("commit_sha"));values=[v for v in candidates if isinstance(v,str)];assert values and len(set(values))==1 and re.fullmatch(r"[a-f0-9]{40}",values[0]);pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a").write("controller_commit_sha="+values[0]+"\n")'
      id: controller-route
    - name: Publish authenticated exact-main status with the effective controller
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}', BCF_CONTROLLER_CUSTODY_PATH: '${{ runner.temp }}/bcf-exact-main-certification-${{ github.run_id }}-${{ github.run_attempt }}/controller-custody.json', BCF_CONTROLLER_EXECUTION_REQUIRED: 'true', BCF_COMMAND_ARG_0: '${{ runner.tool_cache }}/bcf-governance/${{ steps.controller-route.outputs.controller_commit_sha }}/bin/bcf', BCF_COMMAND_ARG_5: '${{ github.repository }}', BCF_COMMAND_ARG_7: '${{ runner.temp }}/bcf-exact-main-certification-${{ github.run_id }}-${{ github.run_attempt }}', BCF_COMMAND_ARG_9: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}', BCF_COMMAND_ARG_11: '${{ github.event.workflow_run.id }}', BCF_COMMAND_ARG_13: '${{ github.event.workflow_run.run_attempt }}'}
      run: |-
        set -euo pipefail
        "$BCF_COMMAND_ARG_0" ci-github exact-main publish --repository "$BCF_COMMAND_ARG_5" --bundle "$BCF_COMMAND_ARG_7" --target-url "$BCF_COMMAND_ARG_9" --collector-run-id "$BCF_COMMAND_ARG_11" --collector-run-attempt "$BCF_COMMAND_ARG_13"
