name: bcf/exact-main-status-publisher
'on':
  workflow_run:
    workflows:
    - bcf/trusted-evidence-finalizer
    types:
    - completed
permissions:
  actions: read
  contents: read
  statuses: write
env:
  BCF_CONTROL_COMMIT: 67601972fa98e1b58641fbb56de78a081a823076
jobs:
  publish:
    name: Publish newest authenticated exact-main status or revocation
    if: ${{ vars.BCF_CI_AUTHORITY_ENABLED == 'true' && github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.head_branch == 'main' }}
    runs-on:
    - self-hosted
    - Linux
    - X64
    - bcf-governance
    - vm-linux-ci-runner
    timeout-minutes: 5
    steps:
    - name: Restore the trusted controller interpreter environment
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Download only the triggering finalizer bundle when present
      id: download
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bcf-exact-main-certification-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ github.event.workflow_run.id }}
        path: ${{ runner.temp }}/bcf-exact-main-certification
        digest-mismatch: error
    - name: Publish canonical terminal, pending, or failed-finalizer authority
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        control_root="${RUNNER_TOOL_CACHE%/}/bcf-governance/$BCF_CONTROL_COMMIT"
        test -d "$control_root"
        test ! -L "$control_root"
        test -x "$control_root/bin/bcf"
        "$control_root/bin/bcf" ci-github exact-main publish \
          --repository "$GITHUB_REPOSITORY" \
          --bundle "$RUNNER_TEMP/bcf-exact-main-certification" \
          --target-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/${{ github.event.workflow_run.id }}" \
          --collector-run-id "${{ github.event.workflow_run.id }}" \
          --collector-run-attempt "${{ github.event.workflow_run.run_attempt }}"
