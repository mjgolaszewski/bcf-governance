name: bcf/immutable-release-publisher
'on':
  workflow_run:
    workflows: [bcf/release-byte-verifier]
    types: [completed]
permissions: {}
jobs:
  controller-route:
    name: Observe provider-effective controller for non-authoritative publication routing
    if: ${{ github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    permissions: {actions: read, contents: read}
    outputs: {target_commit: '${{ steps.candidate-effective-controller.outputs.BCF_BOOTSTRAP_COMMIT_SHA }}'}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out only the triggering authorized release subject
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {ref: '${{ github.event.workflow_run.head_sha }}', fetch-depth: 0, persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Install the declared governance environment
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m pip install -r requirements-governance.txt
    - name: Observe provider-effective controller for non-authoritative routing
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}', BCF_COMMAND_ARG_7: '${{ github.repository }}'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m bcf_governance.cli ci-github controller-rotation resolve --repository "$BCF_COMMAND_ARG_7"
      id: candidate-effective-controller
  publish:
    name: Publish one exact idempotent transaction after governed qualification
    needs: [controller-route]
    if: ${{ github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    permissions: {actions: read, attestations: write, contents: read, id-token: write}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 10
    environment: bcf-trusted-automation
    steps:
    - name: Validate all required environment inputs before work
      shell: bash
      env: {BCF_CONTROLLER_EXECUTION_REQUIRED: 'true'}
      run: |
        set -euo pipefail
        test -n "$BCF_CONTROLLER_EXECUTION_REQUIRED"
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Allocate private release publication directories
      shell: bash
      run: |-
        set -euo pipefail
        mkdir -p -- ''"${BCF_RUN_EXPRESSION_0}"'/bcf-publication-'"${BCF_RUN_EXPRESSION_1}"'-'"${BCF_RUN_EXPRESSION_2}"'/receipt'
      env: {BCF_RUN_EXPRESSION_0: '${{ runner.temp }}', BCF_RUN_EXPRESSION_1: '${{ github.run_id }}', BCF_RUN_EXPRESSION_2: '${{ github.run_attempt }}'}
    - name: Resolve the newest exact-main release receipt mechanically
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_CONTROLLER_EXECUTION_REQUIRED: 'true', BCF_COMMAND_ARG_0: '${{ runner.tool_cache }}/bcf-governance/${{ needs.controller-route.outputs.target_commit }}/bin/bcf', BCF_COMMAND_ARG_5: '${{ github.repository }}', BCF_COMMAND_ARG_7: '${{ github.event.workflow_run.id }}', BCF_COMMAND_ARG_9: '${{ github.event.workflow_run.run_attempt }}', BCF_COMMAND_ARG_11: '${{ runner.temp }}/bcf-publication-${{ github.run_id }}-${{ github.run_attempt }}/publication-inputs.json', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "$BCF_COMMAND_ARG_0" ci-github release resolve-publication --repository "$BCF_COMMAND_ARG_5" --trigger-run-id "$BCF_COMMAND_ARG_7" --trigger-run-attempt "$BCF_COMMAND_ARG_9" --output "$BCF_COMMAND_ARG_11"
      id: resolve
    - name: Download only the resolver-selected receipt and certified assets
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {artifact-ids: '${{ steps.resolve.outputs.receipt_artifact_id }}', github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: '${{ steps.resolve.outputs.receipt_run_id }}', path: '${{ runner.temp }}/bcf-publication-${{ github.run_id }}-${{ github.run_attempt }}/receipt', digest-mismatch: error}
    - name: Attest the exact closed release asset inventory
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with: {subject-path: '${{ runner.temp }}/bcf-publication-${{ github.run_id }}-${{ github.run_attempt }}/receipt/assets/*'}
    - name: Mint one repository-scoped release publication token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with: {app-id: '${{ vars.BCF_AUTOMATION_APP_ID }}', private-key: '${{ secrets.BCF_AUTOMATION_APP_PRIVATE_KEY }}', owner: '${{ github.repository_owner }}', repositories: '${{ github.event.repository.name }}', permission-administration: read, permission-attestations: read, permission-contents: write, skip-token-revoke: 'false'}
      id: release-app-token
    - name: Publish only the authenticated pre-certified bytes
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_CONTROLLER_EXECUTION_REQUIRED: 'true', BCF_COMMAND_ARG_0: '${{ runner.tool_cache }}/bcf-governance/${{ needs.controller-route.outputs.target_commit }}/bin/bcf', BCF_COMMAND_ARG_5: '${{ github.repository }}', BCF_COMMAND_ARG_9: '${{ steps.resolve.outputs.subject_commit }}', BCF_COMMAND_ARG_11: '${{ runner.temp }}/bcf-publication-${{ github.run_id }}-${{ github.run_attempt }}/receipt/assets', BCF_COMMAND_ARG_15: '${{ runner.temp }}/bcf-publication-${{ github.run_id }}-${{ github.run_attempt }}/receipt/release-receipt.json', BCF_COMMAND_ARG_17: '${{ steps.resolve.outputs.receipt_artifact_id }}', BCF_COMMAND_ARG_19: '${{ steps.resolve.outputs.receipt_artifact_name }}', BCF_COMMAND_ARG_21: '${{ steps.resolve.outputs.receipt_provider_digest }}', GITHUB_TOKEN: '${{ steps.release-app-token.outputs.token }}'}
      run: |-
        set -euo pipefail
        "$BCF_COMMAND_ARG_0" ci-github release publish --repository "$BCF_COMMAND_ARG_5" --tag v2.3.9 --commit "$BCF_COMMAND_ARG_9" --release-artifact-dir "$BCF_COMMAND_ARG_11" --release-notes-text 'The attached wheel, source archive, and checksums are the exact mechanically certified BCF Governance release bytes.' --receipt "$BCF_COMMAND_ARG_15" --receipt-artifact-id "$BCF_COMMAND_ARG_17" --receipt-artifact-name "$BCF_COMMAND_ARG_19" --receipt-provider-digest "$BCF_COMMAND_ARG_21"
