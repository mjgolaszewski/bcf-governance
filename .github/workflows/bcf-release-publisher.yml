name: bcf/immutable-release-publisher

on:
  workflow_dispatch:

permissions: {}

env:
  BCF_CONTROL_COMMIT: 49272182790342a52ef7ddbcfd6a540ca7df6baf

jobs:
  publish:
    name: Publish pre-certified immutable release bytes
    if: ${{ github.actor == 'mjgolaszewski' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Restore the trusted controller interpreter environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Require the short-lived release administration credential
        shell: bash
        env:
          BCF_RELEASE_ADMIN_TOKEN: ${{ secrets.BCF_RELEASE_ADMIN_TOKEN }}
        run: test -n "$BCF_RELEASE_ADMIN_TOKEN"
      - name: Resolve the newest exact-main release receipt mechanically
        id: resolve
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          control_root="${RUNNER_TOOL_CACHE%/}/bcf-governance/$BCF_CONTROL_COMMIT"
          test -d "$control_root"
          test ! -L "$control_root"
          test -x "$control_root/bin/bcf"
          mkdir -p "$RUNNER_TEMP/bcf-publication/receipt"
          "$control_root/bin/bcf" ci-github release resolve-publication \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/bcf-publication/publication-inputs.json"
      - name: Download only the resolver-selected receipt and certified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.resolve.outputs.receipt_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve.outputs.receipt_run_id }}
          path: ${{ runner.temp }}/bcf-publication/receipt
          digest-mismatch: error
      - name: Attest the exact closed release asset inventory
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/bcf-publication/receipt/assets/*
      - name: Publish only the authenticated pre-certified bytes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.BCF_RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          control_root="${RUNNER_TOOL_CACHE%/}/bcf-governance/$BCF_CONTROL_COMMIT"
          notes="$RUNNER_TEMP/bcf-publication/release-notes.md"
          printf '%s\n' \
            'BCF Governance 0.7.1 remediates exact-commit CI and release authority.' \
            'The attached wheel, source archive, and checksums are the mechanically certified bytes.' \
            >"$notes"
          "$control_root/bin/bcf" ci-github release publish \
            --repository "$GITHUB_REPOSITORY" \
            --tag "${{ steps.resolve.outputs.tag }}" \
            --commit "${{ steps.resolve.outputs.subject_commit }}" \
            --release-artifact-dir "$RUNNER_TEMP/bcf-publication/receipt/assets" \
            --release-notes "$notes" \
            --receipt "$RUNNER_TEMP/bcf-publication/receipt/release-receipt.json" \
            --receipt-artifact-id "${{ steps.resolve.outputs.receipt_artifact_id }}" \
            --receipt-artifact-name "${{ steps.resolve.outputs.receipt_artifact_name }}" \
            --receipt-provider-digest "${{ steps.resolve.outputs.receipt_provider_digest }}"
