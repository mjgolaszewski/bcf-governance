name: bcf/immutable-release-publisher
'on':
  workflow_dispatch: {}
permissions: {}
jobs:
  controller-route:
    name: Observe provider-effective controller for non-authoritative publication routing
    if: ${{ github.actor == 'mjgolaszewski' && github.ref == 'refs/heads/main' }}
    permissions: {actions: read, contents: read}
    outputs: {target_commit: '${{ steps.candidate-effective-controller.outputs.BCF_BOOTSTRAP_COMMIT_SHA }}'}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 0, persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Install the declared governance environment
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m pip install -r requirements-governance.txt
    - name: Observe provider-effective controller for non-authoritative routing
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m bcf_governance.cli ci-github controller-rotation resolve --repository "${{ github.repository }}"
      id: candidate-effective-controller
  publish:
    name: Publish pre-certified immutable release bytes
    needs: [controller-route]
    if: ${{ github.actor == 'mjgolaszewski' && github.ref == 'refs/heads/main' }}
    permissions: {actions: read, attestations: write, contents: write, id-token: write}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 10
    steps:
    - name: Validate all required environment inputs before work
      shell: bash
      env: {BCF_RELEASE_ADMIN_TOKEN: '${{ secrets.BCF_RELEASE_ADMIN_TOKEN }}', BCF_CONTROLLER_EXECUTION_REQUIRED: 'true'}
      run: |
        set -euo pipefail
        test -n "$BCF_CONTROLLER_EXECUTION_REQUIRED"
        test -n "$BCF_RELEASE_ADMIN_TOKEN"
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Allocate private release publication directories
      shell: bash
      run: |-
        set -euo pipefail
        mkdir -p -- '${{ runner.temp }}/bcf-publication-${{ github.run_id }}-${{ github.run_attempt }}/receipt'
    - name: Resolve the newest exact-main release receipt mechanically
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_CONTROLLER_EXECUTION_REQUIRED: 'true', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "${{ runner.tool_cache }}/bcf-governance/${{ needs.controller-route.outputs.target_commit }}/bin/bcf" ci-github release resolve-publication --repository "${{ github.repository }}" --output "${{ runner.temp }}/bcf-publication-${{ github.run_id }}-${{ github.run_attempt }}/publication-inputs.json"
      id: resolve
    - name: Download only the resolver-selected receipt and certified assets
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {artifact-ids: '${{ steps.resolve.outputs.receipt_artifact_id }}', github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: '${{ steps.resolve.outputs.receipt_run_id }}', path: '${{ runner.temp }}/bcf-publication-${{ github.run_id }}-${{ github.run_attempt }}/receipt', digest-mismatch: error}
    - name: Attest the exact closed release asset inventory
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with: {subject-path: '${{ runner.temp }}/bcf-publication-${{ github.run_id }}-${{ github.run_attempt }}/receipt/assets/*'}
    - name: Publish only the authenticated pre-certified bytes
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_CONTROLLER_EXECUTION_REQUIRED: 'true', BCF_RELEASE_ADMIN_TOKEN: '${{ secrets.BCF_RELEASE_ADMIN_TOKEN }}', GITHUB_TOKEN: '${{ secrets.BCF_RELEASE_ADMIN_TOKEN }}'}
      run: |-
        set -euo pipefail
        "${{ runner.tool_cache }}/bcf-governance/${{ needs.controller-route.outputs.target_commit }}/bin/bcf" ci-github release publish --repository "${{ github.repository }}" --tag v2.1.6 --commit "${{ steps.resolve.outputs.subject_commit }}" --release-artifact-dir "${{ runner.temp }}/bcf-publication-${{ github.run_id }}-${{ github.run_attempt }}/receipt/assets" --release-notes-text 'The attached wheel, source archive, and checksums are the exact mechanically certified BCF Governance release bytes.' --receipt "${{ runner.temp }}/bcf-publication-${{ github.run_id }}-${{ github.run_attempt }}/receipt/release-receipt.json" --receipt-artifact-id "${{ steps.resolve.outputs.receipt_artifact_id }}" --receipt-artifact-name "${{ steps.resolve.outputs.receipt_artifact_name }}" --receipt-provider-digest "${{ steps.resolve.outputs.receipt_provider_digest }}"
