name: governance-mutants-weekly
'on':
  workflow_dispatch: {}
  schedule:
  - {cron: 41 4 * * 0}
permissions: {contents: read}
jobs:
  full-mutants:
    name: Exercise complete weekly governance mutants
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 0, persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Install the declared governance environment
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m pip install -r requirements-governance.txt
    - name: Select the exact real-compiler test Node runtime
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with: {node-version: 22.23.2, package-manager-cache: false}
    - name: Verify and materialize the locked offline TypeScript test compiler
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/bootstrap_test_toolchain.py --repo-root .
    - name: Validate selected interpreter and governance before mutants
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" scripts/preflight_governance.py --repo-root . --mode release --python "$BCF_PYTHON" --format text
    - name: Run full validator mutant profile
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/run_validator_mutants.py --profile full --output .artifacts/scheduled-mutants/weekly-validator.json
    - name: Run full governance semantic mutant profile
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/run_validator_mutants.py --profile semantic-full --output .artifacts/scheduled-mutants/weekly-semantic.json
    - name: Retain exact weekly mutant results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-scheduled-mutants-weekly-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/scheduled-mutants, if-no-files-found: error, retention-days: 90}
      if: ${{ always() }}
