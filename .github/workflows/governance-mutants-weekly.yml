name: governance-mutants-weekly

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 0"

permissions:
  contents: read

jobs:
  full-mutants:
    name: Exercise complete weekly governance mutants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install governance dependencies
        run: python -m pip install -r requirements-governance.txt
      - name: Validate selected interpreter and governance before mutants
        run: python scripts/preflight_governance.py --repo-root . --mode release --python "$(command -v python)" --format text
      - name: Run full validator mutant profile
        run: python .github/scripts/run_validator_mutants.py --profile full
      - name: Run full governance semantic mutant profile
        run: python .github/scripts/run_validator_mutants.py --profile semantic-full
