name: governance-mutants-weekly
'on':
  workflow_dispatch: {}
  schedule:
  - {cron: 41 4 * * 0}
permissions: {contents: read}
jobs:
  full-mutants:
    name: Exercise complete weekly governance mutants
    permissions: {actions: read, contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 0, persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Install the declared governance environment
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m pip install -r requirements-governance.txt
    - name: Select the exact real-compiler test Node runtime
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with: {node-version: 22.23.2, package-manager-cache: false}
    - name: Verify and materialize the locked offline TypeScript test compiler
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/bootstrap_test_toolchain.py --repo-root .
    - name: Validate selected interpreter and governance before mutants
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}', BCF_COMMAND_ARG_7: '${{ github.repository }}'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m bcf_governance.cli ci-github scheduled-control preflight --repository "$BCF_COMMAND_ARG_7" --repo-root . --python "$BCF_PYTHON" --output .artifacts/scheduled-mutants/preflight.json
    - name: Run the complete weekly scheduled control profile
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m bcf_governance.cli ci-github scheduled-control execute --repo-root . --python "$BCF_PYTHON" --schedule weekly --output-dir .artifacts/scheduled-mutants
    - name: Retain exact weekly mutant results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-scheduled-mutants-weekly-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/scheduled-mutants, if-no-files-found: error, retention-days: 90}
      if: ${{ always() }}
