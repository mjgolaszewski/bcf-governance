name: bcf/automation-changelog-reconciler
'on':
  workflow_run:
    workflows: [bcf/automation-admission]
    types: [completed]
permissions: {actions: read, checks: read, contents: read, pull-requests: read, statuses: read}
env: {BCF_REPOSITORY_ID: '1207503211'}
concurrency: {group: bcf-routine-controller-rotation, cancel-in-progress: false}
jobs:
  reconcile:
    name: Commit the deterministic automation changelog entry
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'bcf/automation-admission' }}
    permissions: {actions: read, contents: read, pull-requests: read}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 5
    environment: bcf-trusted-automation
    steps:
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Mint one repository-scoped changelog writer token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with: {app-id: '${{ vars.BCF_AUTOMATION_APP_ID }}', private-key: '${{ secrets.BCF_AUTOMATION_APP_PRIVATE_KEY }}', owner: '${{ github.repository_owner }}', repositories: '${{ github.event.repository.name }}', permission-contents: write}
      id: automation-app-token
    - name: Reconstruct provider state and compare-and-swap the fixed changelog entry
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_COMMAND_ARG_5: '${{ github.repository }}', GITHUB_TOKEN: '${{ github.token }}', BCF_AUTOMATION_APP_TOKEN: '${{ steps.automation-app-token.outputs.token }}'}
      run: |-
        set -euo pipefail
        "$RUNNER_TOOL_CACHE"/bcf-governance/c3ddbd278baaed5e34a26872193b964828a09d64/bin/bcf ci-github automation reconcile --repository "$BCF_COMMAND_ARG_5"
