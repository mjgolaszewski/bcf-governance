      run: |
        set -euo pipefail
        test -n "$BCF_REPOSITORY_ID"
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Download the exact provider-built routine controller
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {name: 'bcf-trusted-control-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.run_attempt }}', github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: '${{ github.event.workflow_run.id }}', path: '${{ runner.temp }}/bcf-trusted-control-${{ github.run_id }}-${{ github.run_attempt }}'}
    - name: Download the probe-authenticated transition
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {name: 'bcf-controller-transition-probed-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/bcf-controller-transition-${{ github.run_id }}-${{ github.run_attempt }}/probed'}
    - name: Stage the probe-authenticated routine controller
      shell: bash
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -I -c 'import hashlib,json,pathlib,re,subprocess,sys,venv
        source=pathlib.Path('"'"'${{ runner.temp }}/bcf-trusted-control-${{ github.run_id }}-${{ github.run_attempt }}'"'"')
        target=pathlib.Path('"'"'${{ runner.temp }}/bcf-controller-${{ github.run_id }}-${{ github.run_attempt }}'"'"')
        authority=pathlib.Path('"'"'${{ runner.temp }}/bcf-controller-transition-${{ github.run_id }}-${{ github.run_attempt }}/probed/controller-transition.json'"'"')
        assert authority.is_file() and not authority.is_symlink()
        payload=json.loads(authority.read_text())
        keys=['"'"'artifact'"'"', '"'"'wheel_sha256'"'"']
        expected=payload
        for key in keys:
         assert isinstance(expected,dict) and key in expected
         expected=expected[key]
        assert isinstance(expected,str) and re.fullmatch(r'"'"'[a-f0-9]{64}'"'"',expected)
        inventory=source/'"'"'SHA256SUMS'"'"'
        assert inventory.is_file() and not inventory.is_symlink()
        declared={}
        for line in inventory.read_text().splitlines():
         digest,separator,name=line.partition('"'"'  '"'"')
         assert separator and len(digest)==64 and name and name not in declared
         declared[name]=digest
        actual={path.name:path for path in source.iterdir() if path.name!='"'"'SHA256SUMS'"'"'}
        assert set(actual)==set(declared)
        assert all(path.is_file() and not path.is_symlink() and hashlib.sha256(path.read_bytes()).hexdigest()==declared[name] for name,path in actual.items())
        wheels=sorted(source.glob('"'"'bcf_governance-*.whl'"'"'))
        assert len(wheels)==1 and not wheels[0].is_symlink()
        assert hashlib.sha256(wheels[0].read_bytes()).hexdigest()==expected
        venv.EnvBuilder(with_pip=True,clear=True).create(target)
        subprocess.run([str(target/'"'"'bin/python'"'"'),'"'"'-m'"'"','"'"'pip'"'"','"'"'install'"'"','"'"'--no-index'"'"','"'"'--find-links'"'"',str(source),str(wheels[0])],check=True)
        subprocess.run([str(target/'"'"'bin/bcf'"'"'),'"'"'ci-github'"'"','"'"'--help'"'"'],check=True)
        '
    - name: Authenticate and promote the routine controller
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}', BCF_REPOSITORY_ID: '${{ env.BCF_REPOSITORY_ID }}'}
      run: |-
        set -euo pipefail
        "${{ runner.temp }}/bcf-controller-${{ github.run_id }}-${{ github.run_attempt }}/bin/bcf" ci-github bootstrap --repository "${{ github.repository }}" --artifact-dir "${{ runner.temp }}/bcf-trusted-control-${{ github.run_id }}-${{ github.run_attempt }}" --artifact-id "${{ needs.authorize.outputs.target_id }}" --artifact-name "${{ needs.authorize.outputs.target_name }}" --provider-digest "${{ needs.authorize.outputs.target_provider_digest }}" --producer-run-id "${{ needs.authorize.outputs.target_run_id }}" --producer-run-attempt "${{ needs.authorize.outputs.target_run_attempt }}" --repository-id "$BCF_REPOSITORY_ID" --commit "${{ needs.authorize.outputs.target_commit_sha }}" --tree "${{ needs.authorize.outputs.target_tree_sha }}" --wheel-sha256 "${{ needs.authorize.outputs.target_wheel_sha256 }}" --python "$BCF_PYTHON" --tool-cache "${{ runner.tool_cache }}"
  activate:
    name: Activate authenticated routine controller transition
    needs: [authorize, promote]
    if: ${{ success() && needs.authorize.outputs.applicable == 'true' }}
    permissions: {actions: read, contents: read}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 5
    steps:
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Download the probe-authenticated transition
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {name: 'bcf-controller-transition-probed-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/bcf-controller-transition-${{ github.run_id }}-${{ github.run_attempt }}/probed'}
    - name: Allocate the private active-transition directory
      shell: bash
      run: |-
        set -euo pipefail
        mkdir -p -- '${{ runner.temp }}/bcf-controller-transition-${{ github.run_id }}-${{ github.run_attempt }}/active'
    - name: Resolve the provider-authenticated effective controller
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "$RUNNER_TOOL_CACHE"/bcf-governance/c3ddbd278baaed5e34a26872193b964828a09d64/bin/bcf ci-github controller-rotation resolve --repository "${{ github.repository }}"
      id: effective-controller
    - name: Authenticate promotion and activate the routine transition
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "${{ runner.tool_cache }}/bcf-governance/${{ steps.effective-controller.outputs.BCF_BOOTSTRAP_COMMIT_SHA }}/bin/bcf" ci-github controller-rotation advance --repository "${{ github.repository }}" --receipt "${{ runner.temp }}/bcf-controller-transition-${{ github.run_id }}-${{ github.run_attempt }}/probed/controller-transition.json" --stage promotion --rotation-run-id "${{ github.run_id }}" --rotation-run-attempt "${{ github.run_attempt }}" --output "${{ runner.temp }}/bcf-controller-transition-${{ github.run_id }}-${{ github.run_attempt }}/active/controller-transition.json"
      id: activate-transition
    - name: Publish the immutable active controller transition
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-controller-transition-${{ steps.activate-transition.outputs.transition_id }}', path: '${{ runner.temp }}/bcf-controller-transition-${{ github.run_id }}-${{ github.run_attempt }}/active', if-no-files-found: error, retention-days: 30}
