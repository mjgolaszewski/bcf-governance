name: bcf/automation-changelog-reconciler
'on':
  workflow_run:
    workflows: [bcf/automation-admission]
    types: [completed]
permissions: {actions: read, contents: read, pull-requests: read}
jobs:
  reconcile:
    name: Commit the deterministic automation changelog entry
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions: {actions: read, contents: read, pull-requests: read}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 5
    environment: bcf-trusted-automation
    steps:
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Mint one repository-scoped changelog writer token
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
      with: {app-id: '${{ vars.BCF_AUTOMATION_APP_ID }}', private-key: '${{ secrets.BCF_AUTOMATION_APP_PRIVATE_KEY }}', owner: '${{ github.repository_owner }}', repositories: '${{ github.event.repository.name }}', permission-contents: write}
      id: automation-app-token
    - name: Reconstruct provider state and compare-and-swap the fixed changelog entry
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}', BCF_AUTOMATION_APP_TOKEN: '${{ steps.automation-app-token.outputs.token }}'}
      run: |-
        set -euo pipefail
        "$RUNNER_TOOL_CACHE"/bcf-governance/acbf0af4a32470046894913de9ec37da17edaa45/bin/bcf ci-github automation reconcile --repository "${{ github.repository }}"
