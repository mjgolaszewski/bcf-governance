name: bcf/pr-finalizer
'on':
  workflow_run:
    workflows: [governance]
    types: [completed]
permissions: {actions: read, contents: read, pull-requests: read}
jobs:
  finalize:
    name: Authenticate the exact-head governance result
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    permissions: {actions: read, contents: read, pull-requests: read}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 5
    steps:
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Aggregate the latest exact-head producer attempts mechanically
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "$RUNNER_TOOL_CACHE"/bcf-governance/1c711eb5198a8985bbc84e3e9b7644bfe3e14bf7/bin/bcf ci-github pr finalize --repository "${{ github.repository }}" --output "${{ runner.temp }}/bcf-pr-finalization-${{ github.run_id }}-${{ github.run_attempt }}"
    - name: Upload the authenticated PR observation
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-pr-finalization-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/bcf-pr-finalization-${{ github.run_id }}-${{ github.run_attempt }}', if-no-files-found: error, retention-days: 30}
