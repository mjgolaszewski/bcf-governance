name: bcf/pr-finalizer
'on':
  workflow_run:
    workflows: [governance]
    types: [completed]
permissions: {actions: read, contents: read, pull-requests: read}
jobs:
  finalize:
    name: Authenticate the exact-head governance result
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    permissions: {actions: read, contents: read, pull-requests: read}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 5
    steps:
    - name: Materialize the exact candidate without executing its evaluator
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {ref: '${{ github.event.workflow_run.head_sha }}', path: '.bcf-pr-candidate-${{ github.run_id }}-${{ github.run_attempt }}', persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Aggregate the latest exact-head producer attempts mechanically
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_COMMAND_ARG_5: '${{ github.repository }}', BCF_COMMAND_ARG_7: '${{ runner.temp }}/bcf-pr-finalization-${{ github.run_id }}-${{ github.run_attempt }}', BCF_COMMAND_ARG_9: '${{ github.workspace }}/.bcf-pr-candidate-${{ github.run_id }}-${{ github.run_attempt }}', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "$RUNNER_TOOL_CACHE"/bcf-governance/c3ddbd278baaed5e34a26872193b964828a09d64/bin/bcf ci-github pr finalize --repository "$BCF_COMMAND_ARG_5" --output "$BCF_COMMAND_ARG_7" --candidate-root "$BCF_COMMAND_ARG_9"
    - name: Upload the authenticated PR observation
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-pr-finalization-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/bcf-pr-finalization-${{ github.run_id }}-${{ github.run_attempt }}', if-no-files-found: error, retention-days: 30}
