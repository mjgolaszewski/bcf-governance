name: bcf/pr-status-publisher
'on':
  workflow_run:
    workflows: [bcf/pr-finalizer]
    types: [completed]
permissions: {actions: read, checks: write, contents: read, pull-requests: read}
jobs:
  publish:
    name: Publish the authoritative exact-head PR certification
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions: {actions: read, checks: write, contents: read, pull-requests: read}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 5
    steps:
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Download only the triggering finalizer observation
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {name: 'bcf-pr-finalization-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}', github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: '${{ github.event.workflow_run.id }}', path: '${{ runner.temp }}/bcf-pr-finalization-${{ github.run_id }}-${{ github.run_attempt }}', digest-mismatch: error}
    - name: Publish the sole exact-head PR certification check
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "$RUNNER_TOOL_CACHE"/bcf-governance/c14a138d05ce962f0d1735e18b757c8158a55eca/bin/bcf ci-github pr publish --repository "${{ github.repository }}" --bundle "${{ runner.temp }}/bcf-pr-finalization-${{ github.run_id }}-${{ github.run_attempt }}" --target-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"
