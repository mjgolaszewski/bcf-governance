      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {name: 'bcf-pr-finalization-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}', github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: '${{ github.event.workflow_run.id }}', path: '${{ runner.temp }}/bcf-pr-finalization-${{ github.run_id }}-${{ github.run_attempt }}', digest-mismatch: error}
    - name: Publish the sole exact-head PR certification check
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "$RUNNER_TOOL_CACHE"/bcf-governance/ef43d62ef78c03678ec3b7a884762bf29d5d1cc1/bin/bcf ci-github pr publish --repository "${{ github.repository }}" --bundle "${{ runner.temp }}/bcf-pr-finalization-${{ github.run_id }}-${{ github.run_attempt }}" --target-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"
