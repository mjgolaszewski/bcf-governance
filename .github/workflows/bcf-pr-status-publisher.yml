        "$RUNNER_TOOL_CACHE"/bcf-governance/5665e3f533028a12da7468ffe057fed0ff8c475f/bin/bcf ci-github pr publish --repository "$BCF_COMMAND_ARG_5" --bundle "$BCF_COMMAND_ARG_7" --target-url "$BCF_COMMAND_ARG_9"
