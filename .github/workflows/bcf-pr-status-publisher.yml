      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_COMMAND_ARG_5: '${{ github.repository }}', BCF_COMMAND_ARG_7: '${{ runner.temp }}/bcf-pr-finalization-${{ github.run_id }}-${{ github.run_attempt }}', BCF_COMMAND_ARG_9: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
