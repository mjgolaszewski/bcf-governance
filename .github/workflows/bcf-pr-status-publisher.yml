      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "$RUNNER_TOOL_CACHE"/bcf-governance/78f12c6d4acc6e389c6deef41c4933f3a46ceb36/bin/bcf ci-github pr publish --repository "${{ github.repository }}" --bundle "${{ runner.temp }}/bcf-pr-finalization-${{ github.run_id }}-${{ github.run_attempt }}" --target-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"
