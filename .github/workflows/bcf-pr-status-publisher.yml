    name: Publish the authoritative exact-head PR certification
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions: {actions: read, checks: write, contents: read, pull-requests: read}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 5
    steps:
