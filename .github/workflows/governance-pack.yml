name: governance-pack
'on':
  pull_request: {}
  workflow_call:
    inputs:
      build_controller: {description: Build the trusted controller artifact for an exact-main admission, required: false, default: false, type: boolean}
      evaluation_mode: {description: Preflight mode selected by the authenticated caller, required: false, default: pr, type: string}
permissions: {contents: read}
env: {BCF_ENFORCE_PR_CHANGELOG: '${{ github.event_name == ''pull_request'' }}', BCF_PR_BASE_SHA: '${{ github.event.pull_request.base.sha }}'}
jobs:
  pack-checks:
    name: Test package, templates, and release tooling
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 0, persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Install the declared governance environment
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m pip install -r requirements-governance.txt
    - name: Verify canonical and packaged template bytes
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/build_pack_manifest.py --check
    - name: Build the exact-main trusted controller bundle
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/build_trusted_controller.py --output .artifacts/trusted-control --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}"
      if: ${{ inputs.build_controller == true && github.ref == 'refs/heads/main' }}
    - name: Upload the exact-main trusted controller bundle
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-trusted-control-${{ github.sha }}-${{ github.run_attempt }}', path: .artifacts/trusted-control, if-no-files-found: error, retention-days: 30}
      if: ${{ inputs.build_controller == true && github.ref == 'refs/heads/main' }}
  ast-checks:
    name: Verify template architecture boundaries
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 0, persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Verify governed Python syntax
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m compileall -q bcf_governance scripts template-repo/scripts tests .github/scripts
