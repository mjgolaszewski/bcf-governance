name: governance-pack

on:
  pull_request:
  workflow_call:
    inputs:
      build_controller:
        description: Build the trusted controller artifact for an exact-main admission
        required: false
        default: false
        type: boolean
      evaluation_mode:
        description: Preflight mode selected by the authenticated caller
        required: false
        default: pr
        type: string

permissions:
  contents: read

jobs:
  pack-checks:
    name: Test package, templates, and release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install governance dependencies
        run: python -m pip install -r requirements-governance.txt
      - name: Validate selected environment before package work
        env:
          BCF_ENFORCE_PR_CHANGELOG: ${{ github.event_name == 'pull_request' }}
          BCF_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/preflight_governance.py --repo-root . --mode "${{ inputs.evaluation_mode || 'pr' }}" --python "$(command -v python)" --format text
      - name: Compile governance scripts and tests
        run: python -m compileall -q bcf_governance scripts template-repo/scripts tests .github/scripts
      - name: Enforce pull-request changelog contract
        if: github.event_name == 'pull_request'
        env:
          BCF_ENFORCE_PR_CHANGELOG: "true"
          BCF_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/validate_governance_yaml.py --repo-root .
      - name: Run governance pack tests
        run: python -m pytest tests
      - name: Run pull-request implementation mutants
        run: python .github/scripts/run_validator_mutants.py --profile high-value
      - name: Run pull-request semantic mutants
        run: python .github/scripts/run_validator_mutants.py --profile semantic-high-value
      - name: Validate template repo from root script
        run: python scripts/validate_governance_yaml.py --repo-root template-repo --allow-placeholders --allow-release-gate-placeholders
      - name: Validate template repo from template script
        run: python template-repo/scripts/validate_governance_yaml.py --repo-root template-repo --allow-placeholders --allow-release-gate-placeholders
      - name: Build exact-main trusted controller wheel
        if: inputs.build_controller == true && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/trusted-control
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" python -m build --wheel --outdir .artifacts/trusted-control
          python -m pip download --only-binary=:all: --dest .artifacts/trusted-control \
            'PyYAML>=6.0,<7' 'jsonschema>=4.21,<5'
          python .github/scripts/test_release_artifacts.py \
            --controller-wheel-dir .artifacts/trusted-control
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          def git(*args: str) -> str:
              return subprocess.run(
                  ["git", *args], check=True, capture_output=True, text=True
              ).stdout.strip()

          payload = {
              "schema_version": "1.0",
              "commit_sha": git("rev-parse", "HEAD"),
              "tree_sha": git("rev-parse", "HEAD^{tree}"),
              "workflow_run_id": "${{ github.run_id }}",
              "workflow_run_attempt": "${{ github.run_attempt }}",
          }
          Path(".artifacts/trusted-control/CONTROL-METADATA.json").write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          (cd .artifacts/trusted-control && sha256sum ./*.whl CONTROL-METADATA.json > SHA256SUMS)
      - name: Upload exact-main trusted controller wheel
        if: inputs.build_controller == true && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bcf-trusted-control-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/trusted-control
          if-no-files-found: error
          retention-days: 30

  ast-checks:
    name: Verify template architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install governance dependencies
        run: python -m pip install -r requirements-governance.txt
      - name: Run template architecture gate regression tests
        run: python -m pytest tests/test_template_architecture_gate.py
