name: bcf/exact-main-admission
'on':
  push:
    branches: [main]
permissions: {contents: read}
jobs:
  admit:
    name: Authenticate exact-main admission and publish pending authority
    if: ${{ vars.BCF_CI_AUTHORITY_ENABLED == 'true' }}
    permissions: {actions: read, contents: read, statuses: write}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 5
    steps:
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Authenticate exact-main admission and publish pending authority
      shell: bash
      env: {GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        test -d "$RUNNER_TOOL_CACHE"/bcf-governance/84f415331c669f53698c7d9ff3fb44918e6aa1fc
        test ! -L "$RUNNER_TOOL_CACHE"/bcf-governance/84f415331c669f53698c7d9ff3fb44918e6aa1fc
        test -x "$RUNNER_TOOL_CACHE"/bcf-governance/84f415331c669f53698c7d9ff3fb44918e6aa1fc/bin/bcf
        "$RUNNER_TOOL_CACHE"/bcf-governance/84f415331c669f53698c7d9ff3fb44918e6aa1fc/bin/bcf ci-github exact-main admit --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --target-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
  governance:
