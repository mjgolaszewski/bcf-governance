name: bcf/exact-main-admission
'on':
  push:
    branches: [main]
permissions: {contents: read}
jobs:
  admit:
    name: Authenticate exact-main admission and publish pending authority
    needs: [trusted-controller-build]
    if: ${{ vars.BCF_CI_AUTHORITY_ENABLED == 'true' && needs.trusted-controller-build.outputs.semantic_evidence_applicable == 'true' }}
    permissions: {actions: write, contents: read, statuses: write}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 10
    environment: bcf-trusted-protection-inspection
    steps:
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Authenticate exact-main admission with the effective controller
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}', BCF_COMMAND_ARG_0: '${{ runner.tool_cache }}/bcf-governance/${{ needs.trusted-controller-build.outputs.target_commit }}/bin/bcf', BCF_COMMAND_ARG_5: '${{ github.repository }}', BCF_COMMAND_ARG_7: '${{ github.sha }}', BCF_COMMAND_ARG_9: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'}
      run: |-
        set -euo pipefail
        "$BCF_COMMAND_ARG_0" ci-github exact-main admit --repository "$BCF_COMMAND_ARG_5" --sha "$BCF_COMMAND_ARG_7" --target-url "$BCF_COMMAND_ARG_9" --evaluation-mode pr
    - name: Mint repository-scoped protection inspection token
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
      with: {app-id: '${{ vars.BCF_PROTECTION_INSPECT_APP_ID }}', private-key: '${{ secrets.BCF_PROTECTION_INSPECT_APP_PRIVATE_KEY }}', owner: '${{ github.repository_owner }}', repositories: '${{ github.event.repository.name }}', permission-administration: write}
      id: protection-inspector-token
    - name: Authenticate and preserve prior merged-PR evidence
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}', BCF_CONTROLLER_EXECUTION_REQUIRED: 'true', BCF_PROTECTION_INSPECT_REQUIRED: 'true', BCF_PROTECTION_INSPECT_APP_TOKEN: '${{ steps.protection-inspector-token.outputs.token }}', BCF_PROTECTION_INSPECT_INSTALLATION_ID: '${{ vars.BCF_PROTECTION_INSPECT_INSTALLATION_ID }}', BCF_PROTECTION_INSPECT_OBSERVED_INSTALLATION_ID: '${{ steps.protection-inspector-token.outputs.installation-id }}', BCF_COMMAND_ARG_0: '${{ runner.tool_cache }}/bcf-governance/${{ needs.trusted-controller-build.outputs.target_commit }}/bin/bcf', BCF_COMMAND_ARG_5: '${{ github.repository }}', BCF_COMMAND_ARG_7: '${{ github.sha }}', BCF_COMMAND_ARG_9: '${{ runner.temp }}/bcf-prior-evidence-${{ github.run_id }}-${{ github.run_attempt }}'}
      run: |-
        set -euo pipefail
        "$BCF_COMMAND_ARG_0" ci-github prior-evidence transport --repository "$BCF_COMMAND_ARG_5" --main-sha "$BCF_COMMAND_ARG_7" --output "$BCF_COMMAND_ARG_9"
    - name: Upload exact prior evidence transport
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-prior-evidence-transport-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/bcf-prior-evidence-${{ github.run_id }}-${{ github.run_attempt }}', if-no-files-found: error, retention-days: 30}
  governance:
    name: Run exact-main governance evidence
    needs: [admit]
    if: ${{ needs.admit.result == 'success' }}
    permissions: {contents: read}
    uses: ./.github/workflows/governance.yml
    with: {evaluation_mode: pr, use_prior_evidence: true, comparison_base_sha: '${{ github.event.before }}'}
  trusted-controller-build:
    name: Build independent exact-main trusted controller
    if: ${{ vars.BCF_CI_AUTHORITY_ENABLED == 'true' }}
    permissions: {actions: read, contents: read}
    outputs: {controller_state: '${{ steps.exact-main-applicability.outputs.controller_state }}', semantic_evidence_applicable: '${{ steps.exact-main-applicability.outputs.semantic_evidence_applicable }}', target_commit: '${{ steps.exact-main-applicability.outputs.target_commit }}'}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 0, persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Install the declared governance environment
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m pip install -r requirements-governance.txt
    - name: Observe provider-effective controller for non-authoritative routing
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}', BCF_COMMAND_ARG_7: '${{ github.repository }}'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m bcf_governance.cli ci-github controller-rotation resolve --repository "$BCF_COMMAND_ARG_7"
      id: candidate-effective-controller
    - name: Classify exact-main semantic evidence applicability
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_COMMAND_ARG_8: '${{ steps.candidate-effective-controller.outputs.BCF_BOOTSTRAP_COMMIT_SHA }}'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m bcf_governance.cli ci controller-applicability --repo-root . --target-commit "$BCF_COMMAND_ARG_8" --github-output --format json
      id: exact-main-applicability
    - name: Allocate the private controller custody directory
      shell: bash
      run: |-
        set -euo pipefail
        mkdir -p -- ''"${BCF_RUN_EXPRESSION_0}"'/bcf-controller-custody'
      env: {BCF_RUN_EXPRESSION_0: '${{ runner.temp }}'}
    - name: Project the provider-authenticated controller custody capsule
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}', BCF_CONTROLLER_EXECUTION_REQUIRED: 'true', BCF_COMMAND_ARG_7: '${{ github.repository }}', BCF_COMMAND_ARG_9: '${{ runner.temp }}/bcf-controller-custody/controller-custody.json'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m bcf_governance.cli ci-github controller-rotation project-custody --repository "$BCF_COMMAND_ARG_7" --output "$BCF_COMMAND_ARG_9"
    - name: Upload exact controller custody
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-controller-custody-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/bcf-controller-custody', if-no-files-found: error, retention-days: 30}
    - name: Build the exact-main trusted controller bundle
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_COMMAND_ARG_5: '${{ github.run_id }}', BCF_COMMAND_ARG_7: '${{ github.run_attempt }}'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/build_trusted_controller.py --output .artifacts/trusted-control --run-id "$BCF_COMMAND_ARG_5" --run-attempt "$BCF_COMMAND_ARG_7"
      if: ${{ steps.exact-main-applicability.outputs.controller_state == 'pending_rotation' }}
    - name: Upload the exact-main trusted controller bundle
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-trusted-control-${{ github.sha }}-${{ github.run_attempt }}', path: .artifacts/trusted-control, if-no-files-found: error, retention-days: 30}
      if: ${{ steps.exact-main-applicability.outputs.controller_state == 'pending_rotation' }}
