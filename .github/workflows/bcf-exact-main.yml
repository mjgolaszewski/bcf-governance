name: bcf/exact-main-admission
'on':
  push:
    branches:
    - main
permissions:
  contents: read
env:
  BCF_CONTROL_COMMIT: 67601972fa98e1b58641fbb56de78a081a823076
jobs:
  admit:
    name: Authenticate exact-main admission and publish pending authority
    if: ${{ vars.BCF_CI_AUTHORITY_ENABLED == 'true' }}
    permissions:
      actions: read
      contents: read
      statuses: write
    runs-on:
    - self-hosted
    - Linux
    - X64
    - bcf-governance
    - vm-linux-ci-runner
    timeout-minutes: 5
    steps:
    - name: Restore the trusted controller interpreter environment
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Authenticate exact main and publish higher-ordinal pending status
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        control_root="${RUNNER_TOOL_CACHE%/}/bcf-governance/$BCF_CONTROL_COMMIT"
        test -d "$control_root"
        test ! -L "$control_root"
        test -x "$control_root/bin/bcf"
        "$control_root/bin/bcf" ci-github exact-main admit \
          --repository "$GITHUB_REPOSITORY" \
          --sha "$GITHUB_SHA" \
          --target-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
  governance:
    name: Run exact-main governance evidence
    needs:
    - admit
    if: ${{ needs.admit.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/governance.yml
    with:
      evaluation_mode: closure
  governance-pack:
    name: Verify exact-main package and templates
    needs:
    - admit
    if: ${{ needs.admit.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/governance-pack.yml
    with:
      build_controller: true
