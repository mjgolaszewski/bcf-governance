      run: |-
        set -euo pipefail
        test -d "$RUNNER_TOOL_CACHE"/bcf-governance/e48d1878ebad644e456dc268cfcd57a14e918820
        test ! -L "$RUNNER_TOOL_CACHE"/bcf-governance/e48d1878ebad644e456dc268cfcd57a14e918820
        test -x "$RUNNER_TOOL_CACHE"/bcf-governance/e48d1878ebad644e456dc268cfcd57a14e918820/bin/bcf
        "$RUNNER_TOOL_CACHE"/bcf-governance/e48d1878ebad644e456dc268cfcd57a14e918820/bin/bcf ci-github exact-main admit --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --target-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
  governance:
