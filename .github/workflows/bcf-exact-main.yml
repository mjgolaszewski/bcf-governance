name: bcf/exact-main-admission
'on':
  push:
    branches: [main]
permissions: {contents: read}
jobs:
  admit:
    name: Authenticate exact-main admission and publish pending authority
    if: ${{ false }}
    permissions: {actions: read, contents: read, statuses: write}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 5
    steps:
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Authenticate exact-main admission and publish pending authority
      shell: bash
      env: {GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        test -d "$RUNNER_TOOL_CACHE"/bcf-governance/3c0e29e667f7fc0104468aafd65001b07442c0c0
        test ! -L "$RUNNER_TOOL_CACHE"/bcf-governance/3c0e29e667f7fc0104468aafd65001b07442c0c0
        test -x "$RUNNER_TOOL_CACHE"/bcf-governance/3c0e29e667f7fc0104468aafd65001b07442c0c0/bin/bcf
        "$RUNNER_TOOL_CACHE"/bcf-governance/3c0e29e667f7fc0104468aafd65001b07442c0c0/bin/bcf ci-github exact-main admit --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --target-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --evaluation-mode "workitem" --evaluation-target "P26-P0-01"
  governance:
    name: Run exact-main governance evidence
    needs: [admit]
    if: ${{ needs.admit.result == 'success' }}
    permissions: {contents: read}
    uses: ./.github/workflows/governance.yml
    with: {evaluation_mode: workitem, evaluation_target: P26-P0-01}
  trusted-controller-build:
    name: Build independent exact-main trusted controller
    if: ${{ vars.BCF_CI_AUTHORITY_ENABLED == 'true' }}
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 0, persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Install the declared governance environment
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m pip install -r requirements-governance.txt
    - name: Build the exact-main trusted controller bundle
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/build_trusted_controller.py --output .artifacts/trusted-control --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}"
    - name: Upload the exact-main trusted controller bundle
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-trusted-control-${{ github.sha }}-${{ github.run_attempt }}', path: .artifacts/trusted-control, if-no-files-found: error, retention-days: 30}
