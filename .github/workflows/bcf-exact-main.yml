name: bcf/exact-main-admission
'on':
  push:
    branches: [main]
permissions: {contents: read}
jobs:
  admit:
    name: Authenticate exact-main admission and publish pending authority
    if: ${{ vars.BCF_CI_AUTHORITY_ENABLED == 'true' }}
    permissions: {actions: read, contents: read, statuses: write}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 5
    steps:
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Authenticate exact-main admission and publish pending authority
      shell: bash
      env: {GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        test -d "$RUNNER_TOOL_CACHE"/bcf-governance/9261bbb6428f85b884ad03d6d6ba10131f7e92ef
        test ! -L "$RUNNER_TOOL_CACHE"/bcf-governance/9261bbb6428f85b884ad03d6d6ba10131f7e92ef
        test -x "$RUNNER_TOOL_CACHE"/bcf-governance/9261bbb6428f85b884ad03d6d6ba10131f7e92ef/bin/bcf
        "$RUNNER_TOOL_CACHE"/bcf-governance/9261bbb6428f85b884ad03d6d6ba10131f7e92ef/bin/bcf ci-github exact-main admit --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --target-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
  governance:
    name: Run exact-main governance evidence
    needs: [admit]
    if: ${{ needs.admit.result == 'success' }}
    permissions: {contents: read}
    uses: ./.github/workflows/governance.yml
    with: {evaluation_mode: closure}
  governance-pack:
    name: Verify exact-main package and templates
    needs: [admit]
    if: ${{ needs.admit.result == 'success' }}
    permissions: {contents: read}
    uses: ./.github/workflows/governance-pack.yml
    with: {build_controller: true, evaluation_mode: release}
