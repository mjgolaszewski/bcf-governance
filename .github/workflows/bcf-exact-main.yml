name: bcf/exact-main-admission
'on':
  push:
    branches:
    - main
permissions:
  actions: read
  contents: read
env:
  BCF_CONTROL_COMMIT: 219337296dfdbbc0040ae97a7657189949524e24
jobs:
  kickoff:
    name: Authenticate exact-main admission
    if: ${{ vars.BCF_CI_AUTHORITY_ENABLED == 'true' }}
    runs-on:
    - self-hosted
    - Linux
    - X64
    - bcf-governance
    - vm-linux-ci-runner
    timeout-minutes: 5
    steps:
    - name: Restore the trusted controller interpreter environment
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Authenticate the exact default-branch commit
      shell: bash
      run: 'set -euo pipefail

        control_root="${RUNNER_TOOL_CACHE%/}/bcf-governance/$BCF_CONTROL_COMMIT"

        test -d "$control_root"

        test ! -L "$control_root"

        test -x "$control_root/bin/bcf"

        "$control_root/bin/bcf" ci-github kickoff --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --control-workflow-path
        .github/workflows/bcf-exact-main.yml'
