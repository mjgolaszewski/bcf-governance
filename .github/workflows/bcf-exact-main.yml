    if: ${{ (vars.BCF_CI_AUTHORITY_ENABLED == 'true') && (github.repository_id == 1207503211 && github.event.repository.id == 1207503211 && github.event.before == 'bba184674315256bbaeec7bb9c3982af7619de50') }}
