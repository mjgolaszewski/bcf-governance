      run: |-
        set -euo pipefail
        test -d "$RUNNER_TOOL_CACHE"/bcf-governance/af037ecee3a006d6157923a7862eda653f011d54
        test ! -L "$RUNNER_TOOL_CACHE"/bcf-governance/af037ecee3a006d6157923a7862eda653f011d54
        test -x "$RUNNER_TOOL_CACHE"/bcf-governance/af037ecee3a006d6157923a7862eda653f011d54/bin/bcf
        "$RUNNER_TOOL_CACHE"/bcf-governance/af037ecee3a006d6157923a7862eda653f011d54/bin/bcf ci-github exact-main admit --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --target-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
  governance:
