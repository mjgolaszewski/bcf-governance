name: bcf/exact-main-admission
'on':
  push:
    branches: [main]
permissions: {contents: read}
jobs:
  admit:
    name: Authenticate exact-main admission and publish pending authority
    needs: [trusted-controller-build]
    if: ${{ vars.BCF_CI_AUTHORITY_ENABLED == 'true' && needs.trusted-controller-build.outputs.semantic_evidence_applicable == 'true' }}
    permissions: {actions: write, contents: read, statuses: write}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 5
    environment: bcf-trusted-protection-inspection
    steps:
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Resolve the provider-authenticated effective controller
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "$RUNNER_TOOL_CACHE"/bcf-governance/c3ddbd278baaed5e34a26872193b964828a09d64/bin/bcf ci-github controller-rotation resolve --repository "${{ github.repository }}"
      id: effective-controller
    - name: Authenticate exact-main admission with the effective controller
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "${{ runner.tool_cache }}/bcf-governance/${{ steps.effective-controller.outputs.BCF_BOOTSTRAP_COMMIT_SHA }}/bin/bcf" ci-github exact-main admit --repository "${{ github.repository }}" --sha "${{ github.sha }}" --target-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" --evaluation-mode workitem --evaluation-target P28-P0-02
    - name: Mint repository-scoped protection inspection token
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
      with: {app-id: '${{ vars.BCF_PROTECTION_INSPECT_APP_ID }}', private-key: '${{ secrets.BCF_PROTECTION_INSPECT_APP_PRIVATE_KEY }}', owner: '${{ github.repository_owner }}', repositories: '${{ github.event.repository.name }}', permission-administration: write}
      id: protection-inspector-token
    - name: Authenticate and preserve prior merged-PR evidence
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}', BCF_PROTECTION_INSPECT_REQUIRED: 'true', BCF_PROTECTION_INSPECT_APP_TOKEN: '${{ steps.protection-inspector-token.outputs.token }}', BCF_PROTECTION_INSPECT_INSTALLATION_ID: '${{ vars.BCF_PROTECTION_INSPECT_INSTALLATION_ID }}', BCF_PROTECTION_INSPECT_OBSERVED_INSTALLATION_ID: '${{ steps.protection-inspector-token.outputs.installation-id }}'}
      run: |-
        set -euo pipefail
        "${{ runner.tool_cache }}/bcf-governance/${{ steps.effective-controller.outputs.BCF_BOOTSTRAP_COMMIT_SHA }}/bin/bcf" ci-github prior-evidence transport --repository "${{ github.repository }}" --main-sha "${{ github.sha }}" --output "${{ runner.temp }}/bcf-prior-evidence-${{ github.run_id }}-${{ github.run_attempt }}"
    - name: Upload exact prior evidence transport
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-prior-evidence-transport-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/bcf-prior-evidence-${{ github.run_id }}-${{ github.run_attempt }}', if-no-files-found: error, retention-days: 30}
  governance:
    name: Run exact-main governance evidence
    needs: [admit]
    if: ${{ needs.admit.result == 'success' }}
    permissions: {contents: read}
    uses: ./.github/workflows/governance.yml
    with: {evaluation_mode: workitem, evaluation_target: P28-P0-02, use_prior_evidence: true}
  trusted-controller-build:
    name: Build independent exact-main trusted controller
    if: ${{ vars.BCF_CI_AUTHORITY_ENABLED == 'true' }}
    permissions: {actions: read, contents: read}
    outputs: {controller_state: '${{ steps.exact-main-applicability.outputs.controller_state }}', semantic_evidence_applicable: '${{ steps.exact-main-applicability.outputs.semantic_evidence_applicable }}', target_commit: '${{ steps.exact-main-applicability.outputs.target_commit }}'}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 0, persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Install the declared governance environment
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m pip install -r requirements-governance.txt
    - name: Observe provider-effective controller for non-authoritative routing
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m bcf_governance.cli ci-github controller-rotation resolve --repository "${{ github.repository }}"
      id: candidate-effective-controller
    - name: Classify exact-main semantic evidence applicability
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m bcf_governance.cli ci controller-applicability --repo-root . --target-commit "${{ steps.candidate-effective-controller.outputs.BCF_BOOTSTRAP_COMMIT_SHA }}" --github-output --format json
      id: exact-main-applicability
    - name: Build the exact-main trusted controller bundle
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/build_trusted_controller.py --output .artifacts/trusted-control --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}"
    - name: Upload the exact-main trusted controller bundle
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-trusted-control-${{ github.sha }}-${{ github.run_attempt }}', path: .artifacts/trusted-control, if-no-files-found: error, retention-days: 30}
