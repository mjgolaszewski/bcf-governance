name: bcf/release-authority-cutover
'on':
  workflow_dispatch: {}
permissions: {}
jobs:
  controller-route:
    name: Observe provider-effective controller for non-authoritative release routing
    if: ${{ github.actor == 'mjgolaszewski' && github.ref == 'refs/heads/main' }}
    permissions: {actions: read, contents: read}
    outputs: {target_commit: '${{ steps.candidate-effective-controller.outputs.BCF_BOOTSTRAP_COMMIT_SHA }}'}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 0, persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Install the declared governance environment
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m pip install -r requirements-governance.txt
    - name: Observe provider-effective controller for non-authoritative routing
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}', BCF_COMMAND_ARG_7: '${{ github.repository }}'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m bcf_governance.cli ci-github controller-rotation resolve --repository "$BCF_COMMAND_ARG_7"
      id: candidate-effective-controller
  authorize:
    name: Authorize newest certified exact main without candidate checkout
    needs: [controller-route]
    if: ${{ github.actor == 'mjgolaszewski' && github.ref == 'refs/heads/main' }}
    permissions: {actions: read, contents: read}
    outputs: {subject_commit: '${{ steps.resolve.outputs.subject_commit }}', subject_tree: '${{ steps.resolve.outputs.subject_tree }}'}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 5
    steps:
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Allocate private release authorization directories
      shell: bash
      run: |-
        set -euo pipefail
        mkdir -p -- ''"${BCF_RUN_EXPRESSION_0}"'/bcf-release-'"${BCF_RUN_EXPRESSION_1}"'-'"${BCF_RUN_EXPRESSION_2}"'/certification' ''"${BCF_RUN_EXPRESSION_0}"'/bcf-release-'"${BCF_RUN_EXPRESSION_1}"'-'"${BCF_RUN_EXPRESSION_2}"'/controller'
      env: {BCF_RUN_EXPRESSION_0: '${{ runner.temp }}', BCF_RUN_EXPRESSION_1: '${{ github.run_id }}', BCF_RUN_EXPRESSION_2: '${{ github.run_attempt }}'}
    - name: Resolve provider-authenticated release inputs
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_CONTROLLER_EXECUTION_REQUIRED: 'true', BCF_COMMAND_ARG_0: '${{ runner.tool_cache }}/bcf-governance/${{ needs.controller-route.outputs.target_commit }}/bin/bcf', BCF_COMMAND_ARG_5: '${{ github.repository }}', BCF_COMMAND_ARG_7: '${{ runner.temp }}/bcf-release-${{ github.run_id }}-${{ github.run_attempt }}/release-inputs.json', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "$BCF_COMMAND_ARG_0" ci-github release resolve --repository "$BCF_COMMAND_ARG_5" --output "$BCF_COMMAND_ARG_7"
      id: resolve
    - name: Download only the mechanically resolved certification artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {artifact-ids: '${{ steps.resolve.outputs.certification_artifact_id }}', github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: '${{ steps.resolve.outputs.certification_run_id }}', path: '${{ runner.temp }}/bcf-release-${{ github.run_id }}-${{ github.run_attempt }}/certification', digest-mismatch: error}
    - name: Download only the mechanically resolved controller artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {artifact-ids: '${{ steps.resolve.outputs.controller_artifact_id }}', github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: '${{ steps.resolve.outputs.controller_run_id }}', path: '${{ runner.temp }}/bcf-release-${{ github.run_id }}-${{ github.run_attempt }}/controller', digest-mismatch: error}
    - name: Authorize exact provider and Git custody
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_CONTROLLER_EXECUTION_REQUIRED: 'true', BCF_COMMAND_ARG_0: '${{ runner.tool_cache }}/bcf-governance/${{ needs.controller-route.outputs.target_commit }}/bin/bcf', BCF_COMMAND_ARG_5: '${{ github.repository }}', BCF_COMMAND_ARG_7: '${{ runner.temp }}/bcf-release-${{ github.run_id }}-${{ github.run_attempt }}/certification', BCF_COMMAND_ARG_9: '${{ runner.temp }}/bcf-release-${{ github.run_id }}-${{ github.run_attempt }}/release-inputs.json', BCF_COMMAND_ARG_11: '${{ runner.temp }}/bcf-release-${{ github.run_id }}-${{ github.run_attempt }}/controller', BCF_COMMAND_ARG_13: '${{ runner.temp }}/bcf-release-${{ github.run_id }}-${{ github.run_attempt }}/release-authorization.json', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "$BCF_COMMAND_ARG_0" ci-github release authorize --repository "$BCF_COMMAND_ARG_5" --bundle "$BCF_COMMAND_ARG_7" --inputs "$BCF_COMMAND_ARG_9" --controller-wheel-dir "$BCF_COMMAND_ARG_11" --output "$BCF_COMMAND_ARG_13"
    - name: Upload immutable release authorization inputs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-release-authorization-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/bcf-release-${{ github.run_id }}-${{ github.run_attempt }}', if-no-files-found: error, retention-days: 30}
  build:
    name: Build exact certified release bytes on a fresh hosted runner
    needs: [authorize]
    if: ${{ needs.authorize.result == 'success' }}
    permissions: {actions: read, contents: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Check out only the authorized exact commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {ref: '${{ needs.authorize.outputs.subject_commit }}', fetch-depth: 0, persist-credentials: false}
    - name: Select the closed release interpreter
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: 3.12.14}
    - name: Select the exact real-compiler test Node runtime
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with: {node-version: 22.23.2, package-manager-cache: false}
    - name: Download this attempt's authorization only
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {name: 'bcf-release-authorization-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/release-build/release-input}
    - name: Test and build the exact authorized release bundle
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_COMMAND_ARG_7: 'bcf-release-build-${{ needs.authorize.outputs.subject_commit }}-${{ github.run_attempt }}'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/build_release_bundle.py --output .artifacts/release-build --authorization .artifacts/release-build/release-input/release-authorization.json --artifact-name "$BCF_COMMAND_ARG_7"
    - name: Upload the exact untrusted build bundle
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-release-build-${{ needs.authorize.outputs.subject_commit }}-${{ github.run_attempt }}', path: .artifacts/release-build, if-no-files-found: error, retention-days: 30}
      if: ${{ always() }}
