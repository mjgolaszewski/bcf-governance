name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install build and test dependencies
        run: python -m pip install -e ".[dev]" build twine
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match package version v{version}")
          PY
      - name: Run complete test suite
        run: pytest -q tests
      - name: Validate source and packaged templates
        run: |
          python scripts/validate_governance_yaml.py --repo-root template-repo --allow-placeholders --allow-release-gate-placeholders
          python bcf_governance/pack/template-repo/scripts/validate_governance_yaml.py --repo-root bcf_governance/pack/template-repo --allow-placeholders --allow-release-gate-placeholders
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*
          (cd dist && sha256sum bcf_governance-* > SHA256SUMS)
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: |
            dist/bcf_governance-*.whl
            dist/bcf_governance-*.tar.gz
            dist/SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/bcf_governance-*.whl
          dist/bcf_governance-*.tar.gz
          dist/SHA256SUMS
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
