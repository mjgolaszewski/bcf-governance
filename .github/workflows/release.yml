name: bcf/release-authority-cutover

on:
  workflow_dispatch:

permissions: {}

jobs:
  authority-cutover-pending:
    name: Release disabled until authority v1.1 activation
    if: ${{ false }}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 1
    steps:
      - name: Fail closed during the structural-to-activation interval
        run: exit 1
