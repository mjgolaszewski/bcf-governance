name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release-artifacts:
    permissions:
      contents: read
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install build and test dependencies
        run: python -m pip install -e ".[dev]" build twine
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          from bcf_governance._version import __version__

          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{__version__}":
              raise SystemExit(f"tag {tag!r} does not match package version v{__version__}")
          PY
      - name: Run complete test suite
        run: pytest -q tests
      - name: Run full implementation and semantic mutants
        run: |
          python .github/scripts/run_validator_mutants.py --profile full
          python .github/scripts/run_validator_mutants.py --profile semantic-full
      - name: Validate source and packaged templates
        run: |
          python scripts/validate_governance_yaml.py --repo-root template-repo --allow-placeholders --allow-release-gate-placeholders
          python bcf_governance/pack/template-repo/scripts/validate_governance_yaml.py --repo-root bcf_governance/pack/template-repo --allow-placeholders --allow-release-gate-placeholders
      - name: Build distributions
        run: |
          python -m build
      - name: Test clean wheel and complete sdist
        run: python .github/scripts/test_release_artifacts.py --dist-dir dist
      - name: Check verified distributions
        run: |
          python -m twine check dist/*
          (cd dist && sha256sum bcf_governance-* > SHA256SUMS)
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bcf-release-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/bcf_governance-*.whl
            dist/bcf_governance-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: ${{ false }} # Disabled while candidate and trusted work share the temporary local pool.
    needs: [release-artifacts]
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 15
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bcf-release-${{ github.sha }}-${{ github.run_attempt }}
          path: dist
      - name: Verify candidate artifact hashes
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: |
            dist/bcf_governance-*.whl
            dist/bcf_governance-*.tar.gz
            dist/SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/bcf_governance-*.whl
          dist/bcf_governance-*.tar.gz
          dist/SHA256SUMS
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
