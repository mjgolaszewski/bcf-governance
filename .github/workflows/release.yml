# input-sha256: 1be1df4d36bc8192d9ef24974dee982cd33fa8663d8471e3e2e3a5db6dc1e872
name: bcf/release-authority-cutover
'on':
  workflow_dispatch: {}
permissions: {}
jobs:
  authorize:
    name: Authorize newest certified exact main without candidate checkout
    if: ${{ false }}
    permissions: {actions: read, contents: read}
    outputs: {subject_commit: '${{ steps.resolve.outputs.subject_commit }}', subject_tree: '${{ steps.resolve.outputs.subject_tree }}'}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 5
    steps:
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Allocate private release authorization directories
      shell: bash
      run: |-
        set -euo pipefail
        mkdir -p -- '${{ runner.temp }}/bcf-release/certification' '${{ runner.temp }}/bcf-release/controller'
    - name: Resolve provider-authenticated release inputs
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "$RUNNER_TOOL_CACHE"/bcf-governance/49272182790342a52ef7ddbcfd6a540ca7df6baf/bin/bcf ci-github release resolve --repository "${{ github.repository }}" --output "${{ runner.temp }}/bcf-release/release-inputs.json"
      id: resolve
    - name: Download only the mechanically resolved certification artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {artifact-ids: '${{ steps.resolve.outputs.certification_artifact_id }}', github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: '${{ steps.resolve.outputs.certification_run_id }}', path: '${{ runner.temp }}/bcf-release/certification', digest-mismatch: error}
    - name: Download only the mechanically resolved controller artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {artifact-ids: '${{ steps.resolve.outputs.controller_artifact_id }}', github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: '${{ steps.resolve.outputs.controller_run_id }}', path: '${{ runner.temp }}/bcf-release/controller', digest-mismatch: error}
    - name: Authorize exact provider and Git custody
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "$RUNNER_TOOL_CACHE"/bcf-governance/49272182790342a52ef7ddbcfd6a540ca7df6baf/bin/bcf ci-github release authorize --repository "${{ github.repository }}" --bundle "${{ runner.temp }}/bcf-release/certification" --inputs "${{ runner.temp }}/bcf-release/release-inputs.json" --controller-wheel-dir "${{ runner.temp }}/bcf-release/controller" --output "${{ runner.temp }}/bcf-release/release-authorization.json"
    - name: Upload immutable release authorization inputs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-release-authorization-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/bcf-release', if-no-files-found: error, retention-days: 30}
  build:
    name: Build exact certified release bytes on a fresh hosted runner
    needs: [authorize]
    if: ${{ needs.authorize.result == 'success' }}
    permissions: {actions: read, contents: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Check out only the authorized exact commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {ref: '${{ needs.authorize.outputs.subject_commit }}', fetch-depth: 0, persist-credentials: false}
    - name: Select the closed release interpreter
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: 3.12.14}
    - name: Download this attempt's authorization only
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {name: 'bcf-release-authorization-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/release-build/release-input}
    - name: Test and build the exact authorized release bundle
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/build_release_bundle.py --output .artifacts/release-build --authorization .artifacts/release-build/release-input/release-authorization.json --artifact-name "bcf-release-build-${{ needs.authorize.outputs.subject_commit }}-${{ github.run_attempt }}"
    - name: Upload the exact untrusted build bundle
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-release-build-${{ needs.authorize.outputs.subject_commit }}-${{ github.run_attempt }}', path: .artifacts/release-build, if-no-files-found: error, retention-days: 30}
