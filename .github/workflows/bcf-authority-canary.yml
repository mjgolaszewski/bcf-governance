name: bcf/authority-revocation-canary
'on':
  workflow_dispatch:
    inputs:
      scenario:
        description: Deterministic producer outcome for this exact run and every rerun attempt
        required: true
        default: success
        type: choice
        options: [success, producer-b-failure]
permissions: {}
jobs:
  admit:
    name: Admit isolated authority canary
    if: ${{ github.actor == 'mjgolaszewski' && github.ref == 'refs/heads/main' }}
    permissions: {actions: read, contents: read, statuses: write}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 2
    steps:
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Authenticate admission and publish isolated pending authority
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_COMMAND_ARG_5: '${{ github.repository }}', BCF_COMMAND_ARG_7: '${{ github.sha }}', BCF_COMMAND_ARG_9: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "$RUNNER_TOOL_CACHE"/bcf-governance/c3ddbd278baaed5e34a26872193b964828a09d64/bin/bcf ci-github canary admit --repository "$BCF_COMMAND_ARG_5" --sha "$BCF_COMMAND_ARG_7" --target-url "$BCF_COMMAND_ARG_9"
  producer-a:
    name: Execute canary producer A
    needs: [admit]
    if: ${{ needs.admit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 0, persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Execute deterministic producer A
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_COMMAND_ARG_5: '${{ inputs.scenario }}'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/authority_canary_producer.py --producer a --scenario "$BCF_COMMAND_ARG_5"
  producer-b:
    name: Execute canary producer B
    needs: [admit]
    if: ${{ needs.admit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 0, persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Execute deterministic producer B
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_COMMAND_ARG_5: '${{ inputs.scenario }}'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/authority_canary_producer.py --producer b --scenario "$BCF_COMMAND_ARG_5"
  observe:
    name: Observe canary precedence mechanically
    needs: [admit, producer-a, producer-b]
    if: ${{ always() && github.actor == 'mjgolaszewski' && github.ref == 'refs/heads/main' && needs.admit.result == 'success' }}
    permissions: {actions: read, contents: read, statuses: write}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 2
