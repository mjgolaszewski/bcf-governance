      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/authority_canary_producer.py --producer b --scenario "${{ inputs.scenario }}"
  observe:
