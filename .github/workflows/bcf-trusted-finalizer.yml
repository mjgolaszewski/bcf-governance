        "$RUNNER_TOOL_CACHE"/bcf-governance/af037ecee3a006d6157923a7862eda653f011d54/bin/bcf ci-github exact-main finalize --repository "$GITHUB_REPOSITORY" --output "${{ runner.temp }}/bcf-exact-main-certification-${{ github.run_id }}-${{ github.run_attempt }}"
