name: bcf/trusted-evidence-finalizer
'on':
  workflow_run:
    workflows: [bcf/exact-main-admission]
    types: [completed]
permissions: {actions: read, contents: read}
jobs:
  finalize:
    name: Reconstruct the newest same-admission exact-main evidence
    if: ${{ vars.BCF_CI_AUTHORITY_ENABLED == 'true' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    permissions: {actions: read, contents: read}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 10
    steps:
    - name: Validate all required environment inputs before work
      shell: bash
      env: {BCF_CONTROLLER_ROUTE_FILE: '${{ runner.temp }}/bcf-controller-custody-${{ github.run_id }}-${{ github.run_attempt }}/controller-custody.json'}
      run: |
        set -euo pipefail
        test -n "$BCF_CONTROLLER_ROUTE_FILE"
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Download the triggering admission controller custody
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {name: 'bcf-controller-custody-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}', github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: '${{ github.event.workflow_run.id }}', path: '${{ runner.temp }}/bcf-controller-custody-${{ github.run_id }}-${{ github.run_attempt }}'}
    - name: Project non-authoritative routing from authenticated controller custody
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_CONTROLLER_ROUTE_FILE: '${{ runner.temp }}/bcf-controller-custody-${{ github.run_id }}-${{ github.run_attempt }}/controller-custody.json'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -c 'import json,os,pathlib,re;source=pathlib.Path(os.environ["BCF_CONTROLLER_ROUTE_FILE"]);files=[source] if source.is_file() else sorted(source.glob("*.json"));assert len(files)==1;p=json.loads(files[0].read_text());custody=p.get("controller_custody",p.get("observations",{}).get("controller_custody",p));candidates=(custody.get("controller",{}).get("commit_sha"),p.get("authority",{}).get("controller_commit_sha"),p.get("controller",{}).get("commit_sha"),p.get("artifact",{}).get("commit_sha"));values=[v for v in candidates if isinstance(v,str)];assert values and len(set(values))==1 and re.fullmatch(r"[a-f0-9]{40}",values[0]);subject=custody.get("subject",{}).get("commit_sha");assert subject is None or re.fullmatch(r"[a-f0-9]{40}",subject);state="" if subject is None else "current" if subject==values[0] else "pending_rotation";out=pathlib.Path(os.environ["GITHUB_OUTPUT"]);out.open("a").write("controller_commit_sha="+values[0]+"\n"+("controller_state="+state+"\n" if state else ""))'
      id: controller-route
    - name: Reconstruct exact-main evidence with the effective controller
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}', BCF_CONTROLLER_CUSTODY_PATH: '${{ runner.temp }}/bcf-controller-custody-${{ github.run_id }}-${{ github.run_attempt }}/controller-custody.json', BCF_CONTROLLER_EXECUTION_REQUIRED: 'true', BCF_COMMAND_ARG_0: '${{ runner.tool_cache }}/bcf-governance/${{ steps.controller-route.outputs.controller_commit_sha }}/bin/bcf', BCF_COMMAND_ARG_5: '${{ github.repository }}', BCF_COMMAND_ARG_7: '${{ github.event.workflow_run.id }}', BCF_COMMAND_ARG_9: '${{ github.event.workflow_run.run_attempt }}', BCF_COMMAND_ARG_11: '${{ runner.temp }}/bcf-exact-main-certification-${{ github.run_id }}-${{ github.run_attempt }}'}
      run: |-
        set -euo pipefail
        "$BCF_COMMAND_ARG_0" ci-github exact-main finalize --repository "$BCF_COMMAND_ARG_5" --trigger-run-id "$BCF_COMMAND_ARG_7" --trigger-run-attempt "$BCF_COMMAND_ARG_9" --output "$BCF_COMMAND_ARG_11"
    - name: Upload exact-main certification bundle
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-exact-main-certification-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/bcf-exact-main-certification-${{ github.run_id }}-${{ github.run_attempt }}', if-no-files-found: error, retention-days: 30}
    - name: Preserve triggering admission controller custody for publication
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-finalizer-controller-custody-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/bcf-controller-custody-${{ github.run_id }}-${{ github.run_attempt }}', if-no-files-found: error, retention-days: 30}
