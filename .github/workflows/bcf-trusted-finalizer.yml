      with: {python-version: '3.12'}
    - name: Reconstruct the newest same-admission exact-main evidence
      shell: bash
      env: {GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        test -d "$RUNNER_TOOL_CACHE"/bcf-governance/3500523478be162e976a198b72de32b9fe0c4296
        test ! -L "$RUNNER_TOOL_CACHE"/bcf-governance/3500523478be162e976a198b72de32b9fe0c4296
        test -x "$RUNNER_TOOL_CACHE"/bcf-governance/3500523478be162e976a198b72de32b9fe0c4296/bin/bcf
        "$RUNNER_TOOL_CACHE"/bcf-governance/3500523478be162e976a198b72de32b9fe0c4296/bin/bcf ci-github exact-main finalize --repository "$GITHUB_REPOSITORY" --output "${{ runner.temp }}/bcf-exact-main-certification-${{ github.run_id }}-${{ github.run_attempt }}"
