      with: {python-version: '3.12'}
    - name: Reconstruct the newest same-admission exact-main evidence
      shell: bash
      env: {GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        test -d "$RUNNER_TOOL_CACHE"/bcf-governance/4b751fc552bb594e16ae9b1450fff6e32a51123a
        test ! -L "$RUNNER_TOOL_CACHE"/bcf-governance/4b751fc552bb594e16ae9b1450fff6e32a51123a
        test -x "$RUNNER_TOOL_CACHE"/bcf-governance/4b751fc552bb594e16ae9b1450fff6e32a51123a/bin/bcf
        "$RUNNER_TOOL_CACHE"/bcf-governance/4b751fc552bb594e16ae9b1450fff6e32a51123a/bin/bcf ci-github exact-main finalize --repository "$GITHUB_REPOSITORY" --output "${{ runner.temp }}/bcf-exact-main-certification-${{ github.run_id }}-${{ github.run_attempt }}"
    - name: Upload exact exact-main-certification evidence
