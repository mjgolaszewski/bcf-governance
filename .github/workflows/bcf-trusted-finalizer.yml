name: bcf/trusted-evidence-finalizer
'on':
  workflow_run:
    workflows: [bcf/exact-main-admission]
    types: [completed]
permissions: {actions: read, contents: read}
jobs:
  finalize:
    name: Reconstruct the newest same-admission exact-main evidence
    if: ${{ vars.BCF_CI_AUTHORITY_ENABLED == 'true' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    permissions: {actions: read, contents: read}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 5
    steps:
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Reconstruct the newest same-admission exact-main evidence
      shell: bash
      env: {GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        test -d "$RUNNER_TOOL_CACHE"/bcf-governance/a0cb25e98308de89187ca69fbbfab30796cb7b1d
        test ! -L "$RUNNER_TOOL_CACHE"/bcf-governance/a0cb25e98308de89187ca69fbbfab30796cb7b1d
        test -x "$RUNNER_TOOL_CACHE"/bcf-governance/a0cb25e98308de89187ca69fbbfab30796cb7b1d/bin/bcf
        "$RUNNER_TOOL_CACHE"/bcf-governance/a0cb25e98308de89187ca69fbbfab30796cb7b1d/bin/bcf ci-github exact-main finalize --repository "$GITHUB_REPOSITORY" --output "${{ runner.temp }}/bcf-exact-main-certification-${{ github.run_id }}-${{ github.run_attempt }}"
    - name: Upload exact exact-main-certification evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-exact-main-certification-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/bcf-exact-main-certification-${{ github.run_id }}-${{ github.run_attempt }}', if-no-files-found: error, retention-days: 30}
