name: bcf/trusted-evidence-finalizer
'on':
  workflow_run:
    workflows: [bcf/exact-main-admission]
    types: [completed]
permissions: {actions: read, contents: read}
jobs:
  finalize:
    name: Reconstruct the newest same-admission exact-main evidence
    if: ${{ vars.BCF_CI_AUTHORITY_ENABLED == 'true' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' || vars.BCF_CI_AUTHORITY_ENABLED == 'true' && github.event.workflow_run.event == 'repository_dispatch' && github.event.workflow_run.head_branch == 'main' }}
    permissions: {actions: read, contents: read}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 5
    steps:
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Resolve the provider-authenticated effective controller
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "$RUNNER_TOOL_CACHE"/bcf-governance/1511b09b5a27ef6e541b37a0c2154dcb44448c65/bin/bcf ci-github controller-rotation resolve --repository "${{ github.repository }}"
      id: effective-controller
    - name: Reconstruct exact-main evidence with the effective controller
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "${{ runner.tool_cache }}/bcf-governance/${{ steps.effective-controller.outputs.BCF_BOOTSTRAP_COMMIT_SHA }}/bin/bcf" ci-github exact-main finalize --repository "${{ github.repository }}" --trigger-run-id "${{ github.event.workflow_run.id }}" --trigger-run-attempt "${{ github.event.workflow_run.run_attempt }}" --output "${{ runner.temp }}/bcf-exact-main-certification-${{ github.run_id }}-${{ github.run_attempt }}"
    - name: Upload exact-main certification bundle
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-exact-main-certification-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/bcf-exact-main-certification-${{ github.run_id }}-${{ github.run_attempt }}', if-no-files-found: error, retention-days: 30}
