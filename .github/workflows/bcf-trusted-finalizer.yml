name: bcf/trusted-evidence-finalizer
'on':
  workflow_run:
    workflows:
    - bcf/exact-main-admission
    - governance
    - governance-pack
    types:
    - completed
permissions:
  actions: read
  contents: read
env:
  BCF_CONTROL_COMMIT: 37475fbff2c5303762e0fdeb97e7cc7834bfe485
jobs:
  finalize:
    name: Reconstruct exact-main producer evidence
    if: ${{ vars.BCF_CI_AUTHORITY_ENABLED == 'true' && github.event.workflow_run.event == 'push' }}
    runs-on:
    - self-hosted
    - Linux
    - X64
    - bcf-governance
    - vm-linux-ci-runner
    timeout-minutes: 5
    steps:
    - name: Restore the trusted controller interpreter environment
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Reconstruct authenticated provider state
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        control_root="${RUNNER_TOOL_CACHE%/}/bcf-governance/$BCF_CONTROL_COMMIT"

        test -d "$control_root"

        test ! -L "$control_root"

        test -x "$control_root/bin/bcf"

        "$control_root/bin/bcf" ci-github finalize-callback --repository "$GITHUB_REPOSITORY" --resolve-control-run --control-workflow-path
        .github/workflows/bcf-exact-main.yml --collector-workflow-path .github/workflows/bcf-trusted-finalizer.yml --output
        "$RUNNER_TEMP/bcf-trusted-callback"'
    - name: Upload the immutable trusted callback envelope
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: bcf-trusted-callback-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/bcf-trusted-callback
        if-no-files-found: error
        retention-days: 30
