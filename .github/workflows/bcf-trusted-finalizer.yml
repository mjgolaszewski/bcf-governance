name: bcf/trusted-evidence-finalizer
'on':
  workflow_run:
    workflows: [bcf/exact-main-admission]
    types: [completed]
permissions: {actions: read, contents: read}
jobs:
  finalize:
    name: Reconstruct the newest same-admission exact-main evidence
    if: ${{ vars.BCF_CI_AUTHORITY_ENABLED == 'true' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    permissions: {actions: read, contents: read}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 5
    steps:
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Reconstruct the newest same-admission exact-main evidence
      shell: bash
      env: {GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        test -d "$RUNNER_TOOL_CACHE"/bcf-governance/a9e285c6c334e97b07e8863f4a9b09f9d5f2d36f
        test ! -L "$RUNNER_TOOL_CACHE"/bcf-governance/a9e285c6c334e97b07e8863f4a9b09f9d5f2d36f
        test -x "$RUNNER_TOOL_CACHE"/bcf-governance/a9e285c6c334e97b07e8863f4a9b09f9d5f2d36f/bin/bcf
        "$RUNNER_TOOL_CACHE"/bcf-governance/a9e285c6c334e97b07e8863f4a9b09f9d5f2d36f/bin/bcf ci-github exact-main finalize --repository "$GITHUB_REPOSITORY" --trigger-run-id "${{ github.event.workflow_run.id }}" --trigger-run-attempt "${{ github.event.workflow_run.run_attempt }}" --output "${{ runner.temp }}/bcf-exact-main-certification-${{ github.run_id }}-${{ github.run_attempt }}"
    - name: Upload exact exact-main-certification evidence
