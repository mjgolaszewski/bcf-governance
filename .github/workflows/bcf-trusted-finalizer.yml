name: bcf/trusted-evidence-finalizer
'on':
  workflow_run:
    workflows:
    - bcf/exact-main-admission
    types:
    - completed
permissions:
  actions: read
  contents: read
env:
  BCF_CONTROL_COMMIT: cc3c1fecb24b5c3c6bd23eca901412d03e778a7d
jobs:
  finalize:
    name: Reconstruct the newest same-admission exact-main evidence
    if: ${{ vars.BCF_CI_AUTHORITY_ENABLED == 'true' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on:
    - self-hosted
    - Linux
    - X64
    - bcf-governance
    - vm-linux-ci-runner
    timeout-minutes: 5
    steps:
    - name: Restore the trusted controller interpreter environment
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Reconstruct authenticated provider state and exact-attempt membership
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        control_root="${RUNNER_TOOL_CACHE%/}/bcf-governance/$BCF_CONTROL_COMMIT"
        test -d "$control_root"
        test ! -L "$control_root"
        test -x "$control_root/bin/bcf"
        "$control_root/bin/bcf" ci-github exact-main finalize \
          --repository "$GITHUB_REPOSITORY" \
          --output "$RUNNER_TEMP/bcf-exact-main-certification"
    - name: Upload the immutable exact-main certification bundle
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: bcf-exact-main-certification-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/bcf-exact-main-certification
        if-no-files-found: error
        retention-days: 30
