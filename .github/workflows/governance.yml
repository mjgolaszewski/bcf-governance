name: governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  BCF_ENFORCE_PR_CHANGELOG: ${{ github.event_name == 'pull_request' }}
  BCF_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  preflight:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && (github.actor != 'mjgolaszewski' || github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","bcf-governance","vm-linux-ci-runner"]') }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 -m pip install -r requirements-governance.txt
      - name: Run canonical cheap preflight
        run: python3 -m bcf_governance.cli preflight --mode "${{ github.event_name == 'pull_request' && 'pr' || 'release' }}" --python "$(command -v python3)"

  evidence:
    needs: [preflight]
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && (github.actor != 'mjgolaszewski' || github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","bcf-governance","vm-linux-ci-runner"]') }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 -m pip install -r requirements-governance.txt
      - name: Capture mechanically derived evidence shard
        run: python3 .github/scripts/capture_governance_shard.py --shard-index "${{ matrix.shard }}" --shard-count 4 --output-root .artifacts/bcf
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "bcf-evidence-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}"
          path: .artifacts/bcf
          if-no-files-found: error

  governance-truthfulness:
    if: always()
    needs: [evidence]
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && (github.actor != 'mjgolaszewski' || github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","bcf-governance","vm-linux-ci-runner"]') }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 -m pip install -r requirements-governance.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: "bcf-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*"
          path: .artifacts/bcf
          merge-multiple: true
      - run: python3 scripts/governance_truth.py --repo-root . --evidence-dir .artifacts/bcf --format json --durable-ref "github-actions://${{ github.repository }}/runs/${{ github.run_id }}/bcf-governance-truth" --output .artifacts/bcf/truth-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "bcf-governance-truth-${{ github.run_id }}-${{ github.run_attempt }}"
          path: .artifacts/bcf/truth-report.json
          if-no-files-found: error
