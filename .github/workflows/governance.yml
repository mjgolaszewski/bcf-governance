name: governance
'on':
  pull_request: {}
  workflow_call:
    inputs:
      evaluation_mode: {description: Exact truth evaluation mode selected by the trusted caller, required: false, default: pr, type: string}
      evaluation_target: {description: Exact typed target required only for bounded workitem certification, required: false, default: '', type: string}
      use_prior_evidence: {description: Consume exact caller-bound prior evidence when present, required: false, default: false, type: boolean}
permissions: {contents: read}
env: {BCF_ENFORCE_PR_CHANGELOG: '${{ github.event_name == ''pull_request'' }}', BCF_PR_BASE_SHA: '${{ github.event.pull_request.base.sha }}'}
jobs:
  preflight:
    name: Validate governance front door
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 0, persist-credentials: false}
    - name: Download exact prior-evidence-transport evidence
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {name: 'bcf-prior-evidence-transport-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/bcf/prior-evidence}
      if: ${{ inputs.use_prior_evidence == true }}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Install the declared governance environment
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m pip install -r requirements-governance.txt
    - name: Run canonical cheap preflight and allocate one evidence session
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" scripts/preflight_governance.py --repo-root . --evaluation-mode "${{ inputs.evaluation_mode || 'pr' }}" --evaluation-target "${{ inputs.evaluation_target || '' }}" --python "$BCF_PYTHON" --artifact-root .artifacts/bcf --expected-producer evidence --format text
      if: ${{ inputs.use_prior_evidence != true }}
    - name: Run canonical cheap preflight with exact prior evidence
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" scripts/preflight_governance.py --repo-root . --evaluation-mode "${{ inputs.evaluation_mode || 'pr' }}" --evaluation-target "${{ inputs.evaluation_target || '' }}" --python "$BCF_PYTHON" --artifact-root .artifacts/bcf --expected-producer evidence --prior-evidence-dir .artifacts/bcf/prior-evidence --format text
      if: ${{ inputs.use_prior_evidence == true }}
    - name: Upload the exact evidence session
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-session-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/bcf/sessions, if-no-files-found: error, retention-days: 30}
  evidence:
    name: Evidence / ${{ matrix.display_name }}
    needs: [preflight]
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
        include:
        - {shard: 0, display_name: Evidence shard 0}
        - {shard: 1, display_name: Evidence shard 1}
        - {shard: 2, display_name: Evidence shard 2}
        - {shard: 3, display_name: Evidence shard 3}
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 0, persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Install the declared governance environment
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m pip install -r requirements-governance.txt
    - name: Select the exact real-compiler test Node runtime
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with: {node-version: 22.23.2, package-manager-cache: false}
    - name: Verify and materialize the locked offline TypeScript test compiler
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/bootstrap_test_toolchain.py --repo-root .
    - name: Download this attempt's evidence session
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {name: 'bcf-session-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/bcf/sessions}
    - name: Restore downloaded evidence-session modes
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/restore_evidence_modes.py --root .artifacts/bcf/sessions
    - name: Capture the mechanically derived evidence shard
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/capture_governance_shard.py --shard-index "${{ matrix.shard }}" --shard-count 4 --session-root .artifacts/bcf/sessions
    - name: Upload this attempt's exact evidence shard
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-evidence-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}', path: .artifacts/bcf/sessions, if-no-files-found: error, retention-days: 30}
      if: ${{ always() }}
  governance-truthfulness:
