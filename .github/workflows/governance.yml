name: governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  BCF_ENFORCE_PR_CHANGELOG: ${{ github.event_name == 'pull_request' }}
  BCF_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  preflight:
    if: github.event_name != 'pull_request' || (github.actor == 'mjgolaszewski' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 -m pip install -r requirements-governance.txt
      - name: Run canonical cheap preflight
        run: python3 -m bcf_governance.cli preflight --mode "${{ github.event_name == 'pull_request' && 'pr' || 'release' }}" --python "$(command -v python3)"

  evidence:
    if: github.event_name != 'pull_request' || (github.actor == 'mjgolaszewski' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: [preflight]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate:
          - architecture-context-membership
          - architecture-cqrs-side
          - architecture-duplication
          - architecture-import-boundaries
          - architecture-layer-membership
          - architecture-module-size
          - architecture-router-thinness
          - architecture-test
          - contract-test
          - governance-exposure-scan
          - governance-validate
          - lint
          - runtime-smoke
          - security-dependency-audit
          - security-review
          - security-sbom
          - security-secret-scan
          - security-vulnerability-scan
          - semantic-ownership
          - test
          - typecheck
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 -m pip install -r requirements-governance.txt
      - name: Capture ${{ matrix.gate }} evidence
        run: python3 scripts/governance_evidence.py --repo-root . run --gate "${{ matrix.gate }}" --output ".artifacts/bcf/${{ matrix.gate }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "bcf-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.gate }}"
          path: .artifacts/bcf/${{ matrix.gate }}
          if-no-files-found: error

  governance-truthfulness:
    if: always() && (github.event_name != 'pull_request' || (github.actor == 'mjgolaszewski' && github.event.pull_request.head.repo.full_name == github.repository))
    needs: [evidence]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 -m pip install -r requirements-governance.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: "bcf-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*"
          path: .artifacts/bcf
          merge-multiple: true
      - run: python3 scripts/governance_truth.py --repo-root . --evidence-dir .artifacts/bcf --format json --durable-ref "github-actions://${{ github.repository }}/runs/${{ github.run_id }}/bcf-governance-truth" --output .artifacts/bcf/truth-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "bcf-governance-truth-${{ github.run_id }}-${{ github.run_attempt }}"
          path: .artifacts/bcf/truth-report.json
          if-no-files-found: error
