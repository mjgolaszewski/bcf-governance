name: governance

on:
  pull_request:
  workflow_call:
    inputs:
      evaluation_mode:
        description: Exact truth evaluation mode selected by the trusted caller
        required: false
        default: pr
        type: string

permissions:
  contents: read

env:
  BCF_ENFORCE_PR_CHANGELOG: ${{ github.event_name == 'pull_request' }}
  BCF_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  preflight:
    name: Validate governance front door
    runs-on: ubuntu-latest
    outputs:
      session_manifest: ${{ steps.preflight.outputs.session_manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.12"}
      - run: python3 -m pip install -r requirements-governance.txt
      - id: preflight
        name: Run canonical cheap preflight and allocate one evidence session
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(python3 scripts/preflight_governance.py --repo-root . --mode "${{ github.event_name == 'workflow_call' && inputs.evaluation_mode == 'closure' && 'release' || 'pr' }}" --python "$(command -v python3)" --artifact-root .artifacts/bcf --expected-producer evidence --format text | tail -n 1)"
          printf 'session_manifest=%s\n' "$manifest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "bcf-session-${{ github.run_id }}-${{ github.run_attempt }}"
          path: .artifacts/bcf/sessions
          if-no-files-found: error

  evidence:
    name: Evidence / ${{ matrix.display_name }}
    needs: [preflight]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
        include:
          - {shard: 0, display_name: "Boundaries, contracts, runtime, types, and secrets"}
          - {shard: 1, display_name: "CQRS, module size, exposure, and dependency risk"}
          - {shard: 2, display_name: "Duplication, routers, governance, and ownership"}
          - {shard: 3, display_name: "Full tests, lint, import boundaries, and SBOM"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.12"}
      - run: python3 -m pip install -r requirements-governance.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: "bcf-session-${{ github.run_id }}-${{ github.run_attempt }}"
          path: .artifacts/bcf/sessions
      - name: Restore immutable evidence session
        shell: bash
        run: |
          set -euo pipefail
          session="${{ needs.preflight.outputs.session_manifest }}"
          session_dir="${session%/evidence-session.json}"
          chmod 700 .artifacts/bcf/sessions "$session_dir"
          chmod 400 "$session"
      - name: Capture mechanically derived evidence shard
        shell: bash
        run: |
          session="${{ needs.preflight.outputs.session_manifest }}"
          python3 .github/scripts/capture_governance_shard.py --shard-index "${{ matrix.shard }}" --shard-count 4 --output-root "${session%/evidence-session.json}" --session-manifest "$session"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "bcf-evidence-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}"
          path: .artifacts/bcf/sessions
          if-no-files-found: error

  governance-truthfulness:
    name: Verify exact-tree governance evidence
    if: always()
    needs: [preflight, evidence]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.12"}
      - run: python3 -m pip install -r requirements-governance.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: "bcf-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*"
          path: .artifacts/bcf/fan-in
      - name: Restore private session modes after artifact transport
        shell: bash
        run: |
          set -euo pipefail
          find .artifacts/bcf/fan-in -type f -name evidence-session.json -execdir chmod 700 . \; -exec chmod 400 {} +
      - run: python3 scripts/governance_truth.py --repo-root . --evidence-dir .artifacts/bcf/fan-in --evaluation-mode "${{ github.event_name == 'workflow_call' && inputs.evaluation_mode || 'pr' }}" --format json --durable-ref "github-actions://${{ github.repository }}/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/bcf-governance-truth" --output .artifacts/bcf/truth-report.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "bcf-governance-truth-${{ github.run_id }}-${{ github.run_attempt }}"
          path: .artifacts/bcf/truth-report.json
          if-no-files-found: error
