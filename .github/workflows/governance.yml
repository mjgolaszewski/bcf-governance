name: governance
'on':
  pull_request: {}
  workflow_call:
    inputs:
      evaluation_mode: {description: Exact truth evaluation mode selected by the trusted caller, required: false, default: pr, type: string}
permissions: {contents: read}
env: {BCF_ENFORCE_PR_CHANGELOG: '${{ github.event_name == ''pull_request'' }}', BCF_PR_BASE_SHA: '${{ github.event.pull_request.base.sha }}'}
jobs:
  preflight:
    name: Validate governance front door
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 0, persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Install the declared governance environment
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m pip install -r requirements-governance.txt
    - name: Run canonical cheap preflight and allocate one evidence session
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" scripts/preflight_governance.py --repo-root . --mode "${{ inputs.evaluation_mode == 'closure' && 'release' || 'pr' }}" --evaluation-mode "${{ inputs.evaluation_mode || 'pr' }}" --python "$BCF_PYTHON" --artifact-root .artifacts/bcf --expected-producer evidence --format text
    - name: Upload the exact evidence session
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-session-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/bcf/sessions, if-no-files-found: error, retention-days: 30}
  evidence:
    name: Evidence / ${{ matrix.display_name }}
    needs: [preflight]
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
        include:
        - {shard: 0, display_name: 'Boundaries, contracts, runtime, types, and secrets'}
        - {shard: 1, display_name: 'CQRS, module size, exposure, and dependency risk'}
        - {shard: 2, display_name: 'Duplication, routers, governance, and ownership'}
        - {shard: 3, display_name: 'Full tests, lint, import boundaries, and SBOM'}
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 0, persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Install the declared governance environment
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m pip install -r requirements-governance.txt
    - name: Download this attempt's evidence session
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {name: 'bcf-session-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/bcf/sessions}
    - name: Restore downloaded evidence-session modes
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/restore_evidence_modes.py --root .artifacts/bcf/sessions
    - name: Capture the mechanically derived evidence shard
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/capture_governance_shard.py --shard-index "${{ matrix.shard }}" --shard-count 4 --session-root .artifacts/bcf/sessions
    - name: Upload this attempt's exact evidence shard
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-evidence-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}', path: .artifacts/bcf/sessions, if-no-files-found: error, retention-days: 30}
      if: ${{ always() }}
  governance-truthfulness:
    name: Verify exact-tree governance evidence
    needs: [preflight, evidence]
    if: ${{ always() }}
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 0, persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Install the declared governance environment
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m pip install -r requirements-governance.txt
    - name: Download only this attempt's evidence shards
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {pattern: 'bcf-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*', path: .artifacts/bcf/fan-in}
      if: ${{ needs.preflight.result == 'success' && needs.evidence.result == 'success' }}
    - name: Restore private evidence-session modes
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/restore_evidence_modes.py --root .artifacts/bcf/fan-in
      if: ${{ needs.preflight.result == 'success' && needs.evidence.result == 'success' }}
    - name: Verify exact-tree governance evidence
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" scripts/governance_truth.py --repo-root . --evidence-dir .artifacts/bcf/fan-in --evaluation-mode "${{ inputs.evaluation_mode || 'pr' }}" --format json --durable-ref "github-actions://${{ github.repository }}/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/bcf-governance-truth" --output .artifacts/bcf/truth-report.json
      if: ${{ needs.preflight.result == 'success' && needs.evidence.result == 'success' }}
    - name: Preserve a causal terminal result
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/governance_terminal_observation.py --repo-root . --output .artifacts/bcf/truth-report.json --preflight-result "${{ needs.preflight.result }}" --evidence-result "${{ needs.evidence.result }}" --repository "${{ github.repository }}" --commit-sha "${{ github.sha }}" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}"
      if: ${{ always() }}
    - name: Upload this attempt's terminal truth report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-governance-truth-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/bcf/truth-report.json, if-no-files-found: error, retention-days: 30}
      if: ${{ always() }}
