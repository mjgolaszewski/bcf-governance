        test -n "$BCF_BOOTSTRAP_COMMIT_SHA"
        test -n "$BCF_BOOTSTRAP_REPOSITORY_ID"
        test -n "$BCF_BOOTSTRAP_RUN_ATTEMPT"
        test -n "$BCF_BOOTSTRAP_RUN_ID"
        test -n "$BCF_BOOTSTRAP_TREE_SHA"
        test -n "$BCF_BOOTSTRAP_WHEEL_SHA256"
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Download only the mechanically pinned controller artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {artifact-ids: '${{ env.BCF_BOOTSTRAP_ARTIFACT_ID }}', github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: '${{ env.BCF_BOOTSTRAP_RUN_ID }}', path: '${{ runner.temp }}/bcf-trusted-control-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}', digest-mismatch: error}
    - name: Stage the checksum-admitted controller in an isolated temporary environment
      shell: bash
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -I -c 'import hashlib,json,pathlib,re,subprocess,sys,venv
        source=pathlib.Path('"'"'${{ runner.temp }}/bcf-trusted-control-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}'"'"')
        target=pathlib.Path('"'"'${{ runner.temp }}/bcf-controller-${{ github.run_id }}-${{ github.run_attempt }}'"'"')
        inventory=source/'"'"'SHA256SUMS'"'"'
        assert inventory.is_file() and not inventory.is_symlink()
        declared={}
        for line in inventory.read_text().splitlines():
         digest,separator,name=line.partition('"'"'  '"'"')
         assert separator and len(digest)==64 and name and name not in declared
         declared[name]=digest
        actual={path.name:path for path in source.iterdir() if path.name!='"'"'SHA256SUMS'"'"'}
        assert set(actual)==set(declared)
        assert all(path.is_file() and not path.is_symlink() and hashlib.sha256(path.read_bytes()).hexdigest()==declared[name] for name,path in actual.items())
        wheels=sorted(source.glob('"'"'bcf_governance-*.whl'"'"'))
        assert len(wheels)==1 and not wheels[0].is_symlink()
        assert hashlib.sha256(wheels[0].read_bytes()).hexdigest()=='"'"'aff4a03802d4578ceabe2422f22c710fa28bb721a06f115eae20c9fa19112d59'"'"'
        venv.EnvBuilder(with_pip=True,clear=True).create(target)
        subprocess.run([str(target/'"'"'bin/python'"'"'),'"'"'-m'"'"','"'"'pip'"'"','"'"'install'"'"','"'"'--no-index'"'"','"'"'--find-links'"'"',str(source),str(wheels[0])],check=True)
        subprocess.run([str(target/'"'"'bin/bcf'"'"'),'"'"'ci-github'"'"','"'"'--help'"'"'],check=True)
        '
    - name: Authenticate provider custody and install offline through the controller
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_BOOTSTRAP_ARTIFACT_ID: '${{ env.BCF_BOOTSTRAP_ARTIFACT_ID }}', BCF_BOOTSTRAP_ARTIFACT_NAME: '${{ env.BCF_BOOTSTRAP_ARTIFACT_NAME }}', BCF_BOOTSTRAP_ARTIFACT_DIGEST: '${{ env.BCF_BOOTSTRAP_ARTIFACT_DIGEST }}', BCF_BOOTSTRAP_RUN_ID: '${{ env.BCF_BOOTSTRAP_RUN_ID }}', BCF_BOOTSTRAP_RUN_ATTEMPT: '${{ env.BCF_BOOTSTRAP_RUN_ATTEMPT }}', BCF_BOOTSTRAP_REPOSITORY_ID: '${{ env.BCF_BOOTSTRAP_REPOSITORY_ID }}', BCF_BOOTSTRAP_COMMIT_SHA: '${{ env.BCF_BOOTSTRAP_COMMIT_SHA }}', BCF_BOOTSTRAP_TREE_SHA: '${{ env.BCF_BOOTSTRAP_TREE_SHA }}', BCF_BOOTSTRAP_WHEEL_SHA256: '${{ env.BCF_BOOTSTRAP_WHEEL_SHA256 }}', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "${{ runner.temp }}/bcf-controller-${{ github.run_id }}-${{ github.run_attempt }}/bin/bcf" ci-github bootstrap --repository "${{ github.repository }}" --artifact-dir "${{ runner.temp }}/bcf-trusted-control-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}" --artifact-id "$BCF_BOOTSTRAP_ARTIFACT_ID" --artifact-name "$BCF_BOOTSTRAP_ARTIFACT_NAME" --provider-digest "$BCF_BOOTSTRAP_ARTIFACT_DIGEST" --producer-run-id "$BCF_BOOTSTRAP_RUN_ID" --producer-run-attempt "$BCF_BOOTSTRAP_RUN_ATTEMPT" --repository-id "$BCF_BOOTSTRAP_REPOSITORY_ID" --commit "$BCF_BOOTSTRAP_COMMIT_SHA" --tree "$BCF_BOOTSTRAP_TREE_SHA" --wheel-sha256 "$BCF_BOOTSTRAP_WHEEL_SHA256" --python "$BCF_PYTHON" --tool-cache "${{ runner.tool_cache }}"
