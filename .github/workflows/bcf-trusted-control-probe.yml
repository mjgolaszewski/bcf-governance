name: bcf/trusted-control-probe
'on':
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  probe:
    name: Verify exact-main controller / ${{ matrix.trusted_runner }}
    if: ${{ github.actor == 'mjgolaszewski' && github.ref == 'refs/heads/main' }}
    permissions: {contents: read}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner, '${{ matrix.trusted_runner }}']
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        trusted_runner: [bcf-trusted-control-1, bcf-trusted-control-2]
    steps:
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Verify the mechanically pinned trusted BCF control
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/probe_trusted_controller.py --policy governance/self-governance-policy.yml --tool-cache "${{ runner.tool_cache }}"
