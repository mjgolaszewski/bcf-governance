name: bcf/trusted-control-probe

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BCF_BOOTSTRAP_ARTIFACT_ID: "9788519181"
  BCF_BOOTSTRAP_ARTIFACT_NAME: bcf-trusted-control-7c30cdca31fa41eb99c5794f9fbbf61b812589f2-1
  BCF_BOOTSTRAP_ARTIFACT_DIGEST: sha256:120dee1f4a433d75eeefb13478c6ab598f06eb8fe1a83b1681bf201e193b184f
  BCF_BOOTSTRAP_RUN_ID: "33476814352"
  BCF_BOOTSTRAP_RUN_ATTEMPT: "1"
  BCF_BOOTSTRAP_COMMIT_SHA: 7c30cdca31fa41eb99c5794f9fbbf61b812589f2
  BCF_BOOTSTRAP_TREE_SHA: cc176961ba75a27598cfa2b9bff9945b7ba4ca76
  BCF_BOOTSTRAP_REPOSITORY_ID: "1207503211"
  BCF_BOOTSTRAP_WHEEL_SHA256: 85ee4b622aa8505a682a4981763177804b5cf2fc988aa70e0690a6f5710806c5

jobs:
  probe:
    name: Verify exact-main controller / ${{ matrix.trusted_runner }}
    if: ${{ github.actor == 'mjgolaszewski' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner, "${{ matrix.trusted_runner }}"]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        trusted_runner: [bcf-trusted-control-1, bcf-trusted-control-2]
    steps:
      - name: Restore the trusted controller interpreter environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify the preinstalled trusted BCF control
        shell: bash
        run: |
          set -euo pipefail
          control_root="${RUNNER_TOOL_CACHE%/}/bcf-governance/$BCF_BOOTSTRAP_COMMIT_SHA"
          test -d "$control_root"
          test ! -L "$control_root"
          test -f "$control_root/INSTALL-METADATA.json"
          test -x "$control_root/bin/bcf"
          grep -F "\"artifact_id\":\"$BCF_BOOTSTRAP_ARTIFACT_ID\"" "$control_root/INSTALL-METADATA.json"
          grep -F "\"wheel_sha256\":\"$BCF_BOOTSTRAP_WHEEL_SHA256\"" "$control_root/INSTALL-METADATA.json"
          "$control_root/bin/bcf" --version
          "$control_root/bin/bcf" ci-github --help
