name: bcf/trusted-release-collector
'on':
  workflow_run:
    workflows: [bcf/release-byte-verifier]
    types: [completed]
permissions: {actions: read, contents: read}
jobs:
  collect:
    name: Recompute authenticated release evidence and emit the sole receipt
    if: ${{ false }}
    permissions: {actions: read, contents: read}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 10
    steps:
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Download only the triggering verifier artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {name: 'bcf-release-verification-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}', github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: '${{ github.event.workflow_run.id }}', path: '${{ runner.temp }}/bcf-release-collection', digest-mismatch: error}
    - name: Recompute provider, Git, dependency, runtime, and asset custody
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "$RUNNER_TOOL_CACHE"/bcf-governance/49272182790342a52ef7ddbcfd6a540ca7df6baf/bin/bcf ci-github release collect --repository "${{ github.repository }}" --bundle "${{ runner.temp }}/bcf-release-collection/build/release-input/certification" --authorization "${{ runner.temp }}/bcf-release-collection/build/release-input/release-authorization.json" --build-manifest "${{ runner.temp }}/bcf-release-collection/build/release-build-manifest.json" --verification "${{ runner.temp }}/bcf-release-collection/verification/release-verification.json" --runtime-report "${{ runner.temp }}/bcf-release-collection/runtime/runtime-verification.json" --runtime-evidence-dir "${{ runner.temp }}/bcf-release-collection/runtime" --release-artifact-dir "${{ runner.temp }}/bcf-release-collection/build/assets" --verification-artifact-name "bcf-release-verification-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}" --output "${{ runner.temp }}/bcf-release-collection/release-receipt.json" --bundle-output "${{ runner.temp }}/bcf-certified-release"
    - name: Upload the sole authoritative release receipt and exact assets
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-release-receipt-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/bcf-certified-release', if-no-files-found: error, retention-days: 90}
