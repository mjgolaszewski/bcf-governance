    - name: Recompute provider, Git, dependency, runtime, and asset custody
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "$RUNNER_TOOL_CACHE"/bcf-governance/af037ecee3a006d6157923a7862eda653f011d54/bin/bcf ci-github release collect --repository "${{ github.repository }}" --bundle "${{ runner.temp }}/bcf-release-collection-${{ github.run_id }}-${{ github.run_attempt }}/build/release-input/certification" --authorization "${{ runner.temp }}/bcf-release-collection-${{ github.run_id }}-${{ github.run_attempt }}/build/release-input/release-authorization.json" --build-manifest "${{ runner.temp }}/bcf-release-collection-${{ github.run_id }}-${{ github.run_attempt }}/build/release-build-manifest.json" --verification "${{ runner.temp }}/bcf-release-collection-${{ github.run_id }}-${{ github.run_attempt }}/verification/release-verification.json" --runtime-report "${{ runner.temp }}/bcf-release-collection-${{ github.run_id }}-${{ github.run_attempt }}/runtime/runtime-verification.json" --runtime-evidence-dir "${{ runner.temp }}/bcf-release-collection-${{ github.run_id }}-${{ github.run_attempt }}/runtime" --release-artifact-dir "${{ runner.temp }}/bcf-release-collection-${{ github.run_id }}-${{ github.run_attempt }}/build/assets" --verification-artifact-name "bcf-release-verification-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}" --output "${{ runner.temp }}/bcf-release-collection-${{ github.run_id }}-${{ github.run_attempt }}/release-receipt.json" --bundle-output "${{ runner.temp }}/bcf-certified-release-${{ github.run_id }}-${{ github.run_attempt }}"
