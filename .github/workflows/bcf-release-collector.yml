name: bcf/trusted-release-collector

on:
  workflow_run:
    workflows: [bcf/release-byte-verifier]
    types: [completed]

permissions: {}

jobs:
  collect:
    name: Collect authenticated release evidence
    if: ${{ false }}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 1
    steps:
      - name: Remain fail-closed until pinned activation
        run: exit 1
