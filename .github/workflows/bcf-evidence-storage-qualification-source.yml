name: bcf/evidence-storage-qualification-source
'on':
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  prepare-evidence-input:
    name: Prepare one bounded content-addressed evidence input
    if: ${{ github.actor == 'mjgolaszewski' && github.ref == 'refs/heads/main' }}
    permissions: {contents: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Install the declared governance environment
      shell: bash
      run: |-
        set -euo pipefail
        "$pythonLocation/bin/python" -m pip install -r requirements-governance.txt
    - name: Prepare one bounded content-addressed evidence input
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" scripts/evidence_storage.py validate --repo-root .
    - name: Prepare content-addressed evidence-storage-qualification-source handoff
      shell: bash
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" scripts/evidence_storage.py prepare --repo-root . --artifact evidence-storage-qualification-source --output ".artifacts/bcf/evidence-storage-qualification/source"
    - name: Upload exact evidence-storage-qualification-source evidence
      if: ${{ success() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-evidence-storage-qualification-source-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/bcf/evidence-storage-qualification/source, if-no-files-found: error, retention-days: 1}
