name: governance-mutants-nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  high-value-mutants:
    name: Exercise nightly high-value governance mutants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install governance dependencies
        run: python -m pip install -r requirements-governance.txt
      - name: Validate selected interpreter and governance before mutants
        run: python scripts/preflight_governance.py --repo-root . --mode release --python "$(command -v python)" --format text
      - name: Run high-value validator mutants
        run: >-
          python .github/scripts/run_validator_mutants.py --profile high-value
          --output .artifacts/scheduled-mutants/high-value.json
      - name: Run high-value governance semantic mutants
        run: >-
          python .github/scripts/run_validator_mutants.py --profile semantic-high-value
          --output .artifacts/scheduled-mutants/semantic-high-value.json
      - name: Retain exact nightly mutant results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bcf-scheduled-mutants-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/scheduled-mutants
          if-no-files-found: error
          retention-days: 90
