name: governance-mutants-nightly
'on':
  workflow_dispatch: {}
  schedule:
  - {cron: 23 3 * * *}
permissions: {contents: read}
jobs:
  high-value-mutants:
    name: Exercise nightly high-value governance mutants
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 0, persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Install the declared governance environment
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m pip install -r requirements-governance.txt
    - name: Validate selected interpreter and governance before mutants
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" scripts/preflight_governance.py --repo-root . --mode release --python "$BCF_PYTHON" --format text
    - name: Run high-value validator mutants
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/run_validator_mutants.py --profile high-value --output .artifacts/scheduled-mutants/nightly-validator.json
    - name: Run high-value governance semantic mutants
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/run_validator_mutants.py --profile semantic-high-value --output .artifacts/scheduled-mutants/nightly-semantic.json
    - name: Retain exact nightly mutant results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-scheduled-mutants-nightly-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/scheduled-mutants, if-no-files-found: error, retention-days: 90}
      if: ${{ always() }}
