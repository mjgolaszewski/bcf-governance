    - name: Authenticate provider custody and install offline through the controller
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: python, BCF_BOOTSTRAP_ARTIFACT_ID: '${{ env.BCF_BOOTSTRAP_ARTIFACT_ID }}', BCF_BOOTSTRAP_ARTIFACT_NAME: '${{ env.BCF_BOOTSTRAP_ARTIFACT_NAME }}', BCF_BOOTSTRAP_ARTIFACT_DIGEST: '${{ env.BCF_BOOTSTRAP_ARTIFACT_DIGEST }}', BCF_BOOTSTRAP_RUN_ID: '${{ env.BCF_BOOTSTRAP_RUN_ID }}', BCF_BOOTSTRAP_RUN_ATTEMPT: '${{ env.BCF_BOOTSTRAP_RUN_ATTEMPT }}', BCF_BOOTSTRAP_REPOSITORY_ID: '${{ env.BCF_BOOTSTRAP_REPOSITORY_ID }}', BCF_BOOTSTRAP_COMMIT_SHA: '${{ env.BCF_BOOTSTRAP_COMMIT_SHA }}', BCF_BOOTSTRAP_TREE_SHA: '${{ env.BCF_BOOTSTRAP_TREE_SHA }}', BCF_BOOTSTRAP_WHEEL_SHA256: '${{ env.BCF_BOOTSTRAP_WHEEL_SHA256 }}', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
