        "$RUNNER_TOOL_CACHE"/bcf-governance/49272182790342a52ef7ddbcfd6a540ca7df6baf/bin/bcf ci-github bootstrap --repository "${{ github.repository }}" --artifact-dir "${{ runner.temp }}/bcf-trusted-control-bootstrap" --artifact-id "$BCF_BOOTSTRAP_ARTIFACT_ID" --artifact-name "$BCF_BOOTSTRAP_ARTIFACT_NAME" --provider-digest "$BCF_BOOTSTRAP_ARTIFACT_DIGEST" --producer-run-id "$BCF_BOOTSTRAP_RUN_ID" --producer-run-attempt "$BCF_BOOTSTRAP_RUN_ATTEMPT" --repository-id "$BCF_BOOTSTRAP_REPOSITORY_ID" --commit "$BCF_BOOTSTRAP_COMMIT_SHA" --tree "$BCF_BOOTSTRAP_TREE_SHA" --wheel-sha256 "$BCF_BOOTSTRAP_WHEEL_SHA256" --python "$BCF_PYTHON" --tool-cache "${{ runner.tool_cache }}"
