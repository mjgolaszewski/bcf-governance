name: bcf/trusted-control-bootstrap

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  BCF_BOOTSTRAP_ARTIFACT_ID: "9773260106"
  BCF_BOOTSTRAP_ARTIFACT_NAME: bcf-trusted-control-1f96e45604c376918154dc50904fc0249d9b8e93-1
  BCF_BOOTSTRAP_ARTIFACT_DIGEST: sha256:03d80a85fbf7367c0b44f37e11be41861f83c9ce8cb8e71133e7406d1820c76b
  BCF_BOOTSTRAP_RUN_ID: "33432625350"
  BCF_BOOTSTRAP_RUN_ATTEMPT: "1"
  BCF_BOOTSTRAP_COMMIT_SHA: 1f96e45604c376918154dc50904fc0249d9b8e93
  BCF_BOOTSTRAP_TREE_SHA: 4261ab720bc69c4d97a6839fe2910f1fd6fc84c1
  BCF_BOOTSTRAP_REPOSITORY_ID: "1207503211"
  BCF_BOOTSTRAP_WHEEL_SHA256: ccabc716a69633c3b55ff34b0dcca434be66fd4b6f3c6ad8b75bcefe542f0002

jobs:
  bootstrap:
    name: Install authenticated controller / ${{ matrix.trusted_runner }}
    if: ${{ github.actor == 'mjgolaszewski' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner, "${{ matrix.trusted_runner }}"]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        trusted_runner: [bcf-trusted-control-1, bcf-trusted-control-2]
    steps:
      - name: Restore the trusted controller interpreter environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Download only the pinned controller artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ env.BCF_BOOTSTRAP_ARTIFACT_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BCF_BOOTSTRAP_RUN_ID }}
          path: ${{ runner.temp }}/bcf-trusted-control-bootstrap
          digest-mismatch: error
      - name: Authenticate provider custody and install offline through the controller
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          control_root="${RUNNER_TOOL_CACHE%/}/bcf-governance/$BCF_BOOTSTRAP_COMMIT_SHA"
          test -d "$control_root"
          test ! -L "$control_root"
          test -x "$control_root/bin/bcf"
          "$control_root/bin/bcf" ci-github bootstrap \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-dir "$RUNNER_TEMP/bcf-trusted-control-bootstrap" \
            --artifact-id "$BCF_BOOTSTRAP_ARTIFACT_ID" \
            --artifact-name "$BCF_BOOTSTRAP_ARTIFACT_NAME" \
            --provider-digest "$BCF_BOOTSTRAP_ARTIFACT_DIGEST" \
            --producer-run-id "$BCF_BOOTSTRAP_RUN_ID" \
            --producer-run-attempt "$BCF_BOOTSTRAP_RUN_ATTEMPT" \
            --repository-id "$BCF_BOOTSTRAP_REPOSITORY_ID" \
            --commit "$BCF_BOOTSTRAP_COMMIT_SHA" \
            --tree "$BCF_BOOTSTRAP_TREE_SHA" \
            --wheel-sha256 "$BCF_BOOTSTRAP_WHEEL_SHA256" \
            --python "$(command -v python)" \
            --tool-cache "$RUNNER_TOOL_CACHE"
