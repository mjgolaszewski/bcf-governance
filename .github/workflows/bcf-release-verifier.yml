name: bcf/release-byte-verifier

on:
  workflow_run:
    workflows: [bcf/release-authority-cutover]
    types: [completed]

permissions: {}

jobs:
  verify:
    name: Verify release bytes on a fresh worker
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Remain fail-closed until pinned activation
        run: exit 1
