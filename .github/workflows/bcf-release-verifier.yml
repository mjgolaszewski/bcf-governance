name: bcf/release-byte-verifier
'on':
  workflow_run:
    workflows: [bcf/release-authority-cutover]
    types: [completed]
permissions: {}
jobs:
  runtime:
    name: Execute token-free offline wheel and sdist verification
    if: ${{ github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    permissions: {actions: read, contents: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Select the closed release interpreter
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: 3.12.14}
    - name: Download the triggering run's trusted authorization and controller
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {name: 'bcf-release-authorization-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}', github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: '${{ github.event.workflow_run.id }}', path: '${{ runner.temp }}/bcf-release-authorization', digest-mismatch: error}
    - name: Install the triggering run's checksum-admitted controller
      shell: bash
      run: |-
        set -euo pipefail
        python -I -c 'import hashlib,json,pathlib,re,subprocess,sys,venv
        source=pathlib.Path('"'"'${{ runner.temp }}/bcf-release-authorization/controller'"'"')
        target=pathlib.Path('"'"'${{ runner.temp }}/bcf-controller'"'"')
        authority=pathlib.Path('"'"'${{ runner.temp }}/bcf-release-authorization/release-authorization.json'"'"')
        assert authority.is_file() and not authority.is_symlink()
        payload=json.loads(authority.read_text())
        keys=['"'"'controller'"'"', '"'"'wheel_sha256'"'"']
        expected=payload
        for key in keys:
         assert isinstance(expected,dict) and key in expected
         expected=expected[key]
        assert isinstance(expected,str) and re.fullmatch(r'"'"'[a-f0-9]{64}'"'"',expected)
        inventory=source/'"'"'SHA256SUMS'"'"'
        assert inventory.is_file() and not inventory.is_symlink()
        declared={}
        for line in inventory.read_text().splitlines():
         digest,separator,name=line.partition('"'"'  '"'"')
         assert separator and len(digest)==64 and name and name not in declared
         declared[name]=digest
        actual={path.name:path for path in source.iterdir() if path.name!='"'"'SHA256SUMS'"'"'}
        assert set(actual)==set(declared)
        assert all(path.is_file() and not path.is_symlink() and hashlib.sha256(path.read_bytes()).hexdigest()==declared[name] for name,path in actual.items())
        wheels=sorted(source.glob('"'"'bcf_governance-*.whl'"'"'))
        assert len(wheels)==1 and not wheels[0].is_symlink()
        assert hashlib.sha256(wheels[0].read_bytes()).hexdigest()==expected
        venv.EnvBuilder(with_pip=True,clear=True).create(target)
        subprocess.run([str(target/'"'"'bin/python'"'"'),'"'"'-m'"'"','"'"'pip'"'"','"'"'install'"'"','"'"'--no-index'"'"','"'"'--find-links'"'"',str(source),str(wheels[0])],check=True)
        subprocess.run([str(target/'"'"'bin/bcf'"'"'),'"'"'ci-github'"'"','"'"'--help'"'"'],check=True)
        '
    - name: Download only the triggering build artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {name: 'bcf-release-build-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.run_attempt }}', github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: '${{ github.event.workflow_run.id }}', path: '${{ runner.temp }}/bcf-release-build', digest-mismatch: error}
    - name: Execute package verification without provider credentials
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '', ACTIONS_ID_TOKEN_REQUEST_TOKEN: '', ACTIONS_RUNTIME_TOKEN: ''}
      run: |-
        set -euo pipefail
        "$RUNNER_TEMP"/bcf-controller/bin/bcf ci-github release runtime --wheelhouse-manifest "${{ runner.temp }}/bcf-release-build/release/wheelhouse-manifest.yml" --lock "${{ runner.temp }}/bcf-release-build/release/requirements-cp312-linux-x86_64.lock" --wheelhouse "${{ runner.temp }}/bcf-release-build/wheelhouse" --release-artifact-dir "${{ runner.temp }}/bcf-release-build/assets" --python "$BCF_PYTHON" --output "${{ runner.temp }}/bcf-release-runtime"
    - name: Upload raw runtime evidence from this attempt
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-release-runtime-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/bcf-release-runtime', if-no-files-found: error, retention-days: 30}
      if: ${{ always() }}
