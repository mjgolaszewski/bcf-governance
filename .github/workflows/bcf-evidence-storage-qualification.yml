name: bcf/evidence-storage-qualification
'on':
  workflow_run:
    workflows: [bcf/evidence-storage-qualification-source]
    types: [completed]
permissions: {contents: read}
jobs:
  publish-evidence-input:
    name: Publish one authenticated immutable evidence input
    permissions: {actions: read, attestations: read, contents: read}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    timeout-minutes: 5
    environment: bcf-trusted-evidence
    steps:
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Mint repository-scoped evidence publication token
      id: evidence-app-token
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
      with: {app-id: '${{ vars.BCF_EVIDENCE_APP_ID }}', private-key: '${{ secrets.BCF_EVIDENCE_APP_PRIVATE_KEY }}', permission-contents: write}
    - name: Publish one authenticated immutable evidence input
      shell: bash
      env: {GITHUB_TOKEN: '${{ github.token }}', BCF_EVIDENCE_WRITE_TOKEN: '${{ steps.evidence-app-token.outputs.token }}'}
      run: |-
        set -euo pipefail
        test -d "$RUNNER_TOOL_CACHE"/bcf-governance/dc07e3352082498db413ba2540dd94f69ce095ef
        test ! -L "$RUNNER_TOOL_CACHE"/bcf-governance/dc07e3352082498db413ba2540dd94f69ce095ef
        test -x "$RUNNER_TOOL_CACHE"/bcf-governance/dc07e3352082498db413ba2540dd94f69ce095ef/bin/bcf
        "$RUNNER_TOOL_CACHE"/bcf-governance/dc07e3352082498db413ba2540dd94f69ce095ef/bin/bcf evidence-store publish-github --repository "$GITHUB_REPOSITORY" --run-id "${{ github.event.workflow_run.id }}" --run-attempt "${{ github.event.workflow_run.run_attempt }}" --artifact-name "bcf-evidence-storage-qualification-source-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}" --output "${{ runner.temp }}/bcf-evidence-storage-qualification-reference-${{ github.run_id }}-${{ github.run_attempt }}/evidence-input-reference.json"
    - name: Upload exact evidence-storage-qualification-reference evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-evidence-storage-qualification-reference-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/bcf-evidence-storage-qualification-reference-${{ github.run_id }}-${{ github.run_attempt }}', if-no-files-found: error, retention-days: 30}
  reconstruct-evidence-input:
    name: Cold-reconstruct and verify the authenticated evidence input
    needs: [publish-evidence-input]
    permissions: {actions: read, attestations: read, contents: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env: {BCF_EVIDENCE_INPUT_BINDINGS: .artifacts/bcf/evidence-storage-qualification/reference/evidence-input-reference.json|.artifacts/bcf/evidence-storage-qualification/resolved}
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {persist-credentials: false, ref: '${{ github.event.workflow_run.head_sha }}'}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Install the declared governance environment
      shell: bash
      run: |-
        set -euo pipefail
        "$pythonLocation/bin/python" -m pip install -r requirements-governance.txt
    - name: Download exact evidence-storage-qualification-reference evidence
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {name: 'bcf-evidence-storage-qualification-reference-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/bcf/evidence-storage-qualification/reference}
    - name: Resolve authenticated evidence-storage-qualification-reference inputs
      shell: bash
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', GITHUB_TOKEN: '${{ github.token }}'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" scripts/evidence_storage.py resolve-github --repo-root . --reference ".artifacts/bcf/evidence-storage-qualification/reference/evidence-input-reference.json" --output ".artifacts/bcf/evidence-storage-qualification/resolved"
    - name: Cold-reconstruct and verify the authenticated evidence input
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" scripts/evidence_storage.py validate --repo-root .
