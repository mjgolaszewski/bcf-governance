        "$BCF_PYTHON" .github/scripts/break_glass_recovery.py install --repo-root . --repository "${{ github.repository }}" --operation-id "${{ inputs.operation_id }}" --reason-code "${{ inputs.reason_code }}" --artifact-root "${{ runner.temp }}/bcf-break-glass-build" --slot "${{ matrix.trusted_runner }}" --output "${{ runner.temp }}/bcf-break-glass-install/receipt.json"
    - name: Upload the installation-stage marker
