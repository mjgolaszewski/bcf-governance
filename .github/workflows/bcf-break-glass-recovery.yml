name: bcf/break-glass-recovery
'on':
  workflow_dispatch:
    inputs:
      stage:
        description: Explicit recovery stage
        required: true
        default: build
        type: choice
        options: [build, install, probe]
      operation_id: {description: Exact 32-character lowercase hexadecimal operation nonce, required: true, default: replace-with-32-lowercase-hex, type: string}
      reason_code:
        description: Bounded incident reason
        required: true
        default: ordinary_control_plane_bootstrap_deadlock
        type: choice
        options: [ordinary_control_plane_bootstrap_deadlock]
permissions: {actions: read, contents: read}
jobs:
  build:
    name: Build exact-main recovery controller
    if: ${{ github.ref == 'refs/heads/main' && inputs.stage == 'build' }}
    permissions: {actions: read, contents: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: bcf-break-glass-recovery
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Install the declared governance environment
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m pip install -r requirements-governance.txt
    - name: Mint the repository-scoped break-glass App token
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
      with: {app-id: '${{ vars.BCF_BREAK_GLASS_APP_ID }}', private-key: '${{ secrets.BCF_BREAK_GLASS_APP_PRIVATE_KEY }}', owner: '${{ github.repository_owner }}', repositories: '${{ github.event.repository.name }}', permission-actions: read, permission-contents: read}
      id: recovery-app-token
    - name: Authenticate owner and exact current main
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_BREAK_GLASS_APP_TOKEN: '${{ steps.recovery-app-token.outputs.token }}', BCF_BREAK_GLASS_APP_ID: '${{ vars.BCF_BREAK_GLASS_APP_ID }}', BCF_BREAK_GLASS_INSTALLATION_ID: '${{ vars.BCF_BREAK_GLASS_INSTALLATION_ID }}', BCF_BREAK_GLASS_WORKFLOW_ID: '${{ vars.BCF_BREAK_GLASS_WORKFLOW_ID }}'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/break_glass_recovery.py authorize-build --repo-root . --repository "${{ github.repository }}" --operation-id "${{ inputs.operation_id }}" --reason-code "${{ inputs.reason_code }}" --output .artifacts/break-glass-build/recovery-authorization.json
    - name: Build the canonical recovery-only controller bundle
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/build_trusted_controller.py --output .artifacts/break-glass-build/controller --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}"
    - name: Bind recovery authorization to exact controller bytes
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/break_glass_recovery.py bind-build --repo-root . --artifact-root .artifacts/break-glass-build --authorization .artifacts/break-glass-build/recovery-authorization.json
    - name: Upload the uniquely derived recovery controller
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-break-glass-recovery-build-${{ inputs.operation_id }}', path: .artifacts/break-glass-build, if-no-files-found: error, retention-days: 90}
  install:
    name: Install recovered controller / ${{ matrix.trusted_runner }}
    if: ${{ github.ref == 'refs/heads/main' && inputs.stage == 'install' }}
    permissions: {actions: read, contents: read}
    runs-on: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner, '${{ matrix.trusted_runner }}']
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
