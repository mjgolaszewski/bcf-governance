      run: |-
        set -euo pipefail
        "$BCF_PYTHON" .github/scripts/break_glass_recovery.py resolve-build --repo-root . --repository "${{ github.repository }}" --operation-id "${{ inputs.operation_id }}" --reason-code "${{ inputs.reason_code }}" --stage "${{ inputs.stage }}"
      id: resolve-build
    - name: Download only the provider-resolved recovery build
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {artifact-ids: '${{ steps.resolve-build.outputs.artifact_id }}', github-token: '${{ steps.recovery-app-token.outputs.token }}', repository: '${{ github.repository }}', run-id: '${{ steps.resolve-build.outputs.build_run_id }}', path: '${{ runner.temp }}/bcf-break-glass-build', digest-mismatch: error}
    - name: Authenticate and install on the exact trusted runner
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_BREAK_GLASS_APP_TOKEN: '${{ steps.recovery-app-token.outputs.token }}', BCF_BREAK_GLASS_APP_ID: '${{ vars.BCF_BREAK_GLASS_APP_ID }}', BCF_BREAK_GLASS_INSTALLATION_ID: '${{ vars.BCF_BREAK_GLASS_INSTALLATION_ID }}', BCF_BREAK_GLASS_WORKFLOW_ID: '${{ vars.BCF_BREAK_GLASS_WORKFLOW_ID }}', RUNNER_NAME: '${{ runner.name }}'}
      run: |-
