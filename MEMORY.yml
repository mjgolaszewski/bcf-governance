regression_shield:
  purpose: keep this file as durable project memory, not as an execution transcript
  invariants:
    - store stable decisions, constraints, environment facts, reusable commands, and references
    - keep workitem execution evidence in phases/*.yml
    - update high-signal entries instead of duplicating them
    - never record secrets or local environment values here
stable_decisions:
  canonical_repo_root: "."
  canonical_governance_guide: AGENTS.yml
  canonical_product_spec: plans/product-spec.yml
  canonical_build_plan: plans/build-plan.yml
  canonical_active_phase_ledger: plans/phase-ledger.yml
  canonical_phase_history: plans/phase-history.yml
  canonical_phase_log_root: phases/
  code_roots:
    backend: bcf_governance
    frontend: docs
  delivery_architecture:
    backend: "python_package_with_private_portable_runtime"
    frontend: "canonical_operator_and_maintainer_guides"
    data: "yaml_json_contracts_and_content_addressed_evidence"
    observability: governed_reference_contracts
  governance_process:
    semantic_validator: scripts/validate_governance_yaml.py
    structural_schema_root: schemas/
    hotfix_lane: governed_and_machine_readable
    artifact_ownership: canonical_owner_map_recorded_in_AGENTS
    phase_rollover: phase_ledger_and_MEMORY_must_move_together
    build_artifact_convention: follow_local_template_pack_shapes_and_naming
memory_retention_policy:
  stable_decisions:
    review_frequency: per_phase_rollover
  environment_facts:
    revalidate_after_days: 7
  reusable_commands:
    validate_on_release_gate: true
  stale_entry_handling:
    - mark_deprecated_before_removal
    - preserve_replacement_reference_when_available
environment_facts:
  current_repo_state:
    - BCF 0.6.1 standard self-governance adopted on 2026-08-14
    - all governance, memory, specs, plans, workitem ledgers, and phase logs are YAML-native
    - observability contracts are scaffolded under contracts/observability/v1/
    - structural anti-drift gates are scaffolded for module size, layer ownership, bounded-context ownership, CQRS side rules, router thinness, and duplication
    - P05 adds an optional lock-verified TypeScript adapter and cross-language traces; exact Identity main proves 62 representations and 220 required browser traces with zero unresolved or uncovered flow
    - BCF has two owner-controlled local CI runners on the bcf-governance and vm-linux-ci-runner labels plus one excluded Dependabot runner
    - main is protected by active repository ruleset 21862678 requiring pull requests, current governance-truthfulness, pack-checks, ast-checks, resolved conversations, and no force push or deletion
    - the local implementation host provides Docker but no disposable VM hypervisor or clone manager
    - evidence execution uses the explicitly selected Python and propagates its lexical executable directory and required loader environment into detached positive and negative-control worktrees
    - P03's canonical preflight runs before evidence; exact contract-owned pytest manifests and run-attempt-specific, disjoint artifact namespaces prevent stale fan-in while profile-v2 truth independently verifies immutable session bindings
    - P01-HF01 merged as main commit a0faa8dc5948e3f9cbac9ef0fbddb9e3357f76a3 and exact-main runs 33321545239 and 33321545295 passed entirely on the local pool
  active_artifacts:
    spec: plans/product-spec.yml
    build_plan: plans/build-plan.yml
    active_phase_ledger: plans/phase-ledger.yml
    phase_history: plans/phase-history.yml
    active_phase_plan: plans/phase-05-plan.yml
    active_workitem_ledger: plans/phase-05-workitems.yml
    active_phase_log: phases/phase-05-log.yml
known_constraints:
  - schema-2 evidence must be recaptured after every governed tree mutation
  - template runtime and packaged template copies must remain byte-identical to canonical sources
  - receipt invocation remains canonical while selected-interpreter identity is recorded as hashed environment metadata
  - release tags are created only at a merge commit whose source and governance CI passed
  - through 2026-08-31 an owner-only same-repository PR may use the two persistent local VM runners while privileged release publication remains disabled
  - restore fresh disposable one-job candidate runners before admitting any non-owner code or re-enabling release publication
  - the persistent trusted VM may collect provider state and publish but may never check out or execute candidate code
  - P10 owns trusted and disposable runner substrate activation; its isolation acceptance must pass before remote candidate execution or release publication
  - release execution and publication remain disabled until disposable candidate execution and isolated trusted publication are available
  - hosted Actions credits are unavailable through 2026-08-31, so release-train dogfood stays local; P05 uses available Python 3.14.5 because 3.14.7 is absent and P10 must repeat the benchmark on its digest-pinned disposable image
  - every BCF behavior commit updates and validates BCF's own applicable governance contracts before successor work begins
  - cleanup revalidates exact Docker IDs/run labels before scoped deletion; retention-removable phase artifacts are consumed only through phase-history plus exact Git commit/hash custody, never live fixture paths
reusable_commands:
  - .venv/bin/python scripts/validate_governance_yaml.py --repo-root .
  - .venv/bin/python -m pytest tests
