    active_phase_ledger: plans/phase-ledger.yml
    phase_history: plans/phase-history.yml
    active_phase_plan: plans/phase-11-plan.yml
    active_workitem_ledger: plans/phase-11-workitems.yml
    active_phase_log: phases/phase-11-log.yml
known_constraints:
  - schema-2 evidence must be recaptured after every governed tree mutation
  - template runtime and packaged template copies must remain byte-identical to canonical sources
  - receipt invocation remains canonical while selected-interpreter identity is recorded as hashed environment metadata
  - release tags are created only at a merge commit whose source and governance CI passed
  - standard hosted runners are free and unlimited while the repository remains public; larger-runner and artifact-storage costs remain separate
  - the persistent trusted VM may collect provider state and publish but may never check out or execute candidate code
  - "P10 exact-main authority is live: P10-HF14 merged as ef8e8ee1d9eda4da77eafdb99a8846ccf2e84cd2, admission run 33359863185 and producer runs 33359863183/33359863142 were reconstructed by finalizer 33360174498, and publisher 33360197707 wrote the successful bcf/exact-main-certification status; controller artifact 9744774824 remains installed on both trusted runners"
  - P11 release build execution is owner-dispatched only after a trusted no-checkout job mechanically authenticates the latest exact-main finalizer; publication remains disabled until P12
  - hosted jobs run to completion without polling, sleeping, idle waiters, or route fallback
  - every BCF behavior commit updates and validates BCF's own applicable governance contracts before successor work begins
  - profile_contract_version absence means 1.0; normal upgrades preserve the installed profile and contract version, and v2 promotion is explicit and monotonic
  - profile promotion never rewrites installed workflows; GitHub workflow adoption remains a separate explicit transaction
  - fresh Lite installations default to v1 while fresh Standard and Regulated installations default to v2
  - expired evidence sessions are pruned only from the ignored fixed session root under declared retention with immediate identity revalidation
  - BCF Standard-v2 evidence preserves its four mechanically derived hosted shards while binding every receipt to one preflight session and exact run attempt
  - TypeScript source analysis and external producer acquisition use typed N/A until their tracked-path triggers make them applicable
  - normalized CI certification is an input to truth and cannot claim certified; only independently verified truth may emit the final output-only release receipt
  - cleanup revalidates exact Docker IDs/run labels before scoped deletion; retention-removable phase artifacts are consumed only through phase-history plus exact Git commit/hash custody, never live fixture paths
reusable_commands:
  - .venv/bin/python scripts/validate_governance_yaml.py --repo-root .
  - .venv/bin/python -m pytest tests
  - bcf profile promote --repo-root . --to standard --contract-version 2.0 --check
  - bcf ci-cleanup --repo-root . --prune-evidence-sessions
