hotfix:
  id: P28-HF12
  mode: full
  related_phase_id: P28
  hotfix_number: 12
  summary: Make adopter release upgrades and selective local execution mechanically
    complete
execution_evidence:
  planned_commands:
  - bcf ci submit --repo-root . --intent closure
  executed_commands:
  - focused installer, upgrade, custody, doctor, profile, reconciliation, pack,
    and historical 2.1.3 upgrade regressions
  - independent Lite v1 and Standard v3 pre-gate adopter probes against exact
    clean-source candidates
  notes:
  - v2.1.4 could replace pack-owned runtime but had no canonical producer for the
    authenticated adopter runtime lock, so every release-bound upgrade either
    retained stale custody or required hand-authored state.
  - The release-check surface also bypassed the selective session plan by
    iterating configured gates; preflight-satisfied claims were therefore
    incorrectly requested from an evidence session that intentionally omitted them.
  - The bounded repair gives the existing installer sole atomic ownership of
    release authentication, runtime projection, and derived custody, and gives
    the existing shard executor one all-planned local mode. No new ceremony or
    alternate authority lane is introduced.
  - The Standard-v3 adopter probe exposed a stale doctor diagnostic that accepted
    only direct gate execution. Doctor now derives the evidence-capture contract
    from the installed profile version, accepts canonical all-planned delegation,
    and rejects shard execution that ignores the selective session plan.
  - The Racecar probe exposed that Doctor and install guidance selected a preserved
    consumer Makefile after upgrade. BCF now resolves the generated fragment as
    the canonical release owner and reports its directly executable command, so
    merged legacy aliases remain byte-preserved and require no manual forward-port.
  - Lite-v1 release execution invokes canonical truth directly from the generated
    fragment, preventing recursive make from falling back to a consumer Makefile.
