summary:
  outcome: completed
  highlights:
  - P08 is opened for ship the GitHub reference topology, adopter, runtime adapter,
    and local PR parity
  - phase artifacts were scaffolded from the governance template
  - added provider-authenticated GitHub repository workflow path event run attempt commit tree and trusted workflow-byte identity without run-name or display-title authority
  - added an explicit transactional GitHub adopter that owns only a closed workflow/config path set, preserves unrelated workflows byte-for-byte, and fails before mutation on conflicts or symlinks
  - defined disjoint disposable read-only candidate and no-checkout trusted roles, closed callback events, provider-state reconstruction, and a mechanical prohibition on polling sleeping and idle waiters
  - added a canonical local PR helper that fetches the remote default branch, proves ancestry, supplies exact base/head and pull-request event context, and catches PR-only changelog failure locally
  - added fail-fast runtime capacity, repository-owned database bind-root, scoped cleanup, and digest-bound trusted external-input contracts
  - self-adopted GitHub run, local PR, runtime capacity, and trusted-input semantic owners while leaving current BCF workflow activation explicitly deferred to P10
