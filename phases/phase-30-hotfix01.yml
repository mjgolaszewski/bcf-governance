  notes:
  - Immutable v2.2.0 publication preceded exact-asset adopter qualification, so the
    release is published without custody and cannot activate P31.
  - The canonical qualification transaction now derives lifecycle intent, exact
    subjects, adopter/profile inventory, and the sole repository-dispatch continuation;
    trusted publication independently rejects missing, stale, incomplete, or changed
    qualification observations.
  - v2.2.1 supersedes the noncustodied v2.2.0 bytes and must complete the corrected
    prepublication qualification edge before immutable publication.
  - The exact-asset qualifier keeps the immutable BCF release subject in a distinct
    namespace from every adopter source/candidate identity; iteration order cannot
    substitute an adopter commit or tree into the release receipt subject.
  - Trusted release authorization observed 4:35 on a successful run and terminated
    at the former 5:00 ceiling; the governed job window is 10 minutes so provider
    latency cannot cancel an otherwise unchanged fail-closed authorization at its
    demonstrated boundary.
  - Exact-wheel adopter qualification no longer assumes a child virtual environment
    inherits the invoking environment's admitted dependencies. It projects the
    immutable wheel into a fresh import root, authenticates its distribution and
    module origins, validates every active runtime requirement, and derives one
    offline qualification command before any adopter clone is mutated.
