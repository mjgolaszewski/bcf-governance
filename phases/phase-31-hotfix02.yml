  - the same closeout candidate exposed that negative-control semantic failures
    could be masked by the matrix freshness meta-check; intrinsic mutation
    diagnostics now retain precedence while ordinary changed CI contracts still
    require same-candidate matrix coverage
  - hotfix scaffolding now idempotently projects its phase-ledger registration
    from the same invocation and cannot leave registration as an agent-remembered
