  notes:
  - immutable v2.3.0 adopter qualification exposed that a checkout without
    .venv selected the private BCF controller interpreter as project Python;
    pip-audit therefore observed bcf-governance itself instead of only the
    adopter dependency closure
  - the matrix-first correction rejects explicit controller/project identity,
