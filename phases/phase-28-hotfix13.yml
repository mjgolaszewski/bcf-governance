  summary: Make adopter workflow-authority reconciliation atomic and mechanically
    committed
execution_evidence:
  planned_commands:
  - focused reconcile authority state matrix and exact Racecar upgrade fixture
  executed_commands:
  - closed workflow-authority transition state matrix
  - exact retained Racecar v2.1.5 upgraded-tree reconciliation replay
  notes:
  - v2.1.5 could authenticate and install exact release bytes, but canonical
    reconciliation rendered the adopter's lifecycle-derived workflow projection
    before discovering that authority can pin only bytes already present in an
    immutable definition commit. The failed operation left a partial projection.
  - The correction makes the existing reconciler own one isolated transition.
    It accepts only committed or exactly canonical interrupted workflow bytes,
    creates the definition and authority commits mechanically, verifies the
    final fixed point, and advances the candidate only after the shadow succeeds.
  - Detached candidates and safe non-default branches preserve their identity;
    default-branch mutation, unexplained workflow drift, unowned untracked files,
    missing Git identity, pin failure, and non-convergence fail before promotion.
  - Isolated proof and rollback repositories receive the already-validated
    candidate Git identity explicitly for mechanical commits; they never depend
    on ambient runner configuration. Version-sensitive Doctor assertions derive
    the executing package version instead of retaining patch-release literals.
  - Racecar pre-gate and post-gate qualification remain required for the exact
    release_22 candidate.
