- {"phase_id":"P01","build_block":"self-governance-0.6.1","release_train":"release_1","retention_source":"git_history","retention_ref":"f4b314be03a7d4c3a85110b31c93e828e6484fe7","status":"completed","outcome":"completed","summary":["BCF 0.6.1 standard governance now governs the framework repository itself","README.md, LICENSE, and CHANGELOG.md are required repository artifacts with executable contracts","pull requests must update CHANGELOG.md relative to their exact base commit","governance documentation was consolidated around one maintainer guide and one operator guide","clean wheel and sdist verification passed, including the complete bundled test suite"],"validation":["pytest tests","python .github/scripts/run_validator_mutants.py --profile full","python .github/scripts/run_validator_mutants.py --profile semantic-full","python scripts/validate_governance_yaml.py --repo-root .","python scripts/check_governance_exposure.py --repo-root .","python -m build --outdir dist/0.6.1","python .github/scripts/test_release_artifacts.py --dist-dir dist/0.6.1","python -m twine check dist/0.6.1/*"],"archived_artifacts":[{"path":"plans/phase-01-plan.yml","sha256":"f296ec0c6856fc2b70beebcd549fdc3e88961dd9d4cd416756f6c26a23c7e2f3","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"},{"path":"plans/phase-01-workitems.yml","sha256":"6ce6662b8cf4631fe583d3c1e151fd65628b47c107819d6035f8a0f3ec9eeccf","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"},{"path":"phases/phase-01-log.yml","sha256":"fe3b976031417fcf75d4950c24ddf9aae22c1a9b64ea9bbb68f5eb3225248938","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"},{"path":"phases/phase-01-hotfix01.yml","sha256":"641de1cc2e6d8486bad9d6b43105716d45f00d172949afd4c6ab98655405569e","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"}]}
- {"phase_id":"P02","build_block":"bcf-0.7-program-and-runner-cutover","release_train":"release_2","retention_source":"git_history","retention_ref":"f4b314be03a7d4c3a85110b31c93e828e6484fe7","status":"completed","outcome":"completed_with_deferred_activation","summary":["P02 is opened for freeze the BCF 0.7 release train and cut workflows onto the trusted and disposable runner substrate","phase artifacts were scaffolded from the governance template","the applicability and deliberate-exclusion matrix is recorded in audits/bcf-0.7-upstream-applicability.yml","all existing jobs are classified as candidate or trusted and every GitHub-hosted runner label was removed","fork pull requests are rejected before candidate runner assignment and the privileged release publisher has no checkout or repository-script execution","completed P01-HF01 temporarily admits only owner-authored same-repository PRs to the persistent local pool and keeps release execution and publication disabled","completed P01-HF01 also repaired selected-interpreter propagation after the first local-pool PR run exposed a toolcache loader failure inside detached evidence worktrees","the P02 branch is based directly on certified main commit a0faa8dc5948e3f9cbac9ef0fbddb9e3357f76a3 after P01-HF01 merged","the owner authorized autonomous reviews and a governed rollover to local P03 implementation while hosted Actions remain unavailable through 2026-08-31","disposable candidate and isolated trusted substrate activation is transferred to P10; remote candidate execution and publication remain fail-closed until its acceptance proof passes"],"validation":[".venv/bin/python scripts/validate_governance_yaml.py --repo-root .",".venv/bin/python -m pytest -q tests/test_self_governance_contracts.py",".venv/bin/python -m pytest tests -q"],"archived_artifacts":[{"path":"plans/phase-02-plan.yml","sha256":"a3dc7d9acd3f733b9af04a8f6cda6db6a1d7d6c06519a02af64b09e36c313ce4","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"}