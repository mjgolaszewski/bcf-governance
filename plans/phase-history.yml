- {"phase_id":"P04","build_block":"python-soip","release_train":"release_2","retention_source":"git_history","retention_ref":"f4b314be03a7d4c3a85110b31c93e828e6484fe7","status":"completed","outcome":"completed","summary":["P04 is opened for generalize and self-adopt Python SOIP","phase artifacts were scaffolded from the governance template","P04 activated after P03 completed with 229 passing tests and a clean-HEAD canonical preflight","generalized the MIT-licensed source-first Python inventory, strict semantic registry, evaluator, compact report, and CLI without importing Identity-specific paths or types","self-adopted three BCF semantic families through the same schema, runtime, gate contract, and cause-verified owner mutation packaged for consumers","Standard mode blocks every declared family while Regulated repository-wide mode mechanically rejects any discovered authoritative type lacking a registry entry"],"validation":[".venv/bin/python scripts/validate_governance_yaml.py --repo-root .",".venv/bin/python -m pytest -q tests",".venv/bin/python .github/scripts/run_self_governance_gate.py semantic-ownership"],"archived_artifacts":[{"path":"plans/phase-04-plan.yml","sha256":"f7c82eb7695d8d1caf25293ab7f041cb0f91509b0d00e2b29e3263e606f0d1d4","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"},{"path":"plans/phase-04-workitems.yml","sha256":"2140d10e1385b0df0be6196aa1c8f1f5ef3dc60880f0e9650204727b205ffb53","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"},{"path":"phases/phase-04-log.yml","sha256":"d9f7babe87fac633d948e8b0df6eaf9ef44d7a5f338bce7b137fe62455ee1b53","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"}]}
- {"phase_id":"P05","build_block":"typescript-soip-and-identity-proof","release_train":"release_2","retention_source":"git_history","retention_ref":"f4b314be03a7d4c3a85110b31c93e828e6484fe7","status":"completed","outcome":"completed","summary":["P05 is opened for add optional TypeScript tracing and prove the exact Identity tree","phase artifacts were scaffolded from the governance template","P05 activated after P04 passed 239 tests, exact clean-commit preflight, and the generalized engine's own cause-verified gate","extracted the TypeScript Compiler API analyzer under MIT with declared tsconfig, exact lock/install parity, tracked source, and no network or Docker fallback","added generalized FastAPI-to-browser contract, transport, and decoder traces plus a compact exact-consumer proof and benchmark harness","exact Identity commit 0569e6dd81b311abf33af5626a32441b0d55cc64 reproduced 62 conformant representations, 221 endpoint traces, 220 required browser traces, zero uncovered required traces, and zero unresolved escapes"],"validation":[".venv/bin/python -m pytest tests -q",".venv/bin/python .github/scripts/run_validator_mutants.py --profile high-value",".venv/bin/python .github/scripts/run_validator_mutants.py --profile semantic-high-value",".venv/bin/python scripts/validate_governance_yaml.py --repo-root ."],"archived_artifacts":[{"path":"plans/phase-05-plan.yml","sha256":"7bf17b802db5aff770a5d3caafaf7f16fd150373accfbe6395a5695fe6a5691f","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"},{"path":"plans/phase-05-workitems.yml","sha256":"83709135dd586fc2ec552e8dd72c938a0628bf4e59d5e4fd32e5efcdb06a6f4b","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"},{"path":"phases/phase-05-log.yml","sha256":"79a78ee22b697d43b3c1b9d2d742360882fa2f102b50a8ac5af015162bb37c11","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"}]}
- {"phase_id":"P06","build_block":"ci-authority-contracts","release_train":"release_2","retention_source":"git_history","retention_ref":"f4b314be03a7d4c3a85110b31c93e828e6484fe7","status":"completed","outcome":"completed","summary":["P06 is opened for add provider-neutral CI identity, admission, state, and typed N/A contracts","phase artifacts were scaffolded from the governance template","added provider-neutral authority, certification, and typed N/A schemas without changing profile-v1 receipt or gate contracts","implemented a pure total-order state machine that authenticates workflow identity before ordinal precedence and binds exact producer, job, matrix, attempt, commit, and tree identity","kept normalized certification acyclic by prohibiting a certification input from claiming the final certified state; existing truth remains the owner that may emit a release receipt","self-adopted the CI authority state as a mechanically governed semantic family with a cause-verified negative control"],"validation":["python -m pytest tests","python scripts/validate_governance_yaml.py --repo-root .","python .github/scripts/run_self_governance_gate.py architecture-module-size","python .github/scripts/run_self_governance_gate.py lint","python .github/scripts/run_self_governance_gate.py typecheck","python .github/scripts/run_self_governance_gate.py semantic-ownership"],"archived_artifacts":[{"path":"plans/phase-06-plan.yml","sha256":"cf3ca7b63534851b1b7d52867b7c4d41f3191a3e72911890ef962836e89680da","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"},{"path":"plans/phase-06-workitems.yml","sha256":"50210ed777aa89ddd6d4af8f2802159f9b7cc240712b4d99dc2970f7e337afdd","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"},{"path":"phases/phase-06-log.yml","sha256":"a315bb34c771a3f89f5a64d70b853e9025dab061be6da764195ef6b69ed280bb","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"}]}
- {"phase_id":"P07","build_block":"ci-truth-and-revocation","release_train":"release_2","retention_source":"git_history","retention_ref":"f4b314be03a7d4c3a85110b31c93e828e6484fe7","status":"completed","outcome":"completed","summary":["P07 is opened for integrate authenticated certification, acyclic receipts, revocation, cancellation, and status authority","phase artifacts were scaffolded from the governance template","added authenticated provider snapshot contracts and deterministic normalization across exact repository, workflow, event, run, attempt, admission, commit, tree, producer, job, and matrix identity","integrated independent CI certification recomputation into truth so later admitted failure revokes earlier success and moved default-main identity becomes obsolete","added authenticated exact-attempt cancellation and status decisions that reject candidate or nontrusted authority and prevent older completion from overwriting newer state","made the final schema-2 release receipt an output-only artifact written after truth succeeds, outside the input evidence directory, with exact hashes for truth, certification, session, evidence bundle, admission, and release artifacts","self-adopted certification, cancellation, status, and release-receipt semantic owners and added cause-verified controls for workflow event identity, raw-snapshot integrity, independent recomputation, authority boundaries, precedence, acyclic construction, and certified-state enforcement"],"validation":["python -m pytest -q tests","python -m bcf_governance.cli preflight --mode release --repo-root .","python scripts/governance_evidence.py --repo-root . run --gate contract-test --output .artifacts/bcf/p07-contract-controls --python python # non-authoritative local artifact","python scripts/governance_evidence.py --repo-root . run --gate semantic-ownership --output .artifacts/bcf/p07-semantic-controls --python python # non-authoritative local artifact"],"archived_artifacts":[{"path":"plans/phase-07-plan.yml","sha256":"94c90075005da5322eef0707fd4d1a7721f382520410b9f47c796a11b9ce80f2","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"},{"path":"plans/phase-07-workitems.yml","sha256":"0c89c9de4e65441188e0a3243600e77ebef01a54d844def4f4a16e6829bbf95e","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"},{"path":"phases/phase-07-log.yml","sha256":"466e3e35ec3d1bcb603754054aa2ca1fe6095419d45b5f399167843405fba2b2","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"}]}
- {"phase_id":"P08","build_block":"github-adopter-runtime-pr-parity","release_train":"release_2","retention_source":"git_history","retention_ref":"f4b314be03a7d4c3a85110b31c93e828e6484fe7","status":"completed","outcome":"completed","summary":["P08 is opened for ship the GitHub reference topology, adopter, runtime adapter, and local PR parity","phase artifacts were scaffolded from the governance template","added provider-authenticated GitHub repository workflow path event run attempt commit tree and trusted workflow-byte identity without run-name or display-title authority","added an explicit transactional GitHub adopter that owns only a closed workflow/config path set, preserves unrelated workflows byte-for-byte, and fails before mutation on conflicts or symlinks","defined disjoint disposable read-only candidate and no-checkout trusted roles, closed callback events, provider-state reconstruction, and a mechanical prohibition on polling sleeping and idle waiters","added a canonical local PR helper that fetches the remote default branch, proves ancestry, supplies exact base/head and pull-request event context, and catches PR-only changelog failure locally","added fail-fast runtime capacity, repository-owned database bind-root, scoped cleanup, and digest-bound trusted external-input contracts","self-adopted GitHub run, local PR, runtime capacity, and trusted-input semantic owners while leaving current BCF workflow activation explicitly deferred to P10"],"validation":["python -m pytest -q tests","python scripts/validate_governance_yaml.py --repo-root .","python -m bcf_governance.cli preflight --repo-root . --mode release --python python","python scripts/governance_evidence.py --repo-root . run --gate contract-test --output .artifacts/bcf/p08-contract-controls --python python # non-authoritative local artifact","python scripts/governance_evidence.py --repo-root . run --gate semantic-ownership --output .artifacts/bcf/p08-semantic-controls --python python # non-authoritative local artifact"],"archived_artifacts":[{"path":"plans/phase-08-plan.yml","sha256":"fd7125299dc137a72dd8f24a5214836cb01ca312d83c3e0b73ab98b788332bd3","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"},{"path":"plans/phase-08-workitems.yml","sha256":"e943b63a1e2466b9c09af7912f2c9a805ee905ba935d48249323845bed94461a","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"},{"path":"phases/phase-08-log.yml","sha256":"fa54d9d7558ffa11ba7f045860f21cc7aa1fb9e476cc242e68913b960d3faec1","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"}]}
- {"phase_id":"P09","build_block":"profile-v2-integration","release_train":"release_2","retention_source":"git_history","retention_ref":"f4b314be03a7d4c3a85110b31c93e828e6484fe7","status":"completed","outcome":"completed","summary":["profile-contract v1 remains the compatibility default when the version is absent","fresh Standard and Regulated installs generate v2 SOIP and one-session evidence surfaces while Lite remains v1","normal upgrades and explicit profile promotion preserve existing workflow bytes","typed N/A readiness, doctor diagnostics, and exact retention-bound session cleanup are integrated through the portable pack"],"validation":[".venv/bin/bcf test-manifest update --repo-root . --gate test --python .venv/bin/python",".venv/bin/python -m pytest -q tests",".venv/bin/python scripts/validate_governance_yaml.py --repo-root .",".venv/bin/python scripts/check_governance_exposure.py --repo-root .",".venv/bin/python .github/scripts/run_self_governance_gate.py lint",".venv/bin/python .github/scripts/run_self_governance_gate.py typecheck",".venv/bin/python .github/scripts/run_self_governance_gate.py architecture-test",".venv/bin/python .github/scripts/run_self_governance_gate.py contract-test"],"archived_artifacts":[{"path":"plans/phase-09-plan.yml","sha256":"78922d4a42f74211adbcd35ccda0e0e0bf3d94da770744f9e0ed18cc5b26dd49","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"},{"path":"plans/phase-09-workitems.yml","sha256":"c6248ebd140bc6a94e2974f0ddaecd2569a47989c6bb283a35706f4fa6b49c43","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"},{"path":"phases/phase-09-log.yml","sha256":"c3af294669455e21144b9f0cc0813c815286a4e61a5261502518bd64ad26754f","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"}]}
- {"phase_id":"P10","build_block":"bcf-standard-v2-dogfood","release_train":"release_2","retention_source":"git_history","retention_ref":"f4b314be03a7d4c3a85110b31c93e828e6484fe7","status":"completed","outcome":"structural_self_adoption_completed","summary":["P10 structurally makes BCF a Standard-v2 consumer while preserving the protected hosted candidate topology","phase artifacts were scaffolded from the governance template","the public P09 promoter moved BCF from implicit contract v1 to explicit Standard v2 while retaining 21 required gates and all ten custom semantic controls","the existing four evidence shards now consume one preflight-allocated immutable session and fan in only exact run-attempt artifacts","typed N/A records cover absent TypeScript source and absent external producer acquisition; the declared runtime contract remains fail-fast and repository-scoped","P10-HF01 owns post-merge CI-authority activation because provider workflow IDs and trusted default-main bytes do not exist before this structural merge"],"validation":[".venv/bin/bcf test-manifest update --repo-root . --gate test --python .venv/bin/python",".venv/bin/python -m pytest -q tests",".venv/bin/python .github/scripts/run_self_governance_gate.py lint",".venv/bin/python .github/scripts/run_self_governance_gate.py typecheck",".venv/bin/python .github/scripts/run_self_governance_gate.py architecture-test",".venv/bin/python .github/scripts/run_self_governance_gate.py contract-test",".venv/bin/python scripts/validate_governance_yaml.py --repo-root .",".venv/bin/python scripts/check_governance_exposure.py --repo-root ."],"archived_artifacts":[{"path":"plans/phase-10-plan.yml","sha256":"186d06a44a85ee3b627ac889b42225332cfa811b13011e912b0f0b7aaf0b2c94","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"},{"path":"plans/phase-10-workitems.yml","sha256":"8484cdb909fb86cba1fdfd68d480650d554f9415ba632a839d101fd36b36fb8c","git_commit":"f4b314be03a7d4c3a85110b31c93e828e6484fe7"},{"path":"phases/pha