scope_lock:
- order: 1
  statement: absence of profile_contract_version continues to mean 1.0 and ordinary
    upgrades preserve the installed profile and contract version
- order: 2
  statement: profile promotion changes governed profile surfaces transactionally but
    never rewrites an existing repository workflow; workflow adoption stays explicit
- order: 3
  statement: Lite stays contract v1 by default while fresh Standard and Regulated
    installations receive v2 evidence-session and SOIP surfaces
- order: 4
  statement: capability N/A records are typed, commit-bound, approved, expiring or
    deterministically re-reviewed, and cannot bypass Regulated requirements
- order: 5
