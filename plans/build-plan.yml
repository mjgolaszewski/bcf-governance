document:
  kind: machine_readable_build_plan
  name: "BCF Governance Build Plan"
  id: "bcf-governance-build-plan"
  version: 1.0.0
  generated_at_utc: "2026-08-14T00:00:00Z"
  status: active
  path: plans/build-plan.yml
planning_contract:
  format: yaml
  mandatory_properties:
    - tightly_scoped_deliverables
    - parallelizable_workstreams
    - hard_dependency_ordering
    - docker_first_local_runtime
    - ast_architecture_tests
    - strict_boundaries
    - observability_reference_model
    - completeness_standard
  completeness_standard: full_completeness_for_declared_scope
planning_inputs:
  date: "2026-08-30"
  planner: "codex"
  primary_source_of_truth: plans/product-spec.yml
  governance_references:
    - AGENTS.yml
    - MEMORY.yml
    - plans/phase-ledger.yml
global_delivery_rules:
  - change units default to the smallest valid vertical slice with low blast radius
  - every behavior change must update specs, plans, MEMORY, and tests together
  - preserve public contracts unless an explicit instruction and migration note authorize a breaking change
  - release gates must run in a declared runtime environment
  - governed artifacts must pass structural schema validation before semantic cross-artifact validation
  - architecture boundaries must be encoded in tests, not left as convention-only prose
  - packaged implementation stays under bcf_governance and public source scripts remain thin wrappers
  - canonical tooling, standalone private runtime, template source, and packaged template copies stay synchronized
  - governance changes must pass semantic validation, not only YAML parse checks
  - observability changes must preserve the shared telemetry and logging contract baseline
  - active phase lifecycle uses the governed taxonomy and records control metadata when work is blocked, paused, or abandoned
  - governed build artifacts must follow the template-pack naming and validation conventions
  - completed release trains must preserve governed phase history for each declared phase
  - new abstractions require proven reuse across at least two real call sites unless explicitly authorized
  - emergency red-CI and release-blocking fixes must use the governed hotfix lane
  - lite hotfix mode is reserved for a single-commit repair with no public-contract or security-scope change; all other hotfixes use full mode
  - candidate code never executes on persistent or trusted control-plane runners
  - profile-v1 public contracts remain compatible until a repository explicitly promotes to contract v2
  - provider state, evidence sessions, certification, and release receipts form an acyclic verification chain
  - each BCF behavior commit updates and validates BCF's own applicable governance contracts before successor work begins; local implementation may proceed while hosted Actions are unavailable, but remote candidate execution and publication stay disabled until disposable and trusted substrate acceptance is proven
global_gates:
  - id: G1
    name: governed_foundation
    applies_before: P02
    required_completion_criteria:
      - canonical governance artifacts exist
      - phase ledger points to active phase artifacts
      - semantic governance validation passes
      - architecture boundary test lane exists
  - id: G2
    name: safe_execution_substrate
    applies_before: P10
    required_completion_criteria:
      - trusted control-plane VM executes no candidate code
      - every code-executing job receives a fresh disposable VM and ephemeral runner identity
      - no GitHub-hosted fallback is configured
phase_sequence:
  - phase_id: P01
    build_block: "self-governance-0.6.1"
    objective: "adopt BCF 0.6.1 standard governance in the framework repository"
    hard_dependencies: []
    tightly_scoped_deliverables:
      - "prepare BCF 0.6.1 with required root artifacts, consolidated documentation, and standard self-governance"
    parallelizable_workstreams:
      - "evidence-integrity contracts and required artifact semantics"
      - "documentation consolidation and release surfaces"
      - "standard self-governance and behavioral controls"
    verification_commands: [make governance-validate, make test]
  - phase_id: P02
    build_block: "bcf-0.7-program-and-runner-cutover"
    objective: "freeze the 0.7 train and establish a fail-closed local workflow cutover"
    hard_dependencies: [P01]
    tightly_scoped_deliverables: ["record the full release program and upstream applicability", "classify every job and remove hosted fallback", "bind disposable and trusted runner activation to P10 while remote execution stays fail-closed"]
    parallelizable_workstreams: ["program governance", "runner substrate and workflow cutover"]
    verification_commands: [".venv/bin/python scripts/validate_governance_yaml.py --repo-root .", ".venv/bin/python -m pytest tests"]
  - {phase_id: P03, build_block: "preflight-interpreter-sessions-cleanup", objective: "add cheap preflight, interpreter authority, evidence sessions, exact fan-in, retention safety, and cleanup hardening", hard_dependencies: [P02], tightly_scoped_deliverables: ["preflight and interpreter authority", "schema-2-compatible sessions and exact-attempt fan-in", "retention and runtime cleanup controls"], parallelizable_workstreams: ["preflight and sessions", "runtime cleanup"], verification_commands: [".venv/bin/python -m pytest tests"]}
  - {phase_id: P04, build_block: "python-soip", objective: "generalize and self-adopt Python SOIP", hard_dependencies: [P03], tightly_scoped_deliverables: ["Python inventory, registry, traces, report, and causal controls"], parallelizable_workstreams: ["contracts and engine", "registry and adversarial tests"], verification_commands: [".venv/bin/python -m pytest tests"]}
  - {phase_id: P05, build_block: "typescript-soip-and-identity-proof", objective: "add optional TypeScript tracing and exact Identity proof", hard_dependencies: [P04], tightly_scoped_deliverables: ["consumer-owned TypeScript analyzer", "cross-language traces", "reproducible Identity proof"], parallelizable_workstreams: ["TypeScript adapter", "Identity benchmark"], verification_commands: [".venv/bin/python -m pytest tests"]}
  - {phase_id: P06, build_block: "ci-authority-contracts", objective: "add CI schemas, identity, admission, state, and typed N/A", hard_dependencies: [P05], tightly_scoped_deliverables: ["provider-neutral contracts", "pure ordered state machine"], parallelizable_workstreams: ["schemas", "state tests"], verification_commands: [".venv/bin/python -m pytest tests"]}
  - {phase_id: P07, build_block: "ci-truth-and-revocation", objective: "integrate CI certification with truth and release receipts", hard_dependencies: [P06], tightly_scoped_deliverables: ["collector and normalizer", "truth, revocation, cancellation, and status authority"], parallelizable_workstreams: ["truth integration", "adversarial controls"], verification_commands: [".venv/bin/python -m pytest tests"]}
  - {phase_id: P08, build_block: "github-adopter-runtime-pr-parity", objective: "ship the GitHub topology, transactional adopter, runtime adapter, and local PR parity", hard_dependencies: [P07], tightly_scoped_deliverables: ["GitHub reference pack", "safe adopter", "runtime and local PR adapters"], parallelizable_workstreams: ["GitHub adapter", "runtime and PR parity"], verification_commands: [".venv/bin/python -m pytest tests"]}
  - {phase_id: P09, build_block: "profile-v2-integration", objective: "integrate v2 through public packaging and lifecycle commands", hard_dependencies: [P08], tightly_scoped_deliverables: ["profiles and transactional promotion", "installer, upgrader, doctor, cleanup, templates, wheel, and sdist parity"], parallelizable_workstreams: ["profile behavior", "packaging parity"], verification_commands: [".venv/bin/python -m pytest tests"]}
  - {phase_id: P10, build_block: "bcf-standard-v2-dogfood", objective: "make BCF itself a complete Standard-v2 consumer", hard_dependencies: [P09], tightly_scoped_deliverables: ["self-adopt generated contracts", "provision and prove disposable candidate and isolated trusted runner substrates", "exact-main canary and protected stable check"], parallelizable_workstreams: ["dogfood migration", "runner substrate proof", "remote activation"], verification_commands: [".venv/bin/python -m pytest tests", "bcf truth"]}
  - {phase_id: P11, build_block: "exact-main-release-artifacts", objective: "build and certify 0.7.0 release bytes from exact merged main", hard_dependencies: [P10], tightly_scoped_deliverables: ["clean wheel and sdist proof", "artifact hashes bound to final release receipt"], parallelizable_workstreams: ["artifact build", "certification"], verification_commands: ["bcf truth"]}
  - {phase_id: P12, build_block: "editorial-refresh-and-release", objective: "refresh final documentation and publish immutable certified bytes", hard_dependencies: [P11], tightly_scoped_deliverables: ["README-led editorial refresh", "final recertification", "annotated tag, attestation, and exact-byte publication"], parallelizable_workstreams: ["documentation", "release verification"], verification_commands: ["bcf truth"]}
