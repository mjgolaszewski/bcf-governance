global_delivery_rules: [change units default to the smallest valid vertical slice with low blast radius, 'every behavior change must update specs, plans, MEMORY, and tests together', preserve public contracts unless an explicit instruction and migration note authorize a breaking change, release gates must run in a declared runtime environment, governed artifacts must pass structural schema validation before semantic cross-artifact validation, 'architecture boundaries must be encoded in tests, not left as convention-only prose', packaged implementation stays under bcf_governance and public source scripts remain thin wrappers, 'canonical tooling, standalone private runtime, template source, and packaged template copies stay synchronized', 'governance changes must pass semantic validation, not only YAML parse checks', observability changes must preserve the shared telemetry and logging contract baseline, 'active phase lifecycle uses the governed taxonomy and records control metadata when work is blocked, paused, or abandoned', governed build artifacts must follow the template-pack naming and validation conventions, completed release trains must preserve governed phase history for each declared phase, new abstractions require proven reuse across at least two real call sites unless explicitly authorized, emergency red-CI and release-blocking fixes must use the governed hotfix lane, lite hotfix mode is reserved for a single-commit repair with no public-contract or security-scope change; all other hotfixes use full mode, candidate code never executes on persistent or trusted control-plane runners, profile-v1 public contracts remain compatible until a repository explicitly promotes to contract v2, 'provider state, evidence sessions, certification, and release receipts form an acyclic verification chain', 'trusted CI workflow, run, attempt, commit, tree, session, and bundle identity are reconstructed and compared mechanically before any status or release mutation', 'each BCF behavior commit updates and validates BCF''s own applicable governance contracts before successor work begins; local implementation may proceed while hosted Actions are unavailable, but remote candidate execution and publication stay disabled until disposable and trusted substrate acceptance is proven']
