operator_requirements_choices_disambiguations:
- {type: decision, statement: all governance memory specs plans workitem ledgers and phase logs remain YAML-native}
- {type: decision, statement: BCF 0.7.0 is one release train and BCF must self-adopt every applicable Standard-v2 capability}
- {type: security_boundary, statement: candidate code executes only on a one-job disposable VM and never on the persistent trusted control-plane VM}
- {type: compatibility, statement: existing consumers remain on profile contract v1 until an explicit validated v2 promotion}
- {type: release, statement: the tag publisher publishes pre-certified exact bytes and never rebuilds source}
- {type: owner_authorization, statement: the sole repository owner authorizes Codex to perform required human reviews and approvals for the 0.7 release train}
- {type: execution_boundary, statement: 'all candidate code uses fresh standard GitHub-hosted jobs because the repository is public; no candidate route polls, sleeps, idles, uses persistent local runners, or falls back, and trusted publication remains fail-closed until P10'}
- {type: historical_custody, statement: v0.7.0 remains untouched as published and attested but provider-mutable historical custody and is not certified under corrected authority v1.1}
- {type: release, statement: v0.7.1 uses an annotated unsigned tag and publication and immutable-release settings require explicit owner approval}
- {type: ci_graph_authority, statement: agents and humans modify governance/ci-graph.yml or registered bounded extensions while deterministic code alone renders and validates workflow bytes}
- {type: identity_preservation, statement: every current Identity workflow job trigger edge stable check runner mapping authority role cleanup contract and scheduled lane is preservation-locked; mutation requires offline no-loss and performance proofs and remote validation is limited to one canary plus activation PR and exact-main}
- {type: hosted_frugality, statement: hosted candidate jobs execute their own bounded work and terminate; polling sleeping lease waiting and hosted waiters for local capacity are prohibited}
