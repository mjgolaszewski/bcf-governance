    statement: all governance, memory, specs, plans, workitem ledgers, and phase logs remain YAML-native
  - type: decision
    statement: BCF 0.7.0 is one release train and BCF must self-adopt every applicable Standard-v2 capability
  - type: security_boundary
    statement: candidate code executes only on a one-job disposable VM and never on the persistent trusted control-plane VM
  - type: compatibility
