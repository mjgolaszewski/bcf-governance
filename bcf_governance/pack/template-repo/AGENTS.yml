document:
  kind: governance
  name: "{{PROJECT_NAME}} Governance"
  id: "{{PROJECT_ID}}-agents"
  version: 1.0.0
  generated_at_utc: "{{DATE}}T00:00:00Z"
  status: active
  path: AGENTS.yml
project:
  repo_root: "{{REPO_ROOT}}"
  project_name: "{{PROJECT_NAME}}"
  product_name: "{{PRODUCT_NAME}}"
regression_shield:
  purpose: machine-readable agent policy; do not use as an execution log
  invariants: [record evidence in phases/*.yml, keep product scope in plans/product-spec.yml, keep delivery sequence in plans/build-plan.yml, keep active state in plans/phase-ledger.yml and MEMORY.yml, append entries tersely but with full intent action evidence and consequence]
authorities:
  precedence: [user_instructions, AGENTS.yml, plans/product-spec.yml, plans/build-plan.yml, plans/phase-ledger.yml, MEMORY.yml]
  execution_evidence_location: [phases/*.yml, audits/]
governance:
  file_format_policy:
    canonical_machine_readable_artifacts: [AGENTS.yml, MEMORY.yml, architecture-boundaries.yml, governance-profile.yml, governance/artifact-manifest.yml, governance/canonical-representations.yml, governance/repo-cleanup-contract.yml, schemas/*.json, contracts/observability/v1/*.contract.yml, plans/*.yml, phases/*.yml]
    note: YAML data is canonical; prose docs explain but do not override governed state
    template_pack_alignment: [new phase and hotfix artifacts must stay scaffold-compatible, mirrored template files must update together]
  structural_schema_contract:
    root: schemas/
    required_schemas: [schemas/agents.schema.json, schemas/architecture-boundaries.schema.json, schemas/canonical-representations.schema.json, schemas/ci-authority.schema.json, schemas/ci-certification.schema.json, schemas/ci-provider-snapshot.schema.json, schemas/github-ci-topology.schema.json, schemas/runtime-capacity.schema.json, schemas/capability-na.schema.json, schemas/governance-profile.schema.json, schemas/artifact-manifest.schema.json, schemas/evidence-policy.schema.json, schemas/evidence-receipt.schema.json, schemas/evidence-session.schema.json, schemas/findings.schema.json, schemas/repo-cleanup-contract.schema.json, schemas/memory.schema.json, schemas/product-spec.schema.json, schemas/build-plan.schema.json, schemas/phase-ledger.schema.json, schemas/phase-history.schema.json, schemas/phase-plan.schema.json, schemas/phase-workitems.schema.json, schemas/phase-log.schema.json, schemas/hotfix-log.schema.json, schemas/observability-contract.schema.json]
  build_plan_contract:
    format: yaml
    required_properties: [tightly_scoped_deliverables, parallelizable_workstreams, hard_dependencies, docker_first_local_runtime, ast_architecture_tests, strict_boundaries, observability_reference_model, completeness_standard]
    completeness_standard: full_completeness_for_declared_scope
  phase_log_contract:
    status_taxonomy:
      planned: defined_not_executed
      completed: implementation_done_checks_pending_or_partial
    computed_states:
      verified: current_tree_required_evidence_passed
      closed: verified_reconciled_and_no_blocking_findings_on_same_tree
    final_closeout_required_fields: [closeout_requirements, known_constraints]
  semantic_validation_contract:
    validator: scripts/validate_governance_yaml.py
    required_checks: [schemas, YAML_parse, document_paths, placeholders, phase_catalog_alignment, phase_history_retention, active_phase_alignment, memory_alignment, release_gate_wiring, hotfix_alignment, observability_contracts, mandatory_structural_gates, artifact_manifest_alignment, evidence_policy, semantic_ownership_registry, finding_registry, repo_cleanup_contract, audit_root_enforcement, nested_governance_boundaries, vendored_artifact_provenance, context_budgets, declared_test_roots]
  hotfix_lane_contract:
    eligibility: [default_branch_red_ci, release_blocking_regression, security_or_expiring_external_breakage]
    minimum_required_artifacts: [phase_ledger_hotfix_record, hotfix_phase_log_entry, canonical_artifact_sync_when_contracts_change]
    modes:
      lite:
        allowed_when: [single_commit_fix, no_public_contract_change, no_security_scope_change]
      full:
        required_when: [default_branch_red_ci, release_blocking_regression, security_or_expiring_external_breakage]
    machine_assist:
      scaffold_script: scripts/scaffold_governance_artifacts.py
      required_record_fields: [id, mode, status, triggered_by_commits, failing_workflows, root_cause, remediated_in_phase, hotfix_log, canonical_artifacts]
      remediation_history_required_fields: [id, mode, recorded_at_utc, action, remediated_in_phase, hotfix_log, canonical_artifacts, local_validation]
      filename_convention: [hotfix log filenames use phase-NN-hotfix##, phase number comes from hotfix.related_phase_id]
  artifact_ownership_contract:
    canonical_owners:
      governance_rules_and_authority_order: AGENTS.yml
      adoption_profile_and_release_gate_classification: governance-profile.yml
      artifact_roots_vendors_and_line_kib_context_budgets: governance/artifact-manifest.yml
      repo_cleanup_policy: governance/repo-cleanup-contract.yml
      architecture_boundary_rule_config: architecture-boundaries.yml
      audit_reports: audits/
      product_scope_and_phase_catalog: plans/product-spec.yml
      machine_readable_phase_sequence_and_delivery_contracts: plans/build-plan.yml
      active_phase_state_blockers_and_validation_commands: plans/phase-ledger.yml
      compact_phase_history_and_archive_hashes: plans/phase-history.yml
      evidence_integrity_policy: governance/evidence-policy.yml
      finding_accounting: governance/findings.yml
      durable_context_and_active_artifact_pointers: MEMORY.yml
      observability_contract_templates: contracts/observability/v1/
    duplication_rules: [repeated fields need a canonical owner, derived fields update with their source, template-pack ownership boundaries remain unless this file changes]
  phase_transition_contract:
    active_phase_lifecycle_taxonomy:
      planned: ready_for_handoff
      active: implementation_in_flight
      blocked: stopped_until_unblock_condition
      paused: intentionally_parked_until_resume_condition
      completed: implementation_done_checks_pending_or_partial
      abandoned: stopped_with_reason
    rollover_rules: [verified and closed are computed only by bcf truth, successor activation updates phase-ledger and MEMORY together, unresolved outgoing risks are recorded before successor activation]
  phase_retention_contract:
    default_cleanup_mode: git_history
    modes: [git_history, archive]
    retained_triplets: [current_phase, already_scaffolded_future_phases, future_phases_in_current_phase_train]
    enforcement: [mode_is_opt_in, old_triplets_outside_retention_window_are_removed_or_archived, phase_scoped_hotfix_records_follow_related_phase, compact_phase_history_records_hashes, archive_mode_ignores_archive_contents]
  instruction_only: true
runtime_surfaces:
  authoritative_surfaces: [local_runtime, ci_runner]
  rules: [CI must be self-seeding, runtime evidence must come from the declared environment]
prime_directive:
  statement: implement the smallest valid vertical slice, preserve public contracts unless explicitly instructed, and prove behavior with tests
  forbidden_default_behavior: [broad_refactors_without_explicit_authorization, public_contract_changes_without_migration_note_and_tests, new_architectural_patterns_without_governance_updates, business_logic_in_routers_repositories_or_adapters, generic_helpers_without_two_real_call_sites]
pre_edit_contract:
  required_before_editing: [bounded_context, architectural_layer, command_or_query_side, target_modules, expected_tests, forbidden_files]
  rule: identify scope and forbidden surfaces before editing production code
  ambiguity_response: stop_and_narrow_scope_before_editing
structural_guardrails:
  executable_gate_policy:
    rule: mandatory structural rules need executable gates or human_review_only rationale
    human_review_only_requires: [rule_id, rationale, reviewer_role, phase_log_evidence]
  production_module_policy:
    max_loc: 800
    applies_to: [production_source_modules]
    excluded_path_tokens: [generated, migrations, vendor, fixtures, snapshots, testdata, tests]
    violation_response: stop_and_propose_module_split_before_editing
  agent_deconstruction_contract:
    max_loc: 800
    applies_to: [agent_touched_source_files, governance_scripts, package_modules]
    oversized_file_response: start_deconstruction_phase_before_adding_feature_behavior
    required_phase_rules: [one_fatty_per_phase, characterization_test_first, preserve_cli_entrypoint, split_by_responsibility, split_shape_plan_validate_execute_report, ast_boundary_gate, targeted_tests, delete_dead_code_immediately]
  module_ownership_policy:
    required_mappings: [exactly_one_architectural_layer, exactly_one_bounded_context_or_domain_concern]
    ambiguity_response: stop_and_update_architecture_boundaries_before_editing
  cqrs_policy:
    command_side: [may_mutate_state_through_ports, must_not_return_read_model_shapes]
    query_side: [may_return_read_models, must_not_mutate_state]
  ddd_dry_policy:
    duplication_scope: bounded_context_first
    cross_context_reuse_requires: explicit_shared_kernel_decision
    shared_abstraction_requires: [two_real_call_sites, owning_context_or_shared_kernel, owning_layer, tests, rationale]
  boundary_violation_response: [stop_before_editing, propose_module_split_or_boundary_update, update_gate_config_and_tests_with_approved_rule_changes]
engineering:
  architecture:
    style: cqrs_lite_with_strict_ports
    backend_code_root: backend/src
    frontend_code_root: frontend/src
    slice_strategy: contract_first_vertical_slice
    operation_model:
      command: mutation_use_case
      query: read_use_case
      handler: orchestration_only
      domain: business_rules
      port_or_repository: persistence_contract
      infrastructure: external_systems_behind_ports
      router: http_translation_only
    enforcement: [ast_enforced_import_boundaries, command_query_separation, orchestration_only_handlers, framework_free_domain, ports_for_persistence_contracts, thin_routers, dry_adapter_composition, configured_module_loc_cap, exactly_one_layer_and_context, ddd_dry_reuse_requires_ownership]
  backend_boundary_rules: [commands mutate through ports and do not return read models, queries return read models and do not mutate state, handlers orchestrate only, domain owns business rules and imports no outer layers or clients, ports define contracts without concrete clients, adapters own persistence and integration details, routers translate HTTP and delegate]
  frontend_boundary_rules: [presentation components do not call HTTP directly, route modules stay thin, DTOs are mapped at the boundary]
contract_first_rules:
  required_sequence: [contracts, ports, tests, use_case_or_handler, router, infrastructure_adapter_if_required]
  public_contract_policy:
    preserve_public_contracts_by_default: true
    backward_compatible_changes_allowed: true
    breaking_changes_require: [explicit_instruction, migration_note, versioned_route_or_compatibility_shim, updated_router_contract_tests]
testing_governance:
  test_roots: [backend/tests]
  required_for_every_change: [docs_only_changes_are_default_test_exception, affected_tests_pass_before_completion, tests_assert_behavior, mandatory_structural_rules_have_gate_or_human_review_rationale]
  command_tests_should_cover_when_applicable: [successful_mutation, authorization_or_policy_failure, domain_invariant_failure, idempotency_or_safe_retry_behavior, persistence_calls_through_ports]
  query_tests_should_cover_when_applicable: [successful_read, empty_result_behavior, filtering_sorting_or_pagination_rules, no_mutation_or_external_side_effect]
  router_tests_should_cover_when_applicable: [http_status_mapping, request_validation, response_schema, auth_dependency_behavior]
transaction_policy:
  owner: use_case_or_handler
  rules: [handlers_coordinate_transactions, repositories_do_not_commit_unless_unit_of_work, external_side_effects_wait_for_irreversible_commit_unless_idempotent, retries_need_idempotency_or_safe_retry_semantics]
error_policy:
  rules: [domain_errors_stay_domain_or_feature_local, handlers_raise_or_return_typed_application_errors, routers_map_typed_errors_to_http, raw_infrastructure_errors_do_not_cross_http]
security_policy:
  rules: [authorize_before_mutation, do_not_weaken_auth_for_tests, do_not_bypass_policy_checks, do_not_remove_validation_without_instruction, no_secrets_in_code_logs_or_non_fake_tests]
persistence_policy:
  rules: [use_cases_depend_on_ports_or_repository_contracts, sqlalchemy_models_do_not_leak_to_domain_or_router_responses, adapters_translate_persistence_models, migrations_require_escalation_and_rollback_consideration]
api_policy:
  rules: [routers_are_thin, routers_validate_input_call_one_use_case_and_map_errors, responses_use_contract_models, orm_objects_are_not_returned_directly]
review_gate:
  required_before_merge: [changed_files_limited_to_authorized_slice_or_escalated, tests_updated_when_behavior_changed, relevant_tests_pass, no_unauthorized_public_contract_changes, no_forbidden_dependency_direction, no_new_generic_utilities_without_justification, no_hidden_auth_or_security_weakening, no_unrelated_formatting_churn]
  automatic_rejection_triggers: [router_contains_business_logic, domain_imports_infrastructure, handler_imports_http_objects, repository_decides_authorization, public_schema_changed_without_migration_note, tests_removed_instead_of_fixed, production_module_exceeds_loc_cap_without_split_plan, module_maps_to_multiple_layers_or_contexts, command_side_returns_read_model_shape, query_side_mutates_state]
quality:
  required_suites: [governance_validation, architecture_module_size, architecture_layer_membership, architecture_context_membership, architecture_import_boundaries, architecture_cqrs_side, architecture_router_thinness, architecture_duplication, unit, integration, contract, lint, typecheck, security_secret_scan, security_dependency_audit, security_sbom, security_vulnerability_scan, runtime_smoke]
  mandatory_sync_rules: [update specs plans and MEMORY when behavior or environment contracts change, update observability contracts and tests together, record blockers before implementation proceeds, governance validation passes when governed artifacts change, hotfixes reconcile into canonical artifacts before closeout]
git_scope:
  default_root: "{{REPO_ROOT}}"
  rules: [stage explicit scopes, verify staged files before commit]
references:
  canonical_product_spec: plans/product-spec.yml
  canonical_build_plan: plans/build-plan.yml
  canonical_active_ledger: plans/phase-ledger.yml
  canonical_memory: MEMORY.yml
  governance_validator: scripts/validate_governance_yaml.py
