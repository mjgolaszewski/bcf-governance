  permitted_defaults_and_single_application_point: []
  accepted_aliases_and_single_ingress_boundary: []
  persistence_codec_and_envelope: {applicability: required, codec_symbol: 'scripts/_bcf_runtime/evidence_sessions.py::load_session', semantic_id: governance.evidence-session.v1, schema_version: 1, exact_byte_format: canonical sorted JSON, integrity_algorithm: SHA-256, identity_bindings: [commit_sha, tree_sha, session_id, run_id, run_attempt], migration_dispatch: schema_version}
  protocol_translations: []
  intentional_projections: []
  declared_consumer_layers_and_sinks: {read: ['scripts/_bcf_runtime/truth_sessions.py::verify_evidence_sessions'], authorization: [], persistence: ['scripts/_bcf_runtime/evidence_sessions.py::bind_session'], cache: [], queue: [], network: [], api: [], browser: []}
  generated_source_authority: {authoritative_roots: [scripts/_bcf_runtime/evidence_sessions.py], generated_mirrors: [], generator: 'bcf install', parity_proof: 'pack manifest SHA-256'}
  migration_policy: {source_versions: [], destination_version: 1, owner: 'scripts/_bcf_runtime/evidence_sessions.py::load_session', runtime_exclusion: schema-version dispatch only, removal_condition: superseded by a reviewed evidence-session schema}
