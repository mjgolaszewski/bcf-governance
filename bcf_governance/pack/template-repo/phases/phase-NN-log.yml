document:
  kind: execution_phase_log
  name: "Phase {{PHASE_NUMBER}} Log"
  id: "{{PROJECT_ID}}-phase-{{PHASE_NUMBER}}-log"
  version: 1.0.0
  generated_at_utc: "{{DATE}}T00:00:00Z"
  status: planned
  path: phases/phase-{{PHASE_NUMBER}}-log.yml
phase:
  id: "{{ACTIVE_PHASE_ID}}"
  build_block: "{{BUILD_BLOCK}}"
summary:
  outcome: planned
  highlights:
    - "{{ACTIVE_PHASE_ID}} is opened for {{PHASE_OBJECTIVE}}"
workitems:
  - id: "{{ACTIVE_PHASE_ID}}-P0-01"
    status: TODO
    summary: "deliver {{DELIVERABLE}}"
execution_evidence:
  planned_commands:
    - make governance-validate
    - make architecture-test
    - make test
    - make release-check
  executed_commands: []
  notes: []
closeout_requirements:
  claims:
    workitems_closed: {required_evidence: [governance-validate]}
    required_suites_green: {required_evidence: [lint, typecheck, test, contract-test]}
    architecture_gates_green: {required_evidence: [architecture-test]}
    health_checks_green: {required_evidence: [runtime-smoke]}
    security_review_complete: {required_evidence: [security-review]}
    findings_resolved: {required_evidence: [security-vulnerability-scan]}
  reconciliation: {required_evidence: [governance-validate, governance-exposure-scan]}
  finding_registry: governance/findings.yml
known_constraints:
  - update canonical governed artifacts together when this phase changes behavior or environment contracts
next_work:
  - implement scoped workitems and record execution evidence in this log
