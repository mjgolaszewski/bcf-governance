document:
  kind: release_train_phase0_backtrace
  id: bcf.release-train.phase0-backtrace.v1
  schema_version: 1
  status: speculative_non_authoritative
  issue: 394
  source_ref: main
construction_rule:
  order: [invariant, canonical_domain_owner, primitive, contract, producer, consumer, evidence]
  dependency_direction: outward_only
  no_parallel_ontology: true
invariants:
- {id: INV-RT-001, statement: exact subject identity survives every proof and authority transition, basis: audits/bcf-2.1-p26-invariant-ownership.yml}
- {id: INV-RT-002, statement: required claims resolve only through canonical execution-group producers or authenticated equivalent proof, basis: governance/gate-contracts.yml}
- {id: INV-RT-003, statement: every reachable producer-consumer pair is complete before allocation or authority and every unreachable pair has one typed exclusion, basis: spec/RELEASE_TRAIN_STATE_DAG.md#rule-31}
- {id: INV-RT-004, statement: candidate-controlled bytes cannot confer trusted finalizer merge exact-main controller release or custody authority, basis: audits/bcf-2.1-p26-invariant-ownership.yml}
- {id: INV-RT-005, statement: missing stale ambiguous wrong-subject wrong-attempt wrong-producer or partial evidence fails closed, basis: audits/bcf-2.1-p26-invariant-ownership.yml}
- {id: INV-RT-006, statement: cheap deterministic rejection precedes expensive evidence or provider allocation, basis: docs/RELIABILITY_MODEL.md}
- {id: INV-RT-007, statement: lifecycle intent and legal successor are mechanically derived and never caller-selected, basis: bcf_governance/tooling/ci_graph_post_merge.py}
- {id: INV-RT-008, statement: release authority requires exact terminal certification plus independent exact-byte verification, basis: audits/v2.3.0-release-custody.yml}
- {id: INV-RT-009, statement: controller mutation rotation recovery and publication remain separate authenticated self-authority, basis: audits/v2.3.0-release-custody.yml}
- {id: INV-RT-010, statement: generated and human representations are projections of singular executable owners, basis: governance/canonical-representations.yml}
- {id: INV-RT-011, statement: reuse changes execution only and cannot broaden proposition qualification freshness dependency or authority, basis: audits/bcf-2.1-p26-invariant-ownership.yml}
- {id: INV-RT-012, statement: recovery is bounded and cannot bypass the failed invariant or broaden authority, basis: schemas/recovery-reentry-authorization.schema.json}
primitives:
- {id: PRIM-SUBJECT, canonical_name: SubjectIdentity, owner: schemas/evidence-receipt.schema.json, invariants: [INV-RT-001, INV-RT-005]}
- {id: PRIM-CLAIM, canonical_name: ClaimIdentity, owner: governance/gate-contracts.yml#claim_model/claims, invariants: [INV-RT-002]}
- {id: PRIM-EXEC-GROUP, canonical_name: ExecutionGroupIdentity, owner: governance/gate-contracts.yml#claim_model/execution_groups, invariants: [INV-RT-002]}
- {id: PRIM-DEPENDENCY, canonical_name: DependencyClosure, owner: bcf_governance/tooling/evidence_planning.py, invariants: [INV-RT-002, INV-RT-011]}
- {id: PRIM-RECEIPT, canonical_name: EvidenceReceipt, owner: bcf_governance/tooling/truth_receipts.py, invariants: [INV-RT-001, INV-RT-005]}
- {id: PRIM-REUSE, canonical_name: ApplicabilityDecision, owner: bcf_governance/tooling/evidence_reuse_attestations.py, invariants: [INV-RT-011]}
- {id: PRIM-AUTHORITY, canonical_name: AuthorityIdentity, owner: bcf_governance/tooling/ci_authority_contracts.py, invariants: [INV-RT-004, INV-RT-008, INV-RT-009]}
- {id: PRIM-LIFECYCLE, canonical_name: LifecycleState, owner: bcf_governance/tooling/governance_truth.py, invariants: [INV-RT-007]}
- {id: PRIM-RECOVERY, canonical_name: RecoveryAuthority, owner: bcf_governance/tooling/ci_graph_controller_lifecycle.py, invariants: [INV-RT-012]}
- {id: PRIM-CI-GRAPH, canonical_name: governance.ci-graph-compilation.v1, owner: bcf_governance/tooling/ci_graph_contracts.py::validate_ci_graph, invariants: [INV-RT-003, INV-RT-010]}
- {id: PRIM-CI-EDGE, canonical_name: EdgeContract, owner: bcf_governance/tooling/ci_graph_edges.py::compile_edge_contracts, invariants: [INV-RT-003, INV-RT-006]}
states:
- {id: ST-INTENT, owner: ci_graph_post_merge, authority: none}
- {id: ST-PREFLIGHT, owner: governance_validation.runner, authority: structural}
- {id: ST-PLAN, owner: evidence_planning, authority: scheduling}
- {id: ST-EVIDENCE, owner: execution_groups, authority: evidence}
- {id: ST-TRUTH, owner: governance_truth, authority: proposition}
- {id: ST-PR-CERT, owner: trusted_finalizer, authority: pr_certification}
- {id: ST-MERGED, owner: provider_protection, authority: repository_merge}
- {id: ST-MAIN-ADMIT, owner: ci_github_automation, authority: exact_main_admission}
- {id: ST-MAIN-TRUTH, owner: governance_truth, authority: exact_main_proposition}
- {id: ST-LIFECYCLE-CERT, owner: trusted_finalizer, authority: bounded_or_terminal_certification}
- {id: ST-CONTROLLER, owner: ci_graph_controller_lifecycle, authority: self_controller}
- {id: ST-RELEASE-AUTH, owner: ci_github_release, authority: release_authorization}
- {id: ST-ASSET-VERIFY, owner: release_verifier, authority: exact_byte_release}
- {id: ST-PUBLISHED, owner: provider_release, authority: publication}
- {id: ST-ADOPTER-QUAL, owner: adopter_qualification, authority: qualification}
- {id: ST-CUSTODY, owner: release_custody_audit, authority: terminal_record}
transitions:
- {id: TR-001, from: ST-INTENT, to: ST-PREFLIGHT, invariants: [INV-RT-003, INV-RT-006, INV-RT-007, INV-RT-010], producer: governance_validation.runner, consumer: evidence_planning, cost: cheap_pre_allocation, rejection: structural_or_semantic_failure}
- {id: TR-002, from: ST-PREFLIGHT, to: ST-PLAN, invariants: [INV-RT-001, INV-RT-002, INV-RT-005, INV-RT-011], producer: evidence_planning, consumer: execution_groups, cost: pre_fanout, rejection: ambiguous_plan_expands_or_rejects}
- {id: TR-003, from: ST-PLAN, to: ST-EVIDENCE, invariants: [INV-RT-001, INV-RT-002, INV-RT-005], producer: execution_groups, consumer: governance_truth, cost: expensive_execution, rejection: producer_failure_timeout_or_receipt_mismatch}
- {id: TR-004, from: ST-EVIDENCE, to: ST-TRUTH, invariants: [INV-RT-001, INV-RT-002, INV-RT-004, INV-RT-005, INV-RT-011], producer: governance_truth, consumer: finalizer, cost: post_execution, rejection: unresolved_or_ineligible_claim}
- {id: TR-005, from: ST-TRUTH, to: ST-PR-CERT, invariants: [INV-RT-001, INV-RT-003, INV-RT-004, INV-RT-005], producer: protected_base_or_installed_controller_finalizer, consumer: provider_required_status, cost: trusted_provider, rejection: wrong_subject_attempt_runtime_protection_or_truth}
- {id: TR-006, from: ST-PR-CERT, to: ST-MERGED, invariants: [INV-RT-004], producer: provider_protection, consumer: exact_main, cost: provider_mutation, rejection: required_status_not_success}
- {id: TR-007, from: ST-MERGED, to: ST-MAIN-ADMIT, invariants: [INV-RT-001, INV-RT-004, INV-RT-006, INV-RT-007, INV-RT-009], producer: ci_github_automation, consumer: exact_main_governance, cost: cheap_provider_preflight, rejection: moved_ambiguous_or_unauthorized_main}
- {id: TR-008, from: ST-MAIN-ADMIT, to: ST-MAIN-TRUTH, invariants: [INV-RT-001, INV-RT-002, INV-RT-005, INV-RT-011], producer: exact_main_governance_truth, consumer: trusted_finalizer, cost: exact_main_execution, rejection: unresolved_claim_or_inapplicable_reuse}
- {id: TR-009, from: ST-MAIN-TRUTH, to: ST-LIFECYCLE-CERT, invariants: [INV-RT-001, INV-RT-004, INV-RT-005, INV-RT-007], producer: trusted_finalizer_publisher, consumer: lifecycle_or_release, cost: trusted_provider, rejection: same_admission_or_scope_failure}
- {id: TR-010, from: ST-LIFECYCLE-CERT, to: ST-CONTROLLER, invariants: [INV-RT-004, INV-RT-009, INV-RT-012], producer: controller_lifecycle, consumer: subsequent_exact_main, cost: provider_controller_mutation, rejection: custody_or_rotation_failure, applicability: only_when_controller_transition_required}
- {id: TR-011, from: ST-LIFECYCLE-CERT, to: ST-RELEASE-AUTH, invariants: [INV-RT-004, INV-RT-008], producer: ci_github_release, consumer: release_verifier, cost: provider_release_preflight, rejection: bounded_or_nonterminal_certification}
- {id: TR-012, from: ST-RELEASE-AUTH, to: ST-ASSET-VERIFY, invariants: [INV-RT-001, INV-RT-005, INV-RT-008], producer: release_collector_verifier, consumer: publication, cost: build_and_verify_assets, rejection: asset_digest_or_inventory_mismatch}
- {id: TR-013, from: ST-ASSET-VERIFY, to: ST-ADOPTER-QUAL, invariants: [INV-RT-005, INV-RT-008, INV-RT-010], producer: adopter_qualification_harness, consumer: publication_eligibility, cost: adopter_execution, rejection: missing_profile_or_failed_fixed_point}
- {id: TR-014, from: ST-ADOPTER-QUAL, to: ST-PUBLISHED, invariants: [INV-RT-004, INV-RT-008], producer: provider_release_publication, consumer: custody, cost: provider_publication, rejection: qualification_or_upload_identity_mismatch}
- {id: TR-015, from: ST-PUBLISHED, to: ST-CUSTODY, invariants: [INV-RT-001, INV-RT-008, INV-RT-010], producer: release_custody_audit, consumer: future_release_and_human_review, cost: verification_only, rejection: immutable_custody_incomplete}
composition:
  ci_job_edges:
    canonical_owner: bcf_governance/tooling/ci_graph_edges.py::compile_edge_contracts
    closure_test: tests/test_ci_graph.py::test_canonical_graph_closes_or_excludes_every_producer_consumer_pair
    rule: import_existing_edge_contract_semantics_do_not_duplicate
  release_train_edges:
    rule: each transition above must bind to one or more canonical CI EdgeContract instances or a separately typed provider/lifecycle edge
    unresolved_binding_is_blocking: true
exclusions:
- {id: EX-001, reason: profile_lane_disconnected, existing_owner: ci_graph_edges}
- {id: EX-002, reason: no_dependency_or_event_path, existing_owner: ci_graph_edges}
- {id: EX-003, reason: reverse_dependency, existing_owner: ci_graph_edges}
- {id: EX-004, reason: bounded_certification_has_no_release_authority, invariant: INV-RT-008}
- {id: EX-005, reason: candidate_authority_cannot_mutate_controller_or_release, invariant: INV-RT-004}
- {id: EX-006, reason: recovery_cannot_bypass_failed_authority, invariant: INV-RT-012}
validation_status:
  mechanically_proven_existing: [PRIM-CI-EDGE]
  reconstructed_requires_agent_validation: [invariants, states, transitions, release_train_edges, exclusions]
  adoption_blocker: no transition may become normative until implementation owner positive test cause-specific negative test terminal consumer and recovery are independently traced
