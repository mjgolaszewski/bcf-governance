- {id: ST-PREFLIGHT, owner: governance_validation.runner, authority: structural}
- {id: ST-PLAN, owner: evidence_planning, authority: scheduling}
- {id: ST-EVIDENCE, owner: execution_groups, authority: evidence}
- {id: ST-TRUTH, owner: governance_truth, authority: proposition}
- {id: ST-PR-CERT, owner: trusted_finalizer, authority: pr_certification}
- {id: ST-MERGED, owner: provider_protection, authority: repository_merge}
- {id: ST-MAIN-ADMIT, owner: ci_github_automation, authority: exact_main_admission}
- {id: ST-MAIN-TRUTH, owner: governance_truth, authority: exact_main_proposition}
- {id: ST-LIFECYCLE-CERT, owner: trusted_finalizer, authority: bounded_or_terminal_certification}
- {id: ST-CONTROLLER, owner: ci_graph_controller_lifecycle, authority: self_controller}
- {id: ST-RELEASE-AUTH, owner: ci_github_release, authority: release_authorization}
- {id: ST-ASSET-VERIFY, owner: release_verifier, authority: exact_byte_release}
- {id: ST-PUBLISHED, owner: provider_release, authority: publication}
- {id: ST-ADOPTER-QUAL, owner: adopter_qualification, authority: qualification}
- {id: ST-CUSTODY, owner: release_custody_audit, authority: terminal_record}
transitions:
- {id: TR-001, from: ST-INTENT, to: ST-PREFLIGHT, invariants: [INV-RT-003, INV-RT-006, INV-RT-007, INV-RT-010], producer: governance_validation.runner, consumer: evidence_planning, cost: cheap_pre_allocation, rejection: structural_or_semantic_failure}
- {id: TR-002, from: ST-PREFLIGHT, to: ST-PLAN, invariants: [INV-RT-001, INV-RT-002, INV-RT-005, INV-RT-011], producer: evidence_planning, consumer: execution_groups, cost: pre_fanout, rejection: ambiguous_plan_expands_or_rejects}
- {id: TR-003, from: ST-PLAN, to: ST-EVIDENCE, invariants: [INV-RT-001, INV-RT-002, INV-RT-005], producer: execution_groups, consumer: governance_truth, cost: expensive_execution, rejection: producer_failure_timeout_or_receipt_mismatch}
- {id: TR-004, from: ST-EVIDENCE, to: ST-TRUTH, invariants: [INV-RT-001, INV-RT-002, INV-RT-004, INV-RT-005, INV-RT-011], producer: governance_truth, consumer: finalizer, cost: post_execution, rejection: unresolved_or_ineligible_claim}
- {id: TR-005, from: ST-TRUTH, to: ST-PR-CERT, invariants: [INV-RT-001, INV-RT-003, INV-RT-004, INV-RT-005], producer: protected_base_or_installed_controller_finalizer, consumer: provider_required_status, cost: trusted_provider, rejection: wrong_subject_attempt_runtime_protection_or_truth}
- {id: TR-006, from: ST-PR-CERT, to: ST-MERGED, invariants: [INV-RT-004], producer: provider_protection, consumer: exact_main, cost: provider_mutation, rejection: required_status_not_success}
- {id: TR-007, from: ST-MERGED, to: ST-MAIN-ADMIT, invariants: [INV-RT-001, INV-RT-004, INV-RT-006, INV-RT-007, INV-RT-009], producer: ci_github_automation, consumer: exact_main_governance, cost: cheap_provider_preflight, rejection: moved_ambiguous_or_unauthorized_main}
- {id: TR-008, from: ST-MAIN-ADMIT, to: ST-MAIN-TRUTH, invariants: [INV-RT-001, INV-RT-002, INV-RT-005, INV-RT-011], producer: exact_main_governance_truth, consumer: trusted_finalizer, cost: exact_main_execution, rejection: unresolved_claim_or_inapplicable_reuse}
- {id: TR-009, from: ST-MAIN-TRUTH, to: ST-LIFECYCLE-CERT, invariants: [INV-RT-001, INV-RT-004, INV-RT-005, INV-RT-007], producer: trusted_finalizer_publisher, consumer: lifecycle_or_release, cost: trusted_provider, rejection: same_admission_or_scope_failure}
- {id: TR-010, from: ST-LIFECYCLE-CERT, to: ST-CONTROLLER, invariants: [INV-RT-004, INV-RT-009, INV-RT-012], producer: controller_lifecycle, consumer: subsequent_exact_main, cost: provider_controller_mutation, rejection: custody_or_rotation_failure, applicability: only_when_controller_transition_required}
- {id: TR-011, from: ST-LIFECYCLE-CERT, to: ST-RELEASE-AUTH, invariants: [INV-RT-004, INV-RT-008], producer: ci_github_release, consumer: release_verifier, cost: provider_release_preflight, rejection: bounded_or_nonterminal_certification}
- {id: TR-012, from: ST-RELEASE-AUTH, to: ST-ASSET-VERIFY, invariants: [INV-RT-001, INV-RT-005, INV-RT-008], producer: release_collector_verifier, consumer: publication, cost: build_and_verify_assets, rejection: asset_digest_or_inventory_mismatch}
- {id: TR-013, from: ST-ASSET-VERIFY, to: ST-ADOPTER-QUAL, invariants: [INV-RT-005, INV-RT-008, INV-RT-010], producer: adopter_qualification_harness, consumer: publication_eligibility, cost: adopter_execution, rejection: missing_profile_or_failed_fixed_point}
- {id: TR-014, from: ST-ADOPTER-QUAL, to: ST-PUBLISHED, invariants: [INV-RT-004, INV-RT-008], producer: provider_release_publication, consumer: custody, cost: provider_publication, rejection: qualification_or_upload_identity_mismatch}
- {id: TR-015, from: ST-PUBLISHED, to: ST-CUSTODY, invariants: [INV-RT-001, INV-RT-008, INV-RT-010], producer: release_custody_audit, consumer: future_release_and_human_review, cost: verification_only, rejection: immutable_custody_incomplete}
