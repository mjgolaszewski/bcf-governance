document: {kind: ci_graph, name: BCF Governance CI Graph, id: bcf-governance-ci-graph, version: 1.0.0, status: active, path: governance/ci-graph.yml}
schema_version: '1.0'
provider: github
profile_contract_version: '3.0'
default_branch: main
trusted_controller: {kind: self_governance_policy, policy_path: governance/self-governance-policy.yml}
evidence_storage: {path: governance/evidence-storage.yml, sha256: e7616b0c43cc0106779b5bab99ec9c1e5e8d30cbc51bff57a3698cb82454fdaa}
value_sources:
  self-policy: {kind: yaml, path: governance/self-governance-policy.yml, sha256: 1e3c297241651dcf86df075ffd4e87bf287622a89b57ccf1e349a14ffb92b98f}
  release-contract: {kind: yaml, path: governance/public-contracts.yml, sha256: b271126eff3e027388727b8324c113ef59024217bd5608b191850aeb0e09c8f7}
  protection-contract: {kind: yaml, path: governance/github-protection.yml, sha256: 5f8c6fcd0d569e17050f694571474faa0f7538d12a5d11cc51891cf01c59a53a}
  automation-contract: {kind: yaml, path: governance/automation-producers.yml, sha256: 74c02575f7599f9e4a82cacc60f6d60692ee81dd1f7bec20441e6b375cf77cce}
extension_points: [preflight, evidence-lane, before-truth, after-truth, exact-main-producer, trusted-control, scheduled-lane, release-role]
extensions:
- {id: bcf-break-glass-recovery, path: governance/ci-extensions/bcf-break-glass-recovery.yml, sha256: 831341d3ee3167c559aa83fd2eec5aea8adf94e6a5149c13b7c11c39ee3da874}
- {id: bcf-automation, path: governance/ci-extensions/bcf-automation.yml, sha256: adde42bee237d4da4a67a72d6d5e8600e63ed010486cea4084391f940b9d1bb0}
- {id: bcf-evidence-storage, path: governance/ci-extensions/bcf-evidence-storage.yml, sha256: 41e40dad457efc53292249a211575505e9d6021d73d3fee2e52c4e9eede68eea}
- {id: bcf-release, path: governance/ci-extensions/bcf-release.yml, sha256: 72b04805b3ea4a85b5a37bd769aa627a9079a173210ea63c9a022aaa07896921}
- {id: bcf-trusted-control, path: governance/ci-extensions/bcf-trusted-control.yml, sha256: 95b956f3cc565d0989552e0c964d45ae3bda021f2a01afb02b320aeb60379c48}
resource_classes:
  hosted-python:
    runner: ubuntu-24.04
    trust: candidate
    hosted: true
    python_version: '3.12'
    capabilities: [git, python]
  hosted-python-latest:
    runner: ubuntu-latest
    trust: candidate
    hosted: true
    python_version: '3.12'
    capabilities: [git, python]
  hosted-release:
    runner: ubuntu-24.04
    trust: candidate
    hosted: true
    python_version: '3.12'
    capabilities: [git, python, release-runtime]
  trusted-control:
    runner: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
    trust: trusted
    hosted: false
    python_version: '3.12'
    capabilities: [provider-api]
  trusted-control-instance:
    runner: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner, '${{ matrix.trusted_runner }}']
    trust: trusted
    hosted: false
    python_version: '3.12'
    capabilities: [provider-api]
  recovery-control-instance:
    runner: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner, '${{ matrix.trusted_runner }}']
    trust: candidate
    hosted: false
    python_version: '3.12'
    capabilities: [provider-api]
artifacts:
  governance-session: {path: .artifacts/bcf/sessions, kind: session, scope: run-attempt, retention_days: 30}
  governance-receipts: {path: .artifacts/bcf/sessions, kind: lane-input, scope: run-attempt, retention_days: 30}
  governance-truth-report: {path: .artifacts/bcf/truth-report.json, kind: terminal, scope: run-attempt, retention_days: 30}
  exact-main-certification: {path: .artifacts/bcf/exact-main-certification, kind: control, scope: run-attempt, retention_days: 30}
  nightly-mutant-results: {path: .artifacts/scheduled-mutants, kind: control, scope: run-attempt, retention_days: 90}
  weekly-mutant-results: {path: .artifacts/scheduled-mutants, kind: control, scope: run-attempt, retention_days: 90}
  trusted-controller-bundle: {path: .artifacts/trusted-control, kind: control, scope: run-attempt, retention_days: 30}
  prior-evidence-transport: {path: .artifacts/bcf/prior-evidence, kind: control, scope: run-attempt, retention_days: 30}
conditions: {evidence-prerequisites-green: needs.preflight.result == 'success' && needs.evidence.result == 'success', prior-evidence-enabled: inputs.use_prior_evidence == true, prior-evidence-disabled: inputs.use_prior_evidence != true, evidence-prerequisites-with-prior: needs.preflight.result == 'success' && needs.evidence.result == 'success' && inputs.use_prior_evidence == true, evidence-prerequisites-without-prior: needs.preflight.result == 'success' && needs.evidence.result == 'success' && inputs.use_prior_evidence != true, exact-main-authority-enabled: vars.BCF_CI_AUTHORITY_ENABLED == 'true', exact-main-semantic-admission-enabled: vars.BCF_CI_AUTHORITY_ENABLED == 'true' && needs.trusted-controller-build.outputs.semantic_evidence_applicable == 'true', exact-main-admitted: needs.admit.result == 'success', exact-main-finalizer-admitted: vars.BCF_CI_AUTHORITY_ENABLED == 'true' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main', exact-main-publisher-admitted: vars.BCF_CI_AUTHORITY_ENABLED
    == 'true' && github.event.workflow_run.name == 'bcf/trusted-evidence-finalizer' && github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.head_branch == 'main', always-step: always()}
commands:
  install-governance-dependencies:
    argv: ['{python}', -m, pip, install, -r, requirements-governance.txt]
    cwd: .
    environment: {}
  governance-preflight:
    argv: ['{python}', scripts/preflight_governance.py, --repo-root, ., --evaluation-mode, '${{ inputs.evaluation_mode || ''pr'' }}', --evaluation-target, '${{ inputs.evaluation_target || '''' }}', --python, '{python}', --artifact-root, .artifacts/bcf, --expected-producer, evidence, --format, text]
    cwd: .
    environment: {}
  governance-preflight-with-prior:
    argv: ['{python}', scripts/preflight_governance.py, --repo-root, ., --evaluation-mode, '${{ inputs.evaluation_mode || ''pr'' }}', --evaluation-target, '${{ inputs.evaluation_target || '''' }}', --python, '{python}', --artifact-root, .artifacts/bcf, --expected-producer, evidence, --prior-evidence-dir, .artifacts/bcf/prior-evidence, --format, text]
    cwd: .
    environment: {}
  capture-governance-shard:
    argv: ['{python}', scripts/capture_governance_shard.py, --repo-root, ., --shard-index, '${{ matrix.shard }}', --shard-count, '4', --session-root, .artifacts/bcf/sessions]
    cwd: .
    environment: {}
  restore-governance-session-modes:
    argv: ['{python}', scripts/restore_evidence_modes.py, --root, .artifacts/bcf/sessions]
    cwd: .
    environment: {}
  restore-evidence-modes:
    argv: ['{python}', .github/scripts/restore_evidence_modes.py, --root, .artifacts/bcf/fan-in]
    cwd: .
    environment: {}
  governance-truth:
    argv: ['{python}', scripts/governance_truth.py, --repo-root, ., --evidence-dir, .artifacts/bcf/fan-in, --evaluation-mode, '${{ inputs.evaluation_mode || ''pr'' }}', --evaluation-target, '${{ inputs.evaluation_target || '''' }}', --format, json, --durable-ref, 'github-actions://${{ github.repository }}/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/bcf-governance-truth', --output, .artifacts/bcf/truth-report.json]
    cwd: .
    environment: {}
  governance-truth-with-prior:
    argv: ['{python}', scripts/governance_truth.py, --repo-root, ., --evidence-dir, .artifacts/bcf/fan-in, --prior-evidence-dir, .artifacts/bcf/prior-evidence, --evaluation-mode, '${{ inputs.evaluation_mode || ''pr'' }}', --evaluation-target, '${{ inputs.evaluation_target || '''' }}', --format, json, --durable-ref, 'github-actions://${{ github.repository }}/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/bcf-governance-truth', --output, .artifacts/bcf/truth-report.json]
    cwd: .
    environment: {}
  governance-terminal-observation:
    argv: ['{python}', .github/scripts/governance_terminal_observation.py, --repo-root, ., --output, .artifacts/bcf/truth-report.json, --preflight-result, '${{ needs.preflight.result }}', --evidence-result, '${{ needs.evidence.result }}', --repository, '${{ github.repository }}', --commit-sha, '${{ github.sha }}', --run-id, '${{ github.run_id }}', --run-attempt, '${{ github.run_attempt }}', --evaluation-mode, '${{ inputs.evaluation_mode || ''pr'' }}', --evaluation-target, '${{ inputs.evaluation_target || '''' }}']
    cwd: .
    environment: {}
  scheduled-preflight:
    argv: ['{python}', scripts/preflight_governance.py, --repo-root, ., --mode, release, --python, '{python}', --format, text]
    cwd: .
    environment: {}
  nightly-validator-mutants:
    argv: ['{python}', .github/scripts/run_validator_mutants.py, --profile, high-value, --output, .artifacts/scheduled-mutants/nightly-validator.json]
    cwd: .
    environment: {}
  nightly-semantic-mutants:
    argv: ['{python}', .github/scripts/run_validator_mutants.py, --profile, semantic-high-value, --output, .artifacts/scheduled-mutants/nightly-semantic.json]
    cwd: .
    environment: {}
  weekly-validator-mutants:
    argv: ['{python}', .github/scripts/run_validator_mutants.py, --profile, full, --output, .artifacts/scheduled-mutants/weekly-validator.json]
    cwd: .
    environment: {}
  weekly-semantic-mutants:
    argv: ['{python}', .github/scripts/run_validator_mutants.py, --profile, semantic-full, --output, .artifacts/scheduled-mutants/weekly-semantic.json]
    cwd: .
    environment: {}
  bootstrap-test-toolchain:
    argv: ['{python}', .github/scripts/bootstrap_test_toolchain.py, --repo-root, .]
    cwd: .
    environment: {}
  build-trusted-controller:
    argv: ['{python}', .github/scripts/build_trusted_controller.py, --output, .artifacts/trusted-control, --run-id, '${{ github.run_id }}', --run-attempt, '${{ github.run_attempt }}']
    cwd: .
    environment: {}
  resolve-effective-controller-candidate:
    argv: ['{python}', -m, bcf_governance.cli, ci-github, controller-rotation, resolve, --repository, '${{ github.repository }}']
    cwd: .
    environment: {GITHUB_TOKEN: '${{ github.token }}'}
  classify-exact-main-controller:
    argv: ['{python}', -m, bcf_governance.cli, ci, controller-applicability, --repo-root, ., --target-commit, '${{ steps.candidate-effective-controller.outputs.BCF_BOOTSTRAP_COMMIT_SHA }}', --github-output, --format, json]
    cwd: .
    environment: {}
  exact-main-admit-effective:
    argv: ['${{ runner.tool_cache }}/bcf-governance/${{ steps.effective-controller.outputs.BCF_BOOTSTRAP_COMMIT_SHA }}/bin/bcf', ci-github, exact-main, admit, --repository, '${{ github.repository }}', --sha, '${{ github.sha }}', --target-url, 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}', --evaluation-mode, workitem, --evaluation-target, P28-P0-02]
    cwd: .
    environment: {GITHUB_TOKEN: '${{ github.token }}'}
  prior-evidence-effective:
    argv: ['${{ runner.tool_cache }}/bcf-governance/${{ steps.effective-controller.outputs.BCF_BOOTSTRAP_COMMIT_SHA }}/bin/bcf', ci-github, prior-evidence, transport, --repository, '${{ github.repository }}', --main-sha, '${{ github.sha }}', --output, '${{ runner.temp }}/bcf-prior-evidence']
    cwd: .
    environment: {GITHUB_TOKEN: '${{ github.token }}', BCF_PROTECTION_INSPECT_REQUIRED: 'true', BCF_PROTECTION_INSPECT_APP_TOKEN: '${{ steps.protection-inspector-token.outputs.token }}', BCF_PROTECTION_INSPECT_INSTALLATION_ID: '${{ vars.BCF_PROTECTION_INSPECT_INSTALLATION_ID }}', BCF_PROTECTION_INSPECT_OBSERVED_INSTALLATION_ID: '${{ steps.protection-inspector-token.outputs.installation-id }}'}
  exact-main-finalize-effective:
    argv: ['${{ runner.tool_cache }}/bcf-governance/${{ steps.effective-controller.outputs.BCF_BOOTSTRAP_COMMIT_SHA }}/bin/bcf', ci-github, exact-main, finalize, --repository, '${{ github.repository }}', --trigger-run-id, '${{ github.event.workflow_run.id }}', --trigger-run-attempt, '${{ github.event.workflow_run.run_attempt }}', --output, '${{ runner.temp }}/bcf-exact-main-certification']
    cwd: .
    environment: {GITHUB_TOKEN: '${{ github.token }}'}
  exact-main-publish-effective:
    argv: ['${{ runner.tool_cache }}/bcf-governance/${{ steps.effective-controller.outputs.BCF_BOOTSTRAP_COMMIT_SHA }}/bin/bcf', ci-github, exact-main, publish, --repository, '${{ github.repository }}', --bundle, '${{ runner.temp }}/bcf-exact-main-certification', --target-url, 'https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}', --collector-run-id, '${{ github.event.workflow_run.id }}', --collector-run-attempt, '${{ github.event.workflow_run.run_attempt }}']
    cwd: .
    environment: {GITHUB_TOKEN: '${{ github.token }}'}
step_components:
  checkout-candidate:
    kind: action
    name: Check out the exact candidate commit
    action: checkout
    with: {fetch-depth: 0, persist-credentials: false}
    environment: {}
    produces: []
    consumes: []
  setup-python:
    kind: action
    name: Provision the declared Python runtime
    action: setup-python
    with: {python-version: '3.12'}
    environment: {}
    produces: []
    consumes: []
  install-governance:
    kind: command
    name: Install the declared governance environment
    command: install-governance-dependencies
    environment: {}
    produces: []
    consumes: []
  run-governance-preflight:
    kind: command
    name: Run canonical cheap preflight and allocate one evidence session
    condition: prior-evidence-disabled
    command: governance-preflight
    environment: {}
    produces: []
    consumes: []
  run-governance-preflight-with-prior:
    kind: command
    name: Run canonical cheap preflight with exact prior evidence
    condition: prior-evidence-enabled
    command: governance-preflight-with-prior
    environment: {}
    produces: []
    consumes: []
  upload-governance-session:
    kind: action
    name: Upload the exact evidence session
    action: upload-artifact
    with: {name: 'bcf-session-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/bcf/sessions, if-no-files-found: error, retention-days: 30}
    environment: {}
    produces: [governance-session]
    consumes: []
  download-governance-session:
    kind: action
    name: Download this attempt's evidence session
    action: download-artifact
    with: {name: 'bcf-session-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/bcf/sessions}
    environment: {}
    produces: []
    consumes: [governance-session]
  capture-governance-shard:
    kind: command
    name: Capture the mechanically derived evidence shard
    command: capture-governance-shard
    environment: {}
    produces: []
    consumes: []
  upload-governance-receipts:
    kind: action
    name: Upload this attempt's exact evidence shard
    condition: always-step
    action: upload-artifact
    with: {name: 'bcf-evidence-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}', path: .artifacts/bcf/sessions, if-no-files-found: error, retention-days: 30}
    environment: {}
    produces: [governance-receipts]
    consumes: []
  download-governance-receipts:
    kind: action
    name: Download only this attempt's evidence shards
    condition: evidence-prerequisites-green
    action: download-artifact
    with: {pattern: 'bcf-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*', path: .artifacts/bcf/fan-in}
    environment: {}
    produces: []
    consumes: [governance-receipts]
  restore-evidence-modes:
    kind: command
    name: Restore private evidence-session modes
    condition: evidence-prerequisites-green
    command: restore-evidence-modes
    restores_private_artifacts: [governance-receipts]
    environment: {}
    produces: []
    consumes: []
  restore-governance-session-modes:
    kind: command
    name: Restore downloaded evidence-session modes
    command: restore-governance-session-modes
    restores_private_artifacts: [governance-session]
    environment: {}
    produces: []
    consumes: []
  run-governance-truth:
    kind: command
    name: Verify exact-tree governance evidence
    condition: evidence-prerequisites-without-prior
    command: governance-truth
    environment: {}
    produces: [governance-truth-report]
    consumes: []
  run-governance-truth-with-prior:
    kind: command
    name: Verify exact-tree governance evidence with prior transport
    condition: evidence-prerequisites-with-prior
    command: governance-truth-with-prior
    environment: {}
    produces: [governance-truth-report]
    consumes: []
  preserve-terminal-observation:
    kind: command
    name: Preserve a causal terminal result
    condition: always-step
    command: governance-terminal-observation
    environment: {}
    produces: [governance-truth-report]
    consumes: []
  upload-governance-truth:
    kind: action
    name: Upload this attempt's terminal truth report
    condition: always-step
    action: upload-artifact
    with: {name: 'bcf-governance-truth-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/bcf/truth-report.json, if-no-files-found: error, retention-days: 30}
    environment: {}
    produces: [governance-truth-report]
    consumes: []
  exact-main-admit-effective:
    kind: command
    name: Authenticate exact-main admission with the effective controller
    command: exact-main-admit-effective
    environment: {}
    produces: []
    consumes: []
  protection-inspector-token:
    kind: action
    name: Mint repository-scoped protection inspection token
    id: protection-inspector-token
    action: create-github-app-token
    with: {app-id: '${{ vars.BCF_PROTECTION_INSPECT_APP_ID }}', private-key: '${{ secrets.BCF_PROTECTION_INSPECT_APP_PRIVATE_KEY }}', owner: '${{ github.repository_owner }}', repositories: '${{ github.event.repository.name }}', permission-administration: write}
    environment: {}
    produces: []
    consumes: []
  prior-evidence-effective:
    kind: command
    name: Authenticate and preserve prior merged-PR evidence
    command: prior-evidence-effective
    environment: {}
    produces: [prior-evidence-transport]
    consumes: []
  upload-prior-evidence-effective:
    kind: action
    name: Upload exact prior evidence transport
    action: upload-artifact
    with: {name: 'bcf-prior-evidence-transport-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/bcf-prior-evidence', if-no-files-found: error, retention-days: 30}
    environment: {}
    produces: [prior-evidence-transport]
    consumes: []
  exact-main-finalize-effective:
    kind: command
    name: Reconstruct exact-main evidence with the effective controller
    command: exact-main-finalize-effective
    environment: {}
    produces: [exact-main-certification]
    consumes: []
  upload-exact-main-certification-effective:
    kind: action
    name: Upload exact-main certification bundle
    action: upload-artifact
    with: {name: 'bcf-exact-main-certification-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/bcf-exact-main-certification', if-no-files-found: error, retention-days: 30}
    environment: {}
    produces: [exact-main-certification]
    consumes: []
  download-exact-main-certification-effective:
    kind: action
    name: Download exact finalizer certification bundle
    action: download-artifact
    with: {name: 'bcf-exact-main-certification-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}', github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: '${{ github.event.workflow_run.id }}', path: '${{ runner.temp }}/bcf-exact-main-certification'}
    environment: {}
    produces: []
    consumes: [exact-main-certification]
  exact-main-publish-effective:
    kind: command
    name: Publish authenticated exact-main status with the effective controller
    command: exact-main-publish-effective
    environment: {}
    produces: []
    consumes: [exact-main-certification]
  scheduled-preflight:
    kind: command
    name: Validate selected interpreter and governance before mutants
    command: scheduled-preflight
    environment: {}
    produces: []
    consumes: []
  nightly-validator-mutants:
    kind: command
    name: Run high-value validator mutants
    command: nightly-validator-mutants
    environment: {}
    produces: []
    consumes: []
  nightly-semantic-mutants:
    kind: command
    name: Run high-value governance semantic mutants
    command: nightly-semantic-mutants
    environment: {}
    produces: []
    consumes: []
  upload-nightly-mutants:
    kind: action
    name: Retain exact nightly mutant results
    condition: always-step
    action: upload-artifact
    with: {name: 'bcf-scheduled-mutants-nightly-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/scheduled-mutants, if-no-files-found: error, retention-days: 90}
    environment: {}
    produces: [nightly-mutant-results]
    consumes: []
  weekly-validator-mutants:
    kind: command
    name: Run full validator mutant profile
    command: weekly-validator-mutants
    environment: {}
    produces: []
    consumes: []
  weekly-semantic-mutants:
    kind: command
    name: Run full governance semantic mutant profile
    command: weekly-semantic-mutants
    environment: {}
    produces: []
    consumes: []
  upload-weekly-mutants:
    kind: action
    name: Retain exact weekly mutant results
    condition: always-step
    action: upload-artifact
    with: {name: 'bcf-scheduled-mutants-weekly-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/scheduled-mutants, if-no-files-found: error, retention-days: 90}
    environment: {}
    produces: [weekly-mutant-results]
    consumes: []
  setup-test-node:
    kind: action
    name: Select the exact real-compiler test Node runtime
    action: setup-node
    with: {node-version: 22.23.2, package-manager-cache: false}
    environment: {}
    produces: []
    consumes: []
  bootstrap-test-toolchain:
    kind: command
    name: Verify and materialize the locked offline TypeScript test compiler
    command: bootstrap-test-toolchain
    environment: {}
    produces: []
    consumes: []
  build-trusted-controller:
    kind: command
    name: Build the exact-main trusted controller bundle
    command: build-trusted-controller
    environment: {}
    produces: [trusted-controller-bundle]
    consumes: []
  resolve-effective-controller-candidate:
    kind: command
    name: Observe provider-effective controller for non-authoritative routing
    id: candidate-effective-controller
    command: resolve-effective-controller-candidate
    environment: {}
    produces: []
    consumes: []
  classify-exact-main-controller:
    kind: command
    name: Classify exact-main semantic evidence applicability
    id: exact-main-applicability
    command: classify-exact-main-controller
    environment: {}
    produces: []
    consumes: []
  upload-trusted-controller:
    kind: action
    name: Upload the exact-main trusted controller bundle
    action: upload-artifact
    with: {name: 'bcf-trusted-control-${{ github.sha }}-${{ github.run_attempt }}', path: .artifacts/trusted-control, if-no-files-found: error, retention-days: 30}
    environment: {}
    produces: [trusted-controller-bundle]
    consumes: []
workflows:
- id: governance
  path: .github/workflows/governance.yml
  display_name: governance
  role: pull-request
  events:
  - {type: pull_request}
  - type: workflow_call
    inputs:
      evaluation_mode: {description: Exact truth evaluation mode selected by the trusted caller, required: false, default: pr, type: string}
      evaluation_target: {description: Exact typed target required only for bounded workitem certification, required: false, default: '', type: string}
      use_prior_evidence: {description: Consume exact caller-bound prior evidence when present, required: false, default: false, type: boolean}
  permissions: {contents: read}
  jobs:
  - id: preflight
    display_name: Validate governance front door
    semantic_role: cheap-preflight
    resource_class: hosted-python-latest
    trust: candidate
    needs: []
    condition: success
    timeout_minutes: 10
    permissions: {contents: read}
    checkout: false
    components: []
    executor:
      kind: component_sequence
      components: [checkout-candidate, setup-python, install-governance, run-governance-preflight, run-governance-preflight-with-prior, upload-governance-session]
    produces: [governance-session]
    consumes: [prior-evidence-transport]
    required: true
  - id: evidence
    display_name: Evidence / ${{ matrix.display_name }}
    semantic_role: required-evidence-shards
    resource_class: hosted-python-latest
    trust: candidate
    needs: [preflight]
    condition: success
    timeout_minutes: 60
    permissions: {contents: read}
    checkout: false
    components: []
    strategy:
      fail_fast: false
      max_parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
        include:
        - {shard: 0, display_name: Evidence shard 0}
        - {shard: 1, display_name: Evidence shard 1}
        - {shard: 2, display_name: Evidence shard 2}
        - {shard: 3, display_name: Evidence shard 3}
    executor:
      kind: gate_shard
      shard_key: shard
      shard_count: 4
      gates: [governance-validate, governance-exposure-scan, architecture-test, architecture-module-size, architecture-layer-membership, architecture-context-membership, architecture-import-boundaries, architecture-cqrs-side, architecture-router-thinness, architecture-duplication, lint, typecheck, test, contract-test, security-secret-scan, security-dependency-audit, security-sbom, security-vulnerability-scan, runtime-smoke, semantic-ownership]
      components: [checkout-candidate, setup-python, install-governance, setup-test-node, bootstrap-test-toolchain, download-governance-session, restore-governance-session-modes, capture-governance-shard, upload-governance-receipts]
    produces: [governance-receipts]
    consumes: [governance-session]
    required: true
  - id: governance-truthfulness
    display_name: Verify exact-tree governance evidence
    semantic_role: terminal-governance-truth
    resource_class: hosted-python-latest
    trust: candidate
    needs: [preflight, evidence]
    condition: always
    timeout_minutes: 15
    permissions: {contents: read}
    checkout: false
    components: []
    executor:
      kind: terminal_truth
      command: governance-truth
      components: [checkout-candidate, setup-python, install-governance, download-governance-receipts, restore-evidence-modes, run-governance-truth, run-governance-truth-with-prior, preserve-terminal-observation, upload-governance-truth]
    produces: [governance-truth-report]
    consumes: [governance-receipts, prior-evidence-transport]
    required: true
- id: exact-main
  path: .github/workflows/bcf-exact-main.yml
  display_name: bcf/exact-main-admission
  role: exact-main
  events:
  - type: push
    branches: [main]
  permissions: {contents: read}
  jobs:
  - id: admit
    display_name: Authenticate exact-main admission and publish pending authority
    semantic_role: exact-main-admission
    resource_class: trusted-control
    trust: trusted
    controller_requirement: current-or-recovery-reentry
    needs: [trusted-controller-build]
    condition: exact-main-semantic-admission-enabled
    timeout_minutes: 5
    permissions: {actions: write, contents: read, statuses: write}
    checkout: false
    components: []
    protected_environment: bcf-trusted-protection-inspection
    executor:
      kind: component_sequence
      components: [setup-python, resolve-effective-controller, exact-main-admit-effective, protection-inspector-token, prior-evidence-effective, upload-prior-evidence-effective]
      evaluation_mode: workitem
      evaluation_target: P28-P0-02
      protection_inspection: true
    produces: [prior-evidence-transport]
    consumes: []
    required: true
  - id: governance
    display_name: Run exact-main governance evidence
    semantic_role: exact-main-governance-producer
    resource_class: hosted-python-latest
    trust: candidate
    needs: [admit]
    condition: exact-main-admitted
    timeout_minutes: 60
    permissions: {contents: read}
    checkout: false
    components: []
    executor:
      kind: reusable_workflow
      path: .github/workflows/governance.yml
      inputs: {evaluation_mode: workitem, evaluation_target: P28-P0-02, use_prior_evidence: true}
      artifact_bindings: {prior-evidence-transport: use_prior_evidence}
    produces: []
    consumes: [prior-evidence-transport]
    required: true
  - id: trusted-controller-build
    display_name: Build independent exact-main trusted controller
    semantic_role: exact-main-controller-builder
    resource_class: hosted-python-latest
    trust: candidate
    needs: []
    condition: exact-main-authority-enabled
    timeout_minutes: 15
    permissions: {actions: read, contents: read}
    checkout: false
    components: []
    outputs: {controller_state: '${{ steps.exact-main-applicability.outputs.controller_state }}', semantic_evidence_applicable: '${{ steps.exact-main-applicability.outputs.semantic_evidence_applicable }}', target_commit: '${{ steps.exact-main-applicability.outputs.target_commit }}'}
    executor:
      kind: component_sequence
      components: [checkout-candidate, setup-python, install-governance, resolve-effective-controller-candidate, classify-exact-main-controller, build-trusted-controller, upload-trusted-controller]
    produces: [trusted-controller-bundle]
    consumes: []
    required: true
- id: exact-main-finalizer
  path: .github/workflows/bcf-trusted-finalizer.yml
  display_name: bcf/trusted-evidence-finalizer
  role: trusted-control
  events:
  - type: workflow_run
    workflows: [bcf/exact-main-admission]
    types: [completed]
  permissions: {actions: read, contents: read}
  jobs:
  - id: finalize
    display_name: Reconstruct the newest same-admission exact-main evidence
    semantic_role: exact-main-trusted-finalizer
    resource_class: trusted-control
    trust: trusted
    controller_requirement: current
    needs: []
    condition: exact-main-finalizer-admitted
    timeout_minutes: 5
    permissions: {actions: read, contents: read}
    checkout: false
    components: []
    executor:
      kind: component_sequence
      components: [setup-python, resolve-effective-controller, exact-main-finalize-effective, upload-exact-main-certification-effective]
    produces: [exact-main-certification]
    consumes: []
    required: true
- id: exact-main-publisher
  path: .github/workflows/bcf-status-publisher.yml
  display_name: bcf/exact-main-status-publisher
  role: trusted-control
  events:
  - type: workflow_run
    workflows: [bcf/trusted-evidence-finalizer, bcf/automation-changelog-reconciler]
    types: [completed]
  permissions: {actions: read, contents: write, statuses: write}
  jobs:
  - id: publish
    display_name: Publish newest authenticated exact-main status or revocation
    semantic_role: exact-main-status-publisher
    resource_class: trusted-control
    trust: trusted
    controller_requirement: current
    needs: []
    condition: exact-main-publisher-admitted
    timeout_minutes: 5
    permissions: {actions: read, contents: read, statuses: write}
    checkout: false
    components: []
    executor:
      kind: component_sequence
      components: [setup-python, download-exact-main-certification-effective, resolve-effective-controller, exact-main-publish-effective]
    produces: []
    consumes: [exact-main-certification]
    required: true
  - id: rotation-callback
    display_name: Dispatch post-rotation exact-main certification
    semantic_role: routine-controller-certification-callback
    resource_class: trusted-control
    trust: trusted
    controller_requirement: current
    needs: []
    condition: routine-callback-applicable
    timeout_minutes: 5
    permissions: {actions: write, contents: write}
    checkout: false
    components: []
    executor:
      kind: component_sequence
      components: [setup-python, resolve-effective-controller, dispatch-routine-certification]
    produces: []
    consumes: []
    required: true
- id: scheduled-nightly-mutants
  path: .github/workflows/governance-mutants-nightly.yml
