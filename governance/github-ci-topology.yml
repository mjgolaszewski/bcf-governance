schema_version: '1.0'
provider: github
dispatch_events:
- bcf-exact-ref-v1
- bcf-certification-finalize-v1
- bcf-status-publish-v1
roles:
- id: exact-main-kickoff
  runner_labels:
  - self-hosted
  - Linux
  - X64
  - bcf-governance
  - vm-linux-ci-runner
  code_execution: false
  checkout: false
  permissions:
  - actions:read
  - contents:read
- id: exact-ref-producer
  runner_labels:
  - ubuntu-latest
  code_execution: true
  checkout: true
  persist_credentials: false
  permissions:
  - contents:read
  disposable: true
- id: trusted-finalizer
  runner_labels:
  - self-hosted
  - Linux
  - X64
  - bcf-governance
  - vm-linux-ci-runner
  code_execution: false
  checkout: false
  permissions:
  - actions:read
  - contents:read
- id: status-publisher
  runner_labels:
  - self-hosted
  - Linux
  - X64
  - bcf-governance
  - vm-linux-ci-runner
  code_execution: false
  checkout: false
  permissions:
  - actions:read
  - contents:read
  - statuses:write
coordination:
  polling: false
  sleeping: false
  idle_waiter: false
  callback_payload_authoritative: false
  provider_api_reconstruction: true
default_branch: main
producer_workflows:
- governance
- governance-pack
activation_variable: BCF_CI_AUTHORITY_ENABLED
dispatch_exact_ref: false
controller_commit: 37475fbff2c5303762e0fdeb97e7cc7834bfe485
