schema_version: '1.0'
provider: github
dispatch_events: []
roles:
- id: exact-main-kickoff
  runner_labels:
  - self-hosted
  - Linux
  - X64
  - bcf-governance
  - vm-linux-ci-runner
  code_execution: false
  checkout: false
  permissions:
  - actions:read
  - contents:read
  - statuses:write
- id: exact-ref-producer
  runner_labels:
  - ubuntu-latest
  code_execution: true
  checkout: true
  persist_credentials: false
  permissions:
  - contents:read
  disposable: true
- id: trusted-finalizer
  runner_labels:
  - self-hosted
  - Linux
  - X64
  - bcf-governance
  - vm-linux-ci-runner
  code_execution: false
  checkout: false
  permissions:
  - actions:read
  - contents:read
- id: status-publisher
  runner_labels:
  - self-hosted
  - Linux
  - X64
  - bcf-governance
  - vm-linux-ci-runner
  code_execution: false
  checkout: false
  permissions:
  - actions:read
  - contents:read
  - statuses:write
coordination:
  polling: false
  sleeping: false
  idle_waiter: false
  callback_payload_authoritative: false
  provider_api_reconstruction: true
authority_contract_version: '1.1'
default_branch: main
producer_workflows:
- job_id: governance
  display_name: Run exact-main governance evidence
  path: .github/workflows/governance.yml
  inputs:
    evaluation_mode: closure
- job_id: governance-pack
  display_name: Verify exact-main package and templates
  path: .github/workflows/governance-pack.yml
  inputs:
    build_controller: true
activation_variable: BCF_CI_AUTHORITY_ENABLED
controller_commit: 67601972fa98e1b58641fbb56de78a081a823076
dispatch_exact_ref: false
