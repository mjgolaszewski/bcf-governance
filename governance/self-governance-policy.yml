  coordination_policy: [no_polling, no_sleeping, no_idle_waiters]
  temporary_local_window: {status: closed, closed_at_utc: '2026-08-30T00:00:00Z', reason: GitHub-hosted ephemeral candidate capacity restored, privileged_publication_enabled: false, restore_condition: not_applicable_closed_window}
  jobs:
