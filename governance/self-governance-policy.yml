schema_version: '1.0'
thin_wrapper_loc_cap: 20
tooling_contexts:
  ci_authority: [ci_authority_, ci_adopt_github.py, ci_commands.py, ci_github.py, ci_github_, local_pr.py, trusted_inputs.py]
  cleanup: [cleanup_ci_resources.py, cleanup_governance_pack.py, evidence_session_cleanup.py, governance_cleanup/]
  evidence: [evidence_attestation.py, evidence_execution.py, evidence_sessions.py, evidence_test_adapters.py, governance_evidence.py, governance_truth.py, governance_truth_support.py, release_receipts.py, test_manifests.py, truth_receipts.py, truth_sessions.py]
  install: [install_governance_pack.py, governance_install/]
  operations: [migrate_governance_evidence.py, publish_audit.py, scaffold_governance_artifacts.py]
  profiles: [governance_profiles.py, profile_]
  runtime: [runtime_capacity.py]
  semantic_ownership: [semantic_ownership_]
  validation: [check_governance_exposure.py, doctor_governance_pack.py, preflight.py, validate_governance_yaml.py, governance_validation/]
cli_commands:
  read_only: [doctor, exposure-scan, preflight, publish-audit, semantic-ownership, truth, validate]
  mutating: [ci, ci-cleanup, ci-github, cleanup, evidence, install, migrate-evidence, profile, scaffold, test-manifest]
required_dependencies:
  PyYAML: '>=6.0,<7'
  jsonschema: '>=4.21,<5'
sbom_format: CycloneDX
forbid_subprocess_shell: true
runner_security:
  hosted_fallback_allowed: false
  fork_pull_request_policy: provider_isolated_standard_hosted_runner
  candidate_substrate: github_standard_hosted_fresh_vm
  candidate_routing:
    candidate_runner: ubuntu-latest
    repository_visibility: public
    billing_class: standard_public_repository
  candidate_lifecycle: provider_fresh_vm_per_job_destroyed_after_completion
  trusted_labels: [self-hosted, Linux, X64, bcf-governance, vm-linux-ci-runner]
  trusted_instance_labels: [bcf-trusted-control-1, bcf-trusted-control-2]
  trusted_controller_interpreter:
    action: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
    python_version: '3.12'
    required_workflows: [.github/workflows/bcf-trusted-control-probe.yml]
  trusted_controller_artifact: {BCF_BOOTSTRAP_ARTIFACT_ID: '9742408170', BCF_BOOTSTRAP_ARTIFACT_NAME: bcf-trusted-control-a22dc0f5ca6a451d337a45a956c6b805d57509c7-1, BCF_BOOTSTRAP_ARTIFACT_DIGEST: 'sha256:0ffbe4d7b99b6e10b3cf7219add3c28c9e53da05865abba43797f1d45921f4b9', BCF_BOOTSTRAP_RUN_ID: '33347212821', BCF_BOOTSTRAP_RUN_ATTEMPT: '1', BCF_BOOTSTRAP_COMMIT_SHA: a22dc0f5ca6a451d337a45a956c6b805d57509c7, BCF_BOOTSTRAP_TREE_SHA: 75eabee55abe367b1a690a013715dd0dcc915307, BCF_BOOTSTRAP_REPOSITORY_ID: '1207503211', BCF_BOOTSTRAP_WHEEL_SHA256: aaf4c24ae11388607dfd5c3ca9d65af5a54b9f068abf91782de830a1b281cf29}
  coordination_policy: [no_polling, no_sleeping, no_idle_waiters]
  temporary_local_window:
    status: closed
    closed_at_utc: '2026-08-30T00:00:00Z'
    reason: GitHub-hosted ephemeral candidate capacity restored
    privileged_publication_enabled: false
    restore_condition: not_applicable_closed_window
  jobs:
    .github/workflows/bcf-trusted-control-bootstrap.yml: {bootstrap: trusted_bootstrap}
    .github/workflows/bcf-trusted-control-probe.yml: {probe: trusted}
    .github/workflows/governance-mutants-nightly.yml: {high-value-mutants: candidate}
    .github/workflows/governance-mutants-weekly.yml: {full-mutants: candidate}
    .github/workflows/governance-pack.yml: {pack-checks: candidate, ast-checks: candidate}
    .github/workflows/governance.yml: {preflight: candidate, evidence: candidate, governance-truthfulness: candidate}
    .github/workflows/release.yml: {release-artifacts: candidate, publish-release: trusted}
  trusted_job_activation:
    .github/workflows/bcf-trusted-control-bootstrap.yml: {bootstrap: owner_main_dispatch}
    .github/workflows/bcf-trusted-control-probe.yml: {probe: owner_main_dispatch}
    .github/workflows/release.yml: {publish-release: disabled}
