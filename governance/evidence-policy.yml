document: {kind: evidence_integrity_policy, name: BCF Governance Evidence Integrity Policy, id: bcf-governance-evidence-policy, version: 1.0.0, generated_at_utc: '2026-08-14T00:00:00Z', status: active, path: governance/evidence-policy.yml}
settings:
