document: {kind: evidence_integrity_policy, name: BCF Governance Evidence Integrity Policy, id: bcf-governance-evidence-policy,
  version: 1.0.0, generated_at_utc: '2026-08-14T00:00:00Z', status: active, path: governance/evidence-policy.yml}
settings:
  authored_terminal_states: []
  computed_states: [verified, closed]
  default_binding: exact_tree
  tree_independent_allowlist: []
  require_negative_control_for_required_gates: true
  required_test_defaults: {min_collected: 1, min_executed: 1, max_skipped: 0}
claim_dependencies:
  workitems_closed: [source, test, governance]
  required_suites_green: [source, test, config, workflow]
  architecture_gates_green: [source, test, config, workflow]
  health_checks_green: [source, config, workflow]
  security_review_complete: [source, config, test, workflow, audit, governance, security_impact]
  findings_resolved: [source, test, audit, governance, security_impact]
  phase_closed: [workitems_closed, required_suites_green, architecture_gates_green, health_checks_green, security_review_complete,
    findings_resolved]
  release_ready: [phase_closed]
security_impact_categories: [authentication, authorization, cryptography, session_and_token_lifecycle, federation, tenant_containment,
  secrets_and_custody, security_middleware, authority_migrations, security_ci]
workflow_contract:
  paths: [.github/workflows/governance.yml]
  required_events: [pull_request, push]
  gate_resolvers:
  - {id: governance-evidence-shards, kind: canonical_contract_shards, workflow_path: .github/workflows/governance.yml, job_id: evidence,
    matrix_key: shard, script_path: .github/scripts/capture_governance_shard.py, gate_contract_path: governance/gate-contracts.yml,
    profile_path: governance-profile.yml}
gate_overrides:
  architecture-context-membership:
    evidence_kind: test_suite
    negative_controls:
    - id: architecture-context-membership-behavior-must-fail
      mutation: {path: governance/self-governance-policy.yml, search: 'validation: [check_governance_exposure.py, doctor_governance_pack.py,
          preflight.py, validate_governance_yaml.py, governance_validation/]', replace: 'validation: [check_governance_exposure.py,
          doctor_governance_pack.py, preflight.py, validate_governance_yaml.py, missing_validation/]'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_self_governance_contracts::test_tooling_modules_map_to_exactly_one_context']
    test_contract: {junit_xml: .artifacts/junit/architecture-context-membership.xml, expected_node_manifest: governance/test-manifests/architecture-context-membership.txt,
      expected_nodes_mode: exact, min_collected: 1, min_executed: 1, max_skipped: 0, artifact_binding: non_authoritative_until_captured}
  architecture-cqrs-side:
    evidence_kind: test_suite
    negative_controls:
    - id: architecture-cqrs-side-behavior-must-fail
      mutation: {path: governance/self-governance-policy.yml, search: 'read_only: [doctor, exposure-scan, preflight, publish-audit,
          semantic-ownership, truth, validate]', replace: 'read_only: [doctor, exposure-scan, preflight, publish-audit, semantic-ownership,
          validate]'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_self_governance_contracts::test_cli_command_query_sides_are_complete_and_disjoint']
    test_contract: {junit_xml: .artifacts/junit/architecture-cqrs-side.xml, expected_node_manifest: governance/test-manifests/architecture-cqrs-side.txt,
      expected_nodes_mode: exact, min_collected: 1, min_executed: 1, max_skipped: 0, artifact_binding: non_authoritative_until_captured}
  architecture-duplication:
    evidence_kind: test_suite
    negative_controls:
    - id: architecture-duplication-behavior-must-fail
      mutation: {path: template-repo/scripts/_bcf_runtime/governance_validation/required_artifacts.py, search: '"""Semantic
          contracts for standard repository root artifacts."""', replace: '"""Mutated standalone runtime contract."""'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_self_governance_contracts::test_template_and_private_runtime_copies_are_exact']
    test_contract: {junit_xml: .artifacts/junit/architecture-duplication.xml, expected_node_manifest: governance/test-manifests/architecture-duplication.txt,
      expected_nodes_mode: exact, min_collected: 1, min_executed: 1, max_skipped: 0, artifact_binding: non_authoritative_until_captured}
  architecture-import-boundaries:
    evidence_kind: test_suite
    negative_controls:
    - id: architecture-import-boundaries-behavior-must-fail
      mutation: {path: bcf_governance/__init__.py, search: from ._version import __version__, replace: 'import scripts

          from ._version import __version__'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_self_governance_contracts::test_packaged_code_does_not_import_public_wrapper_package']
    test_contract: {junit_xml: .artifacts/junit/architecture-import-boundaries.xml, expected_node_manifest: governance/test-manifests/architecture-import-boundaries.txt,
      expected_nodes_mode: exact, min_collected: 1, min_executed: 1, max_skipped: 0, artifact_binding: non_authoritative_until_captured}
  architecture-layer-membership:
    evidence_kind: test_suite
    negative_controls:
    - id: architecture-layer-membership-behavior-must-fail
      mutation: {path: architecture-boundaries.yml, search: 'path_tokens: [pack]', replace: 'path_tokens: [missing_pack]'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_self_governance_contracts::test_source_layout_maps_to_declared_package_layers']
    test_contract: {junit_xml: .artifacts/junit/architecture-layer-membership.xml, expected_node_manifest: governance/test-manifests/architecture-layer-membership.txt,
      expected_nodes_mode: exact, min_collected: 1, min_executed: 1, max_skipped: 0, artifact_binding: non_authoritative_until_captured}
  architecture-module-size:
    evidence_kind: test_suite
    negative_controls:
    - id: architecture-module-size-behavior-must-fail
      mutation: {path: architecture-boundaries.yml, search: 'max_loc: 800', replace: 'max_loc: 1'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_self_governance_contracts::test_production_modules_respect_self_governance_loc_cap']
    test_contract: {junit_xml: .artifacts/junit/architecture-module-size.xml, expected_node_manifest: governance/test-manifests/architecture-module-size.txt,
      expected_nodes_mode: exact, min_collected: 1, min_executed: 1, max_skipped: 0, artifact_binding: non_authoritative_until_captured}
  architecture-router-thinness:
    evidence_kind: test_suite
    negative_controls:
    - id: architecture-router-thinness-behavior-must-fail
      mutation: {path: governance/self-governance-policy.yml, search: 'thin_wrapper_loc_cap: 20', replace: 'thin_wrapper_loc_cap:
          1'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_self_governance_contracts::test_cli_and_source_wrappers_remain_thin']
    test_contract: {junit_xml: .artifacts/junit/architecture-router-thinness.xml, expected_node_manifest: governance/test-manifests/architecture-router-thinness.txt,
      expected_nodes_mode: exact, min_collected: 1, min_executed: 1, max_skipped: 0, artifact_binding: non_authoritative_until_captured}
  architecture-test:
    evidence_kind: test_suite
    negative_controls:
    - id: architecture-test-behavior-must-fail
      mutation: {path: architecture-boundaries.yml, search: 'source_roots: [bcf_governance]', replace: 'source_roots: [missing_package]'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_self_governance_contracts::test_source_roots_match_packaged_implementation']
    test_contract: {junit_xml: .artifacts/junit/architecture-test.xml, expected_node_manifest: governance/test-manifests/architecture-test.txt,
      expected_nodes_mode: exact, min_collected: 1, min_executed: 1, max_skipped: 0, artifact_binding: non_authoritative_until_captured}
  contract-test:
    evidence_kind: test_suite
    negative_controls:
    - id: contract-test-behavior-must-fail
      mutation: {path: template-repo/governance/artifact-manifest.yml, search: 'pull_request_policy: required_update', replace: 'pull_request_policy:
          optional'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_validate_governance_yaml::test_artifact_manifest_requires_standard_repository_artifact_contracts']
    - id: trusted-bootstrap-artifact-identity-must-fail
      mutation: {path: .github/workflows/bcf-trusted-control-bootstrap.yml, search: 'BCF_BOOTSTRAP_ARTIFACT_ID: "9740097978"', replace: 'BCF_BOOTSTRAP_ARTIFACT_ID: "1"'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_self_governance_contracts::test_trusted_bootstrap_is_owner_dispatched_pinned_and_offline']
    - id: trusted-bootstrap-venv-relocation-must-fail
      mutation: {path: .github/workflows/bcf-trusted-control-bootstrap.yml, search: '"$selected_python" -m venv "$install_root"', replace: '"$selected_python" -m venv "$install_root.stage"'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_self_governance_contracts::test_trusted_bootstrap_is_owner_dispatched_pinned_and_offline']
    - id: trusted-controller-interpreter-environment-must-fail
      mutation: {path: .github/workflows/bcf-trusted-control-probe.yml, search: 'actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065', replace: 'actions/setup-python@0000000000000000000000000000000000000000'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_self_governance_contracts::test_trusted_jobs_never_checkout_or_invoke_candidate_scripts']
    - id: ci-workflow-event-authentication-must-fail
      mutation: {path: bcf_governance/tooling/ci_authority_state.py, search: 'if not same_identity or actual.event not in
          allowed_events:', replace: 'if not same_identity:'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_ci_certification::test_untrusted_event_cannot_enter_admission_order']
    - id: ci-raw-snapshot-digest-must-fail
      mutation: {path: bcf_governance/tooling/ci_authority_certification.py, search: 'if _sha256(path) != descriptor["sha256"]:',
        replace: 'if False and _sha256(path) != descriptor["sha256"]:'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_ci_certification::test_snapshot_bytes_are_hash_bound']
    - id: ci-independent-recomputation-must-fail
      mutation: {path: bcf_governance/tooling/ci_authority_certification.py, search: 'if _canonical_bytes(expected) != _canonical_bytes(certification):',
        replace: 'if False and _canonical_bytes(expected) != _canonical_bytes(certification):'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_ci_certification::test_failed_report_reason_is_independently_recomputed']
    - id: ci-cancellation-authentication-must-fail
      mutation: {path: bcf_governance/tooling/ci_authority_decisions.py, search: 'if not child.authenticated:', replace: 'if
          False and not child.authenticated:'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_ci_authority_decisions::test_cancellation_targets_only_authenticated_unfinished_owned_children']
    - id: ci-status-precedence-must-fail
      mutation: {path: bcf_governance/tooling/ci_authority_decisions.py, search: 'if proposed_order < current_order:', replace: 'if
          False and proposed_order < current_order:'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_ci_authority_decisions::test_older_completion_cannot_overwrite_newer_authority']
    - id: release-receipt-acyclic-output-must-fail
      mutation: {path: bcf_governance/tooling/release_receipts.py, search: 'if not _outside(output_path, evidence_dir):',
        replace: 'if False and not _outside(output_path, evidence_dir):'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_release_receipts::test_release_receipt_cannot_be_written_into_truth_inputs']
    - id: release-receipt-certification-must-fail
      mutation: {path: bcf_governance/tooling/release_receipts.py, search: ') != "certified":', replace: ') == "certified":'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_release_receipts::test_failed_truth_or_uncertified_ci_cannot_emit_release']
    - id: github-workflow-path-authentication-must-fail
      mutation: {path: bcf_governance/tooling/ci_github.py, search: 'if active_path != _active_path(expected_active_path):',
        replace: 'if False and active_path != _active_path(expected_active_path):'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_ci_github_reference::test_github_identity_rejects_unauthenticated_provider_state[mutation1-active
            workflow path]']
    - id: github-candidate-write-authority-must-fail
      mutation: {path: bcf_governance/tooling/ci_github.py, search: 'if candidate_permissions & FORBIDDEN_CANDIDATE_CAPABILITIES:',
        replace: 'if False and candidate_permissions & FORBIDDEN_CANDIDATE_CAPABILITIES:'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_ci_github_reference::test_reference_topology_security_mutants_fail[<lambda>-write authority]']
    - id: github-adopter-conflict-must-fail
      mutation: {path: bcf_governance/tooling/ci_adopt_github.py, search: 'elif path.read_bytes() != content:', replace: 'elif
          False and path.read_bytes() != content:'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_ci_github_reference::test_adopter_conflict_fails_before_any_other_path_is_written']
    - id: runtime-global-prune-policy-must-fail
      mutation: {path: bcf_governance/tooling/runtime_capacity.py, search: '"daemon_global_prune": False,', replace: '"daemon_global_prune":
          True,'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_runtime_capacity::test_runtime_contract_rejects_escape_and_broad_cleanup[mutation3-exact, scoped]']
    - id: local-pr-ancestry-must-fail
      mutation: {path: bcf_governance/tooling/local_pr.py, search: 'if ancestry.returncode != 0:', replace: 'if False and
          ancestry.returncode != 0:'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_local_pr::test_local_pr_rejects_head_without_default_branch_ancestry']
    - id: trusted-input-role-must-fail
      mutation: {path: bcf_governance/tooling/trusted_inputs.py, search: 'if executor_role != "trusted-collector":', replace: 'if
          False and executor_role != "trusted-collector":'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_trusted_inputs::test_trusted_input_boundary_mutants_fail[candidate-True-valid-trusted collector]']
    test_contract: {junit_xml: .artifacts/junit/contract-test.xml, expected_node_manifest: governance/test-manifests/contract-test.txt,
      expected_nodes_mode: exact, min_collected: 1, min_executed: 1, max_skipped: 0, artifact_binding: non_authoritative_until_captured}
  governance-exposure-scan:
    evidence_kind: gate
    negative_controls:
    - id: local-workspace-path-is-rejected
      mutation: {path: MEMORY.yml, search: '  canonical_repo_root: "."', replace_base64: ICBjYW5vbmljYWxfcmVwb19yb290OiAiL1VzZXJzL2V4YW1wbGUvcHJpdmF0ZSI=}
      oracle:
        kind: diagnostic
        exit_codes: [1]
        stream: stdout
        regex: local_workspace_path
  governance-validate:
    evidence_kind: gate
    negative_controls:
    - id: authored-verified-state-is-rejected
      mutation: {path: '@active_phase_log', yaml_path: document.status, value: verified}
      oracle:
        kind: diagnostic
        exit_codes: [1]
        stream: stderr
        regex: verified.*(?:not one of|computed)
  lint:
    evidence_kind: gate
    negative_controls:
    - id: lint-behavior-must-fail
      mutation: {path: README.md, search: '# BCF Governance', replace: '# BCF Governance  '}
      oracle:
        kind: diagnostic
        exit_codes: [1]
        stream: stderr
        regex: 'self-governance gate lint failed:'
  runtime-smoke:
    evidence_kind: runtime_health
    negative_controls:
    - id: runtime-smoke-behavior-must-fail
      mutation: {path: manifest.yml, search: 'version: 0.6.1', replace: 'version: 0.0.0'}
      oracle:
        kind: diagnostic
        exit_codes: [1]
        stream: stderr
        regex: 'self-governance gate runtime-smoke failed:'
    output_requirements:
    - {path: .artifacts/runtime-smoke.json, media_type: application/json, authority: non_authoritative_until_captured}
    environment_assertions:
    - {name: BCF_EXECUTION_PROFILE, operator: equals, value: production}
  security-dependency-audit:
    evidence_kind: gate
    negative_controls:
    - id: security-dependency-audit-behavior-must-fail
      mutation: {path: pyproject.toml, search: '"jsonschema>=4.21,<5",', replace: '"jsonschema>=4.21,<4",'}
      oracle:
        kind: diagnostic
        exit_codes: [1]
        stream: stderr
        regex: 'self-governance gate security-dependency-audit failed:'
  security-review:
    evidence_kind: security_review
    negative_controls:
    - id: security-review-behavior-must-fail
      mutation: {path: governance/findings.yml, search: 'reviews: []', replace: "reviews:\n  - invalid"}
      oracle:
        kind: diagnostic
        exit_codes: [1]
        stream: stderr
        regex: 'self-governance gate security-review failed:'
    output_requirements:
    - {path: governance/findings.yml, media_type: application/yaml, authority: non_authoritative_until_captured}
    environment_assertions:
    - {name: BCF_EXECUTION_PROFILE, operator: equals, value: production}
  security-sbom:
    evidence_kind: gate
    negative_controls:
    - id: security-sbom-behavior-must-fail
      mutation: {path: governance/self-governance-policy.yml, search: 'sbom_format: CycloneDX', replace: 'sbom_format: Unknown'}
      oracle:
        kind: diagnostic
        exit_codes: [1]
        stream: stderr
        regex: 'self-governance gate security-sbom failed:'
    output_requirements:
    - {path: .artifacts/sbom.json, media_type: application/json, authority: non_authoritative_until_captured}
  security-secret-scan:
    evidence_kind: gate
    negative_controls:
    - id: security-secret-scan-behavior-must-fail
      mutation: {path: README.md, search: BCF is an executable governance framework, replace_base64: QUtJQUlPU0ZPRE5ON0VYQU1QTEUgQkNGIGlzIGFuIGV4ZWN1dGFibGUgZ292ZXJuYW5jZSBmcmFtZXdvcms=}
      oracle:
        kind: diagnostic
        exit_codes: [1]
        stream: stderr
        regex: 'self-governance gate security-secret-scan failed:'
  security-vulnerability-scan:
    evidence_kind: gate
    negative_controls:
    - id: security-vulnerability-scan-behavior-must-fail
      mutation: {path: governance/self-governance-policy.yml, search: 'forbid_subprocess_shell: true', replace: 'forbid_subprocess_shell:
          false'}
      oracle:
        kind: diagnostic
        exit_codes: [1]
        stream: stderr
        regex: 'self-governance gate security-vulnerability-scan failed:'
    output_requirements:
    - {path: .artifacts/vulnerability-scan.json, media_type: application/json, authority: non_authoritative_until_captured}
  semantic-ownership:
    evidence_kind: gate
    negative_controls:
    - id: semantic-ownership-behavior-must-fail
      mutation: {path: governance/canonical-representations.yml, search: 'authorized_constructors_and_factories: [bcf_governance/tooling/evidence_sessions.py::allocate_session,
          bcf_governance/tooling/evidence_sessions.py::load_session]', replace: 'authorized_constructors_and_factories: [bcf_governance/tooling/missing.py::owner]'}
      oracle:
        kind: diagnostic
        exit_codes: [1]
        stream: stderr
        regex: owner must be an authorized constructor
    - id: ci-authority-owner-behavior-must-fail
      mutation: {path: governance/canonical-representations.yml, search: 'authorized_constructors_and_factories: [bcf_governance/tooling/ci_authority_state.py::evaluate_authority]',
        replace: 'authorized_constructors_and_factories: [bcf_governance/tooling/missing.py::owner]'}
      oracle:
        kind: diagnostic
        exit_codes: [1]
        stream: stderr
        regex: governance.ci-authority-state.v1 owner must be an authorized constructor
    - id: ci-certification-verification-owner-must-fail
      mutation: {path: governance/canonical-representations.yml, search: 'authorized_constructors_and_factories: [bcf_governance/tooling/ci_authority_certification.py::verify_ci_certification]',
        replace: 'authorized_constructors_and_factories: [bcf_governance/tooling/missing.py::owner]'}
      oracle:
        kind: diagnostic
        exit_codes: [1]
        stream: stderr
        regex: governance.ci-certification-verification.v1 owner must be an authorized constructor
    - id: ci-cancellation-decision-owner-must-fail
      mutation: {path: governance/canonical-representations.yml, search: 'authorized_constructors_and_factories: [bcf_governance/tooling/ci_authority_decisions.py::owned_cancellation_targets]',
        replace: 'authorized_constructors_and_factories: [bcf_governance/tooling/missing.py::owner]'}
      oracle:
        kind: diagnostic
        exit_codes: [1]
        stream: stderr
        regex: governance.ci-cancellation-decision.v1 owner must be an authorized constructor
    - id: ci-status-decision-owner-must-fail
      mutation: {path: governance/canonical-representations.yml, search: 'authorized_constructors_and_factories: [bcf_governance/tooling/ci_authority_decisions.py::decide_status_publication]',
        replace: 'authorized_constructors_and_factories: [bcf_governance/tooling/missing.py::owner]'}
      oracle:
        kind: diagnostic
        exit_codes: [1]
        stream: stderr
        regex: governance.ci-status-decision.v1 owner must be an authorized constructor
    - id: release-receipt-owner-must-fail
      mutation: {path: governance/canonical-representations.yml, search: 'authorized_constructors_and_factories: [bcf_governance/tooling/release_receipts.py::build_release_receipt]',
        replace: 'authorized_constructors_and_factories: [bcf_governance/tooling/missing.py::owner]'}
      oracle:
        kind: diagnostic
        exit_codes: [1]
        stream: stderr
        regex: governance.release-receipt.v1 owner must be an authorized constructor
    - id: github-run-identity-owner-must-fail
      mutation: {path: governance/canonical-representations.yml, search: 'authorized_constructors_and_factories: [''bcf_governance/tooling/ci_github.py::authenticate_github_run'']',
        replace: 'authorized_constructors_and_factories: [''bcf_governance/tooling/missing.py::owner'']'}
      oracle:
        kind: diagnostic
        exit_codes: [1]
        stream: stderr
        regex: governance.github-run-identity.v1 owner must be an authorized constructor
    - id: local-pr-context-owner-must-fail
      mutation: {path: governance/canonical-representations.yml, search: 'authorized_constructors_and_factories: [''bcf_governance/tooling/local_pr.py::resolve_local_pr_context'']',
        replace: 'authorized_constructors_and_factories: [''bcf_governance/tooling/missing.py::owner'']'}
      oracle:
        kind: diagnostic
        exit_codes: [1]
        stream: stderr
        regex: governance.local-pr-context.v1 owner must be an authorized constructor
    - id: runtime-capacity-owner-must-fail
      mutation: {path: governance/canonical-representations.yml, search: 'authorized_constructors_and_factories: [''bcf_governance/tooling/runtime_capacity.py::check_runtime_capacity'']',
        replace: 'authorized_constructors_and_factories: [''bcf_governance/tooling/missing.py::owner'']'}
      oracle:
        kind: diagnostic
        exit_codes: [1]
        stream: stderr
        regex: governance.runtime-capacity-decision.v1 owner must be an authorized constructor
    - id: trusted-input-owner-must-fail
      mutation: {path: governance/canonical-representations.yml, search: 'authorized_constructors_and_factories: [''bcf_governance/tooling/trusted_inputs.py::verify_trusted_input'']',
        replace: 'authorized_constructors_and_factories: [''bcf_governance/tooling/missing.py::owner'']'}
      oracle:
        kind: diagnostic
        exit_codes: [1]
        stream: stderr
        regex: governance.trusted-input-verification.v1 owner must be an authorized constructor
    output_requirements:
    - {path: .artifacts/semantic-ownership/report.json, media_type: application/json, authority: non_authoritative_until_captured}
  test:
    evidence_kind: test_suite
