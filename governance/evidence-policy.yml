claim_dependencies:
  workitems_closed: [source, test, governance]
  required_suites_green: [source, test, config, workflow]
  architecture_gates_green: [source, test, config, workflow]
  health_checks_green: [source, config, workflow]
  security_review_complete: [source, config, test, workflow, audit, governance, security_impact]
  findings_resolved: [source, test, audit, governance, security_impact]
  phase_closed: [workitems_closed, required_suites_green, architecture_gates_green, health_checks_green, security_review_complete, findings_resolved]
  release_ready: [phase_closed]
security_impact_categories: [authentication, authorization, cryptography, session_and_token_lifecycle, federation, tenant_containment, secrets_and_custody, security_middleware, authority_migrations, security_ci]
workflow_contract:
