document: {kind: break_glass_recovery_policy, name: BCF break-glass controller recovery, id: bcf-break-glass-recovery, version: 1.0.0, status: active, path: governance/break-glass-recovery.yml}
schema_version: '1.0'
repository: {provider: github, repository_id: '1207503211', name: mjgolaszewski/bcf-governance, default_branch: main}
authority:
  app_name: BCF Break Glass
  app_id: '4966894'
  app_id_variable: BCF_BREAK_GLASS_APP_ID
  app_id_semantics: configured-token-mint-binding
  installation_id: '162228881'
  installation_id_variable: BCF_BREAK_GLASS_INSTALLATION_ID
  installation_id_semantics: configured-expected-not-token-observed
  private_key_secret: BCF_BREAK_GLASS_APP_PRIVATE_KEY
  workflow_id_variable: BCF_BREAK_GLASS_WORKFLOW_ID
  workflow_id: '359360291'
  workflow_path: .github/workflows/bcf-break-glass-recovery.yml
  protected_environment: bcf-break-glass-recovery
  event: workflow_dispatch
  required_actor_permission: admin
  authorized_actors: [{login: mjgolaszewski, user_id: '202175348'}]
  repository_scope_authentication: provider-installation-token-repository-inventory
  reason_codes: [ordinary_control_plane_bootstrap_deadlock]
permissions:
  required: [metadata:read, contents:read, actions:read]
  forbidden: [administration:write, contents:write, pull-requests:write, statuses:write, checks:write, deployments:write, releases:write]
operation:
  stages: [build, install, probe]
  operation_id_pattern: '^[a-f0-9]{32}$'
  singleton: true
  artifact_prefix: bcf-break-glass-recovery
  forensic_artifact_ids: ['10425078154']
  retired_operation_ids: [4aa49c3ab6a100df627619d23c1df483]
builder: {script: .github/scripts/build_trusted_controller.py, job_name: Build exact-main recovery controller}
installer: {primitive: bcf_governance.tooling.ci_github_bootstrap.install_controller}
probe: {semantics: exact-installed-controller-custody}
runners:
- {slot: bcf-trusted-control-1, runner_name: bcf-governance-vm-linux-ci-runner-1}
- {slot: bcf-trusted-control-2, runner_name: bcf-governance-vm-linux-ci-runner-2}
receipt: {schema: schemas/break-glass-recovery-receipt.schema.json, recovery_only: true, governance_certified: false}
prohibitions: [ordinary-certification, release, merge, protection, status-publication, candidate-authorization, arbitrary-ref, arbitrary-artifact]
