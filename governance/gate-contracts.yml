document: {kind: gate_contract_registry,version: '2.0',path: governance/gate-contracts.yml}
schema_version: '2.0'
profile_contract_version: '3.0'
target_profile: standard
interpreter_contract:
  project_dependencies: true
  build_system_requirements: true
  requirements_projection: &ay requirements-governance.txt
  optional_dependency_groups: [dev]
  gate_requirements:
    security-dependency-audit: [pip==26.2.2]
execution_policy: {default_timeout_seconds: 1800,default_cleanup_timeout_seconds: 60}
claim_model:
  version: '1.0'
  dependency_sets:
    whole_tree: ['**']
    implementation: [bcf_governance/**,scripts/**,.github/scripts/**,template-repo/scripts/**]
    architecture: [&V architecture-boundaries.yml,&r governance/self-governance-policy.yml,&s governance/application-operations.yml,&g governance/canonical-representations.yml,&J governance/semantic-families.yml,&aA governance/semantic-lock.yml]
    governance_contracts: [AGENTS.yml,&bt MEMORY.yml,governance-profile.yml,governance/**,schemas/**,plans/**,phases/**]
    tests: [tests/**,governance/test-manifests/**]
    toolchain: [&W pyproject.toml,*ay,requirements-governance.lock]
    workflows: [.github/workflows/**,&j governance/ci-graph.yml,governance/ci-extensions/**,governance/ci-authority.yml,governance/github-ci-topology.yml,governance/github-protection.yml]
    evidence_runtime: [bcf_governance/tooling/governance_evidence.py,&ai bcf_governance/tooling/evaluation_scope.py,bcf_governance/tooling/evidence_*.py,bcf_governance/tooling/truth_*.py,&aD bcf_governance/tooling/governance_truth.py]
    editorial: [CHANGELOG.md,&z README.md,docs/**,spec/**]
  non_proof_dependencies: [editorial]
  execution_groups:
    preflight-structural:
      producer: preflight
      captured_by_preflight: true
      claims: [governance-contracts-valid,governance-exposure-clean,source-syntax-format,semantic-ownership-valid]
    python-tests:
      producer: test
      claims: [&L architecture-context-membership,&M architecture-cqrs-side,&N architecture-duplication,&O architecture-import-boundaries,&P architecture-layer-membership,&Q architecture-module-size,&R architecture-router-thinness,&S architecture-test,&T contract-test,test]
    python-compile-version:
      producer: &D typecheck
      claims: [python-compile-version-contract]
    secret-scan:
      producer: &C security-secret-scan
      claims: [*C]
    dependency-audit:
      producer: &E security-dependency-audit
      claims: [*E]
    sbom:
      producer: &F security-sbom
      claims: [*F]
    unsafe-subprocess:
      producer: &U security-vulnerability-scan
      claims: [unsafe-subprocess-static]
    runtime-smoke:
      producer: &x runtime-smoke
      claims: [*x]
  claims:
    governance-contracts-valid:
      truth: canonical governance contracts and repository projections validate
      execution_group: &Z preflight-structural
      legacy_gate: &aN governance-validate
      dependencies:
        subject: &ar [whole_tree]
        detector: [&aQ governance_contracts,&bm evidence_runtime]
        test_population: []
        toolchain: &c [toolchain]
        trust: [&aR workflows]
      qualification_scope: &q detector
      profiles: &e [normal,regulated,self]
      whole_tree: true
    governance-exposure-clean:
      truth: tracked content contains no forbidden local or private exposure
      execution_group: *Z
      legacy_gate: &aO governance-exposure-scan
      dependencies:
        subject: *ar
        detector: &f [*bm]
        test_population: []
        toolchain: []
        trust: []
      qualification_scope: *q
      profiles: *e
      whole_tree: true
    source-syntax-format:
      truth: tracked Python parses and tracked content has no prohibited trailing whitespace
      execution_group: *Z
      legacy_gate: lint
      dependencies:
        subject: [&K implementation,tests]
        detector: *f
        test_population: []
        toolchain: *c
        trust: []
      qualification_scope: *q
      profiles: *e
    semantic-ownership-valid:
      truth: every declared canonical representation has exactly one authorized semantic owner
      execution_group: *Z
      legacy_gate: &ah semantic-ownership
      dependencies:
        subject: &p [*K,&aP architecture]
        detector: *f
        test_population: []
        toolchain: *c
        trust: []
      qualification_scope: subject
      profiles: *e
    architecture-context-membership:
      truth: production modules belong to exactly one bounded context
      execution_group: &n python-tests
      legacy_gate: *L
      dependencies:
        subject: *p
        detector: *f
        test_population: [tests]
        toolchain: *c
        trust: []
      qualification_scope: subject
      profiles: *e
    architecture-cqrs-side:
      truth: declared operations preserve command query separation
      execution_group: *n
      legacy_gate: *M
      dependencies:
        subject: *p
        detector: *f
        test_population: [tests]
        toolchain: *c
        trust: []
      qualification_scope: subject
      profiles: *e
    architecture-duplication:
      truth: source and governed runtime mirrors remain exact
      execution_group: *n
      legacy_gate: *N
      dependencies:
        subject: *p
        detector: *f
        test_population: [tests]
        toolchain: *c
        trust: []
      qualification_scope: subject
      profiles: [self]
    architecture-import-boundaries:
      truth: packaged code respects declared import direction
      execution_group: *n
      legacy_gate: *O
      dependencies:
        subject: *p
        detector: *f
        test_population: [tests]
        toolchain: *c
        trust: []
      qualification_scope: subject
      profiles: *e
    architecture-layer-membership:
      truth: production modules belong to exactly one declared layer
      execution_group: *n
      legacy_gate: *P
      dependencies:
        subject: *p
        detector: *f
        test_population: [tests]
        toolchain: *c
        trust: []
      qualification_scope: subject
      profiles: *e
    architecture-module-size:
      truth: production modules satisfy the declared size limit
      execution_group: *n
      legacy_gate: *Q
      dependencies:
        subject: *p
        detector: *f
        test_population: [tests]
        toolchain: *c
        trust: []
      qualification_scope: subject
      profiles: *e
    architecture-router-thinness:
      truth: transport and CLI wrappers remain thin
      execution_group: *n
      legacy_gate: *R
      dependencies:
        subject: *p
        detector: *f
        test_population: [tests]
        toolchain: *c
        trust: []
      qualification_scope: subject
      profiles: *e
    architecture-test:
      truth: declared source roots match packaged implementation boundaries
      execution_group: *n
      legacy_gate: *S
      dependencies:
        subject: *p
        detector: *f
        test_population: [tests]
        toolchain: *c
        trust: []
      qualification_scope: subject
      profiles: *e
    contract-test:
      truth: public contracts and adapters satisfy their declared executable tests
      execution_group: *n
      legacy_gate: *T
      dependencies:
        subject: &aS [*K,*aP,*aQ,*aR]
        detector: *f
        test_population: [tests]
        toolchain: *c
        trust: []
      qualification_scope: subject
      profiles: *e
    test:
      truth: the declared test population passes
      execution_group: *n
      legacy_gate: test
      dependencies:
        subject: *aS
        detector: *f
        test_population: [tests]
        toolchain: *c
        trust: []
      qualification_scope: subject
      profiles: *e
    python-compile-version-contract:
      truth: Python sources compile and the package declares its version assignment
      execution_group: python-compile-version
      legacy_gate: *D
      dependencies:
        subject: &am [*K]
        detector: *f
        test_population: []
        toolchain: *c
        trust: []
      qualification_scope: *q
      profiles: *e
    security-secret-scan:
      truth: tracked text contains no declared secret markers
      execution_group: secret-scan
      legacy_gate: *C
      dependencies:
        subject: *ar
        detector: *f
        test_population: []
        toolchain: []
        trust: []
      qualification_scope: *q
      profiles: *e
      whole_tree: true
    security-dependency-audit:
      truth: the exact installed declared dependency closure is mutually consistent and has no vulnerability reported by the pinned freshness-bound advisory scanner
      execution_group: dependency-audit
      legacy_gate: *E
      dependencies:
        subject: *c
        detector: *f
        test_population: []
        toolchain: *c
        trust: []
      qualification_scope: *q
      profiles: *e
    security-sbom:
      truth: the declared dependency set has a deterministic SBOM
      execution_group: sbom
      legacy_gate: *F
      dependencies:
        subject: *c
        detector: *f
        test_population: []
        toolchain: *c
        trust: []
      qualification_scope: *q
      profiles: *e
    unsafe-subprocess-static:
      truth: tracked Python contains no unsafe shell subprocess invocation
      execution_group: unsafe-subprocess
      legacy_gate: *U
      dependencies:
        subject: *am
        detector: *f
        test_population: []
        toolchain: *c
        trust: []
      qualification_scope: *q
      profiles: *e
    runtime-smoke:
      truth: source version and CLI execute in the declared environment
      execution_group: *x
      legacy_gate: *x
      dependencies:
        subject: *am
        detector: *f
        test_population: []
        toolchain: *c
        trust: []
      qualification_scope: *q
      profiles: *e
gates:
  architecture-context-membership:
    invocation: {argv: [python3,&h .github/scripts/run_self_governance_gate.py,*L],cwd: .,env: {},required_env: []}
    evidence: {kind: &o test_suite,test_contract: {junit_xml: .artifacts/junit/architecture-context-membership.xml,selectors: ['tests/test_self_governance_contracts.py::test_tooling_modules_map_to_exactly_one_context'],expected_node_manifest: governance/test-manifests/architecture-context-membership.txt,expected_nodes_mode: exact,min_collected: 1,min_executed: 1,max_skipped: 0,artifact_binding: &l non_authoritative_until_captured}}
    negative_controls:
    - {id: architecture-context-membership-behavior-must-fail,mutation: {path: *r,yaml_path: tooling_contexts.validation,value: [missing_validation/]},oracle: {kind: &a test_node_failure,node_ids: ['tests.test_self_governance_contracts::test_tooling_modules_map_to_exactly_one_context']}}
  architecture-cqrs-side:
    invocation: {argv: [python3,*h,*M],cwd: .,env: {},required_env: []}
    evidence: {kind: *o,test_contract: {junit_xml: .artifacts/junit/architecture-cqrs-side.xml,selectors: ['tests/test_self_governance_contracts.py::test_cli_application_operations_are_closed_and_effect_safe','tests/test_semantic_method_effects.py::test_public_operation_rejects_write_hidden_by_same_instance_method'],expected_node_manifest: governance/test-manifests/architecture-cqrs-side.txt,expected_nodes_mode: exact,min_collected: 1,min_executed: 1,max_skipped: 0,artifact_binding: *l}}
    negative_controls:
    - {id: architecture-cqrs-side-behavior-must-fail,mutation: {path: *s,yaml_path: 'operations[id=governance.cli.doctor.v1].authoritative_mutation',value: true},oracle: {kind: *a,node_ids: &aT ['tests.test_self_governance_contracts::test_cli_application_operations_are_closed_and_effect_safe']}}
    - {id: projection-authority-conferral-must-fail,mutation: {path: *s,yaml_path: 'operations[id=governance.cli.publish-audit.v1].authority_conferral',value: true},oracle: {kind: *a,node_ids: *aT}}
    - {id: same-instance-method-effect-resolution-must-fail,mutation: {path: bcf_governance/tooling/semantic_python_method_identity.py,search: '                call["called_symbol"] = target',replace: '                call["called_symbol"] = str(call["called_symbol"])'},oracle: {kind: *a,node_ids: ['tests.test_semantic_method_effects::test_public_operation_rejects_write_hidden_by_same_instance_method']}}
  architecture-duplication:
    invocation: {argv: [python3,*h,*N],cwd: .,env: {},required_env: []}
    evidence: {kind: *o,test_contract: {junit_xml: .artifacts/junit/architecture-duplication.xml,selectors: ['tests/test_self_governance_contracts.py::test_template_and_private_runtime_copies_are_exact'],expected_node_manifest: governance/test-manifests/architecture-duplication.txt,expected_nodes_mode: exact,min_collected: 1,min_executed: 1,max_skipped: 0,artifact_binding: *l}}
    negative_controls:
    - {id: architecture-duplication-behavior-must-fail,mutation: {path: template-repo/scripts/_bcf_runtime/governance_validation/required_artifacts.py,search: '"""Semantic contracts for standard repository root artifacts."""',replace: '"""Mutated standalone runtime contract."""'},oracle: {kind: *a,node_ids: ['tests.test_self_governance_contracts::test_template_and_private_runtime_copies_are_exact']}}
  architecture-import-boundaries:
    invocation: {argv: [python3,*h,*O],cwd: .,env: {},required_env: []}
    evidence: {kind: *o,test_contract: {junit_xml: .artifacts/junit/architecture-import-boundaries.xml,selectors: ['tests/test_self_governance_contracts.py::test_packaged_code_does_not_import_public_wrapper_package'],expected_node_manifest: governance/test-manifests/architecture-import-boundaries.txt,expected_nodes_mode: exact,min_collected: 1,min_executed: 1,max_skipped: 0,artifact_binding: *l}}
    negative_controls:
    - {id: architecture-import-boundaries-behavior-must-fail,mutation: {path: bcf_governance/__init__.py,search: from ._version import __version__,replace: 'import scripts


          from ._version import __version__'},oracle: {kind: *a,node_ids: ['tests.test_self_governance_contracts::test_packaged_code_does_not_import_public_wrapper_package']}}
  architecture-layer-membership:
    invocation: {argv: [python3,*h,*P],cwd: .,env: {},required_env: []}
    evidence: {kind: *o,test_contract: {junit_xml: .artifacts/junit/architecture-layer-membership.xml,selectors: ['tests/test_self_governance_contracts.py::test_source_layout_maps_to_declared_package_layers'],expected_node_manifest: governance/test-manifests/architecture-layer-membership.txt,expected_nodes_mode: exact,min_collected: 1,min_executed: 1,max_skipped: 0,artifact_binding: *l}}
    negative_controls:
    - {id: architecture-layer-membership-behavior-must-fail,mutation: {path: *V,yaml_path: architecture.layers.pack.path_tokens,value: [missing_pack]},oracle: {kind: *a,node_ids: ['tests.test_self_governance_contracts::test_source_layout_maps_to_declared_package_layers']}}
  architecture-module-size:
    invocation: {argv: [python3,*h,*Q],cwd: .,env: {},required_env: []}
    evidence: {kind: *o,test_contract: {junit_xml: .artifacts/junit/architecture-module-size.xml,selectors: ['tests/test_self_governance_contracts.py::test_production_modules_respect_self_governance_loc_cap'],expected_node_manifest: governance/test-manifests/architecture-module-size.txt,expected_nodes_mode: exact,min_collected: 1,min_executed: 1,max_skipped: 0,artifact_binding: *l}}
    negative_controls:
    - {id: architecture-module-size-behavior-must-fail,mutation: {path: *V,yaml_path: architecture.production_module_policy.max_loc,value: 1},oracle: {kind: *a,node_ids: ['tests.test_self_governance_contracts::test_production_modules_respect_self_governance_loc_cap']}}
  architecture-router-thinness:
    invocation: {argv: [python3,*h,*R],cwd: .,env: {},required_env: []}
    evidence: {kind: *o,test_contract: {junit_xml: .artifacts/junit/architecture-router-thinness.xml,selectors: ['tests/test_self_governance_contracts.py::test_cli_and_source_wrappers_remain_thin'],expected_node_manifest: governance/test-manifests/architecture-router-thinness.txt,expected_nodes_mode: exact,min_collected: 1,min_executed: 1,max_skipped: 0,artifact_binding: *l}}
    negative_controls:
    - {id: architecture-router-thinness-behavior-must-fail,mutation: {path: *r,yaml_path: thin_wrapper_loc_cap,value: 1},oracle: {kind: *a,node_ids: ['tests.test_self_governance_contracts::test_cli_and_source_wrappers_remain_thin']}}
  architecture-test:
    invocation: {argv: [python3,*h,*S],cwd: .,env: {},required_env: []}
    evidence: {kind: *o,test_contract: {junit_xml: .artifacts/junit/architecture-test.xml,selectors: ['tests/test_self_governance_contracts.py::test_source_roots_match_packaged_implementation'],expected_node_manifest: governance/test-manifests/architecture-test.txt,expected_nodes_mode: exact,min_collected: 1,min_executed: 1,max_skipped: 0,artifact_binding: *l}}
    negative_controls:
    - {id: architecture-test-behavior-must-fail,mutation: {path: *V,yaml_path: architecture.source_roots,value: [missing_package]},oracle: {kind: *a,node_ids: ['tests.test_self_governance_contracts::test_source_roots_match_packaged_implementation']}}
  contract-test:
    invocation: {argv: [python3,*h,*T],cwd: .,env: {},required_env: []}
    evidence: {kind: *o,test_contract: {junit_xml: .artifacts/junit/contract-test.xml,selectors: [tests/test_profile_yaml.py,tests/test_ci_graph_routing.py,tests/test_semantic_locking.py,tests/test_semantic_adoption_dependencies.py,tests/test_semantic_adoption_promotion.py,tests/test_semantic_language_matrix.py,tests/test_semantic_authority_typescript.py,tests/test_semantic_typescript_effects.py,tests/test_semantic_typescript_review.py,tests/test_semantic_typescript_boundaries.py,tests/test_semantic_typescript_implicit.py,tests/test_semantic_structural_protocols.py,tests/test_installed_evidence_storage.py,tests/test_test_toolchain.py,tests/test_release_toolchain.py,'tests/test_self_governance_contracts.py::test_governance_evidence_shards_derive_every_required_gate_once','tests/test_self_governance_contracts.py::test_governance_fan_in_is_preflight_ordered_and_attempt_exact','tests/test_self_governance_contracts.py::test_required_repository_artifact_contract_is_executable','tests/test_self_governance_contracts.py::test_trusted_bootstrap_is_owner_dispatched_pinned_and_offline','tests/test_self_workflow_contracts.py::test_self_workflow_contracts_are_one_preflight_owned_mechanical_control','tests/test_self_governance_contracts.py::test_every_github_action_uses_the_canonical_immutable_pin','tests/test_self_governance_contracts.py::test_self_control_plane_is_an_exact_v11_generator_product','tests/test_self_governance_contracts.py::test_exact_main_is_the_only_default_branch_producer','tests/test_self_governance_contracts.py::test_self_ci_authority_matches_immutable_workflow_definitions','tests/test_self_governance_contracts.py::test_trusted_callbacks_reject_prs_and_failed_finalizers_before_runner','tests/test_self_governance_contracts.py::test_authority_canary_is_owner_dispatched_and_attempt_deterministic','tests/test_self_governance_contracts.py::test_scheduled_mutants_preflight_selected_interpreter_before_execution','tests/test_self_governance_contracts.py::test_self_profile_builder_keeps_evidence_semantics_single_owned','tests/test_validate_governance_yaml.py::test_artifact_manifest_requires_standard_repository_artifact_contracts','tests/test_validate_governance_yaml.py::test_profile_v2_rejects_duplicated_evidence_semantic_ownership','tests/test_validate_governance_yaml.py::test_pull_request_validation_requires_changelog_update',tests/test_ci_authority.py,tests/test_ci_authority_pins.py,tests/test_ci_certification.py,tests/test_ci_authority_decisions.py,'tests/test_ci_graph_controller_lifecycle.py::test_five_state_controller_lifecycle_and_requirement_resolution',tests/test_ci_self_controller.py,tests/test_release_receipts.py,tests/test_ci_github_reference.py,tests/test_ci_github_canary.py,tests/test_ci_github_controller.py,tests/test_ci_github_bootstrap.py,tests/test_ci_github_artifacts.py,tests/test_ci_github_release.py,tests/test_release_closure.py,tests/test_local_pr.py,tests/test_runtime_capacity.py,tests/test_trusted_inputs.py,tests/test_bound_trusted_inputs.py,tests/test_trusted_controller_compatibility.py,tests/test_preflight.py,tests/test_interpreter_environment.py,tests/test_release_train_terminal_declaration.py,tests/test_interpreter_plan_boundary.py,tests/test_interpreter_publication_freshness.py,tests/test_installed_interpreter_publication.py,tests/test_governance_terminal_observation.py,'tests/test_governance_evidence.py::test_test_node_control_derives_minimal_pytest_command','tests/test_governance_evidence.py::test_test_node_control_preserves_class_based_raw_selector','tests/test_governance_evidence.py::test_test_node_control_requires_verified_mapping','tests/test_test_manifests.py::test_selector_map_rejects_ambiguous_junit_identity',tests/test_identity_reference_audit.py,tests/test_release_artifacts.py,'tests/test_self_governance_contracts.py::test_exact_main_controller_wheel_is_built_once_after_pack_checks',tests/test_release_runtime_verification.py,tests/test_release_workflow_contracts.py,tests/test_documentation_contracts.py,tests/test_public_contracts.py,
          tests/test_contract_migration.py,tests/test_release_versions.py,tests/test_yaml_mutations.py,tests/test_adoption_soak.py,'tests/test_profile_contract_v2.py::test_bcf_standard_v2_promotion_fits_declared_context_budgets','tests/test_profile_contract_v2.py::test_v2_surfaces_bind_one_session_and_do_not_wait','tests/test_self_governance_contracts.py::test_governance_artifact_transport_restores_private_modes_before_capture','tests/test_ci_graph.py::test_release_controller_jobs_fail_closed_until_target_is_installed','tests/test_ci_graph.py::test_release_controller_jobs_activate_only_after_mechanical_confirmation','tests/test_ci_graph.py::test_selected_python_must_be_provisioned_before_governed_command','tests/test_ci_graph.py::test_renderer_binds_selected_python_to_setup_action_output','tests/test_ci_graph.py::test_trusted_no_checkout_command_rejects_repository_relative_input','tests/test_ci_graph.py::test_trusted_no_checkout_rejects_every_execution_input_surface','tests/test_ci_graph.py::test_direct_event_command_inputs_require_mechanical_fallback','tests/test_self_governance_contracts.py::test_trusted_no_checkout_artifacts_are_job_scoped','tests/test_ci_graph.py::test_bcf_ci_authority_audit_reports_the_complete_effective_graph','tests/test_governance_evidence.py::test_session_selector_admits_one_root_and_preserves_nested_receipt_copies','tests/test_governance_truth.py::test_duplicate_receipt_identity_invalidates_every_copy_before_aggregation',tests/test_interpreter_locked_project.py],expected_node_manifest: governance/test-manifests/contract-test.txt,expected_nodes_mode: exact,min_collected: 1,min_executed: 1,max_skipped: 0,artifact_binding: *l}}
    negative_controls:
    - {id: installed-evidence-wrapper-must-use-private-runtime,mutation: {path: template-repo/scripts/evidence_storage.py,search: from _bcf_runtime.evidence_storage_commands import main,replace: from bcf_governance.tooling.evidence_storage_commands import main},oracle: {kind: *a,node_ids: ['tests.test_installed_evidence_storage::test_canonical_installed_wrapper_has_no_source_package_dependency']}}
    - {id: empty-semantic-lock-must-render-an-array,mutation: {path: bcf_governance/tooling/semantic_locking.py,search: '"projection_outputs:\n" if rows else "projection_outputs: []\n"',replace: '"projection_outputs:\n"'},oracle: {kind: *a,node_ids: ['tests.test_semantic_locking::test_empty_projection_outputs_round_trip_as_an_array']}}
    - {id: semantic-authority-must-use-typescript-inventory,mutation: {path: bcf_governance/tooling/semantic_source_discovery.py,search: 'combined = merge_inventories([python, typescript]) if projects else python',replace: combined = python},oracle: {kind: *a,node_ids: ['tests.test_semantic_authority_typescript::test_population_and_registry_projects_are_composed_once_each']}}
