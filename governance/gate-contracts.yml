document: {kind: gate_contract_registry, version: '1.0', path: governance/gate-contracts.yml}
schema_version: '1.0'
profile_contract_version: '2.0'
target_profile: standard
interpreter_contract: {project_dependencies: true, build_system_requirements: true, requirements_projection: requirements-governance.txt, optional_dependency_groups: [dev], gate_requirements: {security-dependency-audit: [pip, packaging]}}
gates:
  architecture-context-membership:
    invocation:
      argv: [python3, .github/scripts/run_self_governance_gate.py, architecture-context-membership]
      cwd: .
      env: {}
      required_env: []
    evidence:
      kind: test_suite
      test_contract:
        junit_xml: .artifacts/junit/architecture-context-membership.xml
        selectors: ['tests/test_self_governance_contracts.py::test_tooling_modules_map_to_exactly_one_context']
        expected_node_manifest: governance/test-manifests/architecture-context-membership.txt
        expected_nodes_mode: exact
        min_collected: 1
        min_executed: 1
        max_skipped: 0
        artifact_binding: non_authoritative_until_captured
    negative_controls:
    - id: architecture-context-membership-behavior-must-fail
      mutation: {path: governance/self-governance-policy.yml, search: 'validation: [check_governance_exposure.py, doctor_governance_pack.py, interpreter_environment.py, preflight.py, self_workflow_contracts.py, validate_governance_yaml.py, governance_validation/]', replace: 'validation: [check_governance_exposure.py, doctor_governance_pack.py, interpreter_environment.py, preflight.py, self_workflow_contracts.py, validate_governance_yaml.py, missing_validation/]'}
      oracle: {kind: test_node_failure, node_ids: ['tests.test_self_governance_contracts::test_tooling_modules_map_to_exactly_one_context']}
  architecture-cqrs-side:
    invocation:
      argv: [python3, .github/scripts/run_self_governance_gate.py, architecture-cqrs-side]
      cwd: .
      env: {}
      required_env: []
    evidence:
      kind: test_suite
      test_contract:
        junit_xml: .artifacts/junit/architecture-cqrs-side.xml
        selectors: ['tests/test_self_governance_contracts.py::test_cli_command_query_sides_are_complete_and_disjoint']
        expected_node_manifest: governance/test-manifests/architecture-cqrs-side.txt
        expected_nodes_mode: exact
        min_collected: 1
        min_executed: 1
        max_skipped: 0
        artifact_binding: non_authoritative_until_captured
    negative_controls:
    - id: architecture-cqrs-side-behavior-must-fail
      mutation: {path: governance/self-governance-policy.yml, search: 'read_only: [doctor, exposure-scan, preflight, publish-audit,
          semantic-ownership, truth, validate]', replace: 'read_only: [doctor, exposure-scan, preflight, publish-audit, semantic-ownership,
          validate]'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_self_governance_contracts::test_cli_command_query_sides_are_complete_and_disjoint']
  architecture-duplication:
    invocation:
      argv: [python3, .github/scripts/run_self_governance_gate.py, architecture-duplication]
      cwd: .
      env: {}
      required_env: []
    evidence:
      kind: test_suite
      test_contract:
        junit_xml: .artifacts/junit/architecture-duplication.xml
        selectors: ['tests/test_self_governance_contracts.py::test_template_and_private_runtime_copies_are_exact']
        expected_node_manifest: governance/test-manifests/architecture-duplication.txt
        expected_nodes_mode: exact
        min_collected: 1
        min_executed: 1
        max_skipped: 0
        artifact_binding: non_authoritative_until_captured
    negative_controls:
    - id: architecture-duplication-behavior-must-fail
      mutation: {path: template-repo/scripts/_bcf_runtime/governance_validation/required_artifacts.py, search: '"""Semantic
          contracts for standard repository root artifacts."""', replace: '"""Mutated standalone runtime contract."""'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_self_governance_contracts::test_template_and_private_runtime_copies_are_exact']
  architecture-import-boundaries:
    invocation:
      argv: [python3, .github/scripts/run_self_governance_gate.py, architecture-import-boundaries]
      cwd: .
      env: {}
      required_env: []
    evidence:
      kind: test_suite
      test_contract:
        junit_xml: .artifacts/junit/architecture-import-boundaries.xml
        selectors: ['tests/test_self_governance_contracts.py::test_packaged_code_does_not_import_public_wrapper_package']
        expected_node_manifest: governance/test-manifests/architecture-import-boundaries.txt
        expected_nodes_mode: exact
        min_collected: 1
        min_executed: 1
        max_skipped: 0
        artifact_binding: non_authoritative_until_captured
    negative_controls:
    - id: architecture-import-boundaries-behavior-must-fail
      mutation: {path: bcf_governance/__init__.py, search: from ._version import __version__, replace: "import scripts\n\nfrom ._version import __version__"}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_self_governance_contracts::test_packaged_code_does_not_import_public_wrapper_package']
  architecture-layer-membership:
    invocation:
      argv: [python3, .github/scripts/run_self_governance_gate.py, architecture-layer-membership]
      cwd: .
      env: {}
      required_env: []
    evidence:
      kind: test_suite
      test_contract:
        junit_xml: .artifacts/junit/architecture-layer-membership.xml
        selectors: ['tests/test_self_governance_contracts.py::test_source_layout_maps_to_declared_package_layers']
        expected_node_manifest: governance/test-manifests/architecture-layer-membership.txt
        expected_nodes_mode: exact
        min_collected: 1
        min_executed: 1
        max_skipped: 0
        artifact_binding: non_authoritative_until_captured
    negative_controls:
    - id: architecture-layer-membership-behavior-must-fail
      mutation: {path: architecture-boundaries.yml, search: 'path_tokens: [pack]', replace: 'path_tokens: [missing_pack]'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_self_governance_contracts::test_source_layout_maps_to_declared_package_layers']
  architecture-module-size:
    invocation:
      argv: [python3, .github/scripts/run_self_governance_gate.py, architecture-module-size]
      cwd: .
      env: {}
      required_env: []
    evidence:
      kind: test_suite
      test_contract:
        junit_xml: .artifacts/junit/architecture-module-size.xml
        selectors: ['tests/test_self_governance_contracts.py::test_production_modules_respect_self_governance_loc_cap']
        expected_node_manifest: governance/test-manifests/architecture-module-size.txt
        expected_nodes_mode: exact
        min_collected: 1
        min_executed: 1
        max_skipped: 0
        artifact_binding: non_authoritative_until_captured
    negative_controls:
    - id: architecture-module-size-behavior-must-fail
      mutation: {path: architecture-boundaries.yml, search: 'max_loc: 800', replace: 'max_loc: 1'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_self_governance_contracts::test_production_modules_respect_self_governance_loc_cap']
  architecture-router-thinness:
    invocation:
      argv: [python3, .github/scripts/run_self_governance_gate.py, architecture-router-thinness]
      cwd: .
      env: {}
      required_env: []
    evidence:
      kind: test_suite
      test_contract:
        junit_xml: .artifacts/junit/architecture-router-thinness.xml
        selectors: ['tests/test_self_governance_contracts.py::test_cli_and_source_wrappers_remain_thin']
        expected_node_manifest: governance/test-manifests/architecture-router-thinness.txt
        expected_nodes_mode: exact
        min_collected: 1
        min_executed: 1
        max_skipped: 0
        artifact_binding: non_authoritative_until_captured
    negative_controls:
    - id: architecture-router-thinness-behavior-must-fail
      mutation: {path: governance/self-governance-policy.yml, search: 'thin_wrapper_loc_cap: 20', replace: 'thin_wrapper_loc_cap:
          1'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_self_governance_contracts::test_cli_and_source_wrappers_remain_thin']
  architecture-test:
    invocation:
      argv: [python3, .github/scripts/run_self_governance_gate.py, architecture-test]
      cwd: .
      env: {}
      required_env: []
    evidence:
      kind: test_suite
      test_contract:
        junit_xml: .artifacts/junit/architecture-test.xml
        selectors: ['tests/test_self_governance_contracts.py::test_source_roots_match_packaged_implementation']
        expected_node_manifest: governance/test-manifests/architecture-test.txt
        expected_nodes_mode: exact
        min_collected: 1
        min_executed: 1
        max_skipped: 0
        artifact_binding: non_authoritative_until_captured
    negative_controls:
    - id: architecture-test-behavior-must-fail
      mutation: {path: architecture-boundaries.yml, search: 'source_roots: [bcf_governance]', replace: 'source_roots: [missing_package]'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_self_governance_contracts::test_source_roots_match_packaged_implementation']
  contract-test:
    invocation:
      argv: [python3, .github/scripts/run_self_governance_gate.py, contract-test]
      cwd: .
      env: {}
      required_env: []
    evidence:
      kind: test_suite
      test_contract:
        junit_xml: .artifacts/junit/contract-test.xml
        selectors: ['tests/test_self_governance_contracts.py::test_governance_evidence_shards_derive_every_required_gate_once', 'tests/test_self_governance_contracts.py::test_governance_fan_in_is_preflight_ordered_and_attempt_exact', 'tests/test_self_governance_contracts.py::test_required_repository_artifact_contract_is_executable', 'tests/test_self_governance_contracts.py::test_trusted_bootstrap_is_owner_dispatched_pinned_and_offline', 'tests/test_self_workflow_contracts.py::test_self_workflow_contracts_are_one_preflight_owned_mechanical_control', 'tests/test_self_governance_contracts.py::test_every_github_action_uses_the_canonical_immutable_pin', 'tests/test_self_governance_contracts.py::test_self_control_plane_is_an_exact_v11_generator_product', 'tests/test_self_governance_contracts.py::test_exact_main_is_the_only_default_branch_producer', 'tests/test_self_governance_contracts.py::test_self_ci_authority_matches_immutable_workflow_definitions', 'tests/test_self_governance_contracts.py::test_trusted_callbacks_reject_prs_and_failed_finalizers_before_runner', 'tests/test_self_governance_contracts.py::test_authority_canary_is_owner_dispatched_and_attempt_deterministic', 'tests/test_self_governance_contracts.py::test_scheduled_mutants_preflight_selected_interpreter_before_execution', 'tests/test_self_governance_contracts.py::test_self_profile_builder_keeps_evidence_semantics_single_owned', 'tests/test_validate_governance_yaml.py::test_artifact_manifest_requires_standard_repository_artifact_contracts', 'tests/test_validate_governance_yaml.py::test_profile_v2_rejects_duplicated_evidence_semantic_ownership',
          'tests/test_validate_governance_yaml.py::test_pull_request_validation_requires_changelog_update', tests/test_ci_authority.py, tests/test_ci_authority_pins.py,
          tests/test_ci_certification.py, tests/test_ci_authority_decisions.py, tests/test_ci_self_controller.py, tests/test_release_receipts.py, tests/test_ci_github_reference.py,
          tests/test_ci_github_canary.py,
          tests/test_ci_github_controller.py, tests/test_ci_github_bootstrap.py, tests/test_ci_github_artifacts.py, tests/test_ci_github_release.py, tests/test_release_closure.py, tests/test_local_pr.py, tests/test_runtime_capacity.py, tests/test_trusted_inputs.py,
          tests/test_preflight.py, tests/test_interpreter_environment.py, tests/test_governance_terminal_observation.py, 'tests/test_governance_evidence.py::test_test_node_control_derives_minimal_pytest_command', tests/test_identity_reference_audit.py, tests/test_release_artifacts.py, 'tests/test_self_governance_contracts.py::test_exact_main_controller_wheel_is_built_once_after_pack_checks', tests/test_release_runtime_verification.py, tests/test_release_workflow_contracts.py,
          tests/test_documentation_contracts.py, 'tests/test_profile_contract_v2.py::test_bcf_standard_v2_promotion_fits_declared_context_budgets', 'tests/test_self_governance_contracts.py::test_governance_artifact_transport_restores_private_modes_before_capture', 'tests/test_ci_graph.py::test_release_controller_jobs_fail_closed_until_target_is_installed', 'tests/test_ci_graph.py::test_release_controller_jobs_activate_only_after_mechanical_confirmation', 'tests/test_ci_graph.py::test_selected_python_must_be_provisioned_before_governed_command', 'tests/test_ci_graph.py::test_renderer_binds_selected_python_to_setup_action_output', 'tests/test_ci_graph.py::test_trusted_no_checkout_command_rejects_repository_relative_input', 'tests/test_ci_graph.py::test_direct_event_command_inputs_require_mechanical_fallback']
        expected_node_manifest: governance/test-manifests/contract-test.txt
        expected_nodes_mode: exact
        min_collected: 1
        min_executed: 1
        max_skipped: 0
        artifact_binding: non_authoritative_until_captured
    negative_controls:
    - {id: contract-test-behavior-must-fail, mutation: {path: template-repo/governance/artifact-manifest.yml, search: 'pull_request_policy: required_update', replace: 'pull_request_policy: optional'}, oracle: {kind: test_node_failure, node_ids: ['tests.test_validate_governance_yaml::test_artifact_manifest_requires_standard_repository_artifact_contracts']}}
    - {id: package-runtime-asset-selection-must-fail, mutation: {path: pyproject.toml, search: ', "tooling/*.mjs"', replace: ''}, oracle: {kind: test_node_failure, node_ids: ['tests.test_release_artifacts::test_pyproject_packages_every_discovered_runtime_asset']}}
    - {id: source-entrypoint-import-authority-must-fail, mutation: {path: .github/scripts/test_release_artifacts.py, search: '    sys.path.insert(0, str(REPO_ROOT))', replace: '    pass'}, oracle: {kind: test_node_failure, node_ids: ['tests.test_preflight::test_repository_source_entrypoints_establish_import_authority']}}
    - {id: preflight-exposure-scan-must-fail, mutation: {path: bcf_governance/tooling/preflight.py, search: '    if report.status != "pass":', replace: '    if False:'}, oracle: {kind: test_node_failure, node_ids: ['tests.test_preflight::test_exposure_preflight_rejects_local_workspace_paths']}}
    - {id: identity-reference-artifact-membership-must-fail, mutation: {path: .github/scripts/import_identity_reference_proof.py, search: 'if str(artifact_run.get("id")) != run_id:', replace: 'if False:'}, oracle: {kind: test_node_failure, node_ids: ['tests.test_identity_reference_audit::test_identity_reference_importer_rejects_provider_artifact_mismatch']}}
    - {id: identity-reference-archive-digest-must-fail, mutation: {path: .github/scripts/import_identity_reference_proof.py, search: 'if provider_digest != f"sha256:{actual_digest}":', replace: 'if False:'}, oracle: {kind: test_node_failure, node_ids: ['tests.test_identity_reference_audit::test_identity_reference_importer_authenticates_archive_bytes']}}
    - {id: nonterminal-privileged-inventory-must-not-require-future-jobs, mutation: {path: bcf_governance/tooling/ci_github_authority.py, search: 'or (require_terminal and names_set != expected_set)', replace: 'or names_set != expected_set'}, oracle: {kind: test_node_failure, node_ids: ['tests.test_ci_github_release::test_nonterminal_privileged_inventory_accepts_only_pinned_partial_jobs']}}
    - {id: trusted-bootstrap-artifact-identity-must-fail, mutation: {path: bcf_governance/tooling/ci_self_controller.py, search: 'if pin["BCF_BOOTSTRAP_ARTIFACT_NAME"] != expected_name:', replace: 'if False:'}, oracle: {kind: test_node_failure, node_ids: ['tests.test_ci_self_controller::test_controller_pin_rejects_non_derived_artifact_name']}}
    - {id: trusted-bootstrap-controller-command-must-fail, mutation: {path: governance/ci-extensions/bcf-trusted-control.yml, search: "['{controller}', ci-github, bootstrap,", replace: "['{controller}', ci-github, probe,"}, oracle: {kind: test_node_failure, node_ids: ['tests.test_self_governance_contracts::test_trusted_bootstrap_is_owner_dispatched_pinned_and_offline']}}
    - {id: trusted-bootstrap-installed-target-separation-must-fail, mutation: {path: bcf_governance/tooling/ci_graph_contracts.py, search: 'installed = str(installation.get("installed_commit_sha", ""))', replace: 'installed = commit'}, oracle: {kind: test_node_failure, node_ids: ['tests.test_ci_self_controller::test_self_controller_projection_has_one_canonical_pin_owner']}}
    - {id: trusted-controller-interpreter-environment-must-fail, mutation: {path: bcf_governance/tooling/ci_github_actions.py, search: '"setup-python": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",', replace: '"setup-python": "actions/setup-python@0000000000000000000000000000000000000000",'}, oracle: {kind: test_node_failure, node_ids: ['tests.test_self_workflow_contracts::test_self_workflow_contracts_are_one_preflight_owned_mechanical_control']}}
