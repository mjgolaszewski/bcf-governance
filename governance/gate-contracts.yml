      oracle:
        kind: diagnostic
        exit_codes: [1]
        stream: stderr
        regex: governance.trusted-input-verification.v1 owner must be an authorized constructor
  test:
    invocation:
      argv: [python3, .github/scripts/run_self_governance_gate.py, test]
      cwd: .
      env: {}
      required_env: []
    evidence:
      kind: test_suite
      test_contract:
        junit_xml: .artifacts/junit/test.xml
        selectors: ['@test_roots']
        expected_node_manifest: governance/test-manifests/test.txt
        expected_nodes_mode: exact
        min_collected: 1
        min_executed: 1
        max_skipped: 0
        artifact_binding: non_authoritative_until_captured
    negative_controls:
    - id: test-behavior-must-fail
      mutation: {path: template-repo/governance/artifact-manifest.yml, search: 'readme: {path: README.md, contract: project_readme}',
        replace: 'readme: {path: README.md, contract: broken_readme}'}
      oracle:
        kind: test_node_failure
        node_ids: ['tests.test_validate_governance_yaml::test_artifact_manifest_requires_standard_repository_artifact_contracts']
    - {id: pr-truth-progress-separation-must-fail, mutation: {path: bcf_governance/tooling/governance_truth.py, search: 'if evaluation_mode == "pr":', replace: 'if False and evaluation_mode == "pr":'}, oracle: {kind: test_node_failure, node_ids: ['tests.test_governance_truth::test_pr_evaluation_allows_progress_without_claiming_phase_closure']}}
    - {id: release-check-fresh-session-truth-must-fail, mutation: {path: bcf_governance/tooling/profile_v2_surfaces.py, search: '--evidence-dir \"$$session_dir\"', replace: '--evidence-dir $(BCF_EVIDENCE_DIR)'}, oracle: {kind: test_node_failure, node_ids: ['tests.test_self_governance_contracts::test_self_release_check_is_an_exact_generator_product']}}
    - {id: package-preflight-pr-context-must-fail, mutation: {path: bcf_governance/tooling/ci_graph_render.py, search: '"BCF_PR_BASE_SHA": "${{ github.event.pull_request.base.sha }}",', replace: '"BCF_PR_BASE_SHA": "absent",'}, oracle: {kind: test_node_failure, node_ids: ['tests.test_self_governance_contracts::test_changelog_pr_enforcement_is_wired_into_repository_ci']}}
  typecheck:
    invocation:
      argv: [python3, .github/scripts/run_self_governance_gate.py, typecheck]
      cwd: .
      env: {}
      required_env: []
    evidence: {kind: gate}
    negative_controls:
    - id: typecheck-behavior-must-fail
      mutation: {path: bcf_governance/_version.py, search: __version__ = "0.8.0", replace: VERSION = "0.8.0"}
      oracle:
        kind: diagnostic
        exit_codes: [1]
        stream: stderr
        regex: 'self-governance gate typecheck failed:'
gate_catalog:
  governance_validate: {target: governance-validate, status: required, command_policy: governance_validation, rationale: governed
      YAML passes schema semantic path and placeholder validation}
  governance_exposure_scan: {target: governance-exposure-scan, status: required, command_policy: governance_exposure_scan,
    rationale: governed artifacts do not expose local paths or private infrastructure markers}
  architecture_test: {target: architecture-test, status: required, command_policy: architecture_tests, rationale: architecture
      boundaries are executable}
  architecture_module_size: {target: architecture-module-size, status: required, command_policy: architecture_module_size,
    rationale: production modules stay below configured LOC cap}
  architecture_layer_membership: {target: architecture-layer-membership, status: required, command_policy: architecture_layer_membership, rationale: production modules map to one layer}
  architecture_context_membership: {target: architecture-context-membership, status: required, command_policy: architecture_context_membership,
    rationale: production modules map to one bounded context}
  architecture_import_boundaries: {target: architecture-import-boundaries, status: required, command_policy: architecture_import_boundaries,
    rationale: layer import purity prevents drift}
  architecture_cqrs_side: {target: architecture-cqrs-side, status: required, command_policy: architecture_cqrs_side, rationale: command and query sides stay separate}
  architecture_router_thinness: {target: architecture-router-thinness, status: required, command_policy: architecture_router_thinness,
    rationale: routers remain transport adapters}
  architecture_duplication: {target: architecture-duplication, status: required, command_policy: architecture_duplication,
    rationale: duplication and shared helpers stay explicit}
  lint: {target: lint, status: required, command_policy: lint, rationale: lint rules are wired before release-check is trusted}
  typecheck: {target: typecheck, status: required, command_policy: typecheck, rationale: static analysis is wired before release-check is trusted}
  test: {target: test, status: required, command_policy: automated_tests, rationale: touched behavior has automated tests}
  contract_test: {target: contract-test, status: required, command_policy: contract_tests, rationale: public contracts and
      adapters have explicit checks}
  security_secret_scan: {target: security-secret-scan, status: required, command_policy: security_secret_scan, rationale: pushed
      code is scanned for secrets}
  security_dependency_audit: {target: security-dependency-audit, status: required, command_policy: security_dependency_audit,
    rationale: dependencies have a vulnerability audit lane}
  security_sbom: {target: security-sbom, status: required, command_policy: security_sbom, rationale: production-bound artifacts
      produce an SBOM}
  security_vulnerability_scan: {target: security-vulnerability-scan, status: required, command_policy: security_vulnerability_scan,
    rationale: source or image vulnerability scan is wired}
  security_review: {target: security-review, status: required, command_policy: security_review, rationale: canonical review findings and remediation proofs bind to the governed tree}
  runtime_smoke: {target: runtime-smoke, status: required, command_policy: runtime_smoke, rationale: runtime behavior is proven in a declared environment}
  semantic_ownership: {target: semantic-ownership, status: required, command_policy: semantic_ownership, rationale: declared canonical representations have one mechanically enforced owner}
provenance: {}
