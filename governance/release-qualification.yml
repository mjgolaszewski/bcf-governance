document:
  kind: release_qualification_contract
  name: BCF release adopter qualification
  id: bcf-release-adopter-qualification
  version: 1.2.0
  status: active
  path: governance/release-qualification.yml
schema_version: '1.2'
provider_credentials:
- id: tradeflow-read
  owner: moranwm
  repository: tradeflow
  token_environment: BCF_ADOPTER_PROVIDER_TOKEN_0
- id: racecar-read
  owner: mjgolaszewski
  repository: racecar
  token_environment: BCF_ADOPTER_PROVIDER_TOKEN_1
- id: agentbus-read
  owner: mjgolaszewski
  repository: AgentBus
  token_environment: BCF_ADOPTER_PROVIDER_TOKEN_2
required_adopters:
- id: tradeflow-lite
  repository: moranwm/tradeflow
  profile: lite
  provider_credential: tradeflow-read
- id: racecar-standard-v3
  repository: mjgolaszewski/racecar
  profile: standard
  provider_credential: racecar-read
- id: agentbus-standard-v3
  repository: mjgolaszewski/AgentBus
  profile: standard
  provider_credential: agentbus-read
qualification:
  source: provider_default_branch_transaction
  caller_checkout_role: environment_and_object_cache_only
  mutation_scope: disposable_clone_only
  fixed_point: required
  evaluation_scope: canonical_graph_derived
  authority: local_non_authoritative
  execution_provenance: provider_workflow_run_attempt_job_artifact
  continuation: automatic_release_verifier_dag
  source_freshness: current_at_trusted_collection
  product_failure: blocks_custody_until_attributed
  release_asset_identity: exact_sha256sums
