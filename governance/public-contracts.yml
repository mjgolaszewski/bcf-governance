document: {kind: public_contract_registry, name: BCF Supported Public Contracts, id: bcf-governance-public-contracts, version: 1.0.0, status: active, path: governance/public-contracts.yml}
package:
  version: 1.0.2
  distribution: github_releases
  executable_ci_providers: [github]
  platforms: [linux_x86_64]
  python_minors: ['3.11', '3.12', '3.13', '3.14']
cli:
  scope: top_level_commands_and_exit_classes
  top_level_commands: [ci, ci-cleanup, ci-github, cleanup, doctor, environment, evidence, exposure-scan, install, migrate-contract, migrate-evidence, preflight, profile, publish-audit, scaffold, semantic-ownership, test-manifest, truth, validate]
  exit_codes: {success: 0, contract_failure: 1, usage_error: 2}
contracts:
  profile: {path: schemas/governance-profile.schema.json, version_field: profile_contract_version, readable_versions: ['1.0', '2.0'], active_version: '2.0', migration_only_versions: ['1.0']}
  receipt: {path: schemas/evidence-receipt.schema.json, version_field: schema_version, readable_versions: ['2.0'], active_version: '2.0', migration_only_versions: []}
  evidence_session: {path: schemas/evidence-session.schema.json, version_field: schema_version, readable_versions: ['1.0'], active_version: '1.0', migration_only_versions: []}
  ci_authority: {path: schemas/ci-authority.schema.json, version_field: schema_version, readable_versions: ['1.0', '1.1'], active_version: '1.1', migration_only_versions: ['1.0']}
  ci_graph: {path: schemas/ci-graph.schema.json, version_field: schema_version, readable_versions: ['1.0'], active_version: '1.0', migration_only_versions: []}
  ci_graph_extension: {path: schemas/ci-graph-extension.schema.json, version_field: schema_version, readable_versions: ['1.0'], active_version: '1.0', migration_only_versions: []}
  automation_producers: {path: schemas/automation-producers.schema.json, version_field: schema_version, readable_versions: ['1.0'], active_version: '1.0', migration_only_versions: []}
  github_protection: {path: schemas/github-protection.schema.json, version_field: schema_version, readable_versions: ['1.0'], active_version: '1.0', migration_only_versions: []}
ci_graph:
  canonical_path: governance/ci-graph.yml
  extension_points: [preflight, evidence-lane, before-truth, after-truth, exact-main-producer, trusted-control, scheduled-lane, release-role]
  executor_kinds: [command, gate_group, reusable_workflow, authority, component_sequence, gate_shard, terminal_truth, truth]
  generated_header: '# Generated by BCF; edit governance/ci-graph.yml or a registered extension.'
  renderer: bcf_governance/tooling/ci_graph_render.py::render_ci_graph
  parity_check: bcf_governance/tooling/ci_graph_render.py::check_ci_graph
compatibility:
  project_owned_paths: [governance-profile.yml, governance/gate-contracts.yml, governance/evidence-policy.yml, governance/ci-graph.yml, governance/ci-extensions, .github/workflows]
  preserved_unrelated_workflows: true
  generated_workflow_manual_edits: rejected
  deprecated_contracts_require_migration_command: true
  breaking_change_notice: one_release_candidate_or_minor_release
diagnostics:
  prerequisite_kinds: [runner, tool, permission, secret, event, graph_input]
  required_fields: [kind, identifier, status, remediation]
