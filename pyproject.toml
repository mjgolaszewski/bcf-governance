[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bcf-governance"
dynamic = ["version"]
description = "Deterministic governance for software produced by probabilistic AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "BCF Governance Maintainers" }]
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.21,<5",
]

[project.optional-dependencies]
dev = ["build==1.6.0", "pytest==9.1.1"]

[project.scripts]
bcf = "bcf_governance.cli:main"

[tool.setuptools.packages.find]
include = ["bcf_governance*"]

[tool.setuptools.dynamic]
version = {attr = "bcf_governance._version.__version__"}

[tool.setuptools.package-data]
bcf_governance = ["pack/template-repo/**/*", "tooling/*.mjs"]

[tool.setuptools.exclude-package-data]
bcf_governance = [
  "pack/template-repo/**/__pycache__/*",
  "pack/template-repo/**/*.pyc",
]
