[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bcf-governance"
dynamic = ["version"]
description = "Deterministic governance for software produced by probabilistic AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "BCF Governance Maintainers" }]
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.21,<5",
  "packaging>=24,<27",
]

[project.optional-dependencies]
dev = [
  "build==1.6.1", "pip-audit==2.10.1", "pytest==9.0.3", "urllib3>=2.8.0,<3",
  "mypy==1.19.1", "ruff==0.15.7",
  "types-PyYAML==6.0.12.20250915", "types-jsonschema==4.26.0.20261006",
]

[project.scripts]
bcf = "bcf_governance.cli:main"

[tool.setuptools.packages.find]
include = ["bcf_governance*"]

[tool.setuptools.dynamic]
version = {attr = "bcf_governance._version.__version__"}

[tool.setuptools.package-data]
bcf_governance = ["pack/template-repo/**/*", "tooling/*.mjs"]

[tool.setuptools.exclude-package-data]
bcf_governance = [
  "pack/template-repo/**/__pycache__/*",
  "pack/template-repo/**/*.pyc",
]

[tool.pytest.ini_options]
# Release successful disposable fixture directories during compiler-heavy suites.
tmp_path_retention_policy = "failed"

# Managed runtime checks use the same strict rules as the consuming repository.
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "UP009"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
