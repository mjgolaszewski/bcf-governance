document:
  kind: hotfix_execution_log
  name: "{{HOTFIX_ID}} Hotfix Log"
  id: "{{PROJECT_ID}}-{{HOTFIX_ID}}"
  version: 1.0.0
  generated_at_utc: "{{DATE}}T00:00:00Z"
  status: planned
  path: phases/phase-{{PHASE_NUMBER}}-hotfix{{HOTFIX_NUMBER}}.yml
hotfix:
  id: "{{HOTFIX_ID}}"
  mode: "{{HOTFIX_MODE}}"
  related_phase_id: "{{RELATED_PHASE_ID}}"
  hotfix_number: "{{HOTFIX_NUMBER}}"
  summary: "{{HOTFIX_SUMMARY}}"
execution_evidence:
  planned_commands:
    - "{{VALIDATION_COMMAND}}"
  executed_commands: []
  notes:
    - record failing workflow ids, diagnosed root cause, remediation scope, and merge-back status here
closeout_requirements:
  claims:
    required_suites_green: {required_evidence: [test, contract-test]}
    security_review_complete: {required_evidence: [security-review]}
    health_checks_green: {required_evidence: [runtime-smoke]}
  reconciliation:
    required_evidence: [governance-validate, governance-exposure-scan]
  finding_registry: governance/findings.yml
